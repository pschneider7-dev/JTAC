<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brevity-Trainer</title>
<meta name="theme-color" content="#E4E9E7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1517" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="JTAC">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/app.css">
<style>
/* Layout: eine Spalte (max. 720px) im Look der Trainer-Reihe; Codewörter in Funk-Schreibweise (Mono, Versalien) */
:root{
  --bg:#E4E9E7; --surface:#F4F7F5; --surface2:#E9EEEC; --ink:#1A2326; --muted:#55615F; --line:#C3CCC9;
  --ok:#2A7848; --ok-bg:#DCEEE2; --bad:#B0382B; --bad-bg:#F6DEDA; --unk:#7A6A2E; --unk-bg:#F1E9CF;
  --cta:#E0A526; --cta-ink:#1A2326; --radio:#0F1A1C; --radio-ink:#F2B632;
  --font-d:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --font-b:"Barlow","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-m:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1517; --surface:#172022; --surface2:#1D282B; --ink:#E1E7E5; --muted:#93A09D; --line:#2A3639;
    --ok:#56B57F; --ok-bg:#16301F; --bad:#E36D5E; --bad-bg:#3A1C18; --unk:#D9C17A; --unk-bg:#2E2913;
    --cta:#E3AA2E; --cta-ink:#111719; --radio:#06090A; --radio-ink:#F2B632; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1517; --surface:#172022; --surface2:#1D282B; --ink:#E1E7E5; --muted:#93A09D; --line:#2A3639;
  --ok:#56B57F; --ok-bg:#16301F; --bad:#E36D5E; --bad-bg:#3A1C18; --unk:#D9C17A; --unk-bg:#2E2913;
  --cta:#E3AA2E; --cta-ink:#111719; --radio:#06090A; --radio-ink:#F2B632; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--cta);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-block:12px 56px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-d);line-height:1.1;margin:0;text-wrap:balance}
h2{font-size:1.35rem;font-weight:600}
.muted{color:var(--muted)}
.code{font-family:var(--font-m);font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}

/* Kopfleiste */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:720px;margin:0 auto;padding-block:8px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px;min-height:52px}
.bar .t{font-family:var(--font-d);font-weight:600;font-size:1.2rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:40px;height:40px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:500;white-space:nowrap}
.tag{font-family:var(--font-d);font-size:1rem;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.prog{height:3px;background:var(--line)}
.prog>i{display:block;height:100%;background:var(--cta);transition:width .25s}

/* Übersicht */
.hero{padding:26px 0 14px}
.hero h1{font-size:clamp(3rem,13vw,5.2rem);font-weight:700;letter-spacing:-.015em;line-height:.9}
.hero p{max-width:34em;margin:12px 0 0;color:var(--muted);font-size:1.05rem}
.radioline{display:inline-block;margin-top:14px;background:var(--radio);color:var(--radio-ink);font-family:var(--font-m);font-size:.82rem;font-weight:500;letter-spacing:.04em;padding:6px 12px;border-radius:6px;max-width:100%;overflow-wrap:anywhere}
.board{margin:16px 0 22px}
.board h3{font-size:1rem;color:var(--muted);margin:14px 0 6px;letter-spacing:.06em;text-transform:uppercase}
.cells{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
@media (min-width:560px){.cells{grid-template-columns:repeat(4,minmax(0,1fr))}}
.cell{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 9px 12px;overflow:hidden;min-width:0}
.cell[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.cell b{display:block;font-family:var(--font-d);font-weight:700;font-size:1.25rem;line-height:1;font-variant-numeric:tabular-nums}
.cell span{display:block;font-size:.78rem;color:var(--muted);line-height:1.25;margin-top:3px}
.cell i{position:absolute;left:0;bottom:0;height:5px;background:var(--line)}
.cell[data-s="bad"] i{background:var(--bad)} .cell[data-s="mid"] i{background:var(--cta)} .cell[data-s="ok"] i{background:var(--ok)}
.filtnote{font-size:.88rem;color:var(--muted);margin-top:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cta{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;background:var(--cta);color:var(--cta-ink);border:0;border-radius:10px;padding:16px 18px;text-align:left}
.cta strong{font-family:var(--font-d);font-size:1.5rem;font-weight:700;display:block;line-height:1.05}
.cta small{display:block;font-size:.9rem;opacity:.85}
.cta .go{font-family:var(--font-d);font-size:1.6rem;font-weight:700}
.modes{margin-top:20px;border-top:1px solid var(--line)}
.modes h3{font-size:1rem;color:var(--muted);margin:16px 0 2px;letter-spacing:.06em;text-transform:uppercase}
.mode{display:flex;width:100%;gap:14px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:13px 2px}
.mode .mi{flex:1;min-width:0}
.mode strong{display:block;font-family:var(--font-d);font-size:1.3rem;font-weight:600;line-height:1.1}
.mode small{display:block;color:var(--muted);font-size:.9rem;margin-top:2px}
.mode .n{font-family:var(--font-d);font-size:1.05rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.mode:hover strong{text-decoration:underline;text-underline-offset:3px}
.mode[disabled]{opacity:.45;cursor:default}
.foot{margin-top:26px;font-size:.84rem;color:var(--muted);max-width:42em}
.foot p{margin:0 0 8px}
.foot a{color:var(--ink);text-underline-offset:3px}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-weight:600}

/* Frage */
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0 10px;font-size:.9rem;color:var(--muted)}
.chip-cat{display:inline-block;font-family:var(--font-d);font-weight:700;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;background:var(--ink);color:var(--bg);border-radius:5px;padding:2px 9px}
.prompt{font-family:var(--font-d);font-size:1.55rem;font-weight:600;line-height:1.15;margin:6px 0 14px}
.bigcode{display:inline-block;background:var(--radio);color:var(--radio-ink);font-family:var(--font-m);font-weight:700;font-size:clamp(1.5rem,7vw,2.1rem);letter-spacing:.06em;padding:10px 18px;border-radius:8px;margin:4px 0 14px;max-width:100%;overflow-wrap:anywhere}
.defbox{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--cta);border-radius:0 10px 10px 0;padding:12px 16px;margin:4px 0 14px;font-size:1.05rem}
.lage{background:var(--radio);color:#DCE5E2;border-radius:10px;padding:12px 16px;margin:4px 0 12px}
.lage .lh{font-family:var(--font-m);font-size:.74rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--radio-ink)}
.lage p{margin:4px 0 0}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;line-height:1.35}
.opt .k{flex:none;width:26px;height:26px;border-radius:6px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-weight:700;color:var(--muted);font-size:.95rem}
.opt .ot{min-width:0;overflow-wrap:anywhere}
.opt .ot.code{white-space:normal;font-size:1.02rem}
.opt:not([disabled]):hover{border-color:var(--ink)}
.opt[disabled]{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)} .opt.correct .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)} .opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.seq{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.seq .code{font-size:.92rem}
.seq .ar{color:var(--muted);font-weight:700}
.inp{display:block;width:100%;font-family:var(--font-m);font-weight:700;font-size:1.15rem;letter-spacing:.05em;text-transform:uppercase;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:13px 14px}
.inp:focus{border-color:var(--ink);outline:none}
.inp[readonly]{border-style:dashed}
.fhint{font-size:.86rem;color:var(--muted);margin-top:5px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:11px 15px;font-weight:600}
.btn.main{background:var(--ink);color:var(--bg);border-color:var(--ink);flex:1;min-width:9em}
.btn.flagged{border-color:var(--bad);color:var(--bad)}
.fb{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c,var(--ok));border-radius:10px;padding:14px 16px}
.fb .v{font-family:var(--font-d);font-size:1.4rem;font-weight:700;color:var(--c)}
.fb p{margin:6px 0 0}
.entry{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.entry .hd{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.entry .hd .code{font-size:1.05rem}
.entry .lf{font-family:var(--font-d);font-size:1.15rem;font-weight:600}
.entry .en{font-size:.88rem;color:var(--muted);font-style:italic;margin-top:4px}
.entry .nt{font-size:.94rem;margin-top:6px}
.pill{display:inline-block;font-size:.78rem;font-weight:600;border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:1px 9px;color:var(--muted)}

/* Ergebnis */
.score{font-family:var(--font-d);font-size:5rem;font-weight:700;line-height:.9;margin:26px 0 4px;font-variant-numeric:tabular-nums}
.score small{font-size:2rem;color:var(--muted);font-weight:600}
.misslist{list-style:none;padding:0;margin:12px 0 0;border-top:1px solid var(--line)}
.misslist li{padding:10px 0;border-bottom:1px solid var(--line)}
.misslist .code{font-size:.95rem}

/* Glossar */
.seg{display:flex;gap:0;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;margin:14px 0 10px}
.seg button{flex:1;border:0;background:var(--surface);padding:10px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.search{display:block;width:100%;font:inherit;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px}
.gl h3{font-size:1rem;color:var(--muted);margin:20px 0 4px;letter-spacing:.06em;text-transform:uppercase}
.gl dl{margin:0}
.gl .it{padding:10px 0;border-bottom:1px solid var(--line)}
.gl .it .hd{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.gl .it .code{font-size:1rem}
.gl .it p{margin:3px 0 0}
.gl .it .en{font-size:.86rem;color:var(--muted);font-style:italic}
.gl .empty{color:var(--muted);margin-top:16px}

/* Statistik */
.stat-top{display:flex;gap:28px;margin:18px 0 6px;flex-wrap:wrap}
.stat-top b{display:block;font-family:var(--font-d);font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.srow{display:grid;grid-template-columns:minmax(0,10em) 1fr 4.2em;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.94rem}
.sbar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.sbar i{display:block;height:100%}
.confirm{margin-top:10px;padding:12px 14px;border:1px solid var(--bad);background:var(--bad-bg);border-radius:8px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="bar"><div class="bar-in" id="barin"></div><div class="prog" id="prog" hidden><i></i></div></header>
<main class="wrap" id="app" aria-live="polite"></main>

<script>
/* Brevity nach ATP 1-02.1 (Multi-Service Brevity Codes, April 2025) bzw. NATO APP-7 */
const GROUPS = {
  sicht:   {l:"Sicht und Erfassung", k:"b"},
  laser:   {l:"Laser und IR-Pointer", k:"b"},
  angriff: {l:"Angriff und Freigabe", k:"b"},
  feuer:   {l:"Feuerkontrolle und Abbruch", k:"b"},
  waffen:  {l:"Waffen und Wirkung", k:"b"},
  bedr:    {l:"Bedrohung und Selbstschutz", k:"b"},
  koord:   {l:"Treibstoff, Zeit, Koordination", k:"b"},
  luft:    {l:"Luftlage und Identifizierung", k:"b"},
  eloka:   {l:"EloKa und Emitter", k:"b"},
  funk:    {l:"Funk, Datenlink, IFF", k:"b"},
  boden:   {l:"Bodenfeuer und Flugabwehr", k:"b"},
  heli:    {l:"Hubschrauber und CSAR", k:"b"},
  rollen:  {l:"Rollen und Stellen", k:"a"},
  verf:    {l:"Verfahren und Planung", k:"a"},
  raum:    {l:"Raumordnung (ACM, FSCM)", k:"a"},
  wirk:    {l:"Waffen und Wirkung", k:"a"},
  tech:    {l:"Sensoren und Technik", k:"a"},
  threat:  {l:"Bedrohung und Luftverteidigung", k:"a"},
  luftop:  {l:"Luftoperationen", k:"a"},
  fsup:    {l:"Steilfeuer und Feuerunterstützung", k:"a"},
  land:    {l:"Landoperationen und Führung", k:"a"}
};
const G_ORDER_B = ["sicht","laser","angriff","feuer","waffen","bedr","koord","luft","eloka","funk","boden","heli"];
const G_ORDER_A = ["rollen","verf","luftop","raum","fsup","land","wirk","tech","threat"];

/* B(Wort, Gruppe, Bedeutung deutsch, Originaldefinition, Optionen)
   o.opp = Gegenstück, o.conf = Verwechsler, o.note = JTAC-Hinweis, o.acc = akzeptierte Eingaben (Regex), o.near = [Regex, Hinweis] */
const BR = [];
const B = (w, g, de, en, o) => BR.push(Object.assign({w, g, de, en, conf:[]}, o || {}));

/* ---- Sicht und Erfassung ---- */
B("TALLY","sicht","Ziel, gegnerisches Lfz oder Feindstellung in Sicht.","Sighting of a target, non-friendly aircraft, or enemy position. Opposite of NO JOY.",
  {opp:"NO JOY", conf:["VISUAL","CONTACT","CAPTURED"], note:"TALLY gilt für Ziel und Feind, VISUAL für Eigene, CONTACT für Bezugspunkte."});
B("NO JOY","sicht","Ziel bzw. gegnerisches Lfz (BANDIT) nicht in Sicht.","Aircrew does not have visual contact with the TARGET or BANDIT. Opposite of TALLY.",
  {opp:"TALLY", conf:["BLIND","LOOKING","NEGATIVE LASER"], note:"Für das Ziel heißt es NO JOY, für eigene Kräfte BLIND, für Bezugspunkte LOOKING."});
B("VISUAL","sicht","Eigenes Lfz, Schiff oder eigene Bodenposition in Sicht.","Sighting of a FRIENDLY aircraft or ground position or ship. Opposite of BLIND.",
  {opp:"BLIND", conf:["TALLY","CONTACT","FRIENDLY"], note:"Bei Type 1 muss der JTAC das angreifende Lfz sehen – auch das meldet man mit VISUAL."});
B("BLIND","sicht","Keine Sicht auf eigenes Lfz, Schiff oder eigene Bodenposition.","No visual contact with FRIENDLY aircraft, ship, or ground position. Opposite of VISUAL.",
  {opp:"VISUAL", conf:["NO JOY","LOOKING","POPEYE"], note:"Meldet der Pilot BLIND auf deine Position, hilft z. B. ROPE mit dem IR-Pointer oder eine Markierung."});
B("CONTACT","sicht","Bezugspunkt in Sicht – mit dem Auge oder mit dem Sensor (allgemein: Sensorinformation an der genannten Position).","(A/S) Acknowledges sighting of a reference point, visually or via sensor. (General) Sensor information at the stated position.",
  {opp:"LOOKING", conf:["TALLY","VISUAL","CAPTURED"], acc:[/^CONTACTS?( |$)/], note:"Im Talk-on: CONTACT für jeden Bezugspunkt, erst das Ziel selbst wird mit TALLY bestätigt."});
B("LOOKING","sicht","Bezugspunkt, Bodenobjekt bzw. Ziel noch nicht gefunden.","Aircrew does not have the ground or surface object, reference point, or target in sight. Opposite of CONTACT.",
  {opp:"CONTACT", conf:["NO JOY","BLIND","NEGATIVE LASER"], note:"Gegenstück zu CONTACT. Im Talk-on heißt LOOKING: Beschreibung vereinfachen oder größeren Bezugspunkt wählen."});
B("CAPTURED","sicht","Objekt mit dem Bordsensor (z. B. Pod) erfasst und wird verfolgt.","Object has been acquired and is being tracked.",
  {conf:["CONTACT","TALLY","SPOT"], note:"Typisch nach einem Koordinatenhinweis oder SPARKLE: „CAPTURED“ heißt, der Pod hält das Objekt."});
B("SHADOW","sicht","Dem angegebenen Ziel folgen.","Follow indicated TARGET.",
  {conf:["CAPTURED","ANCHOR","CONTINUE"], note:"Nützlich bei Bewegtzielen: Das Lfz bzw. UAS bleibt mit dem Sensor am Ziel."});

/* ---- Laser und IR-Pointer ---- */
B("LASER ON","laser","Aufforderung, mit der Laserbeleuchtung zu beginnen.","Directive call to start lasing.",
  {opp:"CEASE LASER", conf:["LASING","SPARKLE","TEN SECONDS"], note:"Kommt meist vom Lfz an den Bodenlaser – du antwortest mit LASING."});
B("LASING","laser","Ich beleuchte jetzt mit dem Laser (Antwort auf LASER ON).","The speaker is firing the laser in response to LASER ON.",
  {conf:["LASER ON","SPOT","SPARKLE"], note:"Antwort des Lasernden auf LASER ON."});
B("TEN SECONDS","laser","In ca. 10 Sekunden kommt der ON-Ruf (z. B. LASER ON) – bereithalten.","Standby for (weapon) ON call in approximately 10 seconds (e.g., LASER ON, TORCH ON).",
  {conf:["LASER ON","PUSHING","ROLEX"], acc:[/^(TEN|10) SEC(ONDS?)?$/], note:"Gibt dir Zeit, den Laser aufs Ziel zu bringen."});
B("CEASE LASER","laser","Laserbeleuchtung beenden (allgemein CEASE + Tätigkeit, z. B. CEASE SPARKLE).","CEASE [activity]: Discontinue stated activity (e.g., CEASE BUZZER, LASER, SPARKLE, TORCH).",
  {opp:"LASER ON", conf:["ABORT","STEADY","CHECK FIRE"], acc:[/^CEASE LAS(ER|ING)$/], near:[[/^TERMINATE$/,"TERMINATE stand in älteren Ausgaben und Unterlagen für das Beenden des Lasers. Heute: CEASE LASER – TERMINATE gilt nur noch im Übungsbetrieb."]],
   note:"Ältere Unterlagen nutzen dafür TERMINATE. Laser so kurz wie möglich – Fahrzeuge mit Laserwarner bemerken ihn."});
B("SPOT","laser","Reflektierte Laserenergie erfasst (Laser Spot Tracker).","Acquisition of the reflected laser energy.",
  {opp:"NEGATIVE LASER", conf:["CAPTURED","CONTACT","LASING"], note:"Das Lfz sieht deinen Laserpunkt – jetzt kann es Ziel und Laser abgleichen."});
B("NEGATIVE LASER","laser","Keine Laserenergie erfasst.","Laser energy has not been acquired.",
  {opp:"SPOT", conf:["DEADEYE","NO JOY","LOOKING"], acc:[/^NEG(ATIVE)? LASER$/], note:"Dann prüfen: Lasercode, Laser wirklich an, Sichtlinie, Geometrie (Safety Zone)."});
B("SHIFT","laser","Laser, IR-Pointer, Radar oder Haltepunkt verlegen – mit Richtung bzw. neuem Ziel.","Shift laser, IR, radar, device energy, or aim point.",
  {conf:["SNAKE","MATCH SPARKLE","RESET"], note:"Z. B. „SHIFT EAST 50“ – der Laserpunkt wandert auf das nächste Ziel."});
B("DEADEYE","laser","Laserzielbeleuchter ausgefallen.","Laser designator system inoperative.",
  {conf:["NEGATIVE LASER","WINCHESTER","BLIND"], note:"Dann Buddy-Lasing, dein Bodenlaser oder eine Waffe ohne Laser."});
B("BUDDY LASE","laser","Lenkung der Waffe durch eine andere Quelle als das abwerfende Lfz (Anforderung oder Meldung).","Request or informative communication to have weapon guidance from a source other than delivering aircraft.",
  {conf:["MATCH SPARKLE","LASING","SHIFT"], note:"Ein Lfz wirft, ein anderes (oder du) beleuchtet – Lasercode abstimmen."});
B("SPARKLE","laser","Ziel mit dem IR-Pointer markieren bzw. ist markiert.","Mark or marking target by IR pointer.",

B("POINT","funk","Datenlink-Sensorpunkt bzw. TOI (J12.6 SID 10). CONTACT POINT = Tracknummer des TOI aufgefasst; DROP POINT = Zielmeldung nicht mehr nötig; HOLD POINT = waffenfähige Trackdaten halten; SHOOT POINT = auf die Datenlink-Zielmeldung schießen; TARGET POINT = genannte Zielmeldung bekämpfen.","Data link sensor point or TOI, such as the J12.6 SID 10 data link message. CONTACT POINT: Indicates the aircraft has acquired the TOI TRACK NUMBER on their data link. DROP POINT: Data link target sorting message is no longer needed or desired. HOLD POINT: Maintain weapons quality track data. SHOOT POINT: Directive call to shoot data link targeting message; does not imply targeting responsibility. TARGET POINT: Target the referenced data link TARGET sorting message. (Example: “IRON FOUR, TARGET IRON ONE’S POINT”).",

B("STINGER","luft","1. Dreier-Formation: zwei Kontakte vorn nebeneinander, einer dahinter. 2. US-MANPADS mit IR-Lenkung.","1. Three-ship inner GROUP formation with two lead CONTACTs line abreast and the SINGLE in trail. 2. A US infrared MANPADS.",

B("STRADDLE","boden","Beobachtung bei einer Salve mehrerer Rohre: Einschläge teils kurz, teils weit; Beobachter meldet STRADDLE mit Korrektur auf den mittleren Treffpunkt.","A spotting of STRADDLE is made for a multi-gun salvo when some rounds fall short and some fall beyond the target. The spotter announces STRADDLE followed by a correction to place the mean point of impact on the target. The term is normally used during a ship adjust or a massed fire mission.",

B("STRENGTH","luft","Anzahl (Stärke) eines Tracks bzw. einer Gruppe.","Numerical strength of a TRACK or GROUP.",

B("STROKE","funk","Weisung an eine dritte Trackquelle, bestmögliche durchgehende Trackdaten zur Zielbekämpfung zu liefern.","Directive call for third party track production source to provide best possible continuous track data for weapon targeting purposes.",

B("SUMMIT","boden","Gipfelhöhe der Geschossbahn (MAX ORD); bei Luftbeobachtung immer, sonst auf Anfrage; neue Meldung bei Änderung über 300 ft (Luftbeobachter) bzw. 100 m (Bodenbeobachter).","The highest point of a shell’s trajectory (also known as maximum ordnance (MAX ORD)). Sent as standard during an air observed mission and if requested by a ground spotter. Units of measurement are specified. A new SUMMIT is sent if it changes by more than 300 ft for an air observer or 100 meters for a ground observer.",

B("SUSPECT","luft","Identität eines Tracks, der nach Merkmalen, Verhalten, Herkunft oder Nationalität möglicherweise feindlich ist.","An identity applied to a track that is potentially hostile because of its characteristics, behavior, origin, or nationality.",

B("SWEET","funk","1. Gültige Antwort bei der IFF-Prüfung. 2. Mit Linkname (z. B. „TIMBER SWEET“): Datenlink-Information empfangen. 3. Gerät arbeitet einwandfrei.; hebt SICK und BENT auf.","1. (mode, type) Valid response to an administrative IFF or selective ID feature check request. 2. (link name) (e.g., TIMBER SWEET) Confirms receipt of data link information. 3. Equipment indicated is operating efficiently. (Opposite of SOUR; cancels SICK, BENT).",

B("SWITCH","sicht","1. Einstellung am genannten Gerät umschalten. 2. (CAMERA) Video auf EO bzw. IR umschalten. 3. (POLARITY) IR-Polarität black hot/white hot wechseln. 4. Verband bzw. Element wechselt auf die vorgeplante Frequenz.","1. Switch the setting on the referenced item. 2. (CAMERA) Switch full-motion video to EO or IR. 3. (POLARITY) Switch IR polarity to black hot or white hot. 4. Formation or element change to preplanned frequency.",

B("TAG","eloka","1. Antwort auf COLOR (Klärung eines Emitters) mit System und Ort. 2. Meldung an den Hubschrauberführer: Das letzte Lfz des Verbands ist in der Luft.","1. Response to an emitter ambiguity resolution request (COLOR). Requires [system, location]. 2. Call to a helicopter flight lead that the last aircraft of a flight is airborne.",

B("TARGET","angriff","1. Zuweisung der Zielverantwortung. 2. ROE, PID, Koordination und Vorgaben des Führers sind für das Ziel erfüllt; vor dem Waffeneinsatz müssen noch Zielkorrelation, CDE und freies Schussfeld sichergestellt sein.","1. Assignment of targeting responsibilities. 2. ROE, PID, coordination of forces, and commander’s guidance requirements on the referenced target or track have been satisfied. Target or track correlation, CDE, and clear field of fire must be accomplished prior to employing ordnance or fires.",

B("TARGETABLE","angriff","Hinweis an den Verband: Die Voraussetzungen für TARGET sind laut Absprache erfüllt; vom Package Commander zu briefen bzw. in den SPINS festgelegt.","Advisory call to inform package that the ability to TARGET has been met IAW prebriefed contracts; must be briefed by package commander (or outlined in SPINS/standards).",

B("TORCH","waffen","1. Eigene Hochenergielaserwaffe (HEL) feuert. 2. Plattform hat eine HEL-Waffe. 3. Anforderung von HEL-Feuer auf ein Ziel (z. B. „JTAC Alpha request TORCH“). TORCH ON/OFF: HEL-Feuer begonnen bzw. eingestellt.","1. Friendly high-energy laser (HEL) weapon fire. 2. Platform is HEL weapon capable. 3. Request for HEL fires on a specified target (e.g., JTAC Alpha request TORCH). TORCH ON/OFF: Friendly HEL weapon has started/ceased firing.",

B("TRACK","sicht","1. Flug- bzw. Bewegungsrichtung einer Gruppe oder von Kontakten. 2. Weisung: Objekt oder Raum mit Sensor bzw. visuell beobachten. 3. Hubschrauber: Racetrack einrichten (z. B. „TRACK left“). 4. Bewegungsrichtung eines Fahrzeugs bzw. Kontakts (z. B. „TALLY TECHNICAL TRACK Northwest“).","1. GROUP or CONTACTS direction of flight or movement. 2. Directive call assigning responsibility to an asset for maintaining sensor or visual observation of a defined object or area. 3. Rotary-wing directive call to establish race track (e.g., “Taz 31, TRACK left). 4. Information call stating direction of vehicle or CONTACT in motion (e.g., TALLY TECHNICAL TRACK Northwest).",

B("VANISHED","luft","Sonderfall von FADED: Gruppe, ARM oder Kontakt ohne Sensordaten, nicht in einem bekannten Sensorschatten und einem Schuss eigener Kräfte zugeordnet.","Special case of FADED defined as a GROUP or ARM or CONTACT with no available sensor data and is: (1) Not in a known sensor blind zone (terrain masking or Doppler blind zone) AND (2) Correlated to a shot by FRIENDLY forces.",

B("WARNING","bedr","Luftverteidigungswarnstufe: RED = Angriff steht bevor oder läuft; YELLOW = wahrscheinlich; WHITE = unwahrscheinlich.","Air defense warning. Hostile attack is: (RED): Imminent or in progress. (YELLOW): Probable. (WHITE): Improbable.",

B("WATCHING","boden","Flugabwehreinheit hat das Ziel zugewiesen, kann es wegen der Entfernung noch nicht bekämpfen und bekämpft es, sobald die Kriterien erfüllt sind; Antwort auf COVER, wenn AFFIRM nicht möglich ist.","Surface to air defense unit is assigned a target for engagement responsibility; is unable to engage due to threat range; will engage when threat meets engagement criteria. WATCHING is an optional response to COVER when accepting engagement assignment but unable to respond AFFIRM.",
  {x:1, note:"Bereich: Boden-Luft. Kein NATO-Brevity-Wort (nur US-Gebrauch)."});
B("WEAPONS","feuer","Feuerkontrollstatus: FREE = Feuer auf alles, was nicht als FRIENDLY identifiziert ist; TIGHT = nur auf positiv als HOSTILE identifizierte Ziele; HOLD/SAFE = nur zur Selbstverteidigung oder auf Befehl.","Weapons control status. Fire only: 1. FREE: at targets not identified as FRIENDLY IAW current ROE. 2. TIGHT: at targets positively identified as HOSTILE IAW current ROE. 3. HOLD/SAFE: in self-defense or in response to a formal order. NOTE NATO uses WEAPONS to determine munitions available or remaining, similar to WHAT STATE.",
  {x:1, note:"Funkform: WEAPONS [status]. Bedeutung weicht von NATO (APP-7) ab."});

B("WORK","eloka","1. In die genannte Himmelsrichtung manövrieren. 2. Weisung: Ortung (Geolocation) durchführen.","1. Maneuver in the stated cardinal direction. 2. Directive call to command geolocation.",

B("WORKING","eloka","1. Mit System und Ort: Plattform erfasst Daten zum genannten Emitter (EOB). 2. Plattform identifiziert ein Lfz bzw. eine Gruppe elektronisch für den BVR-Einsatz.","1. (system with location) Platform gathering EOB on a designated emitter. 2. Platform executing electronic ID on a specific aircraft or GROUP to obtain ID necessary for BVR employment.",

B("YELLOW","koord","Waffen- bzw. Kraftstoffstand nähert sich der Grenze, ab der der Auftrag nicht fortgesetzt werden kann; Grenzwerte in der Planung festlegen.","Aircraft is at a weapon and/or fuel status that is approaching a level insufficient to continue execution of the mission. NOTE A specific loadout or fuel state should be determined during mission planning.",

/* ---- Lagen: Situation -> Funkspruch ---- */
/* L(id, Lage, Frage, richtig, [3 falsch], Erklärung, Gruppe) */
const LAGEN = [];
const L = (id, lage, q, a, w, ex, g) => LAGEN.push({id, lage, q, a, w, ex, g});
L("l01","Im Talk-on beschreibst du eine Brücke als Bezugspunkt. Der Pilot hat sie gefunden.","Was meldet er?","CONTACT",["TALLY","VISUAL","SPOT"],"CONTACT bestätigt einen Bezugspunkt – mit dem Auge oder dem Sensor. TALLY kommt erst, wenn er das Ziel selbst sieht.","sicht");
L("l02","Der Pilot sieht jetzt die zwei BMP am Waldrand, die du beschrieben hast.","Was meldet er?","TALLY",["CONTACT","VISUAL","SPOT"],"TALLY = Ziel bzw. Feind in Sicht. VISUAL gilt nur für Eigene.","sicht");
L("l03","Der Pilot sieht deine Stellung bzw. deine Markierung der eigenen Position.","Was meldet er?","VISUAL",["TALLY","CONTACT","FRIENDLY"],"VISUAL = eigenes Lfz bzw. eigene Bodenposition in Sicht. Gegenteil: BLIND.","sicht");
L("l04","Trotz Talk-on findet der Pilot das Ziel nicht.","Was meldet er?","NO JOY",["BLIND","NEGATIVE LASER","NAKED"],"NO JOY = Ziel nicht in Sicht. BLIND gilt für eigene Kräfte, NEGATIVE LASER für fehlende Laserenergie.","sicht");
L("l05","Der Pilot sucht den Kirchturm, den du als ersten Bezugspunkt genannt hast, und findet ihn noch nicht.","Was meldet er?","LOOKING",["NO JOY","BLIND","POPEYE"],"LOOKING ist das Gegenstück zu CONTACT. NO JOY bezieht sich auf das Ziel bzw. einen BANDIT.","sicht");
L("l06","Der Pilot findet deine eigene Stellung nicht.","Was meldet er?","BLIND",["NO JOY","LOOKING","POPEYE"],"BLIND = keine Sicht auf Eigene. Helfen kann z. B. ROPE mit dem IR-Pointer.","sicht");
L("l07","Nach deinem Koordinatenhinweis hat der Pilot das Fahrzeug im Pod erfasst und verfolgt es.","Was meldet er?","CAPTURED",["CONTACT","TALLY","SPOT"],"CAPTURED = Objekt mit dem Bordsensor erfasst und verfolgt.","sicht");
L("l08","Laser-Handoff: Der Pilot will dein Bodenlaser-Signal in etwa 10 Sekunden.","Was funkt er?","TEN SECONDS",["LASER ON","PUSHING","ROLEX"],"TEN SECONDS kündigt den ON-Ruf in ca. 10 Sekunden an. Danach kommt LASER ON.","laser");
L("l09","Jetzt soll dein Laser einschalten.","Was funkt der Pilot?","LASER ON",["LASING","SPARKLE","SPOT"],"LASER ON = Aufforderung zum Lasern. Du antwortest mit LASING.","laser");
L("l10","Auf LASER ON hin beleuchtest du das Ziel mit deinem Bodenlaser.","Was meldest du?","LASING",["LASER ON","SPOT","SPARKLE"],"LASING = ich lasere jetzt. SPOT meldet das Lfz, wenn sein Laser Spot Tracker den Punkt erfasst.","laser");
L("l11","Der Laser Spot Tracker des Lfz hat deinen Laserpunkt erfasst.","Was meldet der Pilot?","SPOT",["CAPTURED","CONTACT","LASING"],"SPOT = reflektierte Laserenergie erfasst. Gegenteil: NEGATIVE LASER.","laser");
L("l12","Du lasert, aber der Laser Spot Tracker des Lfz findet nichts.","Was meldet der Pilot?","NEGATIVE LASER",["DEADEYE","NO JOY","LOOKING"],"NEGATIVE LASER: Code, Laser an, Sichtlinie und Geometrie prüfen.","laser");
L("l13","Der Laserzielbeleuchter im Pod des Lfz ist ausgefallen.","Was meldet der Pilot?","DEADEYE",["NEGATIVE LASER","WINCHESTER","BLIND"],"DEADEYE = eigener Laser ausgefallen. Dann Buddy-Lasing oder eine Waffe ohne Laser.","laser");
L("l14","Die Lenkbombe ist eingeschlagen, die Laserbeleuchtung soll enden.","Was wird gefunkt?","CEASE LASER",["ABORT","STEADY","MILLER TIME"],"CEASE LASER beendet die Beleuchtung. Ältere Unterlagen: TERMINATE.","laser");
L("l15","Nacht. Du markierst das Ziel mit dem IR-Pointer.","Was funkst du?","SPARKLE",["LASING","ROPE","SMOKE"],"SPARKLE = Ziel mit IR-Pointer markiert. ROPE markiert deine eigene Position.","laser");
L("l16","Der Pilot findet deinen IR-Pointer auf dem Ziel nicht und bittet dich, ihn zu bewegen.","Welches Wort?","SNAKE",["ROPE","SHIFT","SPARKLE"],"SNAKE = Pointer in einer Acht um das Ziel bewegen. Bewegung fällt im NVG leichter auf.","laser");
L("l17","Der Pilot hat den bewegten Pointer gefunden. Er soll jetzt ruhig auf dem Ziel liegen.","Welches Wort?","STEADY",["CEASE LASER","ANCHOR","CAPTURED"],"STEADY beendet SNAKE: Der Pointer bleibt ruhig auf dem Ziel.","laser");
L("l18","Nacht. Der Pilot findet deine Stellung nicht. Du hilfst ihm mit dem IR-Pointer.","Was tust du?","ROPE",["SNAKE","SPARKLE","VISUAL"],"ROPE = Pointer kreisförmig um das Lfz führen, damit es deine Position findet.","laser");
L("l19","Du willst prüfen, ob das Lfz wirklich dein Ziel meint: Es soll seinen IR-Pointer auf deinen legen.","Was forderst du an?","MATCH SPARKLE",["BUDDY LASE","SHIFT","SPARKLE"],"MATCH SPARKLE = eigene Markierung über die vorhandene legen.","laser");
L("l20","Der Laserpunkt soll auf das zweite Fahrzeug 50 m weiter östlich wandern.","Welches Wort?","SHIFT",["SNAKE","MATCH SPARKLE","RESET"],"SHIFT verlegt Laser, Pointer oder Haltepunkt – mit Richtung, z. B. „SHIFT EAST 50“.","laser");
L("l21","Ein Lfz wirft eine Laserbombe, ein zweites Lfz soll sie mit seinem Laser ins Ziel führen.","Wie heißt das?","BUDDY LASE",["MATCH SPARKLE","SHIFT","LASING"],"BUDDY LASE = Lenkung durch eine andere Quelle als das abwerfende Lfz.","laser");
L("l22","Der Pilot meldet den Beginn seines Angriffsanflugs aus Westen.","Was funkt er?","IN",["PUSHING","ATTACK","HOT"],"„IN FROM THE WEST“ – Endphase des Angriffs. ATTACK ist laut ATP 1-02.1 nicht für CAS.","angriff");
L("l23","Type 2: Der Pilot meldet IN, Ausrichtung und Einschränkungen passen.","Was funkst du?","CLEARED HOT",["CLEARED TO ENGAGE","CONTINUE","SMACK"],"CLEARED HOT gibt bei Type 1 und 2 den Waffeneinsatz frei. CLEARED TO ENGAGE gilt für Type 3.","angriff");
L("l24","Type 3: Das Lfz soll in einem Raum innerhalb deiner Einschränkungen selbst Ziele bekämpfen.","Was funkst du?","CLEARED TO ENGAGE",["CLEARED HOT","ATTACK","SMACK"],"CLEARED TO ENGAGE = Freigabe für Type 3 innerhalb vorgegebener Parameter.","angriff");
L("l25","Du willst einen Probeanflug, damit der Pilot Ziel und eigene Kräfte sieht – ohne Waffeneinsatz.","Was funkst du nach dem IN-Ruf?","CONTINUE DRY",["ABORT","CONTINUE","SKIP IT"],"CONTINUE DRY = Manöver fortsetzen, kein Waffeneinsatz. CONTINUE allein ändert nichts an der Freigabe.","angriff");
L("l26","Der Pilot meldet IN – sein Kurs zeigt aber über eigene Truppen.","Was funkst du sofort?","ABORT",["CONTINUE DRY","CHECK FIRE","HOLD FIRE"],"ABORT bricht den Angriff vor dem Waffeneinsatz ab – im CAS dreimal: „ABORT, ABORT, ABORT“.","angriff");
L("l27","Das Lfz hat den Angriff beendet und dreht nach Süden ab.","Was funkt der Pilot?","OFF",["EXTEND","BUGOUT","COLD"],"„OFF SOUTH“ – Angriff beendet. EXTEND und BUGOUT sind Ausweichmanöver.","angriff");
L("l28","Das Lfz verlässt den IP in Richtung Ziel.","Was meldet der Pilot?","PUSHING",["IN","PUSH","TEN SECONDS"],"PUSHING = verlässt den festgelegten Punkt. PUSH heißt Frequenzwechsel.","angriff");
L("l29","Zwei Lenkbomben haben das Lfz verlassen.","Was meldet der Pilot?","AWAY",["RIFLE","SPLASH","PICKLE"],"„TWO AWAY“ bzw. „TWO PIGS AWAY“. PICKLE ist Pilotenjargon, kein Brevity-Wort.","waffen");

<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const uniq = a => [...new Set(a)];
const BW = {}; BR.forEach(b => BW[b.w] = b);
const AA = {}; AB.forEach(a => AA[a.a] = a);
const normW = s => String(s || '').toUpperCase().replace(/Ä/g,'AE').replace(/Ö/g,'OE').replace(/Ü/g,'UE').replace(/[^A-Z0-9]+/g, ' ').trim();
const normA = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]+/g, '');
const BWN = {}; BR.forEach(b => BWN[normW(b.w)] = b);
const AAN = {}; AB.forEach(a => AAN[normA(a.a)] = a);

/* ---------- Zustand und Speicherung ---------- */
const KEY = 'brevitytrainer.v1';
const blank = () => ({v:1, updated:0, q:{}, flags:{}, recent:[], answered:0, correct:0, filt:[], scope:'all'});
function readLocal(){ try { const r = localStorage.getItem(KEY); if (r) return Object.assign(blank(), JSON.parse(r)); } catch(e){} return blank(); }
let S = readLocal();
let remote = null, syncLabel = 'Nur auf diesem Gerät gespeichert';
let pushTimer = null;
function save(){
  S.updated = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
  if (remote){ clearTimeout(pushTimer); pushTimer = setTimeout(pushRemote, 1200); }
}
async function pushRemote(){
  if (!remote) return;
  try { await remote.set(JSON.parse(JSON.stringify(S))); }
  catch(e){ if (e && (e.code === 'invalid_argument' || e.code === 'revoked' || e.code === 'not_granted')) { remote = null; syncLabel = 'Nur auf diesem Gerät gespeichert'; } }
}
(async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    const ref = db.doc('data/users/' + id + '/progress');
    const snap = await ref.get();
    remote = ref;
    syncLabel = 'Fortschritt wird geräteübergreifend gespeichert';
    if (snap.exists){
      const r = JSON.parse(JSON.stringify(snap.data() || {}));
      if ((r.updated || 0) > (S.updated || 0)){
        S = Object.assign(blank(), r);
        try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
        if (view !== 'quiz') render();
      } else if (S.updated) pushRemote();
    } else if (S.updated) pushRemote();
    if (view === 'home' || view === 'stats') render();
  } catch(e){ remote = null; }
})();

/* ---------- Fragenbank ---------- */
const KINDS = {
  bm:{l:'Bedeutung'}, bc:{l:'Codewort'}, bo:{l:'Gegenstück'}, bi:{l:'Eingabe'},
  lg:{l:'Lage'}, sq:{l:'Ablauf'}, am:{l:'Abkürzung'}, ad:{l:'Abkürzung'}, ai:{l:'Eingabe'}
};
const SEQG = {s01:'laser', s02:'angriff', s03:'sicht', s04:'laser', s05:'koord'};
const BANK = [];
BR.forEach(b => {
  const x = b.x ? 1 : 0;
  BANK.push({id:'bm:' + b.w, kind:'bm', g:b.g, ref:b.w, x});
  BANK.push({id:'bc:' + b.w, kind:'bc', g:b.g, ref:b.w, x});
  BANK.push({id:'bi:' + b.w, kind:'bi', g:b.g, ref:b.w, x});
  if (b.opp) BANK.push({id:'bo:' + b.w, kind:'bo', g:b.g, ref:b.w, x:x || (BW[b.opp].x ? 1 : 0)});
});
LAGEN.forEach(l => BANK.push({id:'lg:' + l.id, kind:'lg', g:l.g, ref:l.id}));
SEQ.forEach(s => BANK.push({id:'sq:' + s.id, kind:'sq', g:SEQG[s.id] || 'angriff', ref:s.id}));
AB.forEach(a => {
  const x = a.x ? 1 : 0;
  BANK.push({id:'am:' + a.a, kind:'am', g:a.g, ref:a.a, x});
  BANK.push({id:'ad:' + a.a, kind:'ad', g:a.g, ref:a.a, x});
  BANK.push({id:'ai:' + a.a, kind:'ai', g:a.g, ref:a.a, x});
});
const QBYID = {}; BANK.forEach(q => QBYID[q.id] = q);

const MODES = {
  mix:{name:'Gemischte Runde', desc:'Alle Fragetypen – Brevity und Abkürzungen', kinds:['bm','bc','bo','lg','sq','am','ad','bi','ai'], n:20},
  bm:{name:'Was bedeutet das Wort?', desc:'Brevity-Wort hören – Bedeutung wählen', kinds:['bm'], n:15},
  bc:{name:'Welches Wort passt?', desc:'Bedeutung lesen – Brevity-Wort wählen', kinds:['bc'], n:15},
  lg:{name:'Lagen und Abläufe', desc:'Was funkst du, was hörst du – und in welcher Reihenfolge?', kinds:['lg','sq','bo'], n:15},
  bi:{name:'Brevity eintippen', desc:'Ohne Antwortvorgaben – das Wort selbst eingeben', kinds:['bi'], n:15},
  abk:{name:'Abkürzungen', desc:'Langform und Bedeutung – CAS, Luftraum, Feuerunterstützung, Landoperationen', kinds:['am','ad'], n:15},
  ai:{name:'Abkürzungen eintippen', desc:'Bedeutung lesen – Abkürzung eingeben', kinds:['ai'], n:15},
  weak:{name:'Fehler üben', desc:'Nur Fragen, die du zuletzt falsch hattest', kinds:null, n:15}
};
const isB = g => GROUPS[g] && GROUPS[g].k === 'b';
/* Wortschatz: 'core' = nur CAS-Kernwörter, 'all' = mit Erweiterung */
const inScope = o => S.scope !== 'core' || !o.x;
const N_CORE = BR.filter(b => !b.x).length + AB.filter(a => !a.x).length;
function poolFor(mode){
  const m = MODES[mode];
  let p = BANK.filter(q => (!m.kinds || m.kinds.includes(q.kind)) && inScope(q));
  if (S.filt && S.filt.length) p = p.filter(q => S.filt.includes(q.g));
  if (mode === 'weak') p = p.filter(q => S.q[q.id] && S.q[q.id].last === 0);
  return p;
}
function pick(pool, n){
  const recent = new Set(S.recent.slice(-40));
  let cand = pool.filter(q => !recent.has(q.id));
  if (cand.length < n) cand = pool.slice();
  const wt = q => { const r = S.q[q.id]; if (!r) return 3; if (r.last === 0) return 5; return 1 / (1 + (r.streak || 0)); };
  const out = [];
  let bag = cand.map(q => ({q, w:wt(q) * (0.6 + Math.random() * 0.8)}));
  while (out.length < n && bag.length){
    const tot = bag.reduce((s, x) => s + x.w, 0);
    let r = Math.random() * tot, i = 0;
    for (; i < bag.length - 1; i++){ r -= bag[i].w; if (r <= 0) break; }
    const q = bag[i].q; out.push(q);
    /* nicht zweimal dasselbe Wort in einer Runde */
    bag = bag.filter((x, j) => j !== i && x.q.ref !== q.ref);
  }
  return shuffle(out);
}

/* ---------- Distraktoren ---------- */
function fillFrom(list, have, n, ex){
  const out = have.slice();
  for (const x of shuffle(list)) { if (out.length >= n) break; if (!out.includes(x) && !ex.includes(x)) out.push(x); }
  return out;
}
function brWrongWords(b, extraEx){
  const ex = [b.w].concat(extraEx || []);
  let w = b.conf.filter(c => !ex.includes(c));
  w = fillFrom(BR.filter(x => x.g === b.g && inScope(x)).map(x => x.w), w, 3, ex);
  w = fillFrom(BR.filter(x => x.g === b.g).map(x => x.w), w, 3, ex);
  w = fillFrom(BR.filter(inScope).map(x => x.w), w, 3, ex);
  return w.slice(0, 3);
}
function abWrong(a){
  const same = AB.filter(x => x.g === a.g && x.a !== a.a && inScope(x));
  const sim = same.filter(x => x.a[0] === a.a[0] || Math.abs(x.a.length - a.a.length) <= 1);
  let w = fillFrom(sim, [], 2, []);
  w = fillFrom(same, w, 3, []);
  w = fillFrom(AB.filter(x => x.a !== a.a), w, 3, []);
  return w.slice(0, 3);
}

/* ---------- Frage erzeugen ---------- */
function materialize(q){
  const m = {q, kind:q.kind};
  if (q.kind === 'bm'){
    const b = BW[q.ref];
    m.html = `<p class="prompt">Was bedeutet dieses Brevity-Wort?</p><div class="bigcode">${esc(b.w)}</div>`;
    m.plain = `Was bedeutet ${b.w}?`;
    m.correct = b.de; m.wrong = brWrongWords(b).map(w => BW[w].de); m.optCode = false;
    m.entries = [b];
  } else if (q.kind === 'bc'){
    const b = BW[q.ref];
    m.html = `<p class="prompt">Welches Brevity-Wort passt?</p><div class="defbox">${esc(b.de)}</div>`;
    m.plain = `Welches Wort: ${b.de}`;
    m.correct = b.w; m.wrong = brWrongWords(b); m.optCode = true;
    m.entries = [b];
  } else if (q.kind === 'bo'){
    const b = BW[q.ref], o = BW[b.opp];
    m.html = `<p class="prompt">Was ist das Gegenstück zu</p><div class="bigcode">${esc(b.w)}</div>`;
    m.plain = `Gegenstück zu ${b.w}?`;
    m.correct = o.w;
    let w = b.conf.filter(c => c !== o.w && c !== b.w);
    w = fillFrom(BR.filter(x => x.opp && x.w !== b.w && x.w !== o.w && inScope(x)).map(x => x.w), w, 3, [b.w, o.w]);
    w = fillFrom(BR.filter(x => x.opp && x.w !== b.w && x.w !== o.w).map(x => x.w), w, 3, [b.w, o.w]);
    m.wrong = w.slice(0, 3); m.optCode = true;
    m.entries = [b, o];
  } else if (q.kind === 'bi'){
    const b = BW[q.ref];
    m.html = `<p class="prompt">Tippe das Brevity-Wort ein.</p><div class="defbox">${esc(b.de)}</div>`;
    m.plain = `Eintippen: ${b.de}`;
    m.typed = 'b'; m.correct = b.w; m.entries = [b];
  } else if (q.kind === 'lg'){
    const l = LAGEN.find(x => x.id === q.ref);
    m.html = `<div class="lage"><div class="lh">Situation</div><p>${esc(l.lage)}</p></div><p class="prompt">${esc(l.q)}</p>`;
    m.plain = l.lage + ' ' + l.q;
    m.correct = l.a; m.wrong = l.w.slice(); m.optCode = true; m.ex = l.ex;
    m.entries = [BW[l.a]].filter(Boolean);
  } else if (q.kind === 'sq'){
    const s = SEQ.find(x => x.id === q.ref);
    m.html = `<p class="prompt">${esc(s.q)}</p>`;
    m.plain = s.q;
    const j = a => a.join(' → ');
    m.correct = j(s.a); m.wrong = s.w.map(j); m.seq = true; m.ex = s.ex;
    m.entries = [];
  } else if (q.kind === 'am'){
    const a = AA[q.ref];
    m.html = `<p class="prompt">Wofür steht diese Abkürzung?</p><div class="bigcode">${esc(a.a)}</div>`;
    m.plain = `Wofür steht ${a.a}?`;
    m.correct = a.long; m.wrong = abWrong(a).map(x => x.long); m.optCode = false;
    m.abk = [a];
  } else if (q.kind === 'ad'){
    const a = AA[q.ref];
    m.html = `<p class="prompt">Welche Abkürzung passt?</p><div class="defbox">${esc(a.de)}</div>`;
    m.plain = `Welche Abkürzung: ${a.de}`;
    m.correct = a.a; m.wrong = abWrong(a).map(x => x.a); m.optCode = true;
    m.abk = [a];
  } else if (q.kind === 'ai'){
    const a = AA[q.ref];
    m.html = `<p class="prompt">Tippe die Abkürzung ein.</p><div class="defbox">${esc(a.de)}</div>`;
    m.plain = `Abkürzung eintippen: ${a.de}`;
    m.typed = 'a'; m.correct = a.a; m.abk = [a];
  }
  if (!m.typed){
    m.opts = shuffle(uniq([m.correct].concat(m.wrong)).slice(0, 4));
  }
  return m;
}

/* ---------- Eingabe prüfen ---------- */
function checkTyped(m, raw){
  if (m.typed === 'b'){
    const b = BW[m.correct], n = normW(raw);
    if (!n) return {v:'bad', msg:'Keine Eingabe.'};
    if (n === normW(b.w) || n.replace(/ /g, '') === normW(b.w).replace(/ /g, '') || (b.acc || []).some(r => r.test(n))) return {v:'ok'};
    for (const [r, msg] of (b.near || [])) if (r.test(n)) return {v:'near', msg};
    const o = BWN[n];
    if (o) return {v:'bad', msg:`${o.w} bedeutet: ${o.de}`};
    if (n === 'PICKLE') return {v:'bad', msg:'PICKLE ist Pilotenjargon und kein Brevity-Wort.'};
    if (n === 'SHACK') return {v:'bad', msg:'SHACK steht nicht mehr in der aktuellen Brevity-Publikation.'};
    return {v:'bad'};
  } else {
    const a = AA[m.correct], n = normA(raw);
    if (!n) return {v:'bad', msg:'Keine Eingabe.'};
    if (n === normA(a.a)) return {v:'ok'};
    const o = AAN[n];
    if (o) return {v:'bad', msg:`${o.a} steht für ${o.long}: ${o.de}`};
    return {v:'bad'};
  }
}

/* ---------- Ablauf ---------- */
let view = 'home', R = null, glossTab = 'b', glossQ = '', statsConfirm = false;

function startRound(mode, list){
  const pool = list || poolFor(mode);
  if (!pool.length) return;
  const qs = list ? shuffle(list).slice(0, 30) : pick(pool, Math.min(MODES[mode].n, pool.length));
  R = {mode, qs, i:0, res:[], cur:materialize(qs[0]), answered:false, verdict:null};
  view = 'quiz'; render(); window.scrollTo(0, 0);
}
function record(q, ok){
  const r = S.q[q.id] || {n:0, ok:0, streak:0, last:null};
  r.n++; if (ok) { r.ok++; r.streak = (r.streak || 0) + 1; r.last = 1; } else { r.streak = 0; r.last = 0; }
  S.q[q.id] = r; S.answered++; if (ok) S.correct++;
  S.recent.push(q.id); if (S.recent.length > 80) S.recent = S.recent.slice(-80);
  save();
}
function answerMC(idx){
  if (!R || R.answered) return;
  const m = R.cur, chosen = m.opts[idx], ok = chosen === m.correct;
  R.answered = true; R.chosen = chosen; R.verdict = ok ? 'ok' : 'bad';
  R.res.push({q:m.q, ok, m, given:chosen});
  record(m.q, ok); render();
}
function answerTyped(raw){
  if (!R || R.answered) return;
  const m = R.cur, r = checkTyped(m, raw);
  R.answered = true; R.typedRaw = raw; R.verdict = r.v; R.vmsg = r.msg;
  const ok = r.v === 'ok';
  R.res.push({q:m.q, ok, m, given:raw});
  record(m.q, ok); render();
}
function next(){
  if (!R) return;
  R.i++;
  if (R.i >= R.qs.length){ view = 'end'; render(); window.scrollTo(0, 0); return; }
  R.cur = materialize(R.qs[R.i]); R.answered = false; R.verdict = null; R.chosen = null; R.vmsg = null; R.typedRaw = '';
  render(); window.scrollTo(0, 0);
}
function toggleFlag(){
  const m = R && R.cur; if (!m) return;
  const id = m.q.id;
  if (S.flags[id]) delete S.flags[id]; else S.flags[id] = {t:m.plain.slice(0, 160), ts:Date.now()};
  save(); render();
}

/* ---------- Darstellung ---------- */
function entryHtml(b){
  return `<div class="entry"><div class="hd"><span class="code">${esc(b.w)}</span><span class="pill">${esc(GROUPS[b.g].l)}</span>${b.opp ? `<span class="pill">Gegenstück: ${esc(b.opp)}</span>` : ''}</div>
    <p style="margin:6px 0 0">${esc(b.de)}</p><p class="en">ATP 1-02.1: „${esc(b.en)}“</p>${b.note ? `<p class="nt">${esc(b.note)}</p>` : ''}</div>`;
}
function abkHtml(a){
  return `<div class="entry"><div class="hd"><span class="code">${esc(a.a)}</span><span class="lf">${esc(a.long)}</span></div><p style="margin:6px 0 0">${esc(a.de)}</p></div>`;
}
function optLabel(m, t){
  if (m.seq) return `<span class="ot seq">${t.split(' → ').map(x => `<span class="code">${esc(x)}</span>`).join('<span class="ar">→</span>')}</span>`;
  return `<span class="ot${m.optCode ? ' code' : ''}">${esc(t)}</span>`;
}
function bar(){
  const bi = $('#barin'), pg = $('#prog');
  if (view === 'home'){
    bi.innerHTML = `<span class="t">Brevity-Trainer</span><button class="iconbtn" data-go="gloss">Nachschlagen</button>`;
    pg.hidden = true;
  } else if (view === 'quiz' || view === 'end'){
    const n = R ? R.qs.length : 0, i = R ? Math.min(R.i + (view === 'end' ? 0 : 1), n) : 0;
    bi.innerHTML = `<button class="iconbtn" data-go="home" aria-label="Zur Übersicht">‹ Übersicht</button><span class="t">${esc(MODES[R.mode] ? MODES[R.mode].name : '')}</span><span class="tag">${view === 'end' ? n + '/' + n : i + '/' + n}</span>`;
    pg.hidden = false; pg.firstChild.style.width = (n ? (view === 'end' ? 100 : (R.i / n) * 100) : 0) + '%';
  } else {
    bi.innerHTML = `<button class="iconbtn" data-go="home" aria-label="Zur Übersicht">‹ Übersicht</button><span class="t">${view === 'gloss' ? 'Nachschlagen' : 'Statistik'}</span>`;
    pg.hidden = true;
  }
}
function groupScore(g){
  const qs = BANK.filter(q => q.g === g && inScope(q));
  const seen = qs.filter(q => S.q[q.id]);
  const good = qs.filter(q => S.q[q.id] && S.q[q.id].last === 1).length;
  return {n:qs.length, seen:seen.length, good, frac: qs.length ? good / qs.length : 0};
}
function cellHtml(g){
  const s = groupScore(g), pct = Math.round(s.frac * 100);
  const st = !s.seen ? 'none' : s.frac >= .8 ? 'ok' : s.frac >= .4 ? 'mid' : 'bad';
  const pressed = S.filt.includes(g);
  return `<button class="cell" data-s="${st}" data-filt="${g}" aria-pressed="${pressed}"><b>${s.seen ? pct + ' %' : '–'}</b><span>${esc(GROUPS[g].l)}</span><i style="width:${pct}%"></i></button>`;
}
function renderHome(){
  const nF = Object.keys(S.flags).length;
  const filt = S.filt.length ? `<div class="filtnote"><span>Nur ${S.filt.length === 1 ? 'Thema' : 'Themen'}: ${S.filt.map(g => esc(GROUPS[g].l)).join(', ')}</span><button class="linkbtn" data-act="clearfilt">Alle Themen</button></div>`
    : `<div class="filtnote">Tippe auf Themen, um die Runden darauf zu beschränken.</div>`;
  const modeBtn = k => { const n = poolFor(k).length; return `<button class="mode" data-start="${k}" ${n ? '' : 'disabled'}><span class="mi"><strong>${esc(MODES[k].name)}</strong><small>${esc(MODES[k].desc)}</small></span><span class="n">${n} Fragen</span></button>`; };
  $('#app').innerHTML = `
  <section class="hero"><a class="hublink" href="../">‹ Alle Trainer</a><h1>Brevity</h1>
    <p>Codewörter nach ATP 1-02.1 – vom CAS-Kern bis zu Luftlage, EloKa, Funk, Bodenfeuer und Hubschraubern – und Abkürzungen aus CAS, Luftraum, Luftoperationen, Feuerunterstützung und Landoperationen.</p>
    <span class="radioline">HOG 31: IN FROM THE WEST – JTAC: CLEARED HOT</span></section>
  <section class="board">
    <div class="seg" role="group" aria-label="Wortschatz wählen" style="margin-top:4px"><button data-scope="core" aria-pressed="${S.scope === 'core'}">CAS-Kern (${N_CORE})</button><button data-scope="all" aria-pressed="${S.scope !== 'core'}">Alles (${BR.length + AB.length})</button></div>
    <h3>Brevity</h3><div class="cells">${G_ORDER_B.filter(g => groupScore(g).n).map(cellHtml).join('')}</div>
    <h3>Abkürzungen</h3><div class="cells">${G_ORDER_A.filter(g => groupScore(g).n).map(cellHtml).join('')}</div>
    ${filt}
  </section>
  <button class="cta" data-start="mix"><span><strong>Gemischte Runde</strong><small>${Math.min(20, poolFor('mix').length)} Fragen aus allen Fragetypen</small></span><span class="go">→</span></button>
  <nav class="modes">
    <h3>Brevity</h3>${['bm','bc','lg','bi'].map(modeBtn).join('')}
    <h3>Abkürzungen</h3>${['abk','ai'].map(modeBtn).join('')}
    <h3>Wiederholen</h3>${modeBtn('weak')}
    <button class="mode" data-go="gloss"><span class="mi"><strong>Nachschlagen</strong><small>Alle ${BR.length} Brevity-Wörter und ${AB.length} Abkürzungen mit Suche</small></span><span class="n">→</span></button>
    <button class="mode" data-go="stats"><span class="mi"><strong>Statistik und gemeldete Fragen</strong><small>Trefferquote je Thema, markierte Fragen</small></span><span class="n">${nF ? nF + ' gemeldet' : ''}</span></button>
  </nav>
  <div class="foot">
    <p>Brevity nach ATP 1-02.1 „Multi-Service Brevity Codes“ (Ausgabe April 2025) bzw. NATO APP-7. Nationale Lehrgangsunterlagen nutzen teils ältere Ausgaben – z. B. TERMINATE statt CEASE LASER oder SHACK für einen Treffer.</p>
    <p>Weitere Trainer: <a href="../drill/">JTAC-Drill</a>, <a href="../waffen/">Waffen-Trainer</a>, <a href="../pods/">Pod-Trainer</a>, <a href="../manoever/">Manöver-Trainer</a>, <a href="../artillerie/">Artillerie-Trainer</a>, <a href="../flugabwehr/">Flugabwehr-Trainer</a> und <a href="https://claude.ai/artifact/Vzk2Qy8udnfbJcAvjCMLSS" target="_blank" rel="noopener">Sensor-to-Shooter-Guide</a>.</p>
    <p>${esc(syncLabel)}.</p>
  </div>`;
}
function renderQuiz(){
  const m = R.cur, q = m.q, ans = R.answered;
  let body = '';
  if (m.typed){
    const ph = m.typed === 'b' ? 'z. B. TALLY' : 'z. B. JTAC';
    body = `<form id="tform" autocomplete="off"><label class="muted" for="tin" style="display:block;margin-bottom:5px;font-weight:600">${m.typed === 'b' ? 'Brevity-Wort' : 'Abkürzung'}</label>
      <input class="inp" id="tin" name="tin" ${ans ? 'readonly' : ''} value="${esc(R.typedRaw || '')}" placeholder="${ph}" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="done">
      ${ans ? '' : `<div class="row"><button class="btn main" type="submit">Prüfen</button><button class="btn" type="button" data-act="giveup">Weiß ich nicht</button></div>`}</form>`;
  } else {
    body = `<div class="opts">${m.opts.map((o, i) => {
      let cls = 'opt';
      if (ans){ if (o === m.correct) cls += ' correct'; else if (o === R.chosen) cls += ' wrong'; else cls += ' dim'; }
      return `<button class="${cls}" data-ans="${i}" ${ans ? 'disabled' : ''}><span class="k">${i + 1}</span>${optLabel(m, o)}</button>`;
    }).join('')}</div>`;
  }
  let fb = '';
  if (ans){
    const v = R.verdict, col = v === 'ok' ? 'var(--ok)' : v === 'near' ? 'var(--unk)' : 'var(--bad)';
    const head = v === 'ok' ? 'Richtig' : v === 'near' ? 'Fast – zählt als falsch' : 'Falsch';
    let sol = '';
    if (m.typed) sol = v === 'ok' ? '' : `<p>Richtig: <span class="code">${esc(m.correct)}</span></p>`;
    else if (v !== 'ok') sol = `<p>Richtig: ${m.optCode || m.seq ? `<span class="code" style="white-space:normal">${esc(m.correct)}</span>` : esc(m.correct)}</p>`;
    fb = `<div class="fb" style="--c:${col}"><div class="v">${head}</div>${sol}${R.vmsg ? `<p>${esc(R.vmsg)}</p>` : ''}${m.ex ? `<p>${esc(m.ex)}</p>` : ''}
      ${(m.entries || []).map(entryHtml).join('')}${(m.abk || []).map(abkHtml).join('')}</div>
      <div class="row"><button class="btn main" data-act="next">${R.i + 1 >= R.qs.length ? 'Auswertung' : 'Weiter'}</button>
      <button class="btn${S.flags[q.id] ? ' flagged' : ''}" data-act="flag">${S.flags[q.id] ? 'Gemeldet' : 'Frage melden'}</button></div>`;
  }
  $('#app').innerHTML = `<div class="qmeta"><span class="chip-cat">${esc(KINDS[q.kind].l)}</span><span>${esc(GROUPS[q.g].l)}</span></div>${m.html}${body}${fb}`;
  if (m.typed && !ans){ const t = $('#tin'); if (t) setTimeout(() => { try { t.focus({preventScroll:true}); } catch(e){} }, 30); }
}
function renderEnd(){
  const ok = R.res.filter(r => r.ok).length, n = R.res.length;
  const miss = R.res.filter(r => !r.ok);
  $('#app').innerHTML = `<div class="score">${ok}<small> / ${n}</small></div>
    <p class="muted">${ok === n ? 'Alles richtig.' : miss.length + (miss.length === 1 ? ' Fehler' : ' Fehler') + ' – unten mit Lösung.'}</p>
    <div class="row"><button class="btn main" data-start="${R.mode}">Neue Runde</button>${miss.length ? `<button class="btn" data-act="retrymiss">Fehler wiederholen</button>` : ''}<button class="btn" data-go="home">Übersicht</button></div>
    ${miss.length ? `<ul class="misslist">${miss.map(r => `<li><div>${esc(r.m.plain)}</div><div class="muted" style="font-size:.9rem">Deine Antwort: ${esc(r.given || '–')}</div><div>Richtig: <span class="code" style="white-space:normal">${esc(r.m.correct)}</span></div></li>`).join('')}</ul>` : ''}`;
}
function glossHtml(){
  const ql = glossQ.trim().toLowerCase();
  const hit = s => !ql || s.toLowerCase().includes(ql);
  let out = '';
  if (glossTab === 'b'){
    for (const g of G_ORDER_B){
      const items = BR.filter(b => b.g === g && (hit(b.w) || hit(b.de) || hit(b.en) || hit(b.note || ''))).sort((a, b) => a.w.localeCompare(b.w));
      if (!items.length) continue;
      out += `<h3>${esc(GROUPS[g].l)}</h3>` + items.map(b => `<div class="it"><div class="hd"><span class="code">${esc(b.w)}</span>${b.opp ? `<span class="pill">Gegenstück: ${esc(b.opp)}</span>` : ''}</div><p>${esc(b.de)}</p><p class="en">${esc(b.en)}</p>${b.note ? `<p style="font-size:.92rem">${esc(b.note)}</p>` : ''}</div>`).join('');
    }
  } else {
    for (const g of G_ORDER_A){
      const items = AB.filter(a => a.g === g && (hit(a.a) || hit(a.long) || hit(a.de))).sort((x, y) => x.a.localeCompare(y.a));
      if (!items.length) continue;
      out += `<h3>${esc(GROUPS[g].l)}</h3>` + items.map(a => `<div class="it"><div class="hd"><span class="code">${esc(a.a)}</span><strong>${esc(a.long)}</strong></div><p>${esc(a.de)}</p></div>`).join('');
    }
  }
  return out || `<p class="empty">Nichts gefunden.</p>`;
}
function renderGloss(){
  $('#app').innerHTML = `<div class="seg" role="group" aria-label="Liste wählen"><button data-tab="b" aria-pressed="${glossTab === 'b'}">Brevity (${BR.length})</button><button data-tab="a" aria-pressed="${glossTab === 'a'}">Abkürzungen (${AB.length})</button></div>
    <input class="search" id="gsearch" type="search" placeholder="Suchen, z. B. Laser oder RED" value="${esc(glossQ)}" aria-label="Suchen">
    <div class="gl" id="gl">${glossHtml()}</div>`;
}
function renderStats(){
  const pct = S.answered ? Math.round(S.correct / S.answered * 100) : 0;
  const rows = G_ORDER_B.concat(G_ORDER_A).map(g => {
    const s = groupScore(g), p = Math.round(s.frac * 100);
    if (!s.n) return '';
    const col = !s.seen ? 'var(--line)' : s.frac >= .8 ? 'var(--ok)' : s.frac >= .4 ? 'var(--cta)' : 'var(--bad)';
    return `<div class="srow"><span>${esc(GROUPS[g].l)}${isB(g) ? '' : ' <span class="muted">(Abk.)</span>'}</span><span class="sbar"><i style="width:${p}%;background:${col}"></i></span><span class="muted" style="text-align:right">${s.good}/${s.n}</span></div>`;
  }).join('');
  const flags = Object.entries(S.flags).sort((a, b) => b[1].ts - a[1].ts);
  $('#app').innerHTML = `<div class="stat-top"><div><b>${S.answered}</b><span class="muted">Antworten</span></div><div><b>${pct} %</b><span class="muted">richtig</span></div><div><b>${Object.keys(S.q).length}</b><span class="muted">von ${BANK.length} Fragen gesehen</span></div></div>
    <h2 style="margin-top:18px">Je Thema <span class="muted" style="font-size:.95rem;font-weight:500">zuletzt richtig beantwortet</span></h2>${rows}
    <h2 style="margin-top:24px">Gemeldete Fragen</h2>
    ${flags.length ? `<ul class="misslist">${flags.map(([id, f]) => `<li><div>${esc(f.t)}</div><button class="linkbtn" data-unflag="${esc(id)}">Meldung entfernen</button></li>`).join('')}</ul>` : '<p class="muted">Keine. Melde eine Frage nach dem Beantworten mit „Frage melden“ – ich prüfe sie dann.</p>'}
    <h2 style="margin-top:24px">Fortschritt</h2>
    ${statsConfirm ? `<div class="confirm"><p style="margin:0 0 8px">Gesamten Fortschritt löschen? Gemeldete Fragen bleiben erhalten.</p><div class="row" style="margin-top:0"><button class="btn" data-act="resetyes" style="border-color:var(--bad);color:var(--bad)">Löschen</button><button class="btn" data-act="resetno">Abbrechen</button></div></div>`
      : `<button class="btn" data-act="reset" style="margin-top:8px">Fortschritt zurücksetzen</button>`}
    <p class="muted" style="font-size:.86rem;margin-top:14px">${esc(syncLabel)}.</p>`;
}
function render(){
  bar();
  if (view === 'home') renderHome();
  else if (view === 'quiz') renderQuiz();
  else if (view === 'end') renderEnd();
  else if (view === 'gloss') renderGloss();
  else if (view === 'stats') renderStats();
}

/* ---------- Ereignisse ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.go){ view = t.dataset.go; statsConfirm = false; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.start){ startRound(t.dataset.start); return; }
  if (t.dataset.ans != null){ answerMC(+t.dataset.ans); return; }
  if (t.dataset.filt){ const g = t.dataset.filt; S.filt = S.filt.includes(g) ? S.filt.filter(x => x !== g) : S.filt.concat(g); save(); render(); return; }
  if (t.dataset.tab){ glossTab = t.dataset.tab; render(); return; }
  if (t.dataset.scope){ S.scope = t.dataset.scope; S.filt = S.filt.filter(g => groupScore(g).n); save(); render(); return; }
  if (t.dataset.unflag){ delete S.flags[t.dataset.unflag]; save(); render(); return; }
  const act = t.dataset.act;
  if (act === 'next') next();
  else if (act === 'flag') toggleFlag();
  else if (act === 'giveup') answerTyped('');
  else if (act === 'clearfilt'){ S.filt = []; save(); render(); }
  else if (act === 'retrymiss'){ const miss = R.res.filter(r => !r.ok).map(r => r.q); startRound(R.mode, miss); }
  else if (act === 'reset'){ statsConfirm = true; render(); }
  else if (act === 'resetno'){ statsConfirm = false; render(); }
  else if (act === 'resetyes'){ const fl = S.flags; S = blank(); S.flags = fl; statsConfirm = false; save(); render(); }
});
document.addEventListener('submit', e => {
  if (e.target.id === 'tform'){ e.preventDefault(); const v = $('#tin') ? $('#tin').value : ''; answerTyped(v); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'gsearch'){ glossQ = e.target.value; const gl = $('#gl'); if (gl) gl.innerHTML = glossHtml(); }
});
document.addEventListener('keydown', e => {
  if (view !== 'quiz' || !R) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (!R.answered && !R.cur.typed && /^[1-4]$/.test(e.key) && tag !== 'input'){ const i = +e.key - 1; if (i < R.cur.opts.length) answerMC(i); }
  else if (R.answered && e.key === 'Enter'){ e.preventDefault(); next(); }
});

window.__bt = {BANK, materialize, checkTyped, MODES, poolFor, pick};
render();
})();
</script>
<script src="../assets/app.js" defer></script>
