<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Blau-Trainer</title>
<meta name="theme-color" content="#E4E9E7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1517" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="JTAC">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/app.css">
<style>
:root{
  --bg:#E4E9E7; --surface:#F4F7F5; --surface2:#E9EEEC; --ink:#1A2326; --muted:#55615F; --line:#C3CCC9;
  --ok:#2A7848; --ok-bg:#DCEEE2; --bad:#B0382B; --bad-bg:#F6DEDA; --unk:#7A6A2E; --unk-bg:#F1E9CF;
  --cta:#E0A526; --cta-ink:#1A2326; --feed:#0B1113; --hud:#F2B632;
  --font-d:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --font-b:"Barlow","Segoe UI",system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1517; --surface:#172022; --surface2:#1D282B; --ink:#E1E7E5; --muted:#93A09D; --line:#2A3639;
    --ok:#56B57F; --ok-bg:#16301F; --bad:#E36D5E; --bad-bg:#3A1C18; --unk:#D9C17A; --unk-bg:#2E2913;
    --cta:#E3AA2E; --cta-ink:#111719; --feed:#06090A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1517; --surface:#172022; --surface2:#1D282B; --ink:#E1E7E5; --muted:#93A09D; --line:#2A3639;
  --ok:#56B57F; --ok-bg:#16301F; --bad:#E36D5E; --bad-bg:#3A1C18; --unk:#D9C17A; --unk-bg:#2E2913;
  --cta:#E3AA2E; --cta-ink:#111719; --feed:#06090A; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--cta);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:12px 18px 48px}
h1,h2,h3{font-family:var(--font-d);line-height:1.1;margin:0}
h2{font-size:1.45rem;font-weight:600;letter-spacing:.005em}
h3{font-size:1.25rem;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.875rem}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:720px;margin:0 auto;padding:8px 18px;display:flex;align-items:center;gap:12px;min-height:52px}
.bar .t{font-family:var(--font-d);font-weight:600;font-size:1.2rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:40px;height:40px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:500}
.prog{height:3px;background:var(--line)}
.prog>i{display:block;height:100%;background:var(--cta);transition:width .25s}

/* home */
.hero{padding:28px 0 20px}
.hero h1{font-size:clamp(3rem,13vw,5.2rem);font-weight:700;letter-spacing:-.015em;line-height:.9}
.hero p{max-width:34em;margin:12px 0 0;color:var(--muted);font-size:1.05rem}
.board{margin:8px 0 24px}
.board-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.cells{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.board h3{font-size:1.05rem;color:var(--muted);margin:14px 0 6px;letter-spacing:.04em;text-transform:uppercase}
@media (min-width:600px){.cells{grid-template-columns:repeat(8,minmax(0,1fr))}}
.cell{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 8px 12px;min-height:66px;overflow:hidden}
.cell b{display:block;font-family:var(--font-d);font-weight:700;font-size:1.25rem;line-height:1}
.cell span{display:block;font-size:.72rem;color:var(--muted);line-height:1.2;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell i{position:absolute;left:0;bottom:0;height:5px;background:var(--line)}
.cell[data-s="bad"] i{background:var(--bad)} .cell[data-s="mid"] i{background:var(--cta)} .cell[data-s="ok"] i{background:var(--ok)}
.cell[data-s="none"]{border-style:dashed}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:.8rem;color:var(--muted)}
.legend em{font-style:normal;display:inline-flex;align-items:center;gap:5px}
.legend em::before{content:"";width:12px;height:5px;background:var(--c)}
.cta{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;background:var(--cta);color:var(--cta-ink);border:0;border-radius:10px;padding:16px 18px;text-align:left}
.cta strong{font-family:var(--font-d);font-size:1.5rem;font-weight:700;display:block;line-height:1.05}
.cta small{display:block;font-size:.9rem;opacity:.85}
.cta .go{font-family:var(--font-d);font-size:1.6rem;font-weight:700}
.modes{margin-top:22px;border-top:1px solid var(--line)}
.mode{display:flex;width:100%;gap:14px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 2px}
.mode .mi{flex:1}
.mode strong{display:block;font-family:var(--font-d);font-size:1.3rem;font-weight:600;line-height:1.1}
.mode small{display:block;color:var(--muted);font-size:.9rem;margin-top:2px}
.mode .n{font-family:var(--font-d);font-size:1.1rem;color:var(--muted);white-space:nowrap}
.mode:hover strong{text-decoration:underline;text-underline-offset:3px}
.foot{margin-top:28px;font-size:.82rem;color:var(--muted);max-width:40em}

/* feed */
.feed{position:relative;margin:0;background:var(--feed);border-radius:10px;overflow:hidden;aspect-ratio:4/3;cursor:zoom-in}
.feed img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.feed svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.feed .hud{position:absolute;font-family:var(--font-d);font-weight:600;font-size:.8rem;letter-spacing:.06em;color:var(--hud);opacity:.85;text-shadow:0 1px 2px #000}
.feed .hud.tl{top:10px;left:14px} .feed .hud.tr{top:10px;right:14px} .feed .hud.bl{bottom:10px;left:14px}
.feed .nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:1.4rem;display:flex;align-items:center;justify-content:center;pointer-events:auto}
.feed .nav.l{left:8px} .feed .nav.r{right:8px}

/* quiz */
.qmeta{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 10px;font-size:.9rem;color:var(--muted)}
.prompt{font-family:var(--font-d);font-size:1.55rem;font-weight:600;line-height:1.15;margin:14px 0 14px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;line-height:1.35}
.opt .k{flex:none;width:26px;height:26px;border-radius:6px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-weight:700;color:var(--muted);font-size:.95rem}
.opt:not([disabled]):hover{border-color:var(--ink)}
.opt[disabled]{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)} .opt.correct .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)} .opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.fb{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c,var(--ok));border-radius:10px;padding:14px 16px}
.fb .v{font-family:var(--font-d);font-size:1.35rem;font-weight:700;color:var(--c)}
.fb p{margin:6px 0 0}
.profile{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.profile h3 small{font-family:var(--font-b);font-size:.85rem;font-weight:500;color:var(--muted);margin-left:6px}
.kv{display:grid;grid-template-columns:7.5em 1fr;gap:4px 12px;margin:10px 0 0;font-size:.94rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;padding:0;list-style:none}
.chips li{font-size:.82rem;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--surface2);border:1px solid var(--line)}
.chips li[data-v="1"]{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.chips li[data-v="0"]{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.chips li[data-v="?"]{background:var(--unk-bg);border-color:var(--unk);color:var(--unk)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:10px 14px;font-weight:600}
.btn.main{background:var(--ink);color:var(--bg);border-color:var(--ink);flex:1;min-width:9em}
.btn.flagged{border-color:var(--bad);color:var(--bad)}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-weight:600}

/* end */
.score{font-family:var(--font-d);font-size:5rem;font-weight:700;line-height:.9;margin:24px 0 4px}
.misslist{list-style:none;padding:0;margin:12px 0 0;border-top:1px solid var(--line)}
.misslist li{padding:10px 0;border-bottom:1px solid var(--line)}

/* cards list */
.group{margin-top:24px}
.group h2{margin-bottom:6px}
.fam{display:flex;width:100%;align-items:center;gap:12px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 2px}
.fam .code{font-family:var(--font-d);font-weight:700;font-size:1.1rem;width:3em;color:var(--muted)}
.fam .nm{flex:1;font-weight:600}
.fam .pct{font-family:var(--font-d);font-size:1.05rem;color:var(--muted)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch}
.sheet[hidden]{display:none}
.sec{margin-top:18px}
.sec h3{font-size:1.1rem;margin-bottom:4px}
.sec ul{margin:4px 0 0;padding-left:1.15em}
.sec li{margin:2px 0}
.desig{font-size:.95rem;color:var(--muted);margin-top:4px}
.bw{margin-top:12px;border-left:4px solid var(--cta);background:var(--surface);padding:8px 12px;border-radius:0 8px 8px 0;font-size:.95rem}
.lightbox{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:12px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}

/* stats */
.stat-top{display:flex;gap:28px;margin:18px 0 6px}
.stat-top b{display:block;font-family:var(--font-d);font-size:2.4rem;line-height:1}
.srow{display:grid;grid-template-columns:8.5em 1fr 4.2em;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.94rem}
.sbar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.sbar i{display:block;height:100%}
textarea{width:100%;min-height:120px;font:inherit;font-size:.85rem;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
.sync{font-size:.8rem;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.foot a{color:var(--ink);text-underline-offset:3px}
.annobox{margin-top:12px}
.annobox #annoarea{margin-top:12px}
.anno{position:relative;margin:0;max-width:100%;border-radius:10px;overflow:hidden;background:var(--feed);cursor:zoom-in}
.anno img{display:block;width:100%;height:100%;object-fit:cover}
.anno .pin{position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:var(--hud);color:#111;border:2px solid #111;font-family:var(--font-d);font-weight:700;font-size:.95rem;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.6);pointer-events:none}
.legendlist{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:6px}
.legendlist li{display:flex;gap:10px;align-items:flex-start;font-size:.94rem;line-height:1.35}
.legendlist b{flex:none;width:22px;height:22px;border-radius:50%;background:var(--hud);color:#111;font-family:var(--font-d);font-size:.85rem;display:flex;align-items:center;justify-content:center;margin-top:1px}
.unitrow{margin-top:10px}
.unitrow strong{font-family:var(--font-d);font-size:1.08rem;font-weight:600}
.unitrow .chips{margin-top:4px}
.vbox{margin-top:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.vbox h4{margin:0;font-family:var(--font-d);font-size:1.2rem;font-weight:600}
.vbox .kv{grid-template-columns:6.8em 1fr}
.sec h3 + .vbox{margin-top:6px}
.imgcap{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:8px}
.vlabel{font-family:var(--font-d);font-weight:700;font-size:1.25rem;background:var(--ink);color:var(--bg);border-radius:6px;padding:2px 10px}
.vlabel.none{background:var(--surface2);color:var(--muted);font-weight:600;font-size:1rem}
.capbtns{display:flex;gap:6px;flex-wrap:wrap}
.btn.sm{padding:6px 10px;font-size:.88rem}
.pinwrap{margin-top:10px}
.fam.sub{padding-left:18px;background:var(--surface)}
.fam.sub .nm{font-weight:600}
.unitrow.cur{border-left:4px solid var(--cta);padding-left:8px}
.tag{font-family:var(--font-b);font-size:.75rem;font-weight:600;background:var(--cta);color:var(--cta-ink);border-radius:999px;padding:1px 8px;vertical-align:middle}
.guide-link{display:flex;gap:14px;align-items:center;margin-top:18px;padding:14px 16px;border:1px solid var(--line);border-left:4px solid var(--cta);border-radius:10px;background:var(--surface);color:var(--ink);text-decoration:none}.guide-link .mi{flex:1}.guide-link strong{display:block;font-family:var(--font-d);font-size:1.3rem;font-weight:600;line-height:1.1}.guide-link small{display:block;color:var(--muted);font-size:.9rem;margin-top:2px}.guide-link .n{font-family:var(--font-d);font-size:1.1rem;color:var(--muted);white-space:nowrap}.guide-link:hover strong{text-decoration:underline;text-underline-offset:3px}
.foot a{color:var(--ink);text-underline-offset:3px}
</style>
<style>
.cmpwrap{margin-top:8px}
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cmpfig{margin:0;min-width:0}
.cmpfig>.ctag{display:inline-block;margin-bottom:4px;background:var(--ink);color:var(--bg);font-family:var(--font-d);font-weight:700;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;padding:1px 8px;border-radius:5px}
.cmpbox{display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;max-width:100%;background:var(--feed);border-radius:8px;overflow:hidden;cursor:zoom-in}
.cmpin{position:relative;max-height:100%}
.cmpin img{display:block;width:100%;height:100%;object-fit:cover}
.cmpin .pin{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:var(--hud);color:#111;border:2px solid #111;font-family:var(--font-d);font-weight:700;font-size:.85rem;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.6);pointer-events:none}
.czoom{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-height:100%}
.czoom .cmpin{max-width:100%}
.czoom .pin{width:28px;height:28px;font-size:1rem}
.czcap{margin:0;color:#eee;font-size:.92rem;line-height:1.35;display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;max-width:720px}
.czcap b{width:100%;text-align:center;font-family:var(--font-d);font-size:1.05rem}
.czcap i{font-style:normal;font-weight:700;display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--hud);color:#111;margin-right:6px;font-size:.8rem}
.cmpfig figcaption{margin-top:6px;font-size:.88rem;line-height:1.3}
.cmpfig figcaption>b{font-family:var(--font-d);font-size:1.02rem;font-weight:600}
.cmpfig .legendlist{margin-top:4px;gap:4px}
.cmpfig .legendlist li{font-size:.84rem;gap:6px}
.cmpfig .legendlist b{width:19px;height:19px;font-size:.78rem}
.vbox h4 .nato{display:inline-block;vertical-align:middle;margin-left:4px;background:var(--ink);color:var(--bg);font-family:var(--font-d);font-weight:600;font-size:.8rem;letter-spacing:.02em;padding:1px 7px;border-radius:5px}
.cmpkey{margin:10px 0 0;padding:8px 12px;border-left:4px solid var(--cta);background:var(--surface);border-radius:0 8px 8px 0;font-size:.95rem}
.confint{margin:4px 0 0;color:var(--muted);font-size:.92rem}
.vbox .cmpwrap{margin-top:6px}
</style>
</head>
<body>
<header class="bar" id="bar"><div class="bar-in" id="barin"></div><div class="prog" id="prog" hidden><i></i></div></header>
<main class="wrap" id="app" aria-live="polite"></main>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>

haltetem Licht", "Mit Nebel", "Gar nicht – Lfz erkennen Fahrzeuge am Typ"], "Markierungstafeln (z. B. VS-17) und vereinbarte Zeichen helfen der Besatzung bei Tag. Nachts gelten IR-Marker und Wärmebild-Kennungstafeln. Was gilt, steht im Befehl bzw. in den SPINS."], ["f-3", "gen", "Ein Kampfpanzer hat sieben Laufrollen. Was kommt in Frage?", ["Leopard 2 oder M1 Abrams", "T-72 oder T-90", "Leclerc oder Challenger 2", "T-80"], "Sieben Laufrollen haben Leopard 2 und M1. Leclerc, Challenger 2 und alle T-Panzer haben sechs."], ["f-4", "gen", "Ein Raketenwerfer trägt einen geschlossenen Kasten statt offener Rohre. Was ist das am ehesten?", ["HIMARS bzw. M270/MARS II – KR Blau", "BM-21 Grad – KR Rot", "TOS-1A", "BM-27 Uragan"], "Westliche Raketenwerfer laden Lenkraketen in geschlossenen Behältern. Russische Werfer wie Grad, Uragan und Smerch tragen offene Rohrbündel."], ["f-5", "gen", "Ein Kampfpanzer zeigt im Wärmebild ein auffällig heißes Heck. Was kann das sein?", ["M1 Abrams oder T-80 – beide mit Gasturbine", "Nur Leopard 2", "Nur T-72", "Ein Panzer mit Motorschaden"], "M1 Abrams und T-80 haben eine Gasturbine mit sehr heißem Abgas. Die Wärmesignatur hilft beim Typ, nicht bei der Seite."], ["r-1", "gen", "Ein Radpanzer mit sechs Rädern und ohne Turm. Was ist das am ehesten?", ["Ein westlicher Radpanzer wie Fuchs oder Griffon", "BTR-82A", "BTR-80", "BRDM-2"], "Russische Radschützenpanzer (BTR-60 bis BTR-82A) haben acht Räder und einen Turm vorn. Sechs Räder ohne Turm: Fuchs oder Griffon."]], "merk": [["Freund oder Feind", ["Fahrzeugtyp allein reicht nicht: Die Ukraine fährt sowjetische und westliche Fahrzeuge, Russland zeigt erbeutete westliche Fahrzeuge.", "Immer abgleichen: eigene Lage und Frontverlauf, Meldungen der Bodentruppe, Blue Force Tracking, Funk.", "Kennzeichnung bei Tag: Markierungstafeln VS-17 (orange bzw. pink), taktische Zeichen; nachts: IR-Marker und -Leuchten, Wärmebild-Kennungstafeln.", "Im Zweifel nicht freigeben – erst bestätigen lassen."]], ["Laufrol async function pushRemote(){

/* ---------- question bank ---------- */
function buildBank(){
  const bank = [];
  for (const f of FAMS){
    const imgs = IMG[f.id] || [];
    imgs.forEach((_, i) => bank.push({id:`img:${f.id}:${i}`, kind:'img', fam:f.id, i}));
    if (multi(f)) imgs.forEach((_, i) => { if (VAR[f.id][i] && pinsFor(f.id, i)) bank.push({id:`var:${f.id}:${i}`, kind:'var', fam:f.id, i}); });
    bank.push({id:`cat:${f.id}`, kind:'cat', fam:f.id});
    bank.push({id:`org:${f.id}`, kind:'org', fam:f.id});
  }
  RED.forEach((r, i) => {
    bank.push({id:`ff:b:${r.blue}`, kind:'ff', fam:r.blue, red:false, i});
    bank.push({id:`ff:r:${r.blue}`, kind:'ff', fam:r.blue, red:true, i});
  });
  for (const [id, fam, q, opts, ex] of DATA.curated) bank.push({id, kind:'cur', fam, q, opts, ex});
  return bank;
}
const BANK = buildBank();

function famAcc(id){ const s = S.fam[id]; if (!s || (s.c + s.w) === 0) return null; return s.c / (s.c + s.w); }
function weight(q, prevFam){
  const fa = famAcc(q.fam);
  const weak = fa === null ? 0.45 : 1 - fa;
  const s = S.q[q.id];
  let w = (1 + 2 * weak) * (s ? Math.max(0.25, 1 + 1.6 * (s.w / Math.max(1, s.c + s.w)) - 0.08 * Math.min(s.c, 6)) : 1.35);
  if (S.recent.includes(q.id)) w *= 0.12;
  if (q.fam === prevFam) w *= 0.25;
  if (q.kind === 'img') w *= 0.9;
  if (q.kind === 'var' || q.kind === 'cat') w *= 0.8;
  return w;
}
function pickRound(mode){
  const M = MODES[mode];
  let pool = BANK.filter(q => M.kinds.includes(q.kind));
  if (M.tags) pool = pool.filter(q => q.kind !== 'cur' || M.tags.some(t => q.id.startsWith(t)));
  if (M.confusion) pool = pool.filter(q => FAM[q.fam] && FAM[q.fam].confuse.length);
  const out = []; let prevFam = null;
  const n = Math.min(ROUND_LEN, pool.length);
  const usedImgFam = {};
  const isImg = q => q.kind === 'img' || q.kind === 'var';
  while (out.length < n && pool.length){
    const ws = pool.map(q => weight(q, prevFam) * (isImg(q) && usedImgFam[q.fam] ? 0.2 : 1));
    let r = Math.random() * ws.reduce((a, b) => a + b, 0), k = 0;
    while (k < ws.length - 1 && (r -= ws[k]) > 0) k++;
    const q = pool.splice(k, 1)[0];
    if (isImg(q)) usedImgFam[q.fam] = true;
    out.push(q); prevFam = q.fam;
  }
  return out;
}

/* distractor helpers */
function nameDistractors(f, strict){
  const pool = FAMS.filter(x => x.id !== f.id);
  const conf = shuffle(f.confuse.map(id => FAM[id]).filter(Boolean));
  const same = shuffle(pool.filter(x => x.cat === f.cat && !f.confuse.includes(x.id)));
  const rest = shuffle(pool.filter(x => x.cat !== f.cat && !f.confuse.includes(x.id)));
  const list = strict ? [...conf, ...same, ...rest] : [...conf.slice(0, 2), ...shuffle([...conf.slice(2), ...same, ...rest])];
  return list.slice(0, 3).map(x => x.name);
}
function varDistractors(f, u){
  const own = f.vars.filter(x => x !== u).map(x => x.name);
  const other = shuffle(f.confuse.flatMap(id => FAM[id].vars.map(x => x.name)));
  return [...own, ...other].filter((x, i, a) => a.indexOf(x) === i).slice(0, 3);
}
function catAlternatives(f){
  const excl = [f.cat, ...(DATA.catExcl[f.cat] || []), ...(DATA.catX[f.id] || [])];
  return shuffle(DATA.catOrder.filter(c => !excl.includes(c))).slice(0, 3).map(c => CATS[c].label);
}
const unitOfImg = (f, i) => f.vars.find(u => u.v === VAR[f.id][i]) || null;
function unitImgs(f, u){
  const all = (IMG[f.id] || []).map((_, i) => i);
  if (!u.v) return all;
  const own = all.filter(i => VAR[f.id][i] === u.v);
  return own.length ? own : all;
}
function randomImg(f, u){
  const idx = u ? unitImgs(f, u) : (IMG[f.id] || []).map((_, i) => i);
  if (!idx.length) return null;
  let i = idx[Math.floor(Math.random() * idx.length)];
  if (idx.length > 1 && S.lastImg[f.id] === i) i = idx[(idx.indexOf(i) + 1) % idx.length];
  return [f.id, i];
}
function annoFig(fid, i, pins, alt){
  if (!pins || !IMG[fid] || IMG[fid][i] == null) return '';
  const ar = (ARS[fid] || [])[i] || 4/3;
  return `<figure class="anno" style="aspect-ratio:${ar};width:min(100%, ${Math.round(520 * ar)}px)" data-zoom="${fid}:${i}">
      <img src="${IMG[fid][i]}" alt="${esc(alt)} mit markierten Erkennungsmerkmalen">
      ${pins.map(([x, y], k) => `<span class="pin" style="left:${x}%;top:${y}%">${k + 1}</span>`).join('')}
    </figure>
    <ol class="legendlist">${pins.map(([, , t], k) => `<li><b>${k + 1}</b><span>${esc(t)}</span></li>`).join('')}</ol>`;
}
const annoHtml = f => annoFig(f.id, 0, ANNO[f.id], f.name);
const leitIdx = (f, u) => (LEIT[f.id] || {})[u.v];
const unitAnno = (f, u) => { const i = leitIdx(f, u); return i == null ? '' : annoFig(f.id, i, pinsFor(f.id, i), u.name); };
/* Merkmale passend zum gezeigten Bild: Bild-Pins, sonst Familien-Pins */
function imgAnno(f, i){
  const p = i != null ? pinsFor(f.id, i) : null;
  if (p) return {title:'Merkmale auf diesem Bild', html:annoFig(f.id, i, p, f.name)};
  return ANNO[f.id] ? {title:`Merkmale der ${f.name}-Familie`, html:annoHtml(f)} : null;
}
const tisLong = u => u.sight + (u.tis === 'tis'
  ? ' Feste Deckung (Erde, Mauern, Glas) schützt, normaler Rauch und normale Tarnnetze kaum.'
  : ' Trotzdem nicht unbeobachtet: Die Infanterie hat Wärmebild-Handgeräte, Drohnen fliegen mit Wärmebildkameras.');
const lwrLong = u => u.lwrx || (u.lwr === 'lwr' ? 'Laserwarner mit automatischem Nebel bzw. Aerosol.' : DATA.lwrNo);

function materialize(q, mode){
  const f = FAM[q.fam];
  const strict = MODES[mode].confusion;
  const confTxt = f && f.confuse.length ? ` Verwechslungsgefahr mit ${f.confuse.map(c => FAM[c].name).join(', ')}.` : '';
  const u = f && q.k != null ? f.vars[q.k] : null;
  switch (q.kind){
    case 'img': {
      const iu = unitOfImg(f, q.i);
      return {prompt:'Welches Fahrzeug ist das?', img:[f.id, q.i], correct:f.name, wrong:nameDistractors(f, strict),
        ex:`${f.name}: ${CATS[f.cat].label}.${iu && f.vars.length > 1 ? ` Hier: ${iu.name} – ${iu.recog}` : ''} Erkennung: ${f.recog}` + confTxt};
    }
    case 'var': {
      const iu = unitOfImg(f, q.i);
      return {prompt:'Welche Version ist das?', img:[f.id, q.i], correct:iu.name, wrong:varDistractors(f, iu),
        ex:`${iu.name}: ${iu.recog}`, unit:iu, pinsNow:true,
        compare:f.vars.filter(x => x !== iu)};
    }
    case 'cat':
      return {prompt:'Was für ein Fahrzeug ist das?', img:randomImg(f), correct:CATS[f.cat].label, wrong:catAlternatives(f),
        ex:`${f.name}: ${CATS[f.cat].label} – ${CATS[f.cat].cap}.`};
    case 'air': {
      const wrong = shuffle(['spz', 'll', 'tpzr', 'tpzk', 'rad', 'pzj']).slice(0, 3).map(c => CATS[c].label);
      return {prompt:'Drohnen- bzw. Pod-Bild: Was für ein Fahrzeug ist das?', img:['air', q.i], correct:CATS.kpz.label, wrong,
        ex:`${DATA.airNotes[q.i]} ${DATA.airTip}`};
    }
    case 'aa':
      return {unit:u, prompt:`${u.name}: Was ist die größte Gefahr für einen Hubschrauber?`, img:randomImg(f, u), correct:u.aaQ[0], wrong:shuffle(u.aaQ[1]).slice(0, 3),
        ex:`${u.aa} ${DATA.fj}`};
    case 'lwr':
      return {unit:u, prompt:`Du lasert einen ${u.name} mit Entfernungsmesser oder Designator. Merkt die Besatzung das?`, img:randomImg(f, u),
        correct:DATA.lwr[u.lwr], wrong:DATA.lwrOrder.filter(k => k !== u.lwr).map(k => DATA.lwr[k]), order:DATA.lwrOrder.map(k => DATA.lwr[k]),
        ex:lwrLong(u)};
    case 'tis':
      return {unit:u, prompt:`Womit klärt ein ${u.name} nachts mit Bordmitteln auf?`, img:randomImg(f, u),
        correct:DATA.tis[u.tis], wrong:DATA.tisOrder.filter(k => k !== u.tis).map(k => DATA.tis[k]), order:DATA.tisOrder.map(k => DATA.tis[k]),
        ex:tisLong(u)};
    case 'wpn':
      return {prompt:`Welche Wirkmittel empfiehlst du gegen ${f.name}?`, img:randomImg(f),
        correct:DATA.wcls[f.wcls], wrong:DATA.wOrder.filter(k => k !== f.wcls).map(k => DATA.wcls[k]), order:DATA.wOrder.map(k => DATA.wcls[k]),
        ex:`${f.protection} Schwachstellen: ${f.weak}`};
    case 'ff': {
      const r = RED[q.i];
      const blue = `${f.name} – KR Blau`, red = `${r.name} – KR Rot`;
      const pool = shuffle([...FAMS.filter(x => x.id !== f.id).map(x => `${x.name} – KR Blau`), ...RED.filter(x => x !== r && x.name !== r.name).map(x => `${x.name} – KR Rot`)]);
      const others = uniq(pool).filter(o => o !== blue && o !== red).slice(0, 2);
      return {prompt:'Freund oder Feind – welches Fahrzeug ist das?', img:q.red ? ['red', q.i] : randomImg(f),
        correct:q.red ? red : blue, wrong:[q.red ? blue : red, ...others],
        ex:`${r.key} Der Typ allein entscheidet nie über Freund oder Feind – immer Lage, Kennzeichnung und Meldungen abgleichen.`};
    }
    case 'org':
      return {prompt:`Aus welchem Land stammt der ${f.name}?`, img:randomImg(f), correct:f.origin,
        wrong:shuffle(DATA.origins.filter(o => o !== f.origin)).slice(0, 3), ex:`${f.designation}. Nutzer: ${f.users}.`};
    case 'cur':
      return {prompt:q.q, correct:q.opts[0], wrong:q.opts.slice(1), ex:q.ex};
  }
}

  $('#app').innerHTML = `
    <div class="score">${R.score}<span class="muted" style="font-size:.45em"> / ${n}</span></div>
    <p class="muted">${MODES[R.mode].name} – ${Math.round(100 * R.score / n)} % richtig.</p>
    ${R.missed.length ? `<h2 style="margin-top:22px">Nacharbeiten</h2><ul class="misslist">${R.missed.map(x => `<li><div>${esc(x.prompt)}</div><div class="small"><strong>${esc(x.correct)}</strong>${FAM[x.fam] ? ` – <button class="linkbtn" data-card="${x.fam}">Steckbrief ${esc(FAM[x.fam].name)}</button>` : x.fam === 'gen' || x.fam === 'air' ? ` – <button class="linkbtn" data-act="merk">Merkblatt</button>` : ''}</div></li>`).join('')}</ul>` : '<p>Alles richtig.</p>'}
    <div class="row" style="margin-top:20px"><button class="btn main" data-start="${R.mode}">Neue Runde</button><button class="btn" data-act="home">Zur Übersicht</button></div>`;
}
function renderCards(){
  $('#bar').hidden = false;
  setBar('Steckbriefe', {back:'home'});
  $('#app').innerHTML = `<div class="row" style="margin-top:6px"><button class="btn" data-act="merk">Merkblatt öffnen</button></div>` + GROUPS.map(([t, ids]) => `<section class="group"><h2>${esc(t)}</h2>
      ${ids.map(id => FAM[id]).map(f => `<button class="fam" data-card="${f.id}"><span class="code">${esc(f.short)}</span><span class="nm">${esc(f.name)}${multi(f) ? ' <span class="small muted" style="font-weight:400">– Familie, Versionen im Vergleich</span>' : ''}<br><span class="small muted" style="font-weight:400">${esc(CATS[f.cat].label)}</span></span><span class="pct">${pct(f.id)}</span></button>`
        + (multi(f) ? f.vars.map(u => `<button class="fam sub" data-card="${u.key}"><span class="code"></span><span class="nm">${esc(u.name)}<br><span class="small muted" style="font-weight:400">${esc(u.recog)}</span></span><span class="pct">${pct(u.key)}</span></button>`).join('') : '')).join('')}</section>`).join('');
}
let cardState = null;
function openSheet(html){
  $('#sheet').innerHTML = html;
  const sh = $('#sheet'); sh.hidden = false; sh.scrollTop = 0;
  document.body.style.overflow = 'hidden';
}
function openCard(id){
  if (!FAM[id] && !UNIT[id]) return;
  cardState = {id, i:0, pins:false};
  drawCard();
  const sh = $('#sheet'); sh.hidden = false; sh.scrollTop = 0;
  document.body.style.overflow = 'hidden';
}
/* Bildliste der Karte: Familie = alle Bilder, Version = nur ihre eigenen */
function cardImgs(){
  const id = cardState.id;
  if (UNIT[id]){ const {f, u} = UNIT[id]; return unitImgs(f, u).filter(i => VAR[f.id][i] === u.v); }
  return (IMG[id] || []).map((_, i) => i);
}
function carouselHtml(f){
  const list = cardImgs(); if (!list.length) return '';
  const k = cardState.i % list.length, i = list[k];
  const iu = multi(f) ? unitOfImg(f, i) : null;
  const pins = pinsFor(f.id, i);
  const label = !multi(f) ? '' : iu ? iu.name : 'Version nicht eindeutig erkennbar';
  const onUnit = !!UNIT[cardState.id];
  return `${feedHtml(f.id, i, {nav:list.length > 1, counter:`${k + 1}/${list.length}`, alt:label || f.name})}
    <div class="imgcap">
      ${multi(f) ? `<span class="vlabel${iu ? '' : ' none'}">${esc(label)}</span>` : '<span></span>'}
      <span class="capbtns">${pins ? `<button class="btn sm" data-act="cardpins" aria-expanded="${cardState.pins ? 'true' : 'false'}">${cardState.pins ? 'Merkmale ausblenden' : 'Merkmale auf diesem Bild'}</button>` : ''}${multi(f) && iu && !onUnit ? `<button class="btn sm" data-card="${iu.key}">Steckbrief ${esc(iu.name)}</button>` : ''}</span>
    </div>
    ${pins && cardState.pins ? `<div class="pinwrap">${annoFig(f.id, i, pins, label || f.name)}</div>` : ''}`;
}
const cmpFor = fid => CMP.filter(c => c.a.fam === fid || c.b.fam === fid);
const cmpPair = (x, y) => CMP.find(c => (c.a.fam === x && c.b.fam === y) || (c.a.fam === y && c.b.fam === x));
function cmpSide(sd, pos, ci, side){
  const ar = (ARS[sd.fam] || [])[sd.i] || 4/3;
  const w = ar >= 4/3 ? 100 : Math.round(ar / (4/3) * 1000) / 10;
  return `<figure class="cmpfig">
    <span class="ctag">${pos}</span>
    <div class="cmpbox" data-czoom="${ci}:${side}"><div class="cmpin" style="aspect-ratio:${ar};width:${w}%">
      <img src="${imgSrc(sd.fam, sd.i)}" alt="${esc(sd.lab)}">
      ${sd.pins.map(([x, y], k) => `<span class="pin" style="left:${x}%;top:${y}%">${k + 1}</span>`).join('')}
    </div></div>
    <figcaption><b>${pos}: ${esc(sd.lab)}</b><ol class="legendlist">${sd.pins.map(([, , t], k) => `<li><b>${k + 1}</b><span>${esc(t)}</span></li>`).join('')}</ol></figcaption>
  </figure>`;
}
function cmpHtml(c, focus){
  const sw = c.b.fam === focus && c.a.fam !== focus, ci = CMP.indexOf(c);
  const [L, Rt] = sw ? [c.b, c.a] : [c.a, c.b];
  return `<div class="cmpwrap"><div class="cmp">${cmpSide(L, 'Links', ci, sw ? 'b' : 'a')}${cmpSide(Rt, 'Rechts', ci, sw ? 'a' : 'b')}</div><p class="cmpkey"><strong>${esc(c.keyLab || 'Sicherstes Merkmal:')}</strong> ${esc(c.key)}</p></div>`;
}
function confCompare(f){
  const others = [...new Set(f.confuse)].filter(c => FAM[c]);
  if (!others.length) return '';
  others.sort((x, y) => (cmpPair(f.id, y) ? 1 : 0) - (cmpPair(f.id, x) ? 1 : 0));
  return `<div class="sec"><h3>Verwechslungsgefahr innerhalb KR Blau</h3><p class="confint">Fahrzeuge, die leicht mit dem ${esc(f.name)} verwechselt werden, und woran du sie unterscheidest.</p>${others.map(c => {
    const o = FAM[c], pr = cmpPair(f.id, c);
    return `<div class="vbox"><h4>${esc(f.name)} oder ${esc(o.name)}?</h4>${pr ? cmpHtml(pr, f.id) : `<p style="margin:4px 0 0"><strong>${esc(o.name)}:</strong> ${esc(o.recog)}</p>${CMPTXT[[f.id, c].sort().join('|')] ? `<p class="cmpkey"><strong>Sicherstes Merkmal:</strong> ${esc(CMPTXT[[f.id, c].sort().join('|')])}</p>` : ''}`}<button class="linkbtn" data-card="${c}" style="margin-top:8px">Steckbrief ${esc(o.name)}</button></div>`;
  }).join('')}</div>`;
}
function openCmpAll(){
  cardState = null;
  openSheet(`<div class="bar" style="position:sticky"><div class="bar-in"><button class="iconbtn" data-act="closecard" aria-label="Schließen">‹ Zurück</button><div class="t">Blau gegen Rot</div></div></div>
  <div class="wrap">
    <h1 style="font-size:2.6rem;margin-top:16px">Blau gegen Rot</h1>
    <p class="muted" style="margin:6px 0 0">Jedes Fahrzeug KR Blau neben einem ähnlichen Fahrzeug KR Rot, mit den Merkmalen, die sie unterscheiden. Tippe auf ein Bild, um es zu vergrößern.</p>
    ${CMP.map((c, k) => `<div class="sec"><h3>${esc(FAM[c.a.fam].name)} oder ${esc(RED[k].name)}?</h3>${cmpHtml(c, c.a.fam)}</div>`).join('')}
  </div>`);
}
function redSec(f){
  const k = RED.findIndex(x => x.blue === f.id); if (k < 0) return '';
  const c = CMP[k];
  return `<div class="sec"><h3>Nicht verwechseln mit KR Rot: ${esc(RED[k].name)}</h3>${cmpHtml(c, f.id)}</div>`;
}
function drawCard(){
  const id = cardState.id;
  const isUnit = !!UNIT[id];
  const f = isUnit ? UNIT[id].f : FAM[id];
  const U = isUnit ? UNIT[id].u : null;
  const list = a => `<ul>${a.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
  const sec = (h, body) => `<div class="sec"><h3>${h}</h3>${body}</div>`;
  const p = s => `<p style="margin:0">${esc(s)}</p>`;
  const common = `
    ${sec('Bewaffnung', list(f.weapons))}
    ${sec('Als JTAC beachten', list(f.jtac))}
    ${redSec(f)}`;
  let body;
  if (isUnit){
    const others = f.vars.filter(x => x !== U);
    body = `
    <h1 style="font-size:2.6rem;margin-top:16px">${esc(U.name)}</h1>
    <div class="desig">Version der ${esc(f.name)}-Familie · ${esc(CATS[f.cat].label)} · <button class="linkbtn" data-card="${f.id}">alle ${esc(f.name)}-Versionen im Vergleich</button></div>
    ${sideChip(f)}
    ${sec(`Woran erkennst du den ${esc(U.name)}?`, unitAnno(f, U) + `<p style="margin:10px 0 0"><strong>${esc(U.recog)}</strong></p><p class="small muted" style="margin:6px 0 0">Gilt für alle ${esc(f.name)}: ${esc(f.recog)}</p>`)}
    ${sec('Unterschied zu den anderen Versionen', others.map(x => `<div class="vbox"><h4>${esc(x.name)}</h4><p style="margin:4px 0 0">${esc(x.recog)}</p><button class="linkbtn" data-card="${x.key}" style="margin-top:6px">Steckbrief ${esc(x.name)}</button></div>`).join(''))}
    ${common}
    ${confCompare(f)}`;
  } else {
    body = `
    <h1 style="font-size:2.6rem;margin-top:16px">${esc(f.name)}</h1>
    <div class="desig">${esc(f.designation)}</div>
    ${sideChip(f)}
    ${multi(f) ? `<div class="row" style="margin-top:12px">${f.vars.map(u => `<button class="btn" data-card="${u.key}">Steckbrief ${esc(u.name)}</button>`).join('')}</div>` : ''}
    ${sec('Nutzer', p(f.users))}
    ${ANNO[f.id] ? sec('Erkennungsmerkmale', annoHtml(f) + `<p style="margin:10px 0 0">${esc(f.recog)}</p>`) : sec('Erkennung', p(f.recog))}
    ${multi(f) ? sec('Versionen unterscheiden', f.vars.map(u => `<div class="vbox"><h4>${esc(u.name)}</h4><div style="margin-top:8px">${unitAnno(f, u)}</div><p style="margin:8px 0 0"><strong>${esc(u.recog)}</strong></p><button class="btn" data-card="${u.key}" style="margin-top:8px">Steckbrief ${esc(u.name)}</button></div>`).join('')) : ''}
    ${common}
    ${confCompare(f)}`;
  }
  const title = isUnit ? U.name : f.name;
  $('#sheet').innerHTML = `<div class="bar" style="position:sticky"><div class="bar-in"><button class="iconbtn" data-act="closecard" aria-label="Schließen">‹ Zurück</button><div class="t">${esc(title)}</div><span class="muted small">${pct(id)}</span></div>
  <div class="wrap">
    ${carouselHtml(f)}
    ${body}
  </div>`;
}
function openMerk(){
  cardState = null;
  openSheet(`<div class="bar" style="position:sticky"><div class="bar-in"><button class="iconbtn" data-act="closecard" aria-label="Schließen">‹ Zurück</button><div class="t">Merkblatt</div></div></div>
  <div class="wrap">
    <h1 style="font-size:2.6rem;margin-top:16px">Merkblatt</h1>
    <p class="muted" style="margin:6px 0 0">Die wichtigsten Regeln aus der App auf einen Blick. Richtwerte aus öffentlichen Quellen – im Einsatz gilt die aktuelle Lage.</p>
    ${DATA.merk.map(([h, items]) => `<div class="sec"><h3>${esc(h)}</h3><ul>${items.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}
  </div>`);
}
function closeCard(){ $('#sheet').hidden = true; document.body.style.overflow = ''; cardState = null; }

function renderStats(){
  $('#bar').hidden = false;
  setBar('Statistik', {back:'home'});
  const rows = FAMS.map(f => ({id:f.id, name:f.name, card:true, a:famAcc(f.id), s:S.fam[f.id] || {c:0, w:0}}));
  UNITS.filter(u => UNIT[u.key] && S.fam[u.key]).forEach(u => rows.push({id:u.key, name:u.name + ' (Version)', card:true, a:famAcc(u.key), s:S.fam[u.key]}));
  rows.push({id:'gen', name:'Grundlagen', card:false, a:famAcc('gen'), s:S.fam.gen || {c:0, w:0}});
  rows.sort((x, y) => (x.a ?? -1) - (y.a ?? -1));
  const flags = Object.entries(S.flags);
  const flagText = flags.map(([id, v]) => `• [${id}] ${v.t}`).join('\n');
  const bar = a => `<div class="sbar"><i style="width:${a === null ? 0 : a * 100}%;background:${a === null ? 'transparent' : a >= .8 ? 'var(--ok)' : a >= .5 ? 'var(--cta)' : 'var(--bad)'}"></i></div>`;
  $('#app').innerHTML = `
    <div class="stat-top"><div><b>${S.answered}</b><span class="muted small">Antworten</span></div><div><b>${S.answered ? Math.round(100 * S.correct / S.answered) + ' %' : '–'}</b><span class="muted small">richtig</span></div></div>
    <p class="sync">${esc(syncLabel)}</p>
    <h2 style="margin-top:18px">Je Fahrzeug, schwächste zuerst</h2>
    <div style="margin-top:6px">${rows.map(r => `<div class="srow">${r.card ? `<button class="linkbtn" data-card="${r.id}" style="text-align:left">${esc(r.name)}</button>` : `<span>${esc(r.name)}</span>`}${bar(r.a)}<span class="small muted" style="text-align:right">${r.a === null ? '–' : Math.round(r.a * 100) + ' %'}<br>${r.s.c + r.s.w}×</span></div>`).join('')}</div>
    <h2 style="margin-top:26px">Gemeldete Fragen</h2>
    ${flags.length ? `<p class="small muted" style="margin:4px 0 8px">Kopiere die Liste und schick sie mir im Chat, dann prüfe und korrigiere ich die Fragen.</p><textarea readonly id="flagtxt">${esc(flagText)}</textarea><div class="row"><button class="btn" data-act="copyflags">Liste kopieren</button><button class="btn" data-act="clearflags">Meldungen löschen</button></div>` : '<p class="muted">Noch keine Frage gemeldet. Nach jeder Antwort kannst du eine Frage mit „Frage melden“ markieren.</p>'}
    <h2 style="margin-top:26px">Zurücksetzen</h2>
    <p class="small muted" style="margin:4px 0 8px">Löscht alle Antworten und Trefferquoten. Gemeldete Fragen bleiben erhalten.</p>
    <button class="btn" data-act="reset">Statistik zurücksetzen</button>`;
}
function render(){
  if (view === 'home') renderHome();
  else if (view === 'quiz') renderQuiz();
  else if (view === 'end') renderEnd();
  else if (view === 'cards') renderCards();
  else if (view === 'stats') renderStats();
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-zoom],[data-czoom]');
  if (!t) return;
  if (t.dataset.img && cardState){
    e.stopPropagation();
    const n = cardImgs().length;
    cardState.i = (cardState.i + Number(t.dataset.img) + n) % n; cardState.pins = false; drawCard(); return;
  }
  if (t.dataset.czoom){
    const [ci, side] = t.dataset.czoom.split(':'); const sd = CMP[Number(ci)][side];
    const ar = (ARS[sd.fam] || [])[sd.i] || 4/3;
    const lb = document.createElement('div'); lb.className = 'lightbox'; lb.setAttribute('role', 'dialog');
    lb.innerHTML = `<div class="czoom"><div class="cmpin" style="aspect-ratio:${ar};width:min(100%, calc((100vh - 140px) * ${ar}))"><img src="${imgSrc(sd.fam, sd.i)}" alt="${esc(sd.lab)}">${sd.pins.map(([x, y], k) => `<span class="pin" style="left:${x}%;top:${y}%">${k + 1}</span>`).join('')}</div>
      <p class="czcap"><b>${esc(sd.lab)}</b>${sd.pins.map(([, , tx], k) => `<span><i>${k + 1}</i>${esc(tx)}</span>`).join('')}</p></div>`;
    lb.addEventListener('click', () => lb.remove());
    document.body.appendChild(lb); return;
  }
  if (t.dataset.zoom){
    const [fid, i] = t.dataset.zoom.split(':');
    const lb = document.createElement('div'); lb.className = 'lightbox'; lb.setAttribute('role', 'dialog');
    lb.innerHTML = `<img src="${imgSrc(fid, Number(i))}" alt="Vergrößerte Ansicht">`;
    lb.addEventListener('click', () => lb.remove());
    document.body.appendChild(lb); return;
  }
  if (t.dataset.start){ closeCard(); startRound(t.dataset.start); return; }
  if (t.dataset.go){ view = t.dataset.go; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.card){ openCard(t.dataset.card); return; }
  if (t.dataset.ans != null){ answer(Number(t.dataset.ans)); return; }
  if (t.dataset.flag){
    const id = t.dataset.flag;
    if (S.flags[id]) delete S.flags[id]; else S.flags[id] = {t:R && R.cur ? R.cur.m.prompt : id, ts:Date.now()};
    save();
    t.classList.toggle('flagged', !!S.flags[id]); t.textContent = S.flags[id] ? 'Gemeldet' : 'Frage melden';
    return;
  }
  const act = t.dataset.act;
  if (act === 'home'){ closeCard(); view = 'home'; R = null; render(); window.scrollTo(0, 0); }
  else if (act === 'next') nextQ();
  else if (act === 'merk') openMerk();
  else if (act === 'cmpall') openCmpAll();
  else if (act === 'anno'){
    const ar = $('#annoarea'); if (!ar) return;
    S.annoOpen = ar.hidden; ar.hidden = !ar.hidden; save();
    t.textContent = S.annoOpen ? 'Erkennungsmerkmale ausblenden' : 'Erkennungsmerkmale zeigen';
    t.setAttribute('aria-expanded', S.annoOpen ? 'true' : 'false');
    if (S.annoOpen) ar.scrollIntoView({behavior:'smooth', block:'nearest'});
  }
  else if (act === 'closecard') closeCard();
  else if (act === 'cardpins' && cardState){ cardState.pins = !cardState.pins; drawCard(); }
  else if (act === 'copyflags'){
    const ta = $('#flagtxt'); ta.select();
    const done = () => { t.textContent = 'Kopiert'; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, () => { try { document.execCommand('copy'); done(); } catch(_){} });
    else { try { document.execCommand('copy'); done(); } catch(_){} }
  }
  else if (act === 'clearflags'){ S.flags = {}; save(); render(); }
  else if (act === 'reset'){
    if (t.dataset.confirm){ const fl = S.flags; S = blank(); S.flags = fl; save(); render(); }
    else { t.dataset.confirm = '1'; t.textContent = 'Wirklich zurücksetzen? Erneut tippen'; t.classList.add('flagged'); }
  }
});
document.addEventListener('keydown', e => {
  if (document.querySelector('.lightbox')){ if (e.key === 'Escape') document.querySelector('.lightbox').remove(); return; }
  if (!$('#sheet').hidden){ if (e.key === 'Escape') closeCard(); return; }
  if (view !== 'quiz' || !R) return;
  if (!R.answered && /^[1-4]$/.test(e.key)){ const k = Number(e.key) - 1; if (k < R.cur.opts.length) answer(k); }
  else if (R.answered && (e.key === 'Enter' || e.key === ' ') && !(e.target && e.target.dataset && e.target.dataset.flag)){ e.preventDefault(); nextQ(); }
});
render();

</script>
<script src="../assets/app.js" defer></script>
</body>
