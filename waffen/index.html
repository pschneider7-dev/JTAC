<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Waffen-Trainer</title>
<meta name="theme-color" content="#E4E9E7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1517" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="JTAC">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/app.css">
<style>
:root{
  --bg:#E4E9E7; --surface:#F4F7F5; --surface2:#E9EEEC; --ink:#1A2326; --muted:#55615F; --line:#C3CCC9;
  --ok:#2A7848; --ok-bg:#DCEEE2; --bad:#B0382B; --bad-bg:#F6DEDA; --unk:#7A6A2E; --unk-bg:#F1E9CF;
  --cta:#E0A526; --cta-ink:#1A2326; --feed:#0B1113; --hud:#F2B632;
  --font-d:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --font-b:"Barlow","Segoe UI",system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1517; --surface:#172022; --surface2:#1D282B; --ink:#E1E7E5; --muted:#93A09D; --line:#2A3639;
    --ok:#56B57F; --ok-bg:#16301F; --bad:#E36D5E; --bad-bg:#3A1C18; --unk:#D9C17A; --unk-bg:#2E2913;
    --cta:#E3AA2E; --cta-ink:#111719; --feed:#06090A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1517; --surface:#172022; --surface2:#1D282B; --ink:#E1E7E5; --muted:#93A09D; --line:#2A3639;
  --ok:#56B57F; --ok-bg:#16301F; --bad:#E36D5E; --bad-bg:#3A1C18; --unk:#D9C17A; --unk-bg:#2E2913;
  --cta:#E3AA2E; --cta-ink:#111719; --feed:#06090A; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--cta);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:12px 18px 48px}
h1,h2,h3{font-family:var(--font-d);line-height:1.1;margin:0}
h2{font-size:1.45rem;font-weight:600;letter-spacing:.005em}
h3{font-size:1.25rem;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.875rem}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:720px;margin:0 auto;padding:8px 18px;display:flex;align-items:center;gap:12px;min-height:52px}
.bar .t{font-family:var(--font-d);font-weight:600;font-size:1.2rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:40px;height:40px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:500}
.prog{height:3px;background:var(--line)}
.prog>i{display:block;height:100%;background:var(--cta);transition:width .25s}

/* home */
.hero{padding:28px 0 20px}
.hero h1{font-size:clamp(3rem,13vw,5.2rem);font-weight:700;letter-spacing:-.015em;line-height:.9}
.hero p{max-width:34em;margin:12px 0 0;color:var(--muted);font-size:1.05rem}
.board{margin:8px 0 24px}
.board-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.cells{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.board h3{font-size:1.05rem;color:var(--muted);margin:14px 0 6px;letter-spacing:.04em;text-transform:uppercase}
@media (min-width:600px){.cells{grid-template-columns:repeat(8,minmax(0,1fr))}}
.cell{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 8px 12px;min-height:66px;overflow:hidden}
.cell b{display:block;font-family:var(--font-d);font-weight:700;font-size:1.25rem;line-height:1}
.cell span{display:block;font-size:.72rem;color:var(--muted);line-height:1.2;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell i{position:absolute;left:0;bottom:0;height:5px;background:var(--line)}
.cell[data-s="bad"] i{background:var(--bad)} .cell[data-s="mid"] i{background:var(--cta)} .cell[data-s="ok"] i{background:var(--ok)}
.cell[data-s="none"]{border-style:dashed}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:.8rem;color:var(--muted)}
.legend em{font-style:normal;display:inline-flex;align-items:center;gap:5px}
.legend em::before{content:"";width:12px;height:5px;background:var(--c)}
.cta{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;background:var(--cta);color:var(--cta-ink);border:0;border-radius:10px;padding:16px 18px;text-align:left}
.cta strong{font-family:var(--font-d);font-size:1.5rem;font-weight:700;display:block;line-height:1.05}
.cta small{display:block;font-size:.9rem;opacity:.85}
.cta .go{font-family:var(--font-d);font-size:1.6rem;font-weight:700}
.modes{margin-top:22px;border-top:1px solid var(--line)}
.mode{display:flex;width:100%;gap:14px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 2px}
.mode .mi{flex:1}
.mode strong{display:block;font-family:var(--font-d);font-size:1.3rem;font-weight:600;line-height:1.1}
.mode small{display:block;color:var(--muted);font-size:.9rem;margin-top:2px}
.mode .n{font-family:var(--font-d);font-size:1.1rem;color:var(--muted);white-space:nowrap}
.mode:hover strong{text-decoration:underline;text-underline-offset:3px}
.foot{margin-top:28px;font-size:.82rem;color:var(--muted);max-width:40em}

/* feed */
.feed{position:relative;margin:0;background:var(--feed);border-radius:10px;overflow:hidden;aspect-ratio:4/3;cursor:zoom-in}
.feed img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.feed svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.feed .hud{position:absolute;font-family:var(--font-d);font-weight:600;font-size:.8rem;letter-spacing:.06em;color:var(--hud);opacity:.85;text-shadow:0 1px 2px #000}
.feed .hud.tl{top:10px;left:14px} .feed .hud.tr{top:10px;right:14px} .feed .hud.bl{bottom:10px;left:14px}
.feed .nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:1.4rem;display:flex;align-items:center;justify-content:center;pointer-events:auto}
.feed .nav.l{left:8px} .feed .nav.r{right:8px}

/* quiz */
.qmeta{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 10px;font-size:.9rem;color:var(--muted)}
.prompt{font-family:var(--font-d);font-size:1.55rem;font-weight:600;line-height:1.15;margin:14px 0 14px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;line-height:1.35}
.opt .k{flex:none;width:26px;height:26px;border-radius:6px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-weight:700;color:var(--muted);font-size:.95rem}
.opt:not([disabled]):hover{border-color:var(--ink)}
.opt[disabled]{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)} .opt.correct .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)} .opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.fb{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c,var(--ok));border-radius:10px;padding:14px 16px}
.fb .v{font-family:var(--font-d);font-size:1.35rem;font-weight:700;color:var(--c)}
.fb p{margin:6px 0 0}
.profile{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.profile h3 small{font-family:var(--font-b);font-size:.85rem;font-weight:500;color:var(--muted);margin-left:6px}
.kv{display:grid;grid-template-columns:7.5em 1fr;gap:4px 12px;margin:10px 0 0;font-size:.94rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;padding:0;list-style:none}
.chips li{font-size:.82rem;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--surface2);border:1px solid var(--line)}
.chips li[data-v="1"]{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.chips li[data-v="0"]{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.chips li[data-v="?"]{background:var(--unk-bg);border-color:var(--unk);color:var(--unk)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:10px 14px;font-weight:600}
.btn.main{background:var(--ink);color:var(--bg);border-color:var(--ink);flex:1;min-width:9em}
.btn.flagged{border-color:var(--bad);color:var(--bad)}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-weight:600}

/* end */
.score{font-family:var(--font-d);font-size:5rem;font-weight:700;line-height:.9;margin:24px 0 4px}
.misslist{list-style:none;padding:0;margin:12px 0 0;border-top:1px solid var(--line)}
.misslist li{padding:10px 0;border-bottom:1px solid var(--line)}

/* cards list */
.group{margin-top:24px}
.group h2{margin-bottom:6px}
.fam{display:flex;width:100%;align-items:center;gap:12px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 2px}
.fam .code{font-family:var(--font-d);font-weight:700;font-size:1.1rem;width:3em;color:var(--muted)}
.fam .nm{flex:1;font-weight:600}
.fam .pct{font-family:var(--font-d);font-size:1.05rem;color:var(--muted)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch}
.sheet[hidden]{display:none}
.sec{margin-top:18px}
.sec h3{font-size:1.1rem;margin-bottom:4px}
.sec ul{margin:4px 0 0;padding-left:1.15em}
.sec li{margin:2px 0}
.desig{font-size:.95rem;color:var(--muted);margin-top:4px}
.bw{margin-top:12px;border-left:4px solid var(--cta);background:var(--surface);padding:8px 12px;border-radius:0 8px 8px 0;font-size:.95rem}
.lightbox{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:12px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}

/* stats */
.stat-top{display:flex;gap:28px;margin:18px 0 6px}
.stat-top b{display:block;font-family:var(--font-d);font-size:2.4rem;line-height:1}
.srow{display:grid;grid-template-columns:8.5em 1fr 4.2em;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.94rem}
.sbar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.sbar i{display:block;height:100%}
textarea{width:100%;min-height:120px;font:inherit;font-size:.85rem;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
.sync{font-size:.8rem;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.foot a{color:var(--ink);text-underline-offset:3px}
.annobox{margin-top:12px}
.annobox #annoarea{margin-top:12px}
.anno{position:relative;margin:0;max-width:100%;border-radius:10px;overflow:hidden;background:var(--feed);cursor:zoom-in}
.anno img{display:block;width:100%;height:100%;object-fit:cover}
.anno .pin{position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:var(--hud);color:#111;border:2px solid #111;font-family:var(--font-d);font-weight:700;font-size:.95rem;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.6);pointer-events:none}
.legendlist{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:6px}
.legendlist li{display:flex;gap:10px;align-items:flex-start;font-size:.94rem;line-height:1.35}
.legendlist b{flex:none;width:22px;height:22px;border-radius:50%;background:var(--hud);color:#111;font-family:var(--font-d);font-size:.85rem;display:flex;align-items:center;justify-content:center;margin-top:1px}
.guide-link{display:flex;gap:14px;align-items:center;margin-top:18px;padding:14px 16px;border:1px solid var(--line);border-left:4px solid var(--cta);border-radius:10px;background:var(--surface);color:var(--ink);text-decoration:none}.guide-link .mi{flex:1}.guide-link strong{display:block;font-family:var(--font-d);font-size:1.3rem;font-weight:600;line-height:1.1}.guide-link small{display:block;color:var(--muted);font-size:.9rem;margin-top:2px}.guide-link .n{font-family:var(--font-d);font-size:1.1rem;color:var(--muted);white-space:nowrap}.guide-link:hover strong{text-decoration:underline;text-underline-offset:3px}
.foot a{color:var(--ink);text-underline-offset:3px}
</style>
</head>

eck (Snakeye oder Ballute) an der Mk 82?", ["Abbremsen beim Tiefabwurf, damit das Lfz aus dem Splitterbereich kommt", "Mehr Reichweite", "Lenkung ins Ziel", "Verzögerte Detonation im Ziel"], "Die Bremsklappen oder der Bremsschirm verlangsamen die Bombe. Das Lfz ist beim Einschlag schon weit genug weg."], ["c-mk84-1", "mk84", "Welche Lenkbombe nutzt den Mk-84-Körper?", ["GBU-31", "GBU-38", "GBU-12", "GBU-39"], "Auf der Mk 84 (2000 lb) basieren GBU-31 (JDAM), GBU-10 und GBU-24 (Laser) sowie GBU-56 (Laser-JDAM)."], ["c-gbu12-1", "gbu12", "Was passiert, wenn bei einer GBU-12 die Laserbeleuchtung kurz vor dem Einschlag abbricht?", ["Sie fliegt ballistisch weiter und trifft ungenau", "Sie schaltet auf GPS um", "Sie detoniert sofort in der Luft", "Sie sucht sich das nächste Wärmeziel"], "Paveway II hat keinen GPS-Ersatzmodus. Ohne Laserpunkt fliegt sie ungelenkt weiter."], ["c-gbu12-2", "gbu12", "Was ist eine GBU-12?", ["Mk 82 mit Paveway-II-Laserkit", "Mk 84 mit Laserkit", "Mk 82 mit GPS-Kit", "Mk 83 mit Laserkit"], "GBU-12 = Mk 82 (500 lb) + Paveway II. Mk 83 + Laserkit ist die GBU-16, Mk 84 + Laserkit die GBU-10, Mk 82 + GPS-Kit die GBU-38."], ["c-gbu16-1", "gbu16", "Welche Paveway II hat 1000 lb?", ["GBU-16", "GBU-12", "GBU-10", "GBU-24"], "GBU-12: 500 lb, GBU-16: 1000 lb, GBU-10: 2000 lb. GBU-24 ist eine Paveway III mit 2000 lb."], ["c-gbu24-1", "gbu24", "Was unterscheidet die Paveway III (GBU-24) von der Paveway II?", ["Proportionale Lenkung, mehr Reichweite, auch Tiefabwurf", "GPS-Lenkung", "Radar-Suchkopf", "Kleinerer Gefechtskopf"], "Die Paveway III steuert feinfühliger und gleitet mit großen Flügeln weiter – auch aus geringer Höhe."], ["c-egbu-1", "egbu", "Welche Präzisionsbombe nutzt der Eurofighter der Luftwaffe?", ["GBU-48 (Enhanced Paveway, 1000 lb)", "GBU-31 JDAM", "Paveway IV", "AASM Hammer"], "Die GBU-48 kombiniert Laser- und GPS-Lenkung auf einem 1000-lb-Körper."], ["c-egbu-2", "egbu", "Was bringt die Enhanced Paveway gegenüber der normalen Paveway II?", ["GPS/INS zusätzlich zum Laser – Angriff auch durch Wolken", "Raketenmotor für mehr Reichweite", "Radar-Suchkopf für Bewegtziele", "Kleinere Splitterwirkung"], "Fällt der Laser aus oder ist keine Sicht vorhanden, fliegt sie auf Koordinaten."], ["c-pw4-1", "pw4", "Welche Nation nutzt die Paveway IV als Standard-Präzisionsbombe?", ["Großbritannien", "Deutschland", "Frankreich", "USA"], "Paveway IV ist der britische Standard an Typhoon und F-35B."], ["c-gbu38-1", "gbu38", "Was ist für den Einsatz einer GBU-38 entscheidend?", ["Präzise Zielkoordinaten mit Höhe", "Der Lasercode", "Sicht des Piloten auf das Ziel", "Laserbeleuchtung bis zum Einschlag"], "Die JDAM fliegt dorthin, wo die Koordinaten hinzeigen. Fehler in Lage oder Höhe verschieben den Einschlag."], ["c-gbu38-2", "gbu38", "Ziel ist ein fahrender Lkw, das Lfz hat nur GBU-38. Was gilt?", ["Ungeeignet – die JDAM fliegt auf feste Koordinaten", "Geeignet, der Pod führt die Bombe nach", "Geeignet bei Laserbeleuchtung", "Geeignet bei klarer Sicht"], "Die GBU-38 hat keinen Suchkopf. Gegen Fahrzeuge in Bewegung: GBU-54, Hellfire oder Maverick."], ["c-gbu31-1", "gbu31", "GBU-31, GBU-32, GBU-38 – welche Gewichtsklassen?", ["2000 lb, 1000 lb, 500 lb", "500 lb, 1000 lb, 2000 lb", "1000 lb, 2000 lb, 500 lb", "Alle 500 lb mit unterschiedlichem Zünder"], "GBU-31: Mk 84 (2000 lb), GBU-32: Mk 83 (1000 lb), GBU-38: Mk 82 (500 lb)."], ["c-gbu54-1", "gbu54", "Woran erkennst du die GBU-54 gegenüber der GBU-38?", ["Schwarze Lasersensor-Kuppel an der Nase", "Größere Heckflügel", "Raketenmotor", "Kein Strake-Band"], "Der Lasersensor DSU-38 sitzt als schwarze Kuppel vorne. Heckkit und Strake-Band sind gleich."], ["c-gbu54-2", "gbu54", "Fahrendes Fahrzeug, klare Sicht, das Lfz trägt GBU-38 und GBU-54. Was wählst du?", ["GBU-54 mit Laserführung bis zum Einschlag", "GBU-38 auf die letzte bekannte Position", "Beide gleichzeitig", "Keine – Bomben gehen nicht gegen Fahrzeuge"], "Die Laser-JDAM ist für Bewegtziele gemacht. Die GBU-38 fliegt nur auf feste Koordinaten."], ["c-sdb-1", "sdb", "Warum eignet sich die GBU-39 SDB gut für bebautes Gebiet?", ["Kleiner, präziser Gefechtskopf mit geringem Kollateralschaden", "Großer Splitterradius", "Brandwirkung", "Sie streut Submunition"], "Rund 17 kg Sprengstoff bei hoher Präzision – deutlich weniger Wirkung im Umfeld als eine 500-lb-Bombe."], ["c-sdb-2", "sdb", "Wie viele SDB trägt ein BRU-61-Träger?", ["4", "2", "6", "8"], "Vier SDB pro BRU-61 – so trägt z. B. eine F-15E viele Präzisionswaffen."], ["c-sdb2-1", "sdb2", "Was kann die StormBreaker, was die GBU-39 nicht kann?", ["Fahrende Ziele bei schlechtem Wetter bekämpfen", "Eine 2000-lb-Wirkung erzielen", "Ohne Abwurf vom Lfz starten", "Luftziele bekämpfen"], "Radar, IIR und Laser im Suchkopf plus Datenlink – die GBU-39 fliegt nur auf Koordinaten."], ["c-aasm-1", "aasm", "Was ist das Besondere am AASM Hammer?", ["Raketenmotor im Kit für mehr Reichweite", "Tarnkappenform", "Bremsschirm für den Tiefabwurf", "Streumunition"], "Lenkteil und Raketenmotor machen aus einer normalen Bombe eine Stand-off-Waffe."], ["c-jsow-1", "jsow", "Was ist die JSOW?", ["Gleitwaffe für Stand-off-Angriffe auf stehende Ziele", "Kurzstrecken-Lenkflugkörper gegen Panzer", "Ungelenkte Bombe", "Anti-Radar-Flugkörper"], "Die AGM-154 gleitet je nach Abwurfhöhe bis rund 130 km / 70 NM."], ["c-cbu87-1", "cbu87", "Warum setzt die Bundeswehr keine CBU-87 ein?", ["Deutschland ist Vertragsstaat des Übereinkommens über Streumunition", "Sie passt an kein deutsches Lfz", "Sie ist zu teuer", "Sie ist zu ungenau für Übungsplätze"], "Das Oslo-Übereinkommen verbietet Streumunition wie die CBU-87. Die USA sind nicht Vertragspartei."], ["c-cbu97-1", "cbu97", "Wie wirkt die CBU-97 gegen Panzer?", ["Skeets erfassen Fahrzeuge per Infrarot und schießen ein Projektil von oben (EFP)", "Großer Splitterradius", "Brandwirkung", "Lasergelenkte Bomblets"], "Jeder BLU-108 schleudert vier Skeets aus. Sie suchen Fahrzeuge und treffen die dünne Dachpanzerung."], ["c-agm65-1", "agm65", "Ein Lfz meldet AGM-65E. Was musst du einplanen?", ["Laserbeleuchtung – die 65E ist lasergelenkt", "Nichts – Fire-and-Forget", "Genaue GPS-Koordinaten", "Radar-Zielzuweisung"], "Die AGM-65E folgt dem Laserpunkt. TV- und IIR-Versionen schaltet der Pilot selbst auf."], ["c-agm65-2", "agm65", "Auf welchem Starter trägt die A-10 die Maverick?", ["LAU-88 (bis 3) oder LAU-117 (1)", "Intern im Waffenschacht", "Im Dreifach-Starter wie Brimstone", "Auf dem M299"], "Der M299 ist der Hellfire-Starter an Hubschraubern und UAS."], ["c-agm114-1", "agm114", "Welche Reichweite hat die Hellfire etwa?", ["Rund 8 km / 4,3 NM", "Rund 2 km / 1,1 NM", "Rund 25 km / 13 NM", "Rund 80 km / 43 NM"], "Rund 8 km / 4,3 NM – deutlich weniger als Bomben vom Fast Jet, daher näher an der Bedrohung."], ["c-agm114-2", "agm114", "Was bedeutet LOAL bei der Hellfire?", ["Lock-on After Launch – der Suchkopf erfasst den Laser erst nach dem Start", "Laser Off After Launch", "Low Altitude Launch", "Lock-on At Long range"], "So kann der Hubschrauber aus der Deckung starten, während ein anderer Designator das Ziel beleuchtet."], ["c-jagm-1", "jagm", "Was kann die JAGM zusätzlich zur Hellfire?", ["Radarmodus – Fire-and-Forget auch bei Rauch und Wolken", "Größerer Gefechtskopf gegen Bunker", "Luftziele bekämpfen", "GPS-Angriff über 100 km / 54 NM"], "Die JAGM kombiniert halbaktiven Laser mit Millimeterwellenradar."], ["c-brim-1", "brim", "Wie trägt der RAF-Typhoon die Brimstone?", ["In Dreifach-Startern", "Einzeln am Rumpf", "Intern", "Auf dem M299"], "Drei Brimstone pro Starter – mehrere Fahrzeuge in einem Anflug."], ["c-apkws-1", "apkws", "Was ist APKWS?", ["Hydra-70-Rakete mit Laser-Lenkteil", "Neue Hellfire-Version", "GPS-Kit für 500-lb-Bomben", "Anti-Radar-Rakete"], "Das Lenkteil sitzt zwischen Gefechtskopf und Motor und macht die Rakete lasergelenkt."], ["c-hydra-1", "hydra", "Wozu nutzt du Hydra-Raketen mit Weißem Phosphor beim CAS?", ["Zielmarkierung für andere Lfz", "Panzerbekämpfung", "Gefechtsfeldbeleuchtung", "Täuschung von Infrarotsuchköpfen"], "WP-Rauch markiert das Ziel – die 9-Line nennt die Markierung."], ["c-spike-1", "spike", "Was zeichnet Spike gegenüber der Hellfire aus?", ["Der Schütze sieht das Suchkopfbild und kann das Ziel im Flug ändern", "Laserlenkung", "Größerer Gefechtskopf", "GPS-Lenkung"], "Spike überträgt das Suchkopfbild per Datenlink. Hellfire braucht einen Laserpunkt."], ["c-pars3-1", "pars3", "Welche Panzerabwehrwaffe trägt der Tiger UHT?", ["PARS 3 LR", "Hellfire", "Spike-ER", "Brimstone"], "Bis zu acht PARS 3 LR in zwei Vierer-Startern."], ["c-pars3-2", "pars3", "Muss für PARS 3 LR jemand das Ziel lasern?", ["Nein – IIR-Suchkopf, Fire-and-Forget", "Ja – der JTAC mit Bodenlaser", "Ja – das Osiris-Visier bis zum Einschlag", "Nur bei Nacht"], "Der Tiger schaltet vor dem Start auf, danach fliegt der Flugkörper selbständig."], ["c-harm-1", "harm", "Wozu dient die AGM-88 im Rahmen von CAS?", ["SEAD: Sie hält die gegnerische Luftabwehr nieder", "Bekämpfung von Panzern", "Zielmarkierung", "Luft-Luft-Selbstschutz"], "Ohne SEAD können CAS-Lfz in bedrohtem Luftraum oft nicht arbeiten."], ["c-taurus-1", "taurus", "Ist der Taurus eine CAS-Waffe?", ["Nein – Marschflugkörper für Ziele in der Tiefe", "Ja – gegen Truppen in Kontakt", "Ja – mit Bodenlaser gelenkt", "Nur gegen Fahrzeuge"], "Taurus fliegt über 500 km / 270 NM auf vorab geplante Ziele."], ["c-storm-1", "storm", "SCALP EG ist …", ["die französische Bezeichnung des Storm Shadow", "die französische Version des Taurus", "eine Gleitbombe", "ein Anti-Radar-Flugkörper"], "Storm Shadow (GBR, ITA) und SCALP EG (FRA) sind derselbe Marschflugkörper von MBDA."], ["c-jassm-1", "jassm", "Wie viele JASSM kann eine B-1B tragen?", ["24", "4", "8", "48"], "Bis zu 24 JASSM in den drei internen Waffenschächten."], ["c-gau8-1", "gau8", "Welches Kaliber hat die GAU-8?", ["30 mm", "20 mm", "27 mm", "25 mm"], "30 × 173 mm. 20 mm: M61 (F-16, F-15E, F/A-18), 27 mm: BK-27, 25 mm: GAU-22 (F-35)."], ["c-m230-1", "m230", "Welche Kanone hat der Apache?", ["M230 30 mm", "GAU-8 30 mm", "M61 20 mm", "BK-27"], "Die M230 ist eine Kettenkanone im Turm unter dem Rumpf."], ["c-bk27-1", "bk27", "Welche Bordkanone haben Eurofighter und Tornado?", ["Mauser BK-27", "GAU-8", "M61A1", "GAU-22"], "27-mm-Revolverkanone. Der Tornado IDS trägt zwei, der ECR keine."], ["c-pa10-1", "p_a10", "Welches Lfz wurde speziell für CAS gebaut?", ["A-10C", "F-16", "F-15E", "Eurofighter"], "Die A-10 ist um die GAU-8 herum gebaut – robust, langsam, viele Stationen."], ["c-pf15-1", "p_f15e", "Wer bedient bei der F-15E meist den Targeting-Pod?", ["Der Waffensystemoffizier (WSO) im hinteren Sitz", "Der Pilot allein", "Ein Bodenoperateur", "Der Flugzeugführer des Tankers"], "Mit WSO an Bord geht Pod-Arbeit und Talk-on oft schneller."], ["c-pf35-1", "p_f35", "Was fragst du bei einer F-35 in Stealth-Konfiguration besonders ab?", ["Interne Waffenzahl und Playtime", "Ob sie eine Bordkanone hat", "Ob ein Pod montiert ist", "Den Lasercode – sie hat keinen Laser"], "Intern passen nur wenige Waffen. Der EOTS hat einen Laser, der Pod ist eingebaut."], ["c-pf35-2", "p_f35", "Welches Kampfflugzeug beschafft die Luftwaffe als Tornado-Nachfolger?", ["F-35A", "F-15E", "Rafale", "F/A-18E/F"], "35 F-35A, u. a. für die nukleare Teilhabe."], ["c-pmq9-1", "p_mq9", "Welches bewaffnungsfähige UAS betreibt die Luftwaffe?", ["Heron TP", "MQ-9A Reaper", "MQ-1C Gray Eagle", "Bayraktar TB2"], "Der Heron TP ist das MALE-UAS der Luftwaffe."], ["c-ptiger-1", "p_tiger", "Wo sitzt das Visier des Tiger UHT?", ["Als Kugel über dem Rotor (Mastvisier Osiris)", "An der Nase", "Auf dem Kabinendach", "Unter dem Rumpf"], "So kann der Tiger aus der Deckung beobachten. HAP/HAD tragen das Strix-Visier auf dem Kabinendach."], ["c-pah64-1", "p_ah64", "Was ist die runde Kuppel über dem Rotor des AH-64?", ["Das Longbow-Feuerleitradar", "Ein Mastvisier", "Eine Satellitenantenne", "Ein Raketenwarner"], "Das Longbow-Radar erfasst Fahrzeuge und liefert Ziele für die radargelenkte Hellfire L bzw. JAGM."], ["c-pb52-1", "p_b52", "Was ist bei CAS mit B-52 oder B-1B typisch?", ["Viele Präzisionswaffen und lange Verweildauer, aber lange Anflüge", "Kanoneneinsatz im Tiefflug", "Hellfire-Einsatz", "Sehr kurze Verweildauer"], "Bomber bringen Masse und Ausdauer, brauchen aber Raum und Zeit für jeden Anflug."], ["c-pef-1", "p_ef", "Ein Luftwaffen-Eurofighter mit RecceLite checkt ein. Kann er für eine LGB lasern?", ["Nein – RecceLite ist ein Aufklärungspod", "Ja", "Nur mit GBU-48", "Nur bei Nacht"], "Zum Lasern braucht er den Litening (LDP)."], ["c-ptor-1", "p_tornado", "Welche Tornado-Version fliegt SEAD mit HARM?", ["Tornado ECR", "Tornado IDS", "Tornado GR4", "Tornado ADV"], "ECR = Electronic Combat and Reconnaissance."], ["c-pf18-1", "p_f18", "Woran erkennst du die Super Hornet gegenüber der F-15E?", ["Nach außen geneigte Seitenleitwerke und lange Vorflügelwurzeln (LEX)", "Zwei Triebwerke", "Zwei Seitenleitwerke", "Tandemcockpit"], "Beide sind Zweistrahler mit zwei Seitenleitwerken; die F-15E-Leitwerke stehen senkrecht."], ["c-praf-1", "p_rafale", "Woran unterscheidest du Rafale und Eurofighter?", ["Lufteinläufe: Rafale seitlich unter dem Cockpit, Eurofighter ein Einlauf unter dem Rumpf", "Die Rafale hat Schwenkflügel", "Der Eurofighter hat zwei Seitenleitwerke", "Die Rafale hat keine Canards"], "Beide haben Deltaflügel mit Canards und ein Seitenleitwerk."], ["g-dc", "gen", "Was bedeutet „Danger Close“?", ["Eigene Kräfte sind innerhalb der Risk Estimate Distance (0,1 % PI) der gewählten Waffe", "Das Ziel liegt weniger als 1 km / 0,5 NM entfernt", "Das Lfz fliegt unter 1.000 ft", "Die Waffe hat keinen Verzögerungszünder"], "Danger Close steht in den Remarks; der Bodenführer übernimmt das Risiko und gibt seine Initialen."], ["g-red", "gen", "Wo findest du die Risk Estimate Distances der Waffen?", ["In der JFIRE bzw. den nationalen Vorgaben", "Im Air Tasking Order (ATO)", "Im Check-in des Lfz", "Auf der Bombe aufgedruckt"], "Die Risk Estimate Distances stehen in der JFIRE (Joint Application of Firepower)."], ["g-cep", "gen", "Was beschreibt der CEP einer Waffe?", ["Radius, in dem 50 % der Waffen einschlagen", "Die maximale Reichweite", "Den Splitterradius", "Den Abstand zu eigenen Kräften"], "Circular Error Probable – ein Maß für die Treffgenauigkeit, nicht für die Wirkung."], ["g-wx", "gen", "Ziel: stehender Gefechtsstand, geschlossene Wolkendecke. Welche Waffenart passt?", ["GPS-Waffe wie GBU-38 oder GBU-31 auf präzise Koordinaten", "GBU-12 mit Bodenlaser", "Maverick mit TV-Suchkopf", "Strafing mit der Kanone"], "Laser- und TV-Lenkung brauchen Sicht. GPS-Waffen treffen auch durch Wolken, wenn die Koordinaten stimmen."], ["g-mover", "gen", "Ziel: fahrender Schützenpanzer, klare Sicht. Was ist am besten geeignet?", ["Lasergelenkter Flugkörper oder GBU-54 mit Laserführung", "GBU-31 auf die letzte Meldung", "Mk 84 ungelenkt", "JASSM"], "Gegen Bewegtziele brauchst du einen Suchkopf, der dem Ziel folgt."], ["g-urban", "gen", "Ziel in einem Haus in bebautem Gebiet, Zivilisten in der Nähe. Welche Waffe passt am ehesten?", ["GBU-39 SDB oder Hellfire – kleiner Gefechtskopf", "Mk 84", "CBU-87", "GBU-31"], "Kleiner Gefechtskopf plus hohe Präzision senkt das Kollateralrisiko."], ["g-airburst", "gen", "Wozu dient ein Annäherungs- bzw. Airburst-Zünder?", ["Detonation über dem Ziel – Splitterwirkung gegen ungeschützte Kräfte", "Wirkung im Inneren von Bunkern", "Schutz des eigenen Lfz beim Tiefabwurf", "Selbstzerlegung von Blindgängern"], "Airburst verteilt die Splitter von oben über eine größere Fläche."], ["g-delay", "gen", "Wozu dient ein Verzögerungszünder (Delay)?", ["Detonation nach dem Eindringen – gegen Gebäude und Bunker", "Mehr Splitterwirkung über offenem Gelände", "Schutz des eigenen Lfz beim Tiefabwurf", "Selbstzerlegung von Blindgängern"], "Die Bombe durchschlägt Decke oder Wand und detoniert im Inneren."], ["g-code", "gen", "Bei welcher Waffe musst du den Lasercode besonders früh abstimmen, weil er am Boden eingestellt wird?", ["Paveway II, z. B. GBU-12", "GBU-38", "Mk 82", "PARS 3 LR"], "Bei Paveway II stellt die Munitionsmannschaft den Code ein. GBU-38, Mk 82 und PARS 3 LR nutzen keinen Laser."], ["g-tof", "gen", "Warum ist die Flugzeit (Time of Flight) einer Waffe für dich wichtig?", ["Laser, Markierung und Warnung der eigenen Kräfte müssen bis zum Einschlag passen", "Sie bestimmt den Lasercode", "Sie ist nur für den Piloten relevant", "Sie ändert die Gefechtskopfwirkung"], "Gerade bei Gleitwaffen aus großer Höhe kann die Flugzeit eine Minute und mehr betragen."], ["g-line6", "gen", "In welcher Zeile der 9-Line steht die Zielposition?", ["Zeile 6", "Zeile 4", "Zeile 8", "Zeile 9"], "Zeile 4: Zielhöhe, Zeile 6: Zielposition, Zeile 8: Position eigener Kräfte."], ["g-line4", "gen", "Warum gehört bei GPS-Waffen die Zielhöhe (Zeile 4) unbedingt dazu?", ["Eine falsche Höhe verschiebt den Einschlagpunkt – GPS-Waffen rechnen dreidimensional", "Der Pilot braucht sie für die Landung", "Sie bestimmt die Zünderart", "Sie ist nur bei Nacht relevant"], "Liegt die Höhe falsch, schlägt die Waffe vor oder hinter dem Ziel ein – je flacher der Anflug, desto mehr."], ["z-roles", "gen", "Wer legt beim CAS-Einsatz die gewünschte Wirkung fest, wer berät zu Waffe und Zünder?", ["Der GFC legt die Wirkung fest; der JTAC berät und stimmt Waffe und Zünder mit dem Lfz-Führer ab", "Der Lfz-Führer entscheidet allein über Waffe und Wirkung", "Der JTAC legt die Wirkung fest, der GFC wählt den Zünder", "Die Wirkung ergibt sich automatisch aus der 9-Line"], "Der GFC verantwortet die Wirkung im Gefecht. Der JTAC übersetzt sie in Waffe, Zünder und Angriffsart – abgestimmt mit dem Lfz-Führer, der seine Beladung kennt."], ["z-inf", "gen", "Infanterie in offener Stellung (Schützenlöcher ohne Deckung). Welcher Zündmodus wirkt am besten?", ["Airburst (Annäherungszünder)", "Verzögerung", "Lange Verzögerung", "Penetrator mit Verzögerung"], "Airburst verteilt die Splitter von oben – auch in Gräben und Löcher ohne Deckung. Aufschlag wirkt dagegen teilweise in den Boden."], ["z-bldg", "gen", "Feind im Inneren eines Gebäudes, die Wirkung soll möglichst im Gebäude bleiben. Welcher Zündmodus?", ["Verzögerung", "Airburst", "Aufschlag (sofort)", "Behälterzünder mit großer Öffnungshöhe"], "Mit Verzögerung durchschlägt die Waffe Dach oder Wand und detoniert im Inneren. Trümmer bleiben trotzdem ein Risiko."], ["z-veh", "gen", "Ungepanzerte Fahrzeuge auf offener Straße. Welcher Zündmodus ist der Standard?", ["Aufschlag (sofort)", "Lange Verzögerung", "Penetrator mit Verzögerung", "Kein Zünder nötig"], "Sofortzündung beim Aufschlag nutzt Spreng- und Splitterwirkung an der Oberfläche."], ["z-bunker", "gen", "Gehärteter Gefechtsstand bzw. Bunker. Welche Kombination passt?", ["Penetrator (BLU-109) mit Verzögerungszünder", "Mk 82 mit Airburst", "CBU-87", "Hydra 70 mit Aufschlagzünder"], "Der Penetrator durchschlägt die Deckung, der Verzögerungszünder lässt ihn erst im Inneren detonieren."], ["z-lgbab", "gen", "Warum ist mit einer GBU-12 kein Airburst durch Annäherungszünder möglich?", ["Im Bug sitzt der Laser-Suchkopf – kein Platz für einen Bugzünder", "Laserbomben dürfen nicht über Grund detonieren", "Der Mk-82-Körper ist dafür zu klein", "Der Laser würde den Zünder auslösen"], "Der Annäherungszünder DSU-33 sitzt im Bug. Bei Paveway-Bomben ist der Bug mit dem Suchkopf belegt – es bleibt der Heckzünder für Aufschlag oder Verzögerung."], ["z-jdamab", "gen", "Womit wird eine GBU-38 airburst-fähig?", ["Annäherungszünder DSU-33 im Bug", "FMU-152 JPF im Heck", "Lasersensor DSU-38 im Bug", "Höhenmesser im JDAM-Heckkit"], "Der DSU-33 im Bug löst wenige Meter über Grund aus. Der JPF steuert nur Aufschlag und Verzögerung."], ["z-gbu54", "gen", "Der GFC will Airburst gegen Infanterie im Freien, das Lfz hat nur GBU-54. Was berätst du?", ["Airburst geht nicht – im Bug sitzt der Lasersensor. Aufschlag nutzen oder ein Lfz mit Airburst-Fähigkeit anfordern", "Airburst im Cockpit einstellen lassen", "Mit dem Bodenlaser über dem Ziel lasern", "GPS-Modus wählen, dann ist Airburst möglich"], "Bei der Laser-JDAM ist der Bug mit dem DSU-38 belegt – kein DSU-33. Es bleibt der Heckzünder."], ["z-jpf", "gen", "Was ist der wichtigste Vorteil des FMU-152 JPF gegenüber dem FMU-139?", ["Die Verzögerung ist im Cockpit programmierbar, auch noch im Flug", "Er ermöglicht Airburst", "Er ersetzt den Laser-Suchkopf", "Er ist nur für Übungsbomben"], "Mit JPF kann der Pilot die Zündung an die Lage anpassen. Beim FMU-139 ist die Einstellung am Boden festgelegt."], ["z-loadout", "gen", "Das Lfz trägt GBU-38 mit FMU-139 im Heck, ohne DSU-33. Der GFC will Airburst. Was gilt?", ["Airburst ist mit dieser Beladung nicht möglich", "Der Pilot schaltet im Cockpit auf Airburst", "Mit JDAM ist Airburst immer möglich", "Airburst gelingt, wenn der Angriff steil geflogen wird"], "Ohne Annäherungszünder im Bug kein Airburst. Was am Boden verbaut wurde, begrenzt deine Optionen – deshalb im Check-in nach den Zündern fragen."], ["z-nosetail", "gen", "Eine Bombe hat einen Bugzünder (sofort) und einen Heckzünder (verzögert). Was kann der Pilot wählen?", ["Welcher Zünder scharf wird – und damit Aufschlag oder Verzögerung", "Nichts – beide lösen immer gemeinsam aus", "Nur die Abwurfhöhe", "Den Lasercode"], "Über die Scharfschaltung (Bug, Heck oder beide) erlaubt eine Beladung zwei Einsatzarten. So kannst du noch im Anflug zwischen Oberflächenwirkung und Wirkung im Inneren wählen."], ["z-ab-danger", "gen", "Was musst du bei Airburst in der Nähe eigener Kräfte bedenken?", ["Die Splitter gehen von oben über eine größere Fläche – Deckung ohne Dach schützt kaum", "Airburst ist immer sicherer als Aufschlag", "Airburst wirkt nur senkrecht nach unten", "Airburst hat keine Splitterwirkung"], "Airburst vergrößert die Splitterwirkung in der Fläche. Abstände zu eigenen Kräften nach den Risk Estimate Distances der JFIRE prüfen."], ["z-pw4", "gen", "Was kann der Pilot bei der Paveway IV im Cockpit wählen?", ["Zündmodus (Aufschlag, Verzögerung, Airburst) sowie Auftreffwinkel und Angriffsrichtung", "Nur den Lasercode", "Nur die Gewichtsklasse", "Nichts – alles ist am Boden eingestellt"], "Die Paveway IV ist im Flug programmierbar – die Wirkung lässt sich bis kurz vor dem Abwurf an die Lage anpassen."], ["z-sdb", "gen", "Warum eignet sich die GBU-39 SDB für sehr unterschiedliche Ziele?", ["Zündmodus im Cockpit wählbar (Aufschlag, Verzögerung, Airburst) bei kleinem Gefechtskopf", "Sie trägt Submunition", "Sie hat einen 2000-lb-Gefechtskopf", "Sie hat eine Hohlladung"], "Eine Waffe, drei Wirkungen – und dank kleinem Gefechtskopf auch nahe an Zivilisten oder eigenen Kräften nutzbar."], ["z-cbu", "gen", "Was bestimmt bei der CBU-87 die Größe der Wirkfläche?", ["Öffnungshöhe und Drehrate des Behälters", "Der Lasercode", "Der Verzögerungszünder im Heck", "Der Auftreffwinkel"], "Höher geöffnet und schneller gedreht streuen die Bomblets weiter. Die Werte werden meist am Boden eingestellt."], ["z-hellr", "gen", "Was ist bei der AGM-114R anders als bei der AGM-114K?", ["Mehrzweck-Gefechtskopf mit wählbarer Wirkung, auch verzögert", "Radarlenkung statt Laser", "Doppelte Reichweite", "Airburst über Annäherungszünder"], "Die K hat eine reine Tandem-Hohlladung gegen Panzer. Die R lässt sich auf Panzer, weiche Ziele oder Räume einstellen."], ["z-retard", "gen", "Mk 82 mit Snakeye-Heck. Welche Einsatzarten erlaubt sie?", ["Im Cockpit wählbar: High Drag (gebremst, Tiefabwurf) oder Low Drag (Freifall)", "Nur High Drag", "Nur Airburst", "Laser- oder GPS-Lenkung"], "Die Bremsklappen öffnen nur, wenn der Pilot High Drag wählt. Sonst fällt die Bombe wie eine normale Mk 82."], ["z-urban", "gen", "Warum kann eine Verzögerungszündung in bebautem Gebiet den Kollateralschaden senken?", ["Die Detonation findet im Gebäude statt – weniger Splitter auf Straßen und Nachbargrundstücken", "Verzögerte Bomben haben weniger Sprengstoff", "Sie detonieren nicht, wenn Zivilisten in der Nähe sind" /* ---------- state & persistence ---------- */
const KEY = 'waffentrainer.v1';
const blank = () => ({v:1, updated:0, fam:{}, q:{}, flags:{}, recent:[], lastImg:{}, answered:0, correct:0, annoOpen:false});
function readLocal(){ try { const r = localStorage.getItem(KEY); if (r) return Object.assign(blank(), JSON.parse(r)); } catch(e){} return blank(); }
let S = readLocal();
let remote = null, syncLabel = 'Nur auf diesem Gerät gespeichert';
let pushTimer = null;
function save(){
  S.updated = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
  if (remote){ clearTimeout(pushTimer); pushTimer = setTimeout(pushRemote, 1200); }
}
async function pushRemote(){
  if (!remote) return;
  try { await remote.set(JSON.parse(JSON.stringify(S))); }
  catch(e){ if (e && (e.code === 'invalid_argument' || e.code === 'revoked' || e.code === 'not_granted')) { remote = null; syncLabel = 'Nur auf diesem Gerät gespeichert'; } }
}
(async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    const ref = db.doc('data/users/' + id + '/progress');
    const snap = await ref.get();
    remote = ref;
    syncLabel = 'Fortschritt wird geräteübergreifend gespeichert';
    if (snap.exists){
      const r = JSON.parse(JSON.stringify(snap.data() || {}));
      if ((r.updated || 0) > (S.updated || 0)){
        S = Object.assign(blank(), r);
        try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
        if (view === 'home' || view === 'stats' || view === 'cards') render();
      } else if (S.updated) pushRemote();
    } else if (S.updated) pushRemote();
    if (view === 'stats') render();
  } catch(e){ remote = null; }
})();

/* ---------- question bank ---------- */
const grpOf = fam => FAM[fam] ? FAM[fam].g : 'gen';
function buildBank(){
  const bank = [];
  for (const f of FAMS){
    const imgs = IMG[f.id] || [];
    imgs.forEach((_, i) => bank.push({id:`img:${f.id}:${i}`, kind:f.g === 'w' ? 'img' : 'pimg', fam:f.id, i}));
    if (f.g === 'w'){
      if (imgs.length) bank.push({id:`cap:${f.id}`, kind:'cap', fam:f.id});
      bank.push({id:`type:${f.id}`, kind:'type', fam:f.id});
      if (f.guide) bank.push({id:`guide:${f.id}`, kind:'guide', fam:f.id});
      if (f.wt) bank.push({id:`wt:${f.id}`, kind:'wt', fam:f.id});
      if (!['cruise','arm'].includes(f.type)) bank.push({id:`mv:${f.id}`, kind:'mv', fam:f.id});
      bank.push({id:`plat:${f.id}`, kind:'plat', fam:f.id});
      const fzd = FUZE[f.id];
      if (fzd && !fzd.disp && fzd.m.every(v => v === 0 || v === 1)) bank.push({id:`fz:${f.id}`, kind:'fz', fam:f.id});
    } else {
      bank.push({id:`sens:${f.id}`, kind:'sens', fam:f.id});
      bank.push({id:`arm:${f.id}`, kind:'arm', fam:f.id});
    }
  }
  for (const [id, fam, q, opts, ex] of DATA.curated) bank.push({id, kind:'cur', fam, q, opts, ex});
  DATA.brevity.forEach(([t, d], i) => {
    bank.push({id:`brev:${i}`, kind:'brev', fam:'gen', t, d});
    bank.push({id:`brevr:${i}`, kind:'brevr', fam:'gen', t, d});
  });
  bank.forEach(q => { q.grp = grpOf(q.fam); });
  return bank;
}
const BANK = buildBank();

function weight(q, prevFam){

  const weak = fa === null ? 0.45 : 1 - fa;

  let w = (1 + 2 * weak) * (s ? Math.max(0.25, 1 + 1.6 * (s.w / Math.max(1, s.c + s.w)) - 0.08 * Math.min(s.c, 6)) : 1.35);
  if (S.recent.includes(q.id)) w *= 0.12;
  if (q.fam === prevFam) w *= 0.25;
  if (q.kind === 'img' || q.kind === 'pimg') w *= 0.9;
  if (q.kind === 'type') w *= 0.7;
  return w;
}
function pickRound(mode){
  const M = MODES[mode];
  let pool = BANK.filter(q => M.kinds.includes(q.kind));
  if (M.grp) pool = pool.filter(q => q.grp === M.grp);
  if (M.tag) pool = pool.filter(q => q.kind !== 'cur' || q.id.startsWith(M.tag));
  if (M.confusion) pool = pool.filter(q => FAM[q.fam] && FAM[q.fam].confuse.length);
  const out = []; let prevFam = null;
  const n = Math.min(ROUND_LEN, pool.length);
  const usedImgFam = {};
  while (out.length < n && pool.length){
    const ws = pool.map(q => weight(q, prevFam) * ((q.kind === 'img' || q.kind === 'pimg') && usedImgFam[q.fam] ? 0.2 : 1));
    let r = Math.random() * ws.reduce((a, b) => a + b, 0), k = 0;
    while (k < ws.length - 1 && (r -= ws[k]) > 0) k++;
    const q = pool.splice(k, 1)[0];
    if (q.kind === 'img' || q.kind === 'pimg') usedImgFam[q.fam] = true;
    out.push(q); prevFam = q.fam;
  }
  return out;
}

/* distractor helpers */
const typeAlternatives = t => Object.keys(TYPES).filter(x => x !== t && TYPES[x].grp === TYPES[t].grp && !(DATA.typeExclude[t] || []).includes(x));
function nameDistractors(f, strict){
  const pool = FAMS.filter(x => x.g === f.g && x.id !== f.id);
  const conf = shuffle(f.confuse.map(id => FAM[id]).filter(Boolean));
  const same = shuffle(pool.filter(x => x.type === f.type && !f.confuse.includes(x.id)));
  const rest = shuffle(pool.filter(x => x.type !== f.type && !f.confuse.includes(x.id)));
  const list = strict ? [...conf, ...same, ...rest] : [...conf.slice(0, 2), ...shuffle([...conf.slice(2), ...same, ...rest])];
  return list.slice(0, 3).map(x => x.name);
}
const guideText = f => f.guideText || GUIDES[f.guide];
function annoHtml(f){

function randomImg(f){

}
const MV = {1:'Ja – auch gegen fahrende Ziele', 0:'Nein – nur gegen stehende Ziele', '?':'Eingeschränkt – je nach Version oder Lenkmodus'};
function materialize(q, mode){

  switch (q.kind){

    case 'pimg':

        ex:`${f.name}: ${f.role}. Erkennung: ${f.recog}` + confTxt};
    case 'cap': {

      return {prompt:'Wofür setzt du diese Waffe typischerweise ein?', img:randomImg(f), correct:TYPES[f.type].cap, wrong,
        ex:`Das ist ${f.name} (${TYPES[f.type].label}). ${f.effects}`};
    }
    case 'type': {

    }

  $('#app').innerHTML = DATA.typeOrder.map(t => {
    const fs = FAMS.filter(f => f.type === t); if (!fs.length) return '';
    const head = TYPES[t].grp !== lastGrp ? `<h1 style="font-size:2rem;margin-top:22px">${TYPES[t].grp === 'w' ? 'Waffen' : 'Plattformen'}</h1>` : '';
    lastGrp = TYPES[t].grp;
    return `${head}<section class="group"><h2>${esc(TYPES[t].label)}</h2><p class="small muted" style="margin:0 0 4px">${esc(TYPES[t].cap)}</p>
      ${fs.map(f => `<button class="fam" data-card="${f.id}"><span class="code">${esc(f.short)}</span><span class="nm">${esc(f.name)}<br><span class="small muted" style="font-weight:400">${esc(f.primary)}</span></span><span class="pct">${pct(f.id)}</span></button>`).join('')}</section>`;
  }).join('');
}
let cardState = null;
function openCard(id){
  const f = FAM[id]; if (!f) return;
  cardState = {id, i:0};
  drawCard();
  const sh = $('#sheet'); sh.hidden = false; sh.scrollTop = 0;
  document.body.style.overflow = 'hidden';
}
function drawCard(){
  const f = FAM[cardState.id]; const n = (IMG[f.id] || []).length;
  const list = a => `<ul>${a.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
  const sec = (h, body) => `<div class="sec"><h3>${h}</h3>${body}</div>`;
  const p = s => `<p style="margin:0">${esc(s)}</p>`;
  const body = f.g === 'w' ? `
    ${sec('Lenkung', p(guideText(f) || 'Ungelenkt – Rohrwaffe'))}
    ${sec('Gewicht und Gefechtskopf', p((f.wt ? f.wt + '-Klasse. ' : '') + f.warhead))}
    ${sec('Plattformen', list(f.platforms))}
    ${sec('Wirkung', p(f.effects))}
    ${sec('Bewegliche Ziele', p(f.mvx))}
    ${sec('Reichweite', p(f.range))}
    ${fuzeSec(f)}` : `
    ${sec('Nutzer', p(f.nations))}
    ${sec('Rolle', p(f.role))}
    ${sec('Zielsensor', p(f.sensor))}
    ${sec('Bordkanone', p(f.gun))}
    ${sec('Typische Bewaffnung', list(f.weapons))}
    ${sec('Einsatzprofil', p(f.profile))}`;
  $('#sheet').innerHTML = `<div class="bar" style="position:sticky"><div class="bar-in"><button class="iconbtn" data-act="closecard" aria-label="Schließen">‹ Zurück</button><div class="t">${esc(f.name)}</div><span class="muted small">${pct(f.id)}</span></div></div>
  <div class="wrap">
    ${n ? feedHtml(f.id, cardState.i, {nav:n > 1, counter:`${cardState.i + 1}/${n}`, alt:f.name}) : ''}
    <h1 style="font-size:2.6rem;margin-top:16px">${esc(f.name)}</h1>
    <div class="desig">${esc(f.designation)}${f.maker ? ' – ' + esc(f.maker) : ''}</div>
    ${chipsHtml(f)}
    ${f.bw ? `<div class="bw"><strong>Bundeswehr:</strong> ${esc(f.bw)}</div>` : ''}
    ${body}
    ${sec('Als JTAC beachten', list(f.jtac))}
    ${ANNO[f.id] ? sec('Erkennungsmerkmale', annoHtml(f) + `<p style="margin:10px 0 0">${esc(f.recog)}</p>`) : sec('Erkennung', p(f.recog))}
    ${f.confuse.length ? sec('Verwechslungsgefahr', `<div class="row" style="margin-top:4px">${f.confuse.map(c => `<button class="btn" data-card="${c}">${esc(FAM[c].name)}</button>`).join('')}</div>`) : ''}
  </div>`;
}
function closeCard(){ $('#sheet').hidden = true; document.body.style.overflow = ''; cardState = null; }

function renderStats(){
  $('#bar').hidden = false;
  setBar('Statistik', {back:'home'});
  const rows = FAMS.map(f => ({f, a:famAcc(f.id), s:S.fam[f.id] || {c:0, w:0}})).sort((x, y) => (x.a ?? -1) - (y.a ?? -1));
  const gen = S.fam.gen || {c:0, w:0};
  const flags = Object.entries(S.flags);
  const flagText = flags.map(([id, v]) => `• [${id}] ${v.t}`).join('\n');
  const bar = a => `<div class="sbar"><i style="width:${a === null ? 0 : a * 100}%;background:${a === null ? 'transparent' : a >= .8 ? 'var(--ok)' : a >= .5 ? 'var(--cta)' : 'var(--bad)'}"></i></div>`;
  const ga = gen.c + gen.w ? gen.c / (gen.c + gen.w) : null;
  $('#app').innerHTML = `
    <div class="stat-top"><div><b>${S.answered}</b><span class="muted small">Antworten</span></div><div><b>${S.answered ? Math.round(100 * S.correct / S.answered) + ' %' : '–'}</b><span class="muted small">richtig</span></div></div>
    <p class="sync">${esc(syncLabel)}</p>
    <h2 style="margin-top:18px">Je System, schwächste zuerst</h2>
    <div style="margin-top:6px">${rows.map(({f, a, s}) => `<div class="srow"><button class="linkbtn" data-card="${f.id}" style="text-align:left">${esc(f.name)}</button>${bar(a)}<span class="small muted" style="text-align:right">${a === null ? '–' : Math.round(a * 100) + ' %'}<br>${s.c + s.w}×</span></div>`).join('')}
    <div class="srow"><span>Waffeneinsatz und Brevity</span>${bar(ga)}<span class="small muted" style="text-align:right">${ga === null ? '–' : Math.round(ga * 100) + ' %'}<br>${gen.c + gen.w}×</span></div></div>
    <h2 style="margin-top:26px">Gemeldete Fragen</h2>
    ${flags.length ? `<p class="small muted" style="margin:4px 0 8px">Kopiere die Liste und schick sie mir im Chat, dann prüfe und korrigiere ich die Fragen.</p><textarea readonly id="flagtxt">${esc(flagText)}</textarea><div class="row"><button class="btn" data-act="copyflags">Liste kopieren</button><button class="btn" data-act="clearflags">Meldungen löschen</button></div>` : '<p class="muted">Noch keine Frage gemeldet. Nach jeder Antwort kannst du eine Frage mit „Frage melden“ markieren.</p>'}
    <h2 style="margin-top:26px">Zurücksetzen</h2>
    <p class="small muted" style="margin:4px 0 8px">Löscht alle Antworten und Trefferquoten. Gemeldete Fragen bleiben erhalten.</p>
    <button class="btn" data-act="reset">Statistik zurücksetzen</button>`;
}
function render(){
  if (view === 'home') renderHome();
  else if (view === 'quiz') renderQuiz();
  else if (view === 'end') renderEnd();
  else if (view === 'cards') renderCards();
  else if (view === 'stats') renderStats();
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-zoom]');
  if (!t) return;
  if (t.dataset.img && cardState){
    e.stopPropagation();
    const n = IMG[cardState.id].length;
    cardState.i = (cardState.i + Number(t.dataset.img) + n) % n; drawCard(); return;
  }
  if (t.dataset.zoom){
    const [fid, i] = t.dataset.zoom.split(':');
    const lb = document.createElement('div'); lb.className = 'lightbox'; lb.setAttribute('role', 'dialog');
    lb.innerHTML = `<img src="${IMG[fid][Number(i)]}" alt="Vergrößerte Ansicht">`;
    lb.addEventListener('click', () => lb.remove());
    document.body.appendChild(lb); return;
  }
  if (t.dataset.start){ closeCard(); startRound(t.dataset.start); return; }
  if (t.dataset.go){ view = t.dataset.go; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.card){ openCard(t.dataset.card); return; }
  if (t.dataset.ans != null){ answer(Number(t.dataset.ans)); return; }
  if (t.dataset.flag){
    const id = t.dataset.flag;
    if (S.flags[id]) delete S.flags[id]; else S.flags[id] = {t:R && R.cur ? R.cur.m.prompt : id, ts:Date.now()};
    save();
    t.classList.toggle('flagged', !!S.flags[id]); t.textContent = S.flags[id] ? 'Gemeldet' : 'Frage melden';
    return;
  }
  const act = t.dataset.act;
  if (act === 'home'){ closeCard(); view = 'home'; R = null; render(); window.scrollTo(0, 0); }
  else if (act === 'next') nextQ();
  else if (act === 'anno'){
    const ar = $('#annoarea'); if (!ar) return;
    S.annoOpen = ar.hidden; ar.hidden = !ar.hidden; save();
    t.textContent = S.annoOpen ? 'Erkennungsmerkmale ausblenden' : 'Erkennungsmerkmale zeigen';
    t.setAttribute('aria-expanded', S.annoOpen ? 'true' : 'false');
    if (S.annoOpen) ar.scrollIntoView({behavior:'smooth', block:'nearest'});
  }
  else if (act === 'closecard') closeCard();
  else if (act === 'copyflags'){
    const ta = $('#flagtxt'); ta.select();
    const done = () => { t.textContent = 'Kopiert'; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, () => { try { document.execCommand('copy'); done(); } catch(_){} });
    else { try { document.execCommand('copy'); done(); } catch(_){} }
  }
  else if (act === 'clearflags'){ S.flags = {}; save(); render(); }
  else if (act === 'reset'){
    if (t.dataset.confirm){ const fl = S.flags; S = blank(); S.flags = fl; save(); render(); }
    else { t.dataset.confirm = '1'; t.textContent = 'Wirklich zurücksetzen? Erneut tippen'; t.classList.add('flagged'); }
  }
});
document.addEventListener('keydown', e => {
  if (document.querySelector('.lightbox')){ if (e.key === 'Escape') document.querySelector('.lightbox').remove(); return; }
  if (!$('#sheet').hidden){ if (e.key === 'Escape') closeCard(); return; }
  if (view !== 'quiz' || !R) return;
  if (!R.answered && /^[1-4]$/.test(e.key)){ const k = Number(e.key) - 1; if (k < R.cur.opts.length) answer(k); }
  else if (R.answered && (e.key === 'Enter' || e.key === ' ') && !(e.target && e.target.dataset && e.target.dataset.flag)){ e.preventDefault(); nextQ(); }
});
render();

</script>
<script src="../assets/app.js" defer></script>
