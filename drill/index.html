<title>JTAC-Drill</title>

<meta name="theme-color" content="#0F1517" media="(prefers-color-scheme: dark)">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
/* Layout: eine Spalte (max. 720px) im Look der Trainer-Reihe – Runde aus Eingabefragen, sofortige Prüfung gegen hinterlegte Antworten */
:root{
  --bg:#E4E9E7; --surface:#F4F7F5; --surface2:#E9EEEC; --ink:#1A2326; --muted:#55615F; --line:#C3CCC9;
  --ok:#2A7848; --ok-bg:#DCEEE2; --bad:#B0382B; --bad-bg:#F6DEDA; --unk:#7A6A2E; --unk-bg:#F1E9CF;
  --cta:#E0A526; --cta-ink:#1A2326; --mid-bg:#F6EBCF;
  --font-d:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --font-b:"Barlow","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-m:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1517; --surface:#172022; --surface2:#1D282B; --ink:#E1E7E5; --muted:#93A09D; --line:#2A3639;
    --ok:#56B57F; --ok-bg:#16301F; --bad:#E36D5E; --bad-bg:#3A1C18; --unk:#D9C17A; --unk-bg:#2E2913;
    --cta:#E3AA2E; --cta-ink:#111719; --mid-bg:#33290F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1517; --surface:#172022; --surface2:#1D282B; --ink:#E1E7E5; --muted:#93A09D; --line:#2A3639;
  --ok:#56B57F; --ok-bg:#16301F; --bad:#E36D5E; --bad-bg:#3A1C18; --unk:#D9C17A; --unk-bg:#2E2913;
  --cta:#E3AA2E; --cta-ink:#111719; --mid-bg:#33290F; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--cta);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:12px 18px 56px}
h1,h2,h3{font-family:var(--font-d);line-height:1.1;margin:0;text-wrap:balance}
h2{font-size:1.3rem;font-weight:600}
.muted{color:var(--muted)}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:720px;margin:0 auto;padding:8px 18px;display:flex;align-items:center;gap:12px;min-height:52px}
.bar .t{font-family:var(--font-d);font-weight:600;font-size:1.2rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:40px;height:40px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:500;white-space:nowrap}
.prog{height:3px;background:var(--line)}
.prog>i{display:block;height:100%;background:var(--cta);transition:width .25s}
.tag{font-family:var(--font-d);font-size:1rem;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

/* Übersicht */
.hero{padding:26px 0 16px}
.hero h1{font-size:clamp(3rem,13vw,5.2rem);font-weight:700;letter-spacing:-.015em;line-height:.9}
.hero p{max-width:34em;margin:12px 0 0;color:var(--muted);font-size:1.05rem}
.sec{margin-top:18px}
.sec h2{margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-weight:600;font-size:.92rem}
.chipbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chipbtn .c{font-weight:500;opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}
.modes{border-top:1px solid var(--line);margin-top:18px}
.mode{display:flex;width:100%;gap:14px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:13px 2px}
.mode .lv{flex:none;width:2.1em;height:2.1em;border-radius:8px;background:var(--ink);color:var(--bg);font-family:var(--font-d);font-weight:700;font-size:1.25rem;display:flex;align-items:center;justify-content:center}
.mode .lv.alt{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.mode .mi{flex:1;min-width:0}
.mode strong{display:block;font-family:var(--font-d);font-size:1.3rem;font-weight:600;line-height:1.1}
.mode small{display:block;color:var(--muted);font-size:.9rem;margin-top:2px}
.mode .n{font-family:var(--font-d);font-size:1.05rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right;line-height:1.15}
.mode:hover strong{text-decoration:underline;text-underline-offset:3px}
.mode[disabled]{opacity:.45;cursor:default}
.mode[disabled]:hover strong{text-decoration:none}
.note{margin-top:12px;padding:10px 14px;border-radius:8px;background:var(--unk-bg);border:1px solid var(--unk);font-size:.94rem}
.matrix{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.matrix th{font-family:var(--font-d);font-weight:600;font-size:.95rem;color:var(--muted);text-align:left;padding:6px 6px 6px 0;letter-spacing:.03em}
.matrix th.c{text-align:center}
.matrix td{padding:5px 3px;border-top:1px solid var(--line)}
.matrix td.tn{font-weight:600;font-size:.95rem;padding-left:0;padding-right:8px}
.mcell{display:block;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 6px 8px;position:relative;overflow:hidden;text-align:center;font-family:var(--font-d);font-size:1.05rem;font-weight:600;line-height:1.1}
.mcell small{display:block;font-family:var(--font-b);font-size:.7rem;font-weight:500;color:var(--muted)}
.mcell i{position:absolute;left:0;bottom:0;height:4px;background:var(--ok)}
.mcell.empty{border-style:dashed;color:var(--muted)}
.foot{margin-top:24px;font-size:.84rem;color:var(--muted);max-width:42em}
.foot p{margin:0 0 8px}
.foot a{color:var(--ink);text-underline-offset:3px}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-weight:600}
.resetrow{margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.92rem}

/* Frage */
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0 10px;font-size:.9rem;color:var(--muted)}
.chip-cat{display:inline-block;font-family:var(--font-d);font-weight:700;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;background:var(--ink);color:var(--bg);border-radius:5px;padding:2px 9px}
.lage{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--cta);border-radius:0 10px 10px 0;padding:12px 16px;margin-bottom:12px}
.lage .lh{font-family:var(--font-d);font-size:.82rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lage p{margin:2px 0 0}
.prompt{font-family:var(--font-d);font-size:1.6rem;font-weight:600;line-height:1.15;margin:4px 0 16px}
.fld{margin-top:14px}
.fld label{display:block;font-weight:600;margin-bottom:5px}
.inp{display:block;width:100%;font-family:var(--font-m);font-size:1.05rem;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px}
.inp:focus{border-color:var(--ink);outline:none}
.inp[readonly]{border-style:dashed}
.fhint{font-size:.86rem;color:var(--muted);margin-top:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:11px 15px;font-weight:600}
.btn.main{background:var(--ink);color:var(--bg);border-color:var(--ink);flex:1;min-width:9em}
.fres{margin-top:8px;padding:9px 12px;border-radius:8px;border:1px solid var(--c);background:var(--cb);font-size:.95rem}
.fres .st{font-family:var(--font-d);font-weight:700;font-size:1.05rem;color:var(--c)}
.fres .interp{color:var(--muted);font-size:.88rem}
.fres .sol{margin-top:2px}
.fres ul{margin:4px 0 0;padding-left:1.1em}
.fres li+li{margin-top:2px}
.fres .hitlist{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;padding:0;list-style:none}
.hitlist li{font-size:.84rem;font-weight:600;border-radius:999px;padding:2px 10px;border:1px solid var(--line);background:var(--surface)}
.hitlist li.y{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.hitlist li.n{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.hitlist li.u{background:var(--unk-bg);border-color:var(--unk);color:var(--unk)}
.hitlist li.g{background:var(--surface2);border-color:var(--line);color:var(--muted)}
.fb{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:10px;padding:14px 16px}
.fb .v{font-family:var(--font-d);font-size:1.45rem;font-weight:700;color:var(--c)}
.fb p{margin:6px 0 0}

/* Ergebnis */
.score{font-family:var(--font-d);font-size:5rem;font-weight:700;line-height:.9;margin:26px 0 4px;font-variant-numeric:tabular-nums}
.score small{font-size:2rem;color:var(--muted);font-weight:600}
.reslist{list-style:none;padding:0;margin:14px 0 0;border-top:1px solid var(--line)}
.reslist li{display:grid;grid-template-columns:3.4em minmax(0,1fr);gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.pts{font-family:var(--font-d);font-weight:700;font-size:1rem;text-align:center;border-radius:6px;padding:2px 4px;border:1px solid var(--line);background:var(--surface2)}
.pts[data-s="ok"]{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.pts[data-s="mid"]{background:var(--mid-bg);border-color:var(--cta)}
.pts[data-s="bad"]{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.reslist small{display:block;color:var(--muted);font-weight:400}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const UML={"ä":"ae","ö":"oe","ü":"ue","ß":"ss"};
function toks(s,keepStar){
  s=String(s).toLowerCase().replace(/[äöüß]/g,c=>UML[c]);
  if(!keepStar)s=s.replace(/\*/g," ");
  s=s.replace(/([a-z])(\d)/g,"$1 $2").replace(/(\d)([a-z])/g,"$1 $2");
  return s.split(keepStar?/[^a-z0-9*]+/:/[^a-z0-9]+/).filter(Boolean);
}
function comp(a){
  const raw=toks(a,true);
  const tk=raw.map(x=>({s:x.replace(/\*/g,""),st:x.endsWith("*")}));
  const inner=tk.slice(0,-1).some(x=>x.st);
  const t=tk.map(x=>x.s),star=tk.length?tk[tk.length-1].st:false;
  const tgt=t.join("");
  return{t,tk,inner,star,tgt,len:t.length,dig:/\d/.test(tgt)};
}
function lev(a,b){
  if(a===b)return 0;const m=a.length,n=b.length;if(!m)return n;if(!n)return m;
  let p=new Array(n+1),c=new Array(n+1);for(let j=0;j<=n;j++)p[j]=j;
  for(let i=1;i<=m;i++){c[0]=i;for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));[p,c]=[c,p];}
  return p[n];
}
function thr(e){if(e.dig)return 0;const L=e.tgt.length;return L>=9?2:L>=5?1:0;}
const SPLIT=/[,;\n\/+&|]|\s(?:und|oder|sowie|bzw\.?|and|or)\s/i;
function chunks(raw){
  return String(raw).split(SPLIT).map(r=>{const t=toks(r);return{raw:r.trim(),t,m:new Array(t.length).fill(false)};}).filter(c=>c.t.length);
}
function findIn(ch,e,fz){
  const T=ch.t,M=ch.m,th=fz?thr(e):0;
  if(e.inner){
    for(let s=0;s+e.len<=T.length;s++){
      let ok=true;
      for(let k=0;k<e.len;k++){const x=e.tk[k],tok=T[s+k];if(M[s+k]||!(x.st?tok.startsWith(x.s):tok===x.s)){ok=false;break;}}
      if(ok)return[s,e.len];
    }
    return null;
  }
  for(let w=1;w<=e.len+1;w++){
    for(let s=0;s+w<=T.length;s++){
      let free=true;for(let k=s;k<s+w;k++)if(M[k]){free=false;break;}
      if(!free)continue;
      const c=T.slice(s,s+w).join("");let ok;
      if(e.star)ok=(c.length>=e.tgt.length)&&(c.startsWith(e.tgt)||(th>0&&lev(c.slice(0,e.tgt.length),e.tgt)<=th));
      else ok=c===e.tgt||(th>0&&Math.abs(c.length-e.tgt.length)<=th&&lev(c,e.tgt)<=th);
      if(ok)return[s,w];
    }
  }
  return null;
}
/* alle Einträge (gleich welcher Kategorie) längste zuerst; erst exakt, dann unscharf */
function matchAll(chs,entries){
  const out=[];
  for(const fz of [false,true])for(const e of entries)for(const ch of chs){let r;while((r=findIn(ch,e,fz))){for(let k=r[0];k<r[0]+r[1];k++)ch.m[k]=true;out.push({e,txt:ch.t.slice(r[0],r[0]+r[1]).join(" "),ch});}}
  return out;
}
const byLen=(a,b)=>b.tgt.length-a.tgt.length||b.len-a.len;
function mk(list,props){return list.map(a=>Object.assign(comp(a),props));}
function prep(){
  for(const q of Q){
    for(const f of q.f){
      if(f.t==="term"){
        let E=mk(f.ok,{cat:"ok"});
        (f.part||[]).forEach((p,i)=>E=E.concat(mk(p.a,{cat:"part",i})));
        (f.bad||[]).forEach((b,i)=>E=E.concat(mk(b.a,{cat:"bad",i})));
        f._E=E.sort(byLen);
      }else if(f.t==="multi"){
        let E=[];
        f.it.forEach((it,i)=>E=E.concat(mk(it.a,{cat:"it",i})));
        (f.bad||[]).forEach((b,i)=>E=E.concat(mk(b.a,{cat:"bad",i})));
        (f.neu||[]).forEach((b,i)=>E=E.concat(mk(b.a,{cat:"neu",i})));
        f._E=E.sort(byLen);
      }
    }
  }
}
function gTerm(f,raw){
  const chs=chunks(raw);
  if(!chs.length)return{s:0,empty:true,notes:[]};
  const hits=matchAll(chs,f._E);
  let ok=false,ps=0,bad=false;const notes=[];
  for(const h of hits){
    if(h.e.cat==="ok")ok=true;
    else if(h.e.cat==="part"){const p=f.part[h.e.i];ps=Math.max(ps,p.s);if(!notes.includes(p.n))notes.push(p.n);}
    else if(h.e.cat==="bad"){bad=true;const n=f.bad[h.e.i].n;if(!notes.includes(n))notes.push(n);}
  }
  const s=bad?0:ok?1:ps;
  return{s,notes:s===1?[]:notes};
}
const STOP=new Set("der die das den dem des ein eine einen einem einer und oder mit ohne ca etwa bzw z b zb also auch noch nur sehr von vom im in an am auf zu zum zur ist sind wird werden the a an of to is are fuer per via als wie mal".split(" "));
function gMulti(f,raw){
  const chs=chunks(raw);
  if(!chs.length)return{s:0,empty:true,notes:[],hits:[]};
  const hits=matchAll(chs,f._E);
  const got=new Map(),badSet=new Map(),neuSet=new Map();
  for(const h of hits){
    if(h.e.cat==="it"){if(!got.has(h.e.i))got.set(h.e.i,h.txt);}
    else if(h.e.cat==="bad"){if(!badSet.has(h.e.i))badSet.set(h.e.i,[]);badSet.get(h.e.i).push(h);}
    else{if(!neuSet.has(h.e.i))neuSet.set(h.e.i,[]);neuSet.get(h.e.i).push(h);}
  }
  const out=[],notes=[];
  got.forEach((t,i)=>out.push({k:"y",txt:f.it[i].s}));
  badSet.forEach((hs,i)=>{hs.forEach(h=>out.push({k:"n",txt:h.ch.raw||h.txt}));notes.push(f.bad[i].n);});
  neuSet.forEach((hs,i)=>{hs.forEach(h=>out.push({k:"g",txt:h.ch.raw||h.txt}));notes.push(f.neu[i].n);});
  for(const ch of chs){if(!ch.m.some(Boolean)&&ch.t.some(t=>!STOP.has(t)))out.push({k:"u",txt:ch.raw+" (nicht erkannt)"});}
  const c=Math.min(got.size,f.n),w=badSet.size;
  return{s:Math.max(0,c-w)/f.n,notes,hits:out,c:got.size,w};
}

const UN={km:["len",1],kilometer:["len",1],m:["len",.001],meter:["len",.001],ft:["len",.0003048],feet:["len",.0003048],fuss:["len",.0003048],"fuß":["len",.0003048],nm:["len",1.852],sm:["len",1.852],
  lb:["wt",1],lbs:["wt",1],pfund:["wt",1],kg:["wt",2.20462],mm:["cal",1],cm:["cal",10],
  "°":["deg",1],grad:["deg",1],deg:["deg",1],"µm":["wl",1],um:["wl",1],mikrometer:["wl",1],
  "%":["pct",1],prozent:["pct",1],h:["time",1],std:["time",1],stunden:["time",1],stunde:["time",1],min:["time",1/60],
  kt:["spd",1],kn:["spd",1],knoten:["spd",1],"km/h":["spd",.539957],kmh:["spd",.539957]};
const UNAME={km:"km",kilometer:"km",m:"m",meter:"m",ft:"ft",feet:"ft",fuss:"ft","fuß":"ft",nm:"NM",sm:"NM",lb:"lb",lbs:"lb",pfund:"lb",kg:"kg",mm:"mm",cm:"cm","°":"°",grad:"°",deg:"°","µm":"µm",um:"µm",mikrometer:"µm","%":"%",prozent:"%",h:"h",std:"h",stunden:"h",stunde:"h",min:"min",kt:"kt",kn:"kt",knoten:"kt","km/h":"km/h",kmh:"km/h"};
function unitOf(u,d){
  if(u==="nm"&&d==="wl")return["wl",.001];
  return UN[u];
}
function parseNum(raw,defU){
  if(!/\d/.test(String(raw))&&/^\s*(null|keins?|keine|none|zero)\b/i.test(String(raw)))raw="0";
  let s=String(raw).toLowerCase().replace(/\bfl\s*(\d{2,3})\b/g,(m,n)=>(+n*100)+" ft");
  const re=/(\d{1,3}(?:[.\s]\d{3})+(?!\d)|\d+(?:[.,]\d+)?)\s*(k(?![gmnt]))?\s*(kilometer|km\/h|kmh|km|meter|mikrometer|µm|um|m|feet|ft|fuß|fuss|nm|sm|lbs|lb|pfund|kg|mm|cm|°|grad|deg|%|prozent|stunden|stunde|std|h|min|knoten|kt|kn)?(?![a-zß])/g;
  const out=[];let m;
  while((m=re.exec(s))){
    const ns=m[1];let v=/^\d{1,3}(?:[.\s]\d{3})+$/.test(ns)?+ns.replace(/[.\s]/g,""):+ns.replace(",",".");
    if(m[2])v*=1000;
    out.push({v,u:m[3]||null,i:m.index,end:m.index+m[0].length});
    if(re.lastIndex===m.index)re.lastIndex++;

  let a=out[0],v=a.v,u=a.u;

const nf=(x,d)=>Number(x).toLocaleString("de-DE",{maximumFractionDigits:d==null?1:d});
function gNum(f,raw){
  if(!String(raw).trim())return{s:0,empty:true,notes:[]};
  const p=parseNum(raw,f.u||null);
  if(!p)return{s:0,notes:["Keine Zahl erkannt."]};
  let x=p.v;
  if(f.d!=="cnt"){
    const U=unitOf(p.u,f.d);
    if(!U||U[0]!==f.d)return{s:0,notes:["Die Einheit passt nicht zur Frage."]};
    x=p.v*U[1];
  }
  let s;
  const tol=f.tol!=null?f.tol:.15;
  if(f.ranges){s=f.ranges.some(r=>x>=r[0]-1e-9&&x<=r[1]+1e-9)?1:0;}
  else{
    const lo=Array.isArray(f.v)?f.v[0]:f.v,hi=Array.isArray(f.v)?f.v[1]:f.v;
    const inB=k=>f.abs!=null?(x>=lo-f.abs*k-1e-9&&x<=hi+f.abs*k+1e-9):(x>=lo*(1-tol*k)-1e-9&&x<=hi*(1+tol*k)+1e-9);
    s=inB(1)?1:(f.d==="cnt"||f.nopart)?0:inB(2)?.5:0;
  }
  let interp="";
  if(f.d!=="cnt"){
    const un=UNAME[p.u]||p.u;
    interp="Erkannt: "+nf(p.v,un==="ft"?0:3)+" "+un;
    const fu=f.u&&UNAME[f.u];
    if(fu&&un!==fu){let y=x/unitOf(f.u,f.d)[1];if(fu==="ft")y=Math.round(y/100)*100;interp+=" ≈ "+nf(y,fu==="ft"?0:1)+" "+fu;}
  }
  return{s,interp,notes:s===.5?["Grob richtig, aber außerhalb der Toleranz von "+(f.abs!=null?"± "+nf(f.abs)+" "+(UNAME[f.u]||""):"± "+Math.round(tol*100)+" %")+"."]:[]};
}

    }).join("")+'</tr>';
  });
  h+='</tbody></table></div><p class="muted" style="font-size:.84rem;margin:6px 0 0">Zahl = zuletzt richtig beantwortet. Tippe auf ein Feld, um nur diesen Bereich zu üben.</p></section>';
  h+='<div class="foot"><p><b>So wird geprüft:</b> Zahlen mit Einheit eintippen (km, m, ft, FL, NM, lb, kg, mm, °, µm, %, h, kt) – ohne Einheit gilt die angezeigte. Merkwerte zählen mit ±15 % Toleranz. Begriffe dürfen Synonyme, Abkürzungen und kleine Tippfehler enthalten; bei russischen Systemen zählt die russische wie die NATO-Bezeichnung. Mehrere Antworten mit Komma trennen – jede falsche Nennung zieht eine richtige ab. Wird eine richtige Antwort nicht erkannt, tippst du auf „Als richtig werten“.</p><p>'+esc(syncLabel)+'</p>';
  h+='<p>Nachschlagen: <a href="../flugabwehr/">Flugabwehr-Trainer</a> · <a href="../manoever/">Manöver-Trainer</a> · <a href="../waffen/">Waffen-Trainer</a> · <a href="../pods/">Pod-Trainer</a> · <a href="../brevity/">Brevity-Trainer</a> · <a href="https://claude.ai/artifact/Vzk2Qy8udnfbJcAvjCMLSS" target="_blank" rel="noopener">Sensor-to-Shooter-Guide</a></p></div>';
  if(Object.keys(S.q).length)h+='<div class="resetrow" id="resetrow"><button class="linkbtn" data-act="askreset">Fortschritt zurücksetzen</button></div>';
  app.innerHTML=h;
}

function fieldHint(f){
  if(f.t==="num"){
    if(f.d==="cnt")return f.hint||"Nur die Zahl";
    const u=UNAME[f.u];
    if(f.d==="len")return "Einheit: "+u+" – auch "+["km","m","ft","NM"].filter(x=>x!==u).join(", ")+" oder FL möglich";
    if(f.d==="wt")return "Einheit: lb – auch kg möglich";
    if(f.d==="wl")return "Einheit: µm – auch nm möglich";
    if(f.d==="time")return "Einheit: Stunden";
    if(f.d==="spd")return "Einheit: kt – auch km/h möglich";
    return "Einheit: "+u;
  }
  if(f.t==="multi")return "Mehrere mit Komma trennen";
  return f.hint||"";
}
function renderQ(){
  const q=byId(sess.ids[sess.i]);
  const ph=f=>f.t==="num"?(f.d==="cnt"?"Zahl":"Zahl + Einheit"):f.t==="multi"?"Antwort 1, Antwort 2 …":"Antwort";
  let h='<div class="qmeta"><span class="chip-cat">'+esc(TOP[q.top].l)+'</span><span>Stufe '+q.lv+' · '+LVL[q.lv].n+'</span></div>';
  if(q.lage)h+='<div class="lage"><div class="lh">Lage</div><p>'+esc(q.lage)+'</p></div>';
  h+='<h2 class="prompt">'+esc(q.q)+'</h2><form id="qf" novalidate>';
  q.f.forEach((f,k)=>{
    const id="f-"+q.id+"-"+k,hint=fieldHint(f);
    h+='<div class="fld"><label for="'+id+'">'+esc(f.l)+'</label><input class="inp" id="'+id+'" data-k="'+k+'" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="'+(k<q.f.length-1?"next":"done")+'" placeholder="'+ph(f)+'">'+(hint?'<div class="fhint">'+esc(hint)+'</div>':'')+'<div id="r-'+k+'"></div></div>';
  });
  h+='<div class="row" id="actrow"><button type="submit" class="btn main">Prüfen</button><button type="button" class="btn" data-act="skip">Lösung zeigen</button></div></form><div id="fbox" aria-live="polite"></div>';
  app.innerHTML=h;
  const first=app.querySelector(".inp");if(first&&window.matchMedia("(hover:hover)").matches)first.focus({preventScroll:true});
  document.getElementById("qf").addEventListener("submit",e=>{e.preventDefault();check(false);});
  app.querySelectorAll(".inp").forEach((inp,k,all)=>inp.addEventListener("keydown",e=>{
    if(e.key==="Enter"&&!view.checked&&k<all.length-1&&!all[k+1].value.trim()){e.preventDefault();all[k+1].focus();}
  }));
}
function check(giveUp){
  if(view.checked)return;
  const q=byId(sess.ids[sess.i]);
  const inputs=[...app.querySelectorAll(".inp")];
  const vals=inputs.map(i=>i.value);
  if(!giveUp&&vals.every(v=>!v.trim())){inputs[0].focus();document.getElementById("fbox").innerHTML='<div class="fb" style="--c:var(--unk)"><p>Gib zuerst eine Antwort ein – oder tippe auf „Lösung zeigen“.</p></div>';return;}
  const res=q.f.map((f,k)=>giveUp?{s:0,notes:[],skipped:true}:grade(f,vals[k]));
  view.checked=true;view.res=res;view.override=false;
  inputs.forEach(i=>i.readOnly=true);
  document.getElementById("actrow").hidden=true;
  q.f.forEach((f,k)=>{
    const r=res[k],s=st(r.s),[c,cb]=colOf(s);
    let h='<div class="fres" style="--c:'+c+';--cb:'+cb+'"><span class="st">'+(r.skipped?"Lösung":s==="ok"?"Richtig":s==="mid"?"Teilweise":"Falsch")+'</span>';
    if(r.interp)h+=' <span class="interp">· '+esc(r.interp)+'</span>';
    if(r.hits&&r.hits.length)h+='<ul class="hitlist">'+r.hits.map(x=>'<li class="'+x.k+'">'+esc(x.txt)+'</li>').join("")+'</ul>';
    if(f.t==="multi"&&!r.skipped&&!r.empty)h+='<div class="interp">'+Math.min(r.c,f.n)+' von '+f.n+' erkannt'+(r.w?', '+r.w+' falsch':'')+'</div>';
    if(s!=="ok"||f.t==="multi")h+='<div class="sol">'+(s==="ok"?"Weitere richtige: ":"Richtig: ")+'<b>'+esc(f.show)+'</b></div>';
    if(r.notes&&r.notes.length)h+='<ul>'+r.notes.map(n=>'<li>'+esc(n)+'</li>').join("")+'</ul>';
    h+='</div>';
    document.getElementById("r-"+k).innerHTML=h;
  });
  finish(q);
}
function qScore(){return view.override?1:view.res.reduce((a,r)=>a+r.s,0)/view.res.length;}
function finish(q){
  const sc=qScore(),s=st(sc),[c]=colOf(s);
  sess.res[q.id]=sc;
  const prev=S.q[q.id]||{n:0,best:0};
  S.q[q.id]={last:sc,best:Math.max(prev.best||0,sc),n:(prev.n||0)+(view.override?0:1),ts:Date.now()};
  save();
  const last=sess.i>=sess.ids.length-1;
  document.getElementById("fbox").innerHTML='<div class="fb" style="--c:'+c+'"><div class="v">'+(view.override?"Als richtig gewertet":s==="ok"?"Richtig":s==="mid"?"Teilweise richtig":"Falsch")+'</div><p>'+esc(q.ex)+'</p><div class="row"><button class="btn main" data-act="next" id="nextbtn">'+(last?"Ergebnis anzeigen":"Weiter →")+'</button>'+(sc<.999&&!view.res.every(r=>r.skipped)?'<button class="btn" data-act="override">Als richtig werten</button>':'')+'</div></div>';
  bar();
  const nb=document.getElementById("nextbtn");if(nb)nb.focus({preventScroll:true});
}
function renderEnd(){
  const ids=sess.ids,tot=ids.reduce((a,id)=>a+(sess.res[id]||0),0);
  const pct=tot/ids.length,s=st(pct),[c]=colOf(s);
  let h='<div class="score" style="color:'+c+'">'+fmtPts(tot)+'<small> / '+ids.length+'</small></div><p class="muted">'+Math.round(pct*100)+' % · '+esc(sess.label)+'</p>';
  h+='<ul class="reslist">'+ids.map(id=>{const q=byId(id),r=sess.res[id]||0;
    return '<li><span class="pts" data-s="'+st(r)+'">'+Math.round(r*100)+' %</span><span>'+esc(q.q)+'<small>'+esc(TOP[q.top].l)+' · Stufe '+q.lv+'</small></span></li>';}).join("")+'</ul>';
  const wrong=ids.filter(id=>(sess.res[id]||0)<.999);
  h+='<div class="row">'+(wrong.length?'<button class="btn main" data-act="redo">'+wrong.length+' Fehler wiederholen</button>':'')+'<button class="btn'+(wrong.length?'':' main')+'" data-act="again">Nächste Runde</button><button class="btn" data-act="home">Übersicht</button></div>';
  app.innerHTML=h;
}

function go(v){view=v;render();window.scrollTo(0,0);}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  const a=b.dataset.act;
  if(a==="home")go({v:"home"});
  else if(a==="topic"){
    const t=b.dataset.t,i=S.topics.indexOf(t);
    if(i>=0)S.topics.splice(i,1);else S.topics.push(t);
    S.topics.sort((x,y)=>TOP_ORDER.indexOf(x)-TOP_ORDER.indexOf(y));save();renderHome();
  }
  else if(a==="size"){S.size=+b.dataset.n;save();renderHome();}
  else if(a==="lvl"){const lv=+b.dataset.l;startSess(pool(lv),"Stufe "+lv);sess.src={lv};}
  else if(a==="mix"){startSess(pool(null),"Gemischt");sess.src={};}
  else if(a==="wrong"){startSess(wrongPool(),"Fehler");if(sess)sess.src={wrong:1};}
  else if(a==="cell"){const t=b.dataset.t,lv=+b.dataset.l;startSess(pool(lv,t),TOP[t].s+" · Stufe "+lv);if(sess)sess.src={lv,t};}
  else if(a==="skip")check(true);
  else if(a==="override"){view.override=true;finish(byId(sess.ids[sess.i]));}
  else if(a==="next"){if(sess.i>=sess.ids.length-1)go({v:"end"});else{sess.i++;go({v:"q",checked:false});}}
  else if(a==="redo"){const w=sess.ids.filter(id=>(sess.res[id]||0)<.999).map(byId);const src=sess.src;startSess(w,"Fehler",true);sess.src=src;}
  else if(a==="again"){
    const src=sess.src||{},label=sess.label;
    const list=src.wrong?wrongPool():src.t?pool(src.lv,src.t):pool(src.lv==null?null:src.lv);
    if(list.length){startSess(list,src.wrong?"Fehler":label);sess.src=src;}else go({v:"home"});
  }
  else if(a==="askreset"){const row=document.getElementById("resetrow");if(row)row.innerHTML='<span>Gesamten Fortschritt löschen?</span><button class="btn" data-act="doreset">Löschen</button><button class="btn" data-act="noreset">Abbrechen</button>';}
  else if(a==="doreset"){const t=S.topics,z=S.size;S=blank();S.topics=t;S.size=z;save();renderHome();}
  else if(a==="noreset")renderHome();
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&view.v==="q"&&view.checked&&!e.target.closest("button")){e.preventDefault();const nb=document.getElementById("nextbtn");if(nb)nb.click();}
});
render();
})();
</script>
<script src="../assets/app.js" defer></script>
</body>
