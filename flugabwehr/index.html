<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Flugabwehr-Trainer</title>
<meta name="theme-color" content="#E4E9E7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1517" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="JTAC">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/app.css">
<style>
:root{
  --bg:#E4E9E7; --surface:#F4F7F5; --surface2:#E9EEEC; --ink:#1A2326; --muted:#55615F; --line:#C3CCC9;
  --ok:#2A7848; --ok-bg:#DCEEE2; --bad:#B0382B; --bad-bg:#F6DEDA; --unk:#7A6A2E; --unk-bg:#F1E9CF;
  --cta:#E0A526; --cta-ink:#1A2326; --feed:#0B1113; --hud:#F2B632;
  --font-d:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --font-b:"Barlow","Segoe UI",system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1517; --surface:#172022; --surface2:#1D282B; --ink:#E1E7E5; --muted:#93A09D; --line:#2A3639;
    --ok:#56B57F; --ok-bg:#16301F; --bad:#E36D5E; --bad-bg:#3A1C18; --unk:#D9C17A; --unk-bg:#2E2913;
    --cta:#E3AA2E; --cta-ink:#111719; --feed:#06090A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1517; --surface:#172022; --surface2:#1D282B; --ink:#E1E7E5; --muted:#93A09D; --line:#2A3639;
  --ok:#56B57F; --ok-bg:#16301F; --bad:#E36D5E; --bad-bg:#3A1C18; --unk:#D9C17A; --unk-bg:#2E2913;
  --cta:#E3AA2E; --cta-ink:#111719; --feed:#06090A; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--cta);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:12px 18px 48px}
h1,h2,h3{font-family:var(--font-d);line-height:1.1;margin:0}
h2{font-size:1.45rem;font-weight:600;letter-spacing:.005em}
h3{font-size:1.25rem;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.875rem}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:720px;margin:0 auto;padding:8px 18px;display:flex;align-items:center;gap:12px;min-height:52px}
.bar .t{font-family:var(--font-d);font-weight:600;font-size:1.2rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:40px;height:40px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:500}
.prog{height:3px;background:var(--line)}
.prog>i{display:block;height:100%;background:var(--cta);transition:width .25s}

/* home */
.hero{padding:28px 0 20px}
.hero h1{font-size:clamp(3rem,13vw,5.2rem);font-weight:700;letter-spacing:-.015em;line-height:.9}
.hero p{max-width:34em;margin:12px 0 0;color:var(--muted);font-size:1.05rem}
.board{margin:8px 0 24px}
.board-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.cells{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.board h3{font-size:1.05rem;color:var(--muted);margin:14px 0 6px;letter-spacing:.04em;text-transform:uppercase}
@media (min-width:600px){.cells{grid-template-columns:repeat(8,minmax(0,1fr))}}
.cell{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 8px 12px;min-height:66px;overflow:hidden}
.cell b{display:block;font-family:var(--font-d);font-weight:700;font-size:1.25rem;line-height:1}
.cell span{display:block;font-size:.72rem;color:var(--muted);line-height:1.2;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell i{position:absolute;left:0;bottom:0;height:5px;background:var(--line)}
.cell[data-s="bad"] i{background:var(--bad)} .cell[data-s="mid"] i{background:var(--cta)} .cell[data-s="ok"] i{background:var(--ok)}
.cell[data-s="none"]{border-style:dashed}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:.8rem;color:var(--muted)}
.legend em{font-style:normal;display:inline-flex;align-items:center;gap:5px}
.legend em::before{content:"";width:12px;height:5px;background:var(--c)}
.cta{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;background:var(--cta);color:var(--cta-ink);border:0;border-radius:10px;padding:16px 18px;text-align:left}
.cta strong{font-family:var(--font-d);font-size:1.5rem;font-weight:700;display:block;line-height:1.05}
.cta small{display:block;font-size:.9rem;opacity:.85}
.cta .go{font-family:var(--font-d);font-size:1.6rem;font-weight:700}
.modes{margin-top:22px;border-top:1px solid var(--line)}
.mode{display:flex;width:100%;gap:14px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 2px}
.mode .mi{flex:1}
.mode strong{display:block;font-family:var(--font-d);font-size:1.3rem;font-weight:600;line-height:1.1}
.mode small{display:block;color:var(--muted);font-size:.9rem;margin-top:2px}
.mode .n{font-family:var(--font-d);font-size:1.1rem;color:var(--muted);white-space:nowrap}
.mode:hover strong{text-decoration:underline;text-underline-offset:3px}
.foot{margin-top:28px;font-size:.82rem;color:var(--muted);max-width:40em}

/* feed */
.feed{position:relative;margin:0;background:var(--feed);border-radius:10px;overflow:hidden;aspect-ratio:4/3;cursor:zoom-in}
.feed img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.feed svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.feed .hud{position:absolute;font-family:var(--font-d);font-weight:600;font-size:.8rem;letter-spacing:.06em;color:var(--hud);opacity:.85;text-shadow:0 1px 2px #000}
.feed .hud.tl{top:10px;left:14px} .feed .hud.tr{top:10px;right:14px} .feed .hud.bl{bottom:10px;left:14px}
.feed .nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:1.4rem;display:flex;align-items:center;justify-content:center;pointer-events:auto}
.feed .nav.l{left:8px} .feed .nav.r{right:8px}

/* quiz */
.qmeta{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 10px;font-size:.9rem;color:var(--muted)}
.prompt{font-family:var(--font-d);font-size:1.55rem;font-weight:600;line-height:1.15;margin:14px 0 14px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;line-height:1.35}
.opt .k{flex:none;width:26px;height:26px;border-radius:6px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-weight:700;color:var(--muted);font-size:.95rem}
.opt:not([disabled]):hover{border-color:var(--ink)}
.opt[disabled]{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)} .opt.correct .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)} .opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.fb{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c,var(--ok));border-radius:10px;padding:14px 16px}
.fb .v{font-family:var(--font-d);font-size:1.35rem;font-weight:700;color:var(--c)}
.fb p{margin:6px 0 0}
.profile{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.profile h3 small{font-family:var(--font-b);font-size:.85rem;font-weight:500;color:var(--muted);margin-left:6px}
.kv{display:grid;grid-template-columns:7.5em 1fr;gap:4px 12px;margin:10px 0 0;font-size:.94rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;padding:0;list-style:none}
.chips li{font-size:.82rem;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--surface2);border:1px solid var(--line)}
.chips li[data-v="1"]{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.chips li[data-v="0"]{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.chips li[data-v="?"]{background:var(--unk-bg);border-color:var(--unk);color:var(--unk)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:10px 14px;font-weight:600}
.btn.main{background:var(--ink);color:var(--bg);border-color:var(--ink);flex:1;min-width:9em}
.btn.flagged{border-color:var(--bad);color:var(--bad)}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-weight:600}

/* end */
.score{font-family:var(--font-d);font-size:5rem;font-weight:700;line-height:.9;margin:24px 0 4px}
.misslist{list-style:none;padding:0;margin:12px 0 0;border-top:1px solid var(--line)}
.misslist li{padding:10px 0;border-bottom:1px solid var(--line)}

/* cards list */
.group{margin-top:24px}
.group h2{margin-bottom:6px}
.fam{display:flex;width:100%;align-items:center;gap:12px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 2px}
.fam .code{font-family:var(--font-d);font-weight:700;font-size:1.1rem;width:3em;color:var(--muted)}
.fam .nm{flex:1;font-weight:600}
.fam .pct{font-family:var(--font-d);font-size:1.05rem;color:var(--muted)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch}
.sheet[hidden]{display:none}
.sec{margin-top:18px}
.sec h3{font-size:1.1rem;margin-bottom:4px}
.sec ul{margin:4px 0 0;padding-left:1.15em}
.sec li{margin:2px 0}
.desig{font-size:.95rem;color:var(--muted);margin-top:4px}
.bw{margin-top:12px;border-left:4px solid var(--cta);background:var(--surface);padding:8px 12px;border-radius:0 8px 8px 0;font-size:.95rem}
.lightbox{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:12px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}

/* stats */
.stat-top{display:flex;gap:28px;margin:18px 0 6px}
.stat-top b{display:block;font-family:var(--font-d);font-size:2.4rem;line-height:1}
.srow{display:grid;grid-template-columns:8.5em 1fr 4.2em;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.94rem}
.sbar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.sbar i{display:block;height:100%}
textarea{width:100%;min-height:120px;font:inherit;font-size:.85rem;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
.sync{font-size:.8rem;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.foot a{color:var(--ink);text-underline-offset:3px}
.annobox{margin-top:12px}
.annobox #annoarea{margin-top:12px}
.anno{position:relative;margin:0;max-width:100%;border-radius:10px;overflow:hidden;background:var(--feed);cursor:zoom-in}
.anno img{display:block;width:100%;height:100%;object-fit:cover}
.anno .pin{position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:var(--hud);color:#111;border:2px solid #111;font-family:var(--font-d);font-weight:700;font-size:.95rem;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.6);pointer-events:none}
.legendlist{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:6px}
.legendlist li{display:flex;gap:10px;align-items:flex-start;font-size:.94rem;line-height:1.35}
.legendlist b{flex:none;width:22px;height:22px;border-radius:50%;background:var(--hud);color:#111;font-family:var(--font-d);font-size:.85rem;display:flex;align-items:center;justify-content:center;margin-top:1px}
.unitrow{margin-top:10px}
.unitrow strong{font-family:var(--font-d);font-size:1.08rem;font-weight:600}
.unitrow .chips{margin-top:4px}
.vbox{margin-top:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.vbox h4{margin:0;font-family:var(--font-d);font-size:1.2rem;font-weight:600}
.vbox .kv{grid-template-columns:6.8em 1fr}
.sec h3 + .vbox{margin-top:6px}
.imgcap{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:8px}
.vlabel{font-family:var(--font-d);font-weight:700;font-size:1.25rem;background:var(--ink);color:var(--bg);border-radius:6px;padding:2px 10px}
.vlabel.none{background:var(--surface2);color:var(--muted);font-weight:600;font-size:1rem}
.capbtns{display:flex;gap:6px;flex-wrap:wrap}
.btn.sm{padding:6px 10px;font-size:.88rem}
.pinwrap{margin-top:10px}
.fam.sub{padding-left:18px;background:var(--surface)}
.fam.sub .nm{font-weight:600}
.unitrow.cur{border-left:4px solid var(--cta);padding-left:8px}
.tag{font-family:var(--font-b);font-size:.75rem;font-weight:600;background:var(--cta);color:var(--cta-ink);border-radius:999px;padding:1px 8px;vertical-align:middle}
.guide-link{display:flex;gap:14px;align-items:center;margin-top:18px;padding:14px 16px;border:1px solid var(--line);border-left:4px solid var(--cta);border-radius:10px;background:var(--surface);color:var(--ink);text-decoration:none}.guide-link .mi{flex:1}.guide-link strong{display:block;font-family:var(--font-d);font-size:1.3rem;font-weight:600;line-height:1.1}.guide-link small{display:block;color:var(--muted);font-size:.9rem;margin-top:2px}.guide-link .n{font-family:var(--font-d);font-size:1.1rem;color:var(--muted);white-space:nowrap}.guide-link:hover strong{text-decoration:underline;text-underline-offset:3px}
.foot a{color:var(--ink);text-underline-offset:3px}
</style>
<style>
.cmpwrap{margin-top:8px}
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cmpfig{margin:0;min-width:0}
.cmpfig>.ctag{display:inline-block;margin-bottom:4px;background:var(--ink);color:var(--bg);font-family:var(--font-d);font-weight:700;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;padding:1px 8px;border-radius:5px}
.cmpbox{display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;max-width:100%;background:var(--feed);border-radius:8px;overflow:hidden;cursor:zoom-in}
.cmpin{position:relative;max-height:100%}
.cmpin img{display:block;width:100%;height:100%;object-fit:cover}
.cmpin .pin{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:var(--hud);color:#111;border:2px solid #111;font-family:var(--font-d);font-weight:700;font-size:.85rem;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.6);pointer-events:none}
.czoom{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-height:100%}
.czoom .cmpin{max-width:100%}
.czoom .pin{width:28px;height:28px;font-size:1rem}
.czcap{margin:0;color:#eee;font-size:.92rem;line-height:1.35;display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;max-width:720px}
.czcap b{width:100%;text-align:center;font-family:var(--font-d);font-size:1.05rem}
.czcap i{font-style:normal;font-weight:700;display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--hud);color:#111;margin-right:6px;font-size:.8rem}
.cmpfig figcaption{margin-top:6px;font-size:.88rem;line-height:1.3}
.cmpfig figcaption>b{font-family:var(--font-d);font-size:1.02rem;font-weight:600}
.cmpfig .legendlist{margin-top:4px;gap:4px}
.cmpfig .legendlist li{font-size:.84rem;gap:6px}
.cmpfig .legendlist b{width:19px;height:19px;font-size:.78rem}
.vbox h4 .nato{display:inline-block;vertical-align:middle;margin-left:4px;background:var(--ink);color:var(--bg);font-family:var(--font-d);font-weight:600;font-size:.8rem;letter-spacing:.02em;padding:1px 7px;border-radius:5px}
.cmpkey{margin:10px 0 0;padding:8px 12px;border-left:4px solid var(--cta);background:var(--surface);border-radius:0 8px 8px 0;font-size:.95rem}
</style>
</head>

<header class="bar" id="bar"><div class="bar-in" id="barin"></div><div class="prog" id="prog" hidden><i></i></div></header>
<main class="wrap" id="app" aria-live="polite"></main>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>
<script>
const DATA = {"title":"Flugabwehr-Trainer","key":"flugabwehrtrainer.v1","intro":"Luftverteidigung der Kräfte Rot aus Sicht von JTAC und Lfz: System erkennen, auch aus der Drohne, Bekämpfungszone in Entfernung und Höhe kennen, wissen, ob dein Radarwarner warnt, Radare den Systemen zuordnen und richtig reagieren.","airAsk":"name","cats":{"aag":{"label":"Fla-Kanone (gezogen bzw. auf Fahrzeug)","cap":"Optisch gerichtete Zwillingskanone ohne Radar – Gefahr im Nahbereich"},"spaag":{"label":"Fla-Panzer mit Rohrwaffen","cap":"Kettenfahrzeug mit radargelenkten Fla-Kanonen – Nahbereich bis ca. 2,5 km"},"spaagm":{"label":"Kanonen-Raketen-Flugabwehrsystem","cap":"Kombiniert Maschinenkanonen und Lenkflugkörper – deckt Nah- und Kurzstrecke ab"},"shorad":{"label":"Kurzstrecken-Fla-Raketensystem (SHORAD)","cap":"Fla-Raketen bis ca. 15 km Entfernung und 10 km Höhe – begleitet die Manövertruppe"},"manpads":{"label":"Schultergestützte Fla-Rakete (MANPADS)","cap":"Infrarotgelenkt und vom Soldaten getragen – überall möglich, keine Radarwarnung"},"mr":{"label":"Mittelstrecken-Fla-Raketensystem","cap":"Bekämpft Ziele bis ca. 25–120 km und in großer Höhe – mehrere Fahrzeuge im Verbund"},"lr":{"label":"Langstrecken-Fla-Raketensystem","cap":"Bekämpft Lfz bis 100–400 km – Bataillon aus Radaren, Gefechtsstand und Startfahrzeugen"},"radar":{"label":"Such- bzw. Frühwarnradar","cap":"Entdeckt Luftziele auf große Entfernung und weist die Fla-Raketen ein"}},"catOrder":["aag","spaag","spaagm","shorad","manpads","mr","lr","radar"],"catExcl":{"aag":["spaag"],"spaag":["spaagm","aag"],"spaagm":["spaag","shorad"],"shorad":["spaagm"],"mr":["lr"],"lr":["mr"]},"catX":{},"rwr":{"radar":"Ja – Such- und Feuerleitradar sind auf dem RWR sichtbar, der Flugkörper wird per Radar geführt","mix":"Nicht sicher – das Radar warnt, aber das System kann auch rein optisch bzw. mit Wärmebild zielen und schießen","ir":"Nein – passive Infrarotlenkung ohne Radar; nur ein Raketenwarner (MAWS) erkennt den Start","none":"Nein – o  Feuerleitung.","Ein Frühwarnradar heißt: Die Fla-Raketen werden früh eingewiesen.","Hochwertziel für SEAD/DEAD."],"vars":[{"v":null,"name":"Nebo-SVU / Nebo-M","rwr":null,"sight":"VHF-Radar mit sehr großer Reichweite."}],"chip":"Nebo"},{"id":"kasta","name":"Kasta-2E2 / Flat Face E","short":"KAS","cat":"radar","wcls":"arm","designation":"39N6 Kasta-2E2 / Flat Face E – Rundsuchradar gegen Tiefflieger, Hubschrauber und Marschflugkörper; Antenne auf hohem Mast","users":"Russland u. a.","weapons":["Keine Waffen – entdeckt tief fliegende Ziele früh und weist Fla-Systeme ein"],"protection":"Ungepanzert.","weak":"Antenne auf dem Mast, strahlt – Ziel für Anti-Radar-Flugkörper.","recog":"Langgezogene Parabolantenne auf hohem Mast, Kabinen auf Lkw.","confuse":["nebo","s300p"],"jtac":["Gerade für Hubschrauber und Tiefflug gefährlich: Der Mast vergrößert den Radarhorizont.","Arbeitet mit S-300/S-400 und Kurzstreckensystemen zusammen.","Hochwertziel für SEAD/DEAD."],"vars":[{"v":null,"name":"Kasta-2E2 / Flat Face E","rwr":null,"sight":"Rundsuchradar auf Mast gegen Tiefflieger."}],"chip":"Flat Face E"}],"airNotes":{"dr_006_strela10":"Drohne von schräg oben: MT-LB-Wanne mit Startgestell – rechts der Treffer.","dr_007_strela10":"Drohne von oben: getarntes Kettenfahrzeug mit Startgestell im Gebüsch, kleines Bild: Treffer.","dr_011_osa":"Drohne von schräg oben: 6×6-Radfahrzeug mit Turm und Radar auf einem Feldweg.","dr_009_torm2":"Drohnenbild: Kettenfahrzeug mit hohem, kastigem Turm und flacher Radarplatte oben.","dr_002_tor_luft":"Wärmebild bei Nacht: Fla-Fahrzeug mit hohem Turm und Radar auf einem Tieflader.","dr_008_tor_luft":"Wärmebild von oben: Kettenfahrzeug mit hohem Turm, daneben ein anfliegender Flugkörper.","dr_010_tor_luft":"Drohne aus großer Höhe: einzelnes Kettenfahrzeug mit hohem Turm auf einem Feld voller Fahrspuren.","wm_042_buk_luft":"Luftbild senkrecht von oben: Kettenfahrzeug mit großer aufgerichteter Radarantenne – Suchradar 9S18.","dr_003_buk_luft":"Wärmebild: Kettenfahrzeug mit Drehstarter und großem Radar vorn am Turm.","dr_004_buk_luft":"Drohne von schräg oben: Kettenfahrzeug mit aufgerichtetem Starter am Waldrand, daneben eine Explosion.","dr_012_s300p_luft":"Aufklärungsdrohne aus großer Höhe: Fahrzeuge einer Fla-Raketen-Stellung, teils brennend – nur die Anordnung ist erkennbar.","dr_013_s400_luft":"Wärmebild aus nächster Nähe: Startfahrzeug mit großen Kanistern.","wm_064_s400_tel":"Wärmebild einer Drohne: Startfahrzeug mit großen Kanistern auf einer Straße.","dr_019_s400_91n6":"Wärmebild: großes Radar auf Fahrgestell, daneben ein Lkw – Rundsuchradar 91N6."},"curated":[["t-1","gen","Du fliegst in 5 km Höhe. Welche Systeme erreichen dich dort nicht mehr?",["ZU-23-2, ZSU-23-4 Shilka, Strela-10 (SA-13) und MANPADS (SA-18/24/29)","Pantsir (SA-22) und Tor (SA-15)","Buk (SA-11/17/27) und S-400 (SA-21)","Keines – alle reichen höher"],"Rohrwaffen enden bei ca. 1,5–4 km Höhe, Strela-10 / SA-13 bei ca. 3,5 km, MANPADS bei ca. 3,5–4,5 km. Pantsir / SA-22, Tor / SA-15, Buk und die Langstreckensysteme reichen deutlich höher."],["t-2","manpads","Bis in welche Höhe musst du mit MANPADS (Igla-S / SA-24, Verba / SA-29) rechnen?",["Bis ca. 3,5–4,5 km","Bis ca. 1 km","Bis ca. 10 km","Bis ca. 20 km"],"Igla-S / SA-24 Grinch erreicht ca. 3,5 km, Verba / SA-29 Gizmo ca. 4,5 km Höhe – bei ca. 5–6 km Entfernung."],["t-3","pantsir","Ein Pantsir-S1 / SA-22 Greyhound schützt ein Ziel. Reicht ein Hellfire-Angriff aus 8 km Entfernung?",["Nein – seine Lenkflugkörper reichen bis ca. 20 km; erst das Fla-System ausschalten oder umgehen","Ja – der Pantsir reicht nur 4 km","Ja, wenn du tief fliegst","Ja – der Pantsir bekämpft nur Drohnen"],"Die Kanonen reichen ca. 4 km, die Lenkflugkörper ca. 20 km (Pantsir-SM ca. 40 km). Mit 8 km bist du mitten in der Bekämpfungszone der SA-22."],["t-4","gen","Was bedeutet WEZ?",["Weapon Engagement Zone – der Raum, in dem ein System dich bekämpfen kann (Entfernung und Höhe)","Waffenwirkungszone deiner eigenen Bombe","Warnzone für eigene Truppen","Der Bereich, in dem ein Radar dich nur entdeckt"],"Die WEZ beschreibt, wo ein Fla-System ein Ziel bekämpfen kann. Die Entdeckungsreichweite der Radare ist meist deutlich größer."],["t-5","tor","Warum ist der Tor / SA-15 Gauntlet auch für Präzisionswaffen eine Gefahr?",["Er fängt anfliegende Lenkbomben, Flugkörper und Drohnen ab","Er stört GPS","Er blendet Laser","Er macht Ziele im Wärmebild unsichtbar"],"Die SA-15 wurde gezielt gegen kleine, schnelle Ziele entwickelt und schützt wichtige Objekte vor Präzisionswaffen. Mehrere Waffen gleichzeitig oder vorheriges Ausschalten einplanen."],["t-6","s400","Ein S-400-Bataillon (SA-21 Growler) steht 80 km entfernt. Was bedeutet das für deinen CAS-Einsatz?",["Hoch fliegende Lfz sind in Reichweite – Geländeabdeckung, Abstand oder vorherige SEAD/DEAD nötig","Nichts – 80 km sind zu weit","Nur Hubschrauber sind gefährdet","Nur nachts gefährlich"],"Mit 48N6 reicht die SA-21 ca. 250 km weit. Tief fliegende Ziele entdeckt sie wegen des Radarhorizonts erst spät – Höhe ist hier der Feind."],["t-7","gen","Warum fliegen Hubschrauber bei SHORAD-Bedrohung oft im Tiefflug?",["Geländeabdeckung: Radare sehen nicht hinter Hügel und Wald, die Bekämpfungszeit wird kurz","Im Tiefflug ist man im Wärmebild unsichtbar","Fla-Raketen können nicht nach unten zielen","MANPADS funktionieren dort nicht"],"Radar und Sicht brauchen eine freie Linie zum Ziel. Rohrwaffen und MANPADS bleiben im Tiefflug aber gefährlich – deshalb Gelände nutzen und Muster vermeiden."],["r-1","strela10","Dein RWR bleibt still. Bist du sicher vor Strela-10 / SA-13 Gopher und MANPADS?",["Nein – beide sind infrarotgelenkt ohne Radar; nur ein Raketenwarner erkennt den Start","Ja – ohne RWR-Warnung kein Beschuss","Ja, aber nur nachts","Nein, aber nur bei Regen"],"Infrarotgelenkte Systeme senden nichts aus. Erst der Raketenwarner (MAWS) erkennt das Raketentriebwerk."],["r-2","gen","Welche Systeme können dich bekämpfen, ohne dass dein RWR sicher warnt?",["Strela-10 (SA-13), MANPADS und ZU-23 – dazu Pantsir (SA-22), Tor (SA-15), Osa (SA-8) und Tunguska (SA-19) im optischen Modus","Nur die S-400 (SA-21)","Nur der Buk (SA-11/17/27)","Keines"],"Infrarot- und optisch gerichtete Systeme strahlen nicht. Pantsir, Tor, Osa und Tunguska können ihr Ziel auch optisch bzw. mit Wärmebild verfolgen."],["r-3","buk","Warum warnt dein RWR beim Buk (SA-11/17/27) zuverlässig?",["Halbaktive Radarlenkung – das Feuerleitradar muss dich bis zum Treffer beleuchten","Der Buk sendet ein Warnsignal","Weil er Infrarot nutzt","Er warnt gar nicht"],"Der Suchkopf des Buk-Lenkflugkörpers empfängt die Reflexion der Beleuchtung durch das TELAR-Radar (Fire Dome). Diese Beleuchtung erkennt dein RWR."],["r-4","gen","Was hilft gegen einen infrarotgelenkten Flugkörper?",["Flares, DIRCM, Höhe und Abstand, Sonne und Gelände nutzen","Chaff","Funkstörung","Langsamer fliegen"],"Chaff wirkt gegen Radar, nicht gegen Infrarot. Gegen IR helfen Flares, DIRCM (Laserstörer) und vor allem: außerhalb der Reichweite bleiben."],["r-5","gen","Was hilft gegen einen radargelenkten Flugkörper?",["Chaff, Störsender, Manöver quer zur Radarkeule, Geländeabdeckung","Flares","Licht aus","Steigflug in große Höhe"],"Gegen Radar helfen Chaff, Störsender und Manöver, die den Doppler-Effekt ausnutzen (quer zur Keule). Geländeabdeckung unterbricht die Radarverbindung."],["e-1","s400","Die Aufklärung meldet ein Feuerleitradar 92N6 / Grave Stone. Was folgt daraus?",["Eine S-400-Feuereinheit (SA-21) mit Startfahrzeugen ist in der Nähe","Nur ein einzelnes Radar ohne Waffen","Ein Artillerieortungsradar","Eine Buk-Batterie (SA-11/17/27)"],"Das 92N6 / Grave Stone führt die Lenkflugkörper der SA-21. Die Startfahrzeuge stehen meist im Umkreis weniger km."],["e-2","gen","Welches Element einer Fla-Raketen-Batterie hat bei SEAD/DEAD meist die höchste Priorität?",["Das Feuerleitradar – ohne es keine Lenkung","Der Ersatzteil-Lkw","Die Startfahrzeuge in Marschlage","Der Stromerzeuger"],"Ohne Feuerleitradar (Flap Lid, Grave Stone) können SA-10/20, SA-21 und S-350 keine Lenkflugkörper führen. Ausnahmen mit eigenem Radar am Startfahrzeug sind Buk-TELAR und S-300V 9A83."],["e-3","s300v","Was unterscheidet den Starter 9A83 der S-300V / SA-12 vom 9A82?",["9A83: vier Kanister und eigenes Feuerleitradar am Mast – 9A82: zwei sehr große Kanister","Der 9A82 fährt auf Rädern, der 9A83 auf Ketten","Kein Unterschied","Der 9A83 ist ein Radar ohne Kanister"],"Beide stehen auf demselben schweren Kettenfahrgestell. Der 9A83 trägt die 9M83 (SA-12A Gladiator), der 9A82 die großen 9M82 (SA-12B Giant) für größere Reichweite und gegen ballistische Raketen."],["e-4","nebo","Wofür dient ein Nebo-M?",["Frühwarnung auf große Entfernung, auch gegen Ziele mit geringer Radarsignatur – zu ungenau für die Feuerleitung","Feuerleitung für den Pantsir","Artillerieortung","Störung von Funk"],"VHF-Radare wie Nebo erkennen auch Ziele mit kleiner Radarsignatur früh, aber ungenau. Sie weisen Fla-Raketen und Jäger ein."],["e-5","kasta","Warum steht die Antenne des Kasta-2E2 / Flat Face E auf einem hohen Mast?",["Größerer Radarhorizont – entdeckt Tiefflieger und Hubschrauber früher","Schutz vor Diebstahl","Damit sie im Wärmebild unsichtbar ist","Für Satellitenfunk"],"Je höher die Antenne, desto weiter reicht die Sicht über die Erdkrümmung und Hindernisse – genau das brauchen Tieffliegerradare."],["w-1","buk","Wie wird eine Buk-Batterie (SA-11 Gadfly bzw. SA-17 Grizzly) bekämpft?",["SEAD/DEAD aus Abstand: Anti-Radar-Flugkörper, Gleitbomben, Marschflugkörper – nicht in die WEZ einfliegen","Mit Hellfire aus 8 km","Mit der Bordkanone im Tiefflug","Gar nicht – sie ist unverwundbar"],"Mit ca. 35–70 km Reichweite liegt der Buk weit über der Reichweite typischer CAS-Waffen. Sie wird mit Stand-off-Waffen ausgeschaltet oder umgangen."],["w-2","zu23","Eine ZU-23-2 auf einem Lkw beschießt eigene Truppen. Wie bekämpfst du sie sicher?",["Aus mehr als ca. 3 km Entfernung bzw. über 2 km Höhe: Lenkbombe, Hellfire, APKWS","Im Tiefflug frontal mit der Bordkanone","Mit Nebel","Gar nicht"],"Die ZU-23-2 reicht ca. 2,5 km weit und 1,5 km hoch. Außerhalb davon ist sie ein leichtes Ziel."],["w-3","manpads","Eigene Truppen melden MANPADS-Schützen (SA-24/SA-29) am Waldrand. Was ändert sich für den Angriff?",["Höhe und Abstand halten, Anflug aus anderer Richtung, Flares bereit; den Waldrand mit Splitter bzw. Airburst belegen","Nichts","Tiefflug direkt darüber","Nur nachts angreifen"],"MANPADS reichen ca. 4,5 km hoch und 6 km weit. Angriffsrichtung und Höhe danach planen."],["w-4","pantsir","Ein Pantsir (SA-22) steht neben einer S-400-Batterie (SA-21). Warum?",["Nahschutz gegen Drohnen, Flugkörper und Lenkbomben, die die S-400 angreifen","Er ersetzt das Radar der S-400","Er transportiert Ersatzraketen","Zufall"],"Langstreckensysteme sind gegen kleine, tief fliegende Ziele verwundbar. SA-22 bzw. SA-15 schließen diese Lücke."],["r-6","kub","Warum warnt dein RWR beim Kub / SA-6 Gainful?",["Halbaktive Radarlenkung: Das Radarfahrzeug 1S91 muss das Ziel bis zum Treffer beleuchten","Der Lenkflugkörper hat einen Infrarotsuchkopf","Jeder Starter 2P25 hat ein eigenes Feuerleitradar","Gar nicht – der Kub zielt nur optisch"],"Der Lenkflugkörper fliegt auf das Radarsignal zu, das das 1S91 / Straight Flush am Ziel reflektiert. Solange er fliegt, muss das Radar beleuchten – dein RWR warnt."],["e-6","kub","Die Aufklärung meldet ein Radar 1S91 / Straight Flush. Was folgt daraus?",["Eine Kub-Batterie (SA-6) – die Startfahrzeuge 2P25 stehen im Umkreis weniger km","Ein einzelner Buk-TELAR (SA-11)","Ein Frühwarnradar ohne eigene Fla-Raketen","Eine Shilka-Gruppe"],"Das 1S91 ist das Such- und Feuerleitradar der Kub-Batterie und führt bis zu vier Startfahrzeuge 2P25. Mit ihm ist die Batterie bekämpfungsbereit – WEZ ca. 24 km."],["w-5","kub","Wie bekämpfst du eine Kub-Batterie (SA-6) am wirksamsten?",["Das Radarfahrzeug 1S91 aus Abstand ausschalten – ohne es sind die Starter blind","Zuerst die Startfahrzeuge mit der Bordkanone","Im Tiefflug überfliegen, der Kub schießt nicht tief","Abwarten, bis die Lenkflugkörper verschossen sind"],"Je Batterie gibt es nur ein Radarfahrzeug, die Starter 2P25 haben kein eigenes Radar. Also Anti-Radar-Flugkörper oder Lenkbombe auf das 1S91 – aus Abstand, die WEZ reicht ca. 24 km. Ausnahme: Kub-M4 mit beigestelltem Buk-Starter 9A38."]],"merk":[["NATO-Bezeichnungen",["Rohrwaffen: ZU-23-2 und ZSU-23-4 Shilka (Radar Gun Dish) – keine SA-Nummer.","2K22 Tunguska = SA-19 Grison (Radar Hot Shot). Pantsir-S1/-SM = SA-22 Greyhound.","9K35 Strela-10 = SA-13 Gopher. 9K33 Osa = SA-8A Gecko, Osa-AK/AKM = SA-8B (Radar Land Roll). Tor-M1/-M2 = SA-15 Gauntlet (Radar Scrum Half).","MANPADS: 9K38 Igla = SA-18 Grouse, 9K338 Igla-S = SA-24 Grinch, 9K333 Verba = SA-29 Gizmo.","2K12 Kub / Kvadrat = SA-6 Gainful (Radar 1S91 Straight Flush). Buk/Buk-M1 = SA-11 Gadfly, Buk-M1-2/-M2 = SA-17 Grizzly, Buk-M3 = SA-27 Gollum. M1 und M1-2 sehen gleich aus; die Ukraine nutzt v. a. Buk-M1. TELAR-Radar Fire Dome, Suchradar 9S18 Snow Drift.","S-300V = SA-12 Gladiator (9M83) / Giant (9M82), S-300V4 = SA-23. Radare 9S15 Bill Board, 9S19 High Screen, 9S32 Grill Pan.","S-300PT/PS/PM = SA-10 Grumble, S-300PMU1/PMU2 (PM1/PM2) = SA-20 Gargoyle. Radare 30N6 Flap Lid (30N6E2: Tomb Stone), 64N6 Big Bird, 76N6 Clam Shell.","S-400 = SA-21 Growler. Radare 92N6 Grave Stone, 91N6 Big Bird, 96L6 Cheese Board.","S-350 Vityaz = SA-X-28 (noch ohne Namen). Kasta-2E2 = Flat Face E. Nebo-SVU / Nebo-M: kein gebräuchlicher NATO-Name."]],["Bekämpfungszonen (Richtwerte)",["ZU-23-2 und ZSU-23-4 Shilka: ca. 2,5 km, bis ca. 1,5–2 km Höhe.","Strela-10 / SA-13: ca. 5 km, 3,5 km Höhe. MANPADS (SA-18/24/29): ca. 5–6 km, 3,5–4,5 km Höhe.","Tunguska / SA-19: ca. 8–10 km, 3,5 km Höhe. Osa / SA-8: ca. 10 km, 5 km Höhe.","Tor-M1 / SA-15: ca. 12 km, 6 km Höhe. Tor-M2 / SA-15: ca. 15 km, 10 km Höhe. Pantsir-S1 / SA-22: ca. 20 km, 15 km Höhe (SM: ca. 40 km).","Kub / SA-6: ca. 24 km, 8–12 km Höhe. Buk: SA-11 ca. 35 km, SA-17 ca. 45–50 km, SA-27 ca. 70 km. S-350 / SA-X-28: ca. 120 km. S-300V / SA-12: ca. 75–100 km. S-300P / SA-10, SA-20: ca. 75–200 km. S-400 / SA-21: bis ca. 250 km, mit 40N6 bis ca. 380 km."]],["Warnt mein RWR?",["Radargelenkt (Kub, Buk, S-300, S-400, S-350 – SA-6/10/11/12/17/20/21/27/28): ja.","Radar plus optisch (Shilka, Tunguska SA-19, Osa SA-8, Tor SA-15, Pantsir SA-22): nur, solange das Radar arbeitet.","Infrarot (Strela-10 SA-13, MANPADS) und optische Kanonen (ZU-23): nein – nur ein Raketenwarner erkennt den Start bzw. Mündungsfeuer und Leuchtspur."]],["Gegenmaßnahmen",["Gegen IR: Flares, DIRCM, Höhe und Abstand, Sonne und Gelände nutzen.","Gegen Radar: Chaff, Störsender, Manöver quer zur Radarkeule, Geländeabdeckung.","Immer: Muster vermeiden, nicht über dieselbe Stelle zurück, Abfluglinie gegen bekannte Bedrohungen planen."]],["Radare und Elemente",["Radar erkannt heißt System erkannt: Flap Lid (30N6) = SA-10/20, Grave Stone (92N6) = SA-21, Grill Pan (9S32) = SA-12, Snow Drift (9S18) = Buk, Straight Flush (1S91) = SA-6.","Flap Lid und Grave Stone sowie die beiden Big Bird (64N6 und 91N6) sehen sich sehr ähnlich – den Typ über Aufklärung bzw. ELINT bestätigen.","Startfahrzeuge von SA-10/20 und SA-21 sind optisch nicht zu unterscheiden. Im Zweifel als SA-21 einstufen – größte Reichweite.","Feuerleitradar zuerst – ohne es sind SA-10/20, SA-21 und S-350 blind. Buk-TELAR und 9A83 haben ein eigenes Radar, der Kub-Starter 2P25 nicht.","Frühwarnradare (Nebo, Kasta / Flat Face E) weisen die Fla-Raketen ein – Hochwertziele für SEAD/DEAD."]],["Wirkmittel und Taktik",["Mittel- und Langstrecke: nicht in die WEZ einfliegen – SEAD/DEAD aus Abstand mit Anti-Radar-Flugkörpern, Gleitbomben bzw. Marschflugkörpern.","SHORAD und Fla-Panzer: aus Abstand mit Hellfire/JAGM, Maverick oder Lenkbombe – Pantsir (SA-22) und Tor (SA-15) reichen weiter als Hellfire.","MANPADS: meiden statt suchen; erkannte Schützen mit Splitter bzw. Airburst bekämpfen.","SA-22 bzw. SA-15 schützen oft die Langstreckensysteme – das Gesamtbild beachten."]]],"compare":[{"a":{"fam":"s300p","f":"wm_048_s300p_tel","lab":"S-300P / SA-10, SA-20 – Startfahrzeuge 5P85","pins":[[25,80,"Radfahrzeug MAZ-543 mit acht großen Rädern"],[10,50,"Vier Kanister – am Starter kein eigenes Radar"]],"i":0},"b":{"fam":"s300v","f":"wm_043_s300v_9a83","lab":"S-300V / SA-12 – Startfahrzeug 9A83","pins":[[40,85,"Schweres Kettenfahrgestell"],[55,8,"Eigenes Feuerleitradar auf hohem Mast"],[35,50,"Vier Kanister"]],"i":0},"key":"Räder oder Ketten: Die S-300P fährt auf Rädern, die S-300V auf Ketten. Ein Radar auf hohem Mast direkt am Starter gibt es nur beim 9A83 der S-300V."},{"a":{"fam":"s300p","f":"wm_048_s300p_tel","lab":"S-300P / SA-10, SA-20 – Startfahrzeuge 5P85","pins":[[10,50,"Vier dicke Kanister aufgerichtet"],[25,80,"Selbstfahrend auf MAZ-543 8×8"]],"i":0},"b":{"fam":"s400","f":"wm_061_s400_tel","lab":"S-400 / SA-21 – Startfahrzeuge 5P85SM2","pins":[[55,25,"Vier dicke Kanister aufgerichtet"],[72,70,"Selbstfahrend auf MAZ-543M 8×8"]],"i":1},"keyLab":"Kein sicheres Merkmal:","key":"Die Startfahrzeuge sehen gleich aus. Beide Systeme gibt es selbstfahrend auf MAZ-543 und als Sattelzug, beide mit vier dicken Kanistern. Im Zweifel als S-400 einstufen – größte Reichweite – und den Typ über Radare bzw. Aufklärungslage bestätigen."},{"a":{"fam":"s400","f":"wm_063_s400_tel","lab":"S-400 / SA-21 – Startfahrzeug","pins":[[70,35,"Vier dicke Kanister"],[42,45,"Hier als Sattelzug – die S-400 gibt es auch selbstfahrend"]],"i":0},"b":{"fam":"s350","f":"wm_070_s350","lab":"S-350 / SA-X-28 – Startfahrzeug 50P6","pins":[[65,30,"Bis zu zwölf schlanke Kanister"],[30,45,"Kompaktes BAZ-6909 8×8 ohne Auflieger"]],"i":0},"key":"Kanister zählen: vier dicke Kanister = S-400, bis zu zwölf schlanke = S-350."},{"a":{"fam":"buk","f":"wm_035_bukm12","lab":"Buk-M1/M1-2 / SA-11, SA-17 – TELAR","pins":[[45,15,"Lenkflugkörper offen auf dem Drehstarter"],[82,35,"Großes Feuerleitradar unter runder Haube am Turm"]],"i":0},"b":{"fam":"tor","f":"wm_026_torm1","lab":"Tor-M1 / SA-15 Gauntlet","pins":[[26,20,"Suchradar oben auf dem Turm"],[53,36,"Feuerleitradar vorn am Turm"],[28,42,"Geschlossener, kastiger Turm – Lenkflugkörper stecken unsichtbar senkrecht darin"]],"i":0},"key":"Sind Lenkflugkörper oder Kanister auf einem Drehstarter zu sehen, ist es ein Buk. Ein geschlossener Kasten mit Suchradar obendrauf ist ein Tor. Der Buk reicht mit ca. 35–70 km viel weiter als der Tor mit ca. 12–15 km."},{"a":{"fam":"buk","f":"wm_039_bukm3","lab":"Buk-M3 / SA-27 Gollum – TELAR","pins":[[55,20,"Sechs schlanke Kanister auf dem Drehstarter"],[78,42,"Radar unter Haube vorn am Turm"]],"i":5},"b":{"fam":"s300v","f":"wm_043_s300v_9a83","lab":"S-300V / SA-12 – Startfahrzeug 9A83","pins":[[35,50,"Vier dicke Kanister fest auf dem Fahrzeug"],[55,8,"Radar auf hohem Mast"]],"i":0},"key":"Sechs schlanke Kanister auf einem drehbaren Turm = Buk-M3. Vier dicke Kanister mit Radarmast auf einem deutlich größeren Fahrzeug = S-300V."},{"a":{"fam":"pantsir","f":"wm_012_pantsir","lab":"Pantsir-S1 / SA-22 Greyhound","pins":[[16,24,"Je sechs Lenkflugkörper links und rechts am Turm"],[45,72,"Radfahrzeug KamAZ 8×8"]],"i":0},"b":{"fam":"tunguska","f":"wm_009_tunguska","lab":"2K22 Tunguska / SA-19 Grison","pins":[[62,13,"Je vier Lenkflugkörper seitlich am Turm"],[29,24,"Suchradar am Turmheck"],[55,80,"Kettenfahrgestell"]],"i":0},"key":"Räder = Pantsir, Ketten = Tunguska. Ausnahme ist der Pantsir-SM-SV auf Ketten – er hat aber ein flaches Radar oben auf dem Turm. Der Pantsir reicht mit ca. 20 km doppelt so weit wie die Tunguska."},{"a":{"fam":"shilka","f":"wm_005_shilka","lab":"ZSU-23-4 Shilka","pins":[[69,37,"Flacher Turm mit vier dünnen Rohren, keine Lenkflugkörper"],[33,22,"Radarantenne am Turmheck"]],"i":0},"b":{"fam":"tunguska","f":"wm_009_tunguska","lab":"2K22 Tunguska / SA-19 Grison","pins":[[43,31,"Zwei Doppelkanonen"],[62,13,"Dazu Lenkflugkörper seitlich am Turm"],[29,24,"Großes Suchradar am Turmheck"]],"i":0},"key":"Nur Rohre und ein kleiner, flacher Turm = Shilka (ca. 2,5 km). Doppelkanonen plus Lenkflugkörper und ein großer Turm = Tunguska (bis ca. 10 km)."},{"a":{"fam":"osa","f":"wm_021_osa","lab":"9K33 Osa / SA-8 Gecko","pins":[[45,12,"Rundsuchradar auf dem Turm"],[40,75,"6×6-Radfahrzeug"]],"i":0},"b":{"fam":"strela10","f":"wm_017_strela10","lab":"9K35 Strela-10 / SA-13 Gopher","pins":[[35,20,"Vier Startbehälter, kein Radar"],[55,70,"MT-LB-Kettenfahrgestell"]],"i":0},"key":"Räder und Radar = Osa, dein RWR warnt. Ketten ohne Radar = Strela-10 – infrarotgelenkt, dein RWR bleibt still."},{"a":{"fam":"kub","f":"wm_201_kub_2p25","lab":"Kub / SA-6 – Startfahrzeug 2P25","pins":[[42,18,"Drei Lenkflugkörper auf dem Drehstarter"],[30,40,"Kein eigenes Radar am Starter"]],"i":0},"b":{"fam":"buk","f":"wm_035_bukm12","lab":"Buk-M1/M1-2 / SA-11, SA-17 – TELAR","pins":[[45,15,"Lenkflugkörper offen auf dem Drehstarter"],[82,35,"Großes Feuerleitradar unter runder Haube am Turm"]],"i":0},"key":"Drei Lenkflugkörper auf einem Starter ohne Radar: Kub. Vier Lenkflugkörper und ein großes Radar vorn am Turm: Buk. Beim Kub sitzt das Radar auf einem eigenen Fahrzeug, dem 1S91 – fällt es aus, sind alle Starter blind."}],"alike":[{"a":["s300p","tel"],"b":["s400","tel"],"note":"Startfahrzeuge von S-300P und S-400 sehen gleich aus – deshalb stand die jeweils andere hier nicht zur Wahl."},{"a":["s300p","30n6"],"b":["s400","92n6"],"note":"Die Feuerleitradare 30N6 (S-300P) und 92N6 (S-400) sehen sich sehr ähnlich – deshalb stand das jeweils andere hier nicht zur Wahl."},{"a":["s300p","64n6"],"b":["s400","91n6"],"note":"Die Rundsuchradare 64N6 (S-300P) und 91N6 (S-400) sehen sich sehr ähnlich – deshalb stand das jeweils andere hier nicht zur Wahl."}],"cmpDesc":"Ähnliche Systeme nebeneinander – z. B. S-300P oder S-300V, Buk oder Tor","versions":{"zu23":{"rows":[{"n":"ZU-23-2","nato":"keine SA-Nummer","y":"1960","wez":"ca. 2,5 km, bis ca. 1,5 km Höhe","m":"Gezogene Zweirad-Lafette mit zwei Rohren und zwei offenen Sitzen."},{"n":"ZU-23-2 auf Träger","nato":"keine SA-Nummer","y":"","wez":"wie oben","m":"Dieselbe Waffe auf Lkw-Ladefläche, MT-LB- oder BTR-D-Dach – heute die häufigste Form."}],"note":"Die Versionen unterscheiden sich nur im Träger. Optisches Visier – kein RWR-Alarm."},"shilka":{"rows":[{"n":"ZSU-23-4, -V, -V1","nato":"Radar Gun Dish","y":"1965–1970","wez":"ca. 2,5 km, bis ca. 1,5–2 km Höhe","m":"Vier Rohre, Radarantenne am Turmheck; Unterschiede nur in Details."},{"n":"ZSU-23-4M2 „Afghan“","nato":"keine SA-Nummer","y":"1978","wez":"ca. 2,5 km, bis ca. 1,5–2 km Höhe","m":"Ohne Radar – die Radarantenne fehlt, dafür Nachtsichtgerät."},{"n":"ZSU-23-4M4 / M5 (Shilka-M4)","nato":"Radar Gun Dish","y":"ab 1999","wez":"Kanonen wie oben, Igla bis ca. 5 km","m":"Je zwei Igla-Starter links und rechts am Turm, Nebelwurfbecher."}],"note":"Igla-Starter am Turm = Shilka-M4/M5. Fehlende Radarantenne = M2 – dann warnt dein RWR nicht. Als Rohrwaffe ohne SA-Nummer."},"tunguska":{"rows":[{"n":"2K22 Tunguska (2S6)","nato":"SA-19 Grison","y":"1982","wez":"Lenkflugkörper ca. 8 km, Kanonen ca. 4 km, bis ca. 3,5 km Höhe","m":"Nur vier Lenkflugkörper – zwei je Seite."},{"n":"2K22M Tunguska-M (2S6M)","nato":"SA-19 Grison","y":"1990","wez":"Lenkflugkörper ca. 8 km, Kanonen ca. 4 km, bis ca. 3,5 km Höhe","m":"Acht Lenkflugkörper – vier je Seite."},{"n":"2K22M1 Tunguska-M1 (2S6M1)","nato":"SA-19 Grison","y":"2003","wez":"Lenkflugkörper ca. 10 km, bis ca. 3,5 km Höhe","m":"Acht Lenkflugkörper; äußerlich wie Tunguska-M."}],"note":"Lenkflugkörper zählen: vier = alte 2K22, acht = Tunguska-M oder M1. M und M1 sind optisch kaum zu unterscheiden – plane mit 10 km."},"pantsir":{"rows":[{"n":"Pantsir-S1","nato":"SA-22 Greyhound","y":"2012","wez":"ca. 20 km, bis ca. 15 km Höhe; Kanonen ca. 4 km","m":"KamAZ 8×8, Suchradar als Drehantenne auf dem Turm."},{"n":"Pantsir-SM","nato":"SA-22 Greyhound","y":"ab ca. 2022","wez":"ca. 40 km","m":"Neues 8×8 mit gepanzerter Kabine, flaches Phased-Array-Suchradar oben auf d   while (out.length < n && pool.length){

const unitOfImg = (f, i) => f.vars.find(u => u.v && u.v === meta(f.id, i).v) || null;

    const ar = (ARS[sd.fam] || [])[sd.i] || 4/3;
    const lb = document.createElement('div'); lb.className = 'lightbox'; lb.setAttribute('role', 'dialog');
    lb.innerHTML = `<div class="czoom"><div class="cmpin" style="aspect-ratio:${ar};width:min(100%, calc((100vh - 140px) * ${ar}))"><img src="${IMG[sd.fam][sd.i]}" alt="${esc(sd.lab)}">${sd.pins.map(([x, y], k) => `<span class="pin" style="left:${x}%;top:${y}%">${k + 1}</span>`).join('')}</div>
      <p class="czcap"><b>${esc(sd.lab)}</b>${sd.pins.map(([, , tx], k) => `<span><i>${k + 1}</i>${esc(tx)}</span>`).join('')}</p></div>`;
    lb.addEventListener('click', () => lb.remove());
    document.body.appendChild(lb); return;
  }
  if (t.dataset.zoom){
    const [fid, i] = t.dataset.zoom.split(':');
    const lb = document.createElement('div'); lb.className = 'lightbox'; lb.setAttribute('role', 'dialog');
    lb.innerHTML = `<img src="${imgSrc(fid, Number(i))}" alt="Vergrößerte Ansicht">`;
    lb.addEventListener('click', () => lb.remove());
    document.body.appendChild(lb); return;
  }
  if (t.dataset.start){ closeCard(); startRound(t.dataset.start); return; }
  if (t.dataset.go){ view = t.dataset.go; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.card){ openCard(t.dataset.card); return; }
  if (t.dataset.ans != null){ answer(Number(t.dataset.ans)); return; }
  if (t.dataset.flag){
    const id = t.dataset.flag;
    if (S.flags[id]) delete S.flags[id]; else S.flags[id] = {t:R && R.cur ? R.cur.m.prompt : id, ts:Date.now()};
    save();
    t.classList.toggle('flagged', !!S.flags[id]); t.textContent = S.flags[id] ? 'Gemeldet' : 'Frage melden';
    return;
  }
  const act = t.dataset.act;
  if (act === 'home'){ closeCard(); view = 'home'; R = null; render(); window.scrollTo(0, 0); }
  else if (act === 'next') nextQ();
  else if (act === 'merk') openMerk();
  else if (act === 'cmpall') openCmpAll();
  else if (act === 'anno'){
    const ar = $('#annoarea'); if (!ar) return;
    S.annoOpen = ar.hidden; ar.hidden = !ar.hidden; save();
    t.textContent = S.annoOpen ? 'Erkennungsmerkmale ausblenden' : 'Erkennungsmerkmale zeigen';
    t.setAttribute('aria-expanded', S.annoOpen ? 'true' : 'false');
    if (S.annoOpen) ar.scrollIntoView({behavior:'smooth', block:'nearest'});
  }
  else if (act === 'closecard') closeCard();
  else if (act === 'cardpins' && cardState){ cardState.pins = !cardState.pins; drawCard(); }
  else if (act === 'copyflags'){
    const ta = $('#flagtxt'); ta.select();
    const done = () => { t.textContent = 'Kopiert'; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, () => { try { document.execCommand('copy'); done(); } catch(_){} });
    else { try { document.execCommand('copy'); done(); } catch(_){} }
  }
  else if (act === 'clearflags'){ S.flags = {}; save(); render(); }
  else if (act === 'reset'){
    if (t.dataset.confirm){ const fl = S.flags; S = blank(); S.flags = fl; save(); render(); }
    else { t.dataset.confirm = '1'; t.textContent = 'Wirklich zurücksetzen? Erneut tippen'; t.classList.add('flagged'); }
  }
});
document.addEventListener('keydown', e => {
  if (document.querySelector('.lightbox')){ if (e.key === 'Escape') document.querySelector('.lightbox').remove(); return; }
  if (!$('#sheet').hidden){ if (e.key === 'Escape') closeCard(); return; }
  if (view !== 'quiz' || !R) return;
  if (!R.answered && /^[1-4]$/.test(e.key)){ const k = Number(e.key) - 1; if (k < R.cur.opts.length) answer(k); }
  else if (R.answered && (e.key === 'Enter' || e.key === ' ') && !(e.target && e.target.dataset && e.target.dataset.flag)){ e.preventDefault(); nextQ(); }
});
render();

</script>
<script src="../assets/app.js" defer></script>
