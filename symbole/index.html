<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Symbole</title>
<meta name="theme-color" content="#E4E9E7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1517" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="JTAC">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/app.css">
<style>
/* Symbol-Generator im Look der Trainer-Reihe */
:root{
  --bg:#E4E9E7; --surface:#F4F7F5; --surface2:#E9EEEC; --ink:#1A2326; --muted:#55615F; --line:#C3CCC9;
  --ok:#2A7848; --ok-bg:#DCEEE2; --bad:#B0382B; --bad-bg:#F6DEDA; --unk:#7A6A2E; --unk-bg:#F1E9CF;
  --cta:#E0A526; --cta-ink:#1A2326; --radio:#0F1A1C; --radio-ink:#F2B632;
  --font-d:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --font-b:"Barlow","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-m:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1517; --surface:#172022; --surface2:#1D282B; --ink:#E1E7E5; --muted:#93A09D; --line:#2A3639;
    --ok:#56B57F; --ok-bg:#16301F; --bad:#E36D5E; --bad-bg:#3A1C18; --unk:#D9C17A; --unk-bg:#2E2913;
    --cta:#E3AA2E; --cta-ink:#111719; --radio:#06090A; --radio-ink:#F2B632; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1517; --surface:#172022; --surface2:#1D282B; --ink:#E1E7E5; --muted:#93A09D; --line:#2A3639;
  --ok:#56B57F; --ok-bg:#16301F; --bad:#E36D5E; --bad-bg:#3A1C18; --unk:#D9C17A; --unk-bg:#2E2913;
  --cta:#E3AA2E; --cta-ink:#111719; --radio:#06090A; --radio-ink:#F2B632; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--cta);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-block:12px 56px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-d);line-height:1.1;margin:0;text-wrap:balance}
h2{font-size:1.35rem;font-weight:600}
.muted{color:var(--muted)}
.code{font-family:var(--font-m);font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}

/* Kopfleiste */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:720px;margin:0 auto;padding-block:8px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px;min-height:52px}
.bar .t{font-family:var(--font-d);font-weight:600;font-size:1.2rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:40px;height:40px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:500;white-space:nowrap}
.tag{font-family:var(--font-d);font-size:1rem;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.prog{height:3px;background:var(--line)}
.prog>i{display:block;height:100%;background:var(--cta);transition:width .25s}

/* Übersicht */
.hero{padding:26px 0 14px}
.hero h1{font-size:clamp(3rem,13vw,5.2rem);font-weight:700;letter-spacing:-.015em;line-height:.9}
.hero p{max-width:34em;margin:12px 0 0;color:var(--muted);font-size:1.05rem}
.radioline{display:inline-block;margin-top:14px;background:var(--radio);color:var(--radio-ink);font-family:var(--font-m);font-size:.82rem;font-weight:500;letter-spacing:.04em;padding:6px 12px;border-radius:6px;max-width:100%;overflow-wrap:anywhere}
.board{margin:16px 0 22px}
.board h3{font-size:1rem;color:var(--muted);margin:14px 0 6px;letter-spacing:.06em;text-transform:uppercase}
.cells{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
@media (min-width:560px){.cells{grid-template-columns:repeat(4,minmax(0,1fr))}}
.cell{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 9px 12px;overflow:hidden;min-width:0}
.cell[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.cell b{display:block;font-family:var(--font-d);font-weight:700;font-size:1.25rem;line-height:1;font-variant-numeric:tabular-nums}
.cell span{display:block;font-size:.78rem;color:var(--muted);line-height:1.25;margin-top:3px}
.cell i{position:absolute;left:0;bottom:0;height:5px;background:var(--line)}
.cell[data-s="bad"] i{background:var(--bad)} .cell[data-s="mid"] i{background:var(--cta)} .cell[data-s="ok"] i{background:var(--ok)}
.filtnote{font-size:.88rem;color:var(--muted);margin-top:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cta{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;background:var(--cta);color:var(--cta-ink);border:0;border-radius:10px;padding:16px 18px;text-align:left}
.cta strong{font-family:var(--font-d);font-size:1.5rem;font-weight:700;display:block;line-height:1.05}
.cta small{display:block;font-size:.9rem;opacity:.85}
.cta .go{font-family:var(--font-d);font-size:1.6rem;font-weight:700}
.modes{margin-top:20px;border-top:1px solid var(--line)}
.modes h3{font-size:1rem;color:var(--muted);margin:16px 0 2px;letter-spacing:.06em;text-transform:uppercase}
.mode{display:flex;width:100%;gap:14px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:13px 2px}
.mode .mi{flex:1;min-width:0}
.mode strong{display:block;font-family:var(--font-d);font-size:1.3rem;font-weight:600;line-height:1.1}
.mode small{display:block;color:var(--muted);font-size:.9rem;margin-top:2px}
.mode .n{font-family:var(--font-d);font-size:1.05rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.mode:hover strong{text-decoration:underline;text-underline-offset:3px}
.mode[disabled]{opacity:.45;cursor:default}
.foot{margin-top:26px;font-size:.84rem;color:var(--muted);max-width:42em}
.foot p{margin:0 0 8px}
.foot a{color:var(--ink);text-underline-offset:3px}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-weight:600}

/* Frage */
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0 10px;font-size:.9rem;color:var(--muted)}
.chip-cat{display:inline-block;font-family:var(--font-d);font-weight:700;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;background:var(--ink);color:var(--bg);border-radius:5px;padding:2px 9px}
.prompt{font-family:var(--font-d);font-size:1.55rem;font-weight:600;line-height:1.15;margin:6px 0 14px}
.bigcode{display:inline-block;background:var(--radio);color:var(--radio-ink);font-family:var(--font-m);font-weight:700;font-size:clamp(1.5rem,7vw,2.1rem);letter-spacing:.06em;padding:10px 18px;border-radius:8px;margin:4px 0 14px;max-width:100%;overflow-wrap:anywhere}
.defbox{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--cta);border-radius:0 10px 10px 0;padding:12px 16px;margin:4px 0 14px;font-size:1.05rem}
.lage{background:var(--radio);color:#DCE5E2;border-radius:10px;padding:12px 16px;margin:4px 0 12px}
.lage .lh{font-family:var(--font-m);font-size:.74rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--radio-ink)}
.lage p{margin:4px 0 0}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;line-height:1.35}
.opt .k{flex:none;width:26px;height:26px;border-radius:6px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-weight:700;color:var(--muted);font-size:.95rem}
.opt .ot{min-width:0;overflow-wrap:anywhere}
.opt .ot.code{white-space:normal;font-size:1.02rem}
.opt:not([disabled]):hover{border-color:var(--ink)}
.opt[disabled]{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)} .opt.correct .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)} .opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.seq{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.seq .code{font-size:.92rem}
.seq .ar{color:var(--muted);font-weight:700}
.inp{display:block;width:100%;font-family:var(--font-m);font-weight:700;font-size:1.15rem;letter-spacing:.05em;text-transform:uppercase;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:13px 14px}
.inp:focus{border-color:var(--ink);outline:none}
.inp[readonly]{border-style:dashed}
.fhint{font-size:.86rem;color:var(--muted);margin-top:5px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:11px 15px;font-weight:600}
.btn.main{background:var(--ink);color:var(--bg);border-color:var(--ink);flex:1;min-width:9em}
.btn.flagged{border-color:var(--bad);color:var(--bad)}
.fb{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c,var(--ok));border-radius:10px;padding:14px 16px}
.fb .v{font-family:var(--font-d);font-size:1.4rem;font-weight:700;color:var(--c)}
.fb p{margin:6px 0 0}
.entry{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.entry .hd{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.entry .hd .code{font-size:1.05rem}
.entry .lf{font-family:var(--font-d);font-size:1.15rem;font-weight:600}
.entry .en{font-size:.88rem;color:var(--muted);font-style:italic;margin-top:4px}
.entry .nt{font-size:.94rem;margin-top:6px}
.pill{display:inline-block;font-size:.78rem;font-weight:600;border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:1px 9px;color:var(--muted)}

/* Ergebnis */
.score{font-family:var(--font-d);font-size:5rem;font-weight:700;line-height:.9;margin:26px 0 4px;font-variant-numeric:tabular-nums}
.score small{font-size:2rem;color:var(--muted);font-weight:600}
.misslist{list-style:none;padding:0;margin:12px 0 0;border-top:1px solid var(--line)}
.misslist li{padding:10px 0;border-bottom:1px solid var(--line)}
.misslist .code{font-size:.95rem}

/* Glossar */
.seg{display:flex;gap:0;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;margin:14px 0 10px}
.seg button{flex:1;border:0;background:var(--surface);padding:10px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.search{display:block;width:100%;font:inherit;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px}
.gl h3{font-size:1rem;color:var(--muted);margin:20px 0 4px;letter-spacing:.06em;text-transform:uppercase}
.gl dl{margin:0}
.gl .it{padding:10px 0;border-bottom:1px solid var(--line)}
.gl .it .hd{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.gl .it .code{font-size:1rem}
.gl .it p{margin:3px 0 0}
.gl .it .en{font-size:.86rem;color:var(--muted);font-style:italic}
.gl .empty{color:var(--muted);margin-top:16px}

/* Statistik */
.stat-top{display:flex;gap:28px;margin:18px 0 6px;flex-wrap:wrap}
.stat-top b{display:block;font-family:var(--font-d);font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.srow{display:grid;grid-template-columns:minmax(0,10em) 1fr 4.2em;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.94rem}
.sbar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.sbar i{display:block;height:100%}
.confirm{margin-top:10px;padding:12px 14px;border:1px solid var(--bad);background:var(--bad-bg);border-radius:8px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* Symbol-Generator */
.lbl{display:block;font-weight:600;color:var(--muted);margin:6px 0 5px}
.inp.big{text-transform:none;letter-spacing:0;font-family:var(--font-b);font-weight:600;font-size:1.08rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:.84rem;text-align:left;line-height:1.25}
.chip:hover{border-color:var(--ink)}
.result{margin-top:14px}
.symbox{background:#fff;border:1px solid var(--line);border-radius:12px;min-height:160px;display:flex;align-items:center;justify-content:center;padding:16px;overflow-x:auto}
.symbox svg{max-width:100%;height:auto}
.kv{display:grid;grid-template-columns:minmax(0,12em) minmax(0,1fr);gap:6px 14px;margin:12px 0 6px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
@media (max-width:440px){.kv{grid-template-columns:1fr;gap:2px}.kv dd{margin-bottom:8px}}
.sidc{font-size:.8rem;color:var(--muted);margin:4px 0}
.sidc span{font-family:var(--font-m);overflow-wrap:anywhere}
.warn{color:var(--bad);margin:10px 0 0}
.note{color:var(--unk);margin:8px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:16px}
.card h2{margin-bottom:6px}
.card h3{font-size:1.02rem;margin:12px 0 2px}
.card p{margin:4px 0}
details summary{cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary h2::before{content:"▸ "}
details[open] summary h2::before{content:"▾ "}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,14em),1fr));gap:10px;margin-top:12px}
.fgrid label{display:flex;flex-direction:column;gap:4px;font-weight:600;color:var(--muted);font-size:.88rem;min-width:0}
.fgrid select,.fgrid input{font:inherit;font-size:.95rem;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:9px 10px;font-weight:400;min-width:0;max-width:100%}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(7.5em,1fr));gap:8px}
.hit{display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 6px;color:#1A2326;font-size:.74rem;line-height:1.2;min-width:0}
.hit svg{max-width:100%;height:auto}
.hit span{overflow-wrap:anywhere}
.tabw{overflow-x:auto}
.ftab{border-collapse:collapse;background:#fff;border-radius:8px;margin:6px 0}
.ftab th,.ftab td{padding:5px 4px;text-align:center;color:#1A2326;font-size:.8rem;font-weight:600}
.ftab svg{height:auto;max-width:52px}
.demo{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:center;background:#fff;border-radius:10px;padding:12px;margin:8px 0}
.demo svg{max-width:100%;height:auto}

.catbar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.catbar .search{flex:1 1 14em;min-width:0;font:inherit;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px}
.sel2{font:inherit;font-size:.92rem;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:9px 8px;max-width:100%}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(9em,1fr));gap:8px}
.hit small{color:#55615F;font-size:.68rem}

/* Symbol-Trainer */
a.cta{text-decoration:none}
a.mode{text-decoration:none;color:var(--ink)}
.wt{font-size:1.6rem;margin-top:8px}
.chk2{display:flex;gap:8px;align-items:center;font-size:.92rem;color:var(--muted);margin-top:10px}
.chk2 input{width:18px;height:18px;accent-color:var(--ink)}
.wrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:2px 0 4px}
.lvl{font:inherit;font-size:.92rem;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:8px;max-width:100%}
.tm{font-family:var(--font-m);font-size:.95rem;font-weight:700;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.lage .rep{font-size:1.08rem;font-weight:600;line-height:1.4}
.bprev{position:sticky;top:calc(env(safe-area-inset-top,0px) + 53px);z-index:4;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line)}
.bprev .pv{display:flex;gap:8px}
.bprev .sbox{flex:1;min-width:0;background:#fff;border:1px solid var(--line);border-radius:10px;min-height:118px;max-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px;color:#1A2326;overflow:hidden}
.bprev .sbox.sol{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.bprev .sbox svg{max-width:100%;max-height:160px;width:auto;height:auto}
.bprev .sbox small{font-size:.7rem;color:#55615F;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.bsec{margin-top:16px}
.bsec h3{font-size:.92rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:0 0 6px}
.ggrid{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(66px,1fr))}
.ggrid.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.ggrid.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.ggrid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:470px){.ggrid.g6{grid-template-columns:repeat(3,minmax(0,1fr))}}
.gb{display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:4px;min-width:0;color:var(--ink)}
.gb .gl{width:100%;height:54px;background:#fff;border-radius:5px;display:flex;align-items:center;justify-content:center;color:#1A2326;font-family:var(--font-d);font-weight:700;font-size:1.5rem;overflow:hidden}
.gb .gl svg{max-width:94%;max-height:50px;width:auto;height:auto}
.gb small{font-size:.7rem;line-height:1.15;color:var(--muted);text-align:center;hyphens:auto;overflow-wrap:break-word;max-width:100%}
.bprev.done{position:static}
@media (max-width:560px){.bprev .pv.two{flex-direction:column}}
.gb[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);background:var(--surface2)}
.gb:disabled{opacity:.35;cursor:not-allowed}
.kseg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kbtn{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.kbtn b{display:block;font-family:var(--font-d);font-size:1.3rem;line-height:1.1}
.kbtn small{display:block;color:var(--muted);font-size:.82rem;line-height:1.25;margin-top:2px}
.kbtn[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);background:var(--surface2)}
.compass{display:grid;grid-template-columns:repeat(3,58px);gap:6px}
.compass .gb .gl{height:40px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,11em),1fr));gap:10px}
.tgrid label{display:flex;flex-direction:column;gap:4px;font-weight:600;color:var(--muted);font-size:.84rem;min-width:0}
.tgrid .inl{display:flex;gap:6px;min-width:0}
.tgrid input{font:inherit;font-family:var(--font-m);font-size:1rem;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0;width:100%}
.tgrid input:focus{border-color:var(--ink);outline:none}
.btn.sm{padding:8px 10px;font-size:.9rem;flex:none}
.actbar{position:sticky;bottom:0;z-index:4;background:var(--bg);border-top:1px solid var(--line);margin-top:20px;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap}
.chk{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:5px;grid-template-columns:repeat(auto-fill,minmax(min(100%,12em),1fr))}
.chk li{padding:6px 10px;border-radius:7px;font-weight:600;font-size:.92rem}
.chk li.ok{background:var(--ok-bg);color:var(--ok)}
.chk li.bad{background:var(--bad-bg);color:var(--bad)}
.vfig{margin:12px 0 10px;background:#0B1112;border-radius:10px;overflow:hidden}
.vfig img{display:block;width:100%;max-height:300px;object-fit:contain}
.vfig figcaption{font-size:.72rem;color:#9AA5A2;padding:4px 10px}
.lh3{font-size:1rem;color:var(--muted);margin:20px 0 2px;letter-spacing:.06em;text-transform:uppercase}
.vrow{display:grid;grid-template-columns:84px minmax(0,1fr) 64px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.vrow img,.vrow .noimg{width:84px;height:60px;object-fit:cover;border-radius:6px;background:var(--surface2);display:block}
.vrow .vs{background:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;height:60px}
.vrow .vs svg{max-width:58px;max-height:54px;width:auto;height:auto}
.vrow b{font-family:var(--font-d);font-size:1.12rem;line-height:1.1}
.vrow p{margin:2px 0 0;font-size:.86rem}
.vrow .vw{color:var(--muted);font-size:.8rem}
.symbox.rd{min-height:150px}
.gf{color:var(--warn,#B7791F);font-weight:700}

/* ---------- Freitext auswerten ---------- */
function parse(input){
  const F = {ident:'', key:'', mob:'00', ech:'00', hq:'0', status:'0', dir:'', qty:'', type:'', info:'', t:'', dtg:'', speed:'', lead:'00', rank:'00', sphq:''};
  const notes = [];
  let t = norm(input);
  const cut = (re, fn) => { t = t.replace(re, function(){ fn.apply(null, arguments); return ' '; }); };
  // Zeit, Geschwindigkeit, Richtung in Grad bzw. Strich (vor dem Entfernen der Satzzeichen)
  cut(/\s(?:um\s+)?(\d{1,2})[:.](\d{2})\s*(?:uhr|z|zulu)?(?=\s)/, (m, h, mi) => { F.dtg = h.padStart(2, '0') + mi; });
  cut(/\s(?:um\s+)(\d{4})\s*(?:uhr|z|zulu)?(?=\s)|\s(\d{4})\s*(?:uhr|z|zulu)(?=\s)/, (m, a, b) => { F.dtg = a || b; });
  cut(/\s(?:mit\s+)?(\d{1,4})\s*(km\/h|kmh|km\s+h|kn|knoten|kts)(?=\s)/, (m, v, u) => { F.speed = v + (/^k(n|nots|ts)|knoten/.test(u) ? ' KN' : ' KM/H'); });
  cut(/\s(?:in\s+)?(?:richtung|kurs|bewegungsrichtung|marschrichtung)\s+(\d{1,4})\s*(grad|°|strich|mil|mils)?(?=\s)/, (m, v, u) => {
    let d = +v; if (/strich|mil/.test(u || '') || (!u && d > 360)) d = Math.round(d * 360 / 6400); F.dir = String(d % 360);
  });
  t = t.replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ');
  t = ' ' + t.trim() + ' ';
  cut(/\s(?:in\s+)?(?:richtung|nach|kurs|bewegungsrichtung|marschrichtung)\s+(?:dem\s+|den\s+)?(nordwesten|nordosten|suedwesten|suedosten|nordwest|nordost|suedwest|suedost|norden|sueden|osten|westen|nord|sued|ost|west|nw|no|sw|so|n|s|o|w)(?=\s)/, (m, w) => { F.dir = String(DIRW[w]); });
  cut(/\s(nordwaerts|suedwaerts|ostwaerts|westwaerts)(?=\s)/, (m, w) => { F.dir = String({nordwaerts:0, suedwaerts:180, ostwaerts:90, westwaerts:270}[w]); });
  // Tätigkeiten
  const acts = [];
  for (const a of ACTS){ let hit = false; t = t.replace(a.re, () => { hit = true; return ' '; }); if (hit && !acts.includes(a.l)) acts.push(a.l); }
  // Zugehörigkeit
  cut(/\s(?:vermutlich\s+feindlich\w*|verdacht\s+feindlich|feindverdaechtig\w*|verdaechtig\w*)(?=\s)/, () => F.ident = '5');
  cut(/\s(?:vermutlich\s+eigen\w*|angenommen\s+eigen\w*)(?=\s)/, () => F.ident = '2');
  cut(/\s(?:feindlich\w*|feind|feinde|gegner\w*|rot|hostile|enemy)(?=\s)/, () => F.ident = F.ident || '6');
  cut(/\s(?:eigen\w*|freund\w*|blau|friendly|verbuendet\w*)(?=\s)/, () => F.ident = F.ident || '3');
  cut(/\s(?:neutral\w*|gruen)(?=\s)/, () => F.ident = F.ident || '4');
  cut(/\s(?:unbekannt\w*|gelb)(?=\s)/, () => F.ident = F.ident || '1');
  // Zustand, Stab, Attrappe, Mobilität, Gewichtsklasse
  cut(/\s(?:zerstoert|vernichtet|ausgeschaltet|abgeschossen)(?=\s)/, () => F.status = '4');
  cut(/\s(?:beschaedigt|getroffen)(?=\s)/, () => F.status = '3');
  cut(/\s(?:vermutet\w*|vermutlich|geplant\w*|erwartet\w*)(?=\s)/, () => F.status = F.status === '0' ? '1' : F.status);
  let dummy = false, hq = false, tf = false;
  cut(/\s(?:attrappe\w*|scheinziel\w*|scheinstellung\w*)(?=\s)/, () => dummy = true);
  let mobW = '', weight = '';
  cut(/\s(?:auf\s+)?(?:raedern|rad|radfahrzeug\w*|bereift)(?=\s)/, () => mobW = '32');
  cut(/\s(?:auf\s+)?(?:ketten|kette|kettenfahrzeug\w*)(?=\s)/, () => mobW = '33');
  cut(/\s(?:gezogen\w*)(?=\s)/, () => mobW = '35');
  cut(/\s(?:amphibisch\w*|schwimmfaehig\w*)(?=\s)/, () => mobW = '52');
  cut(/\s(leicht\w*|mittel\w*|mittelschwer\w*|schwer\w*)(?=\s)/, (m, w) => weight = /^mittel/.test(w) ? 'm' : /^leicht/.test(w) ? 'l' : 'h');
  // Kampfgruppe (BTG)
  cut(/\s(?:btg|bataillonskampfgruppe|bataillonstaktische\s+gruppe)(?=\s)/, () => { F.key = 'u_ca'; F.ech = '16'; tf = true; });
  cut(/\s(?:kampfgruppe|task\s+force)(?=\s)/, () => { tf = true; });
  // Besondere Gefechtsstände (Feld AA)
  cut(/\s(?:hauptgefechtsstand\w*)(?=\s)/, () => { hq = true; F.sphq = 'MAIN'; });
  cut(/\s(?:gefechtsstand\s+vorne|vorgeschobene\w*\s+gefechtsstand\w*|taktische\w*\s+gefechtsstand\w*|tac\s+cp|tac)(?=\s)/, () => { hq = true; F.sphq = 'TAC'; });
  cut(/\s(?:ausweichgefechtsstand\w*)(?=\s)/, () => { hq = true; F.sphq = 'ALT'; });
  cut(/\s(?:rueckwaertige\w*\s+gefechtsstand\w*)(?=\s)/, () => { hq = true; F.sphq = 'REAR'; });
  // Punkte (Beobachtungsposten, TRP, Checkpoint …)
  let cmKey = '';
  for (const c of CMW){ const m = t.match(c.re); if (m){ cmKey = c.k; t = t.replace(m[0], ' '); break; } }
  // Dienstgrad
  for (const r of RANKW){ const m = t.match(r.re); if (m){ F.rank = r.c; t = t.replace(m[0], ' '); break; } }
  // Gefechtsstand / Stab (auch zusammengesetzt, z. B. Bataillonsgefechtsstand)
  t = t.replace(/\s(\w*?)(gefechtsstand\w*|gefstd|stab|hauptquartier|hq|kommandoposten)(?=\s)/g, (m, pre) => { hq = true; return ' ' + (pre ? pre.replace(/s$/, '') : '') + ' '; });
  // Größe (Echelon), auch als Wortende: Panzerkompanie, Aufklärungszug, Spähtrupp
  let unitWord = '';
  const toks = t.trim().split(/\s+/).filter(Boolean), keep = [];
  for (const w of toks){
    let used = false;
    for (const [e, c] of ECHW){
      if (w === e || w === e + 'n' || w === e + 'en'){ F.ech = c; used = true; break; }
      if (w.length > e.length + 2 && w.endsWith(e) && e.length >= 3){
        const pre = w.slice(0, -e.length).replace(/s$/, '');
        if (UNIT.some(u => u.re.test(pre))){ F.ech = c; unitWord = unitWord || pre; used = true; break; }
      }
    }
    if (!used) keep.push(w);
  }
  t = ' ' + keep.join(' ') + ' ';

  const unitIn = w => { const u = UNIT.find(x => x.re.test(w)); return u ? u.k : ''; };

  t = t.replace(/\s(\w*?)(truppfuehrer|gruppenfuehrer|halbzugfuehrer|zugfuehrer|fahrzeugkommandant|kommandant|kompaniechef|kompaniefuehrer|batteriechef|staffelkapitaen|bataillonskommandeur|abteilungskommandeur|regimentskommandeur|brigadekommandeur|divisionskommandeur|kommandeur|kdr|fuehrer)(?=\s)/, (m, pre, w) => {
    leadW = true; F.lead = LEADW[w] || '00'; const p = pre.replace(/s$/, ''); indiv = (p && UNIT2IND[unitIn(p)]) || 'i_mil'; return ' ';
  });
  if (!indiv && !cmKey && F.ech === '00') for (const r of IND){ const m = t.match(r.re); if (m){ indiv = r.k; t = t.replace(m[0], ' '); break; } }
  if (!indiv && !cmKey && F.rank !== '00' && F.ech === '00') indiv = 'i_mil';
  // Gerät
  let eq = null, eqLabel = '';
  for (const e of EQ){ const m = t.match(e.re); if (m){ eq = e; eqLabel = e.lab(m[1]); t = t.replace(m[0], ' '); let r; while ((r = t.match(e.re))) t = t.replace(r[0], ' '); break; } }
  // Einheitenwort
  if (unitWord) F.key = F.key || unitIn(unitWord);
  const isUnit = !indiv && !cmKey && (F.ech !== '00' || hq || tf || (!eq && t.trim().split(/\s+/).some(w => unitIn(w))));
  const keep2 = [];
  for (const w of t.trim().split(/\s+/).filter(Boolean)){
    const k = unitIn(w);
    if (k && (isUnit || !eq)){ if (!F.key || F.key === 'u_none') F.key = k; continue; }
    if (k === 'u_aufkl' && eq){ if (!acts.includes('Aufklärung')) acts.push('Aufklärung'); continue; }
    if (k === 'u_ll' && eq){ notes.push('Den Luftlande-Zusatz (Schwingen unten im Rahmen) gibt es nach APP-6(D), 3.4.7, nur für Einheiten – Gerät hat keine Zusätze unten im Rahmen. Für einen Luftlandeverband z. B. „Luftlandezug feindlich auf BMD-4M“ schreiben.'); continue; }
    keep2.push(w);
  }
  // Anzahl
  let qty = '';
  const keep3 = [];
  for (const w of keep2){
    let m;
    if (!qty && (m = w.match(/^(\d{1,3})x?$/) || w.match(/^x(\d{1,3})$/))) { qty = m[1]; continue; }
    if (!qty && NUMW[w]) { qty = String(NUMW[w]); continue; }
    if (w === 'mehrere') { qty = qty || 'mehrere'; continue; }
    keep3.push(w);
  }

    if (qty && /^\d+$/.test(qty)) F.t = qty;
  } else if (indiv){
    if (indiv === 'i_mil' && F.key && UNIT2IND[F.key]) indiv = UNIT2IND[F.key];

    if (leadW && F.lead === '00') F.lead = ECH2LEAD[F.ech] || '00';
    F.ech = '00';
    if (eq && eqLabel) acts.unshift('mit ' + eqLabel);
    if (qty && qty !== '1') acts.unshift(qty + '×');

    if (eq && (!F.key || F.key === 'u_none') && EQ2UNIT[eq.k]){ F.key = EQ2UNIT[eq.k]; notes.push(`„${SYMS[eq.k].de}“ als Hinweis auf die Truppengattung gewertet: ${SYMS[F.key].de}.`); }

}

/* ---------- Zeichnen ---------- */
function sidcOf(F){
  const S = SYMS[F.key] || SYMS.u_none;
  const ent = F.ent && F.key && SYMS[F.key].s === '15' ? F.ent : S.e;
  const amp = S.s === '10' ? (F.ech || '00') : S.s === '15' ? (F.mob || '00') : '00';
  const hq = S.s === '10' ? (F.hq || '0') : /^(15|01|20|27)$/.test(S.s) && F.hq === '1' ? '1' : '0';
  let m1 = S.m1 || '00', m2 = S.m2 || '00';
  if (S.s === '27'){ if (F.lead && F.lead !== '00') m1 = F.lead; if (F.rank && F.rank !== '00') m2 = F.rank; }
  return '10' + '0' + F.ident + S.s + F.status + hq + amp + ent + m1 + m2;
}
function symOf(F, size){
  const o = {size:size || 90};
  if (F.qty) o.quantity = F.qty;
  if (F.type) o.type = F.type;
  if (F.info) o.additionalInformation = F.info;
  if (F.t) o.uniqueDesignation = F.t;
  if (F.dtg) o.dtg = F.dtg;
  if (F.speed) o.speed = F.speed;
  if (F.sphq && SYMS[F.key] && SYMS[F.key].s === '10') o.specialHeadquarters = F.sphq;
  if (F.dir !== '' && F.dir != null && !isNaN(+F.dir)) o.direction = +F.dir;
  return new ms.Symbol(sidcOf(F), o);
}

function opt(map, sel){ return Object.entries(map).map(([k, v]) => `<option value="${k}"${k === sel ? ' selected' : ''}>${esc(v)}</option>`).join(''); }
function symOptions(sel){
  const grp = (t, f) => `<optgroup label="${t}">${Object.entries(SYMS).filter(([k, s]) => f(k, s)).map(([k, s]) => `<option value="${k}"${k === sel ? ' selected' : ''}>${esc(s.de)}</option>`).join('')}</optgroup>`;
  const x = k => k.charAt(0) === 'x';
  return `<option value=""${!sel ? ' selected' : ''}>– bitte wählen –</option>` + grp('Landgerät', (k, s) => s.s === '15' && !x(k)) + grp('Einheiten', (k, s) => s.s === '10' && !x(k)) + grp('Einzelpersonen', (k, s) => s.s === '27' && !x(k)) + grp('Luftfahrzeuge', (k, s) => s.s === '01' && !x(k)) + grp('Punkte', (k, s) => s.s === '25' && !x(k)) + (Object.keys(SYMS).some(x) ? grp('Aus dem Katalog', k => x(k)) : '');
}
function dirOptions(sel){
  const s = sel == null ? '' : String(sel);
  let o = DIRS.map(([v, l]) => `<option value="${v}"${v === s ? ' selected' : ''}>${l}${v !== '' ? ' (' + v + '°)' : ''}</option>`).join('');
  if (s !== '' && !DIRS.some(d => d[0] === s)) o += `<option value="${s}" selected>${s}°</option>`;
  return o;
}

/* ---------- Zeichen ---------- */
const blank = () => ({kind:'', id:'', st:'0', ue:'', m1:'00', m2:'00', ek:'', sz:0, rad:0, mob:'00', ech:'00', hq:false, rr:'', dummy:false, C:'', V:'', T:'', M:'', H:'', W:'', dir:''});
function sidc(s){
  const u = s.kind !== 'e';
  const st = unsure(s.id) ? '0' : (s.st || '0');
  const hq = u ? String((s.hq ? 2 : 0) + (s.dummy ? 1 : 0)) : (s.dummy ? '1' : '0');
  const amp = u ? (s.ech || '00') : (s.mob || '00');
  const ent = u ? (s.ue || '000000') : (s.ek ? eqCode(s.ek, s.sz, s.rad) : '000000');
  return '100' + (s.id || '1') + (u ? '10' : '15') + st + hq + amp + ent + (u ? (s.m1 || '00') + (s.m2 || '00') : '0000');
}
const cache = new Map();
function svgOf(s, size, plain){
  const o = {size: size || 80};
  if (!plain){
    if (s.kind === 'e' && s.C) o.quantity = s.C;
    if (s.V) o.type = s.V;
    if (s.T) o.uniqueDesignation = s.T;
    if (s.M) o.higherFormation = s.M;
    if (s.H) o.additionalInformation = s.H;
    if (s.W) o.dtg = s.W;
    if (s.kind !== 'e' && s.rr) o.reinforcedReduced = s.rr;
    if (s.dir !== '' && s.dir != null) o.direction = +s.dir;
  }
  if (!s.id) o.monoColor = '#8E9997';
  const code = sidc(s), key = code + JSON.stringify(o);
  let v = cache.get(key);
  if (v === undefined){ try { v = new ms.Symbol(code, o).asSVG(); } catch (e){ v = ''; } if (cache.size > 1500) cache.clear(); cache.set(key, v); }
  return v;
}
function desc(s, noType){
  const p = [idOf(s.id).de];
  if (s.kind === 'u'){
    p.push(uOf(s.ue).de);
    if (s.m1 && s.m1 !== '00') p.push(m1De(s.m1));
    if (s.m2 && s.m2 !== '00') p.push(m2De(s.m2));
    if (s.ech !== '00') p.push(echDe(s.ech));
    if (s.hq) p.push('Gefechtsstand');
    if (s.rr) p.push(RR[s.rr]);
    if (s.T || s.M) p.push([s.T, s.M].filter(Boolean).join('/'));
  } else {
    p.push((s.C && s.C !== '1' ? s.C + ' × ' : '') + eqLabel(s.ek, s.sz, s.rad) + (s.V && !noType ? ` (${s.V})` : ''));
    p.push('Mobilität ' + mobDe(s.mob));
  }
  if (s.dummy) p.push('Attrappe');
  if (!unsure(s.id) && s.st === '1') p.push('vermutet bzw. geplant');
  if (s.dir !== '' && s.dir != null) p.push('Bewegung nach ' + dirOf(s.dir)[1]);
  return p.join(' · ');
}

const wpick = list => { const t = list.reduce((n, x) => n + (x.w || 1), 0); let r = Math.random() * t; for (const x of list){ r -= x.w || 1; if (r < 0) return x; } return list[0]; };
const REGS = ['31','26','292','122','371','212','33'];
function dtgNow(d){ d = d || new Date(); const h = -d.getTimezoneOffset() / 60; const z = h === 0 ? 'Z' : h > 0 ? ('ABCDEFGHIKLM'[h - 1] || 'Z') : ('NOPQRSTUVWXY'[-h - 1] || 'Z');
  return p2(d.getDate()) + p2(d.getHours()) + p2(d.getMinutes()) + z + MON[d.getMonth()] + String(d.getFullYear()).slice(2); }
function dtgRnd(){ const d = new Date(); return p2(rnd(1, 28)) + p2(rnd(0, 23)) + p2(rnd(0, 59)) + pick(['Z','A','B']) + MON[d.getMonth()] + String(d.getFullYear()).slice(2); }

/* Erzeugt eine Meldung: txt (Meldetext), A (was richtig ist), sol (Musterlösung als Zeichen), why (Begründung) */
function genTask(lvl, forceKind){
  const idc = pick(['6','6','6','6','6','6','6','6','5','5','1','3','3','4','2']);
  let certain = !unsure(idc);
  const A = {kind:'', id:idc, st:'0', ue:null, ek:null, sz:null, rad:null, mob:null, ech:'00', hq:false, rr:'', dummy:false, C:'', V:null, T:'', M:'', W:'', dir:'', lvl};
  const sol = Object.assign(blank(), {id:idc});
  let txt = idOf(idc).ph + ': ', why = '', act = '', plural = false;
  const kind = forceKind || (chance(.55) ? 'e' : 'u');
  if (kind === 'e' && !['6', '5', '1'].includes(idc)){ A.id = sol.id = pick(['6', '6', '6', '5', '1']); txt = idOf(A.id).ph + ': '; }
  A.kind = sol.kind = kind;
  if (kind === 'e'){
    const v = pick(VEH), k = v.ek[0], rm = v.repMob ? pick(v.repMob) : null, name = pick(v.v);
    const qty = lvl >= 2 ? pick([1, 1, 2, 2, 3, 4]) : 1;
    plural = qty > 1;
    Object.assign(A, {ek:v.ek, sz:v.sz === undefined ? null : v.sz, rad:v.rad === undefined ? null : v.rad, mob:rm ? [rm[1]] : v.mob, C:qty > 1 ? String(qty) : '', V:lvl >= 2 ? v.tok : null});
    const sz = byEk(A.sz, k), rd = byEk(A.rad, k);
    Object.assign(sol, {ek:k, sz:sz ? sz[0] : 0, rad:rd ? rd[0] : 0, mob:A.mob[0], C:A.C, V:name});
    txt += (qty > 1 ? qty + ' × ' : '') + name + (rm ? ' ' + rm[0] : '');
    if (lvl >= 2 && chance(.1)){ A.dummy = sol.dummy = true; txt += plural ? ', Attrappen' : ', Attrappe'; }
    why = v.w; A.veh = v;
  } else {
    const friendly = idc === '3' || idc === '2';
    const t = wpick(friendly ? UT.filter(x => x.fr) : UT), e = pick(t.ech);
    let name = friendly ? t.fr : pick(t.n);
    const echw = t.bat && e === '15' ? 'Batterie' : ECHW[e];
    Object.assign(A, {ue:[t.ue], ech:e, m1:t.m1acc || [t.m1 || '00'], m2:t.m2acc || [t.m2 || '00']}); Object.assign(sol, {ue:t.ue, ech:e, m1:t.m1 || '00', m2:t.m2 || '00'});
    let head = `${echw} ${name}`;
    if (lvl >= 2 && (e === '14' || e === '15') && chance(.14)){ A.hq = sol.hq = true; head = `Gefechtsstand ${echw} ${name}`; }
    if (lvl >= 2 && friendly){
      const reg = pick(REGS), c = rnd(1, 6);
      const T = e === '15' ? c + '.' : rnd(1, 4) + '.';
      const M = e === '15' ? reg : c + './' + reg;
      A.T = sol.T = T; A.M = sol.M = M;
      head = `${T}/${M} – ${head}`;
    }
    txt += head;
    if (lvl >= 2 && chance(.12)){ const r = pick(['+', '-']); A.rr = sol.rr = r; txt += r === '+' ? ', verstärkt' : ', geschwächt'; }
    why = 'Einheit: Icon ' + uOf(t.ue).de + (t.m1 ? ', Zusatz oben im Rahmen ' + m1De(t.m1) : '') + (t.m2 ? ', Zusatz unten im Rahmen ' + m2De(t.m2) : '') + ', Echelon ' + echDe(e) + ' über dem Rahmen.' + (t.m2acc ? ' Zusatz „gezogen“ unten im Rahmen ist freigestellt.' : '');
  }
  certain = !unsure(A.id);
  if (lvl >= 2 && certain && chance(.14)){ A.st = sol.st = '1'; txt += ', Standort vermutet (nicht bestätigt)'; }
  if (lvl >= 3){
    if (!A.dummy && chance(.75)){
      const d = pick(DIRS); A.dir = sol.dir = d[0];
      if (kind === 'e'){ const vb = pick([['fährt','fahren','in Bewegung'], ['bewegt sich','bewegen sich','in Bewegung'], ['stößt vor','stoßen vor','Vorstoß']]); txt += `, ${plural ? vb[1] : vb[0]} nach ${d[2]}`; act = vb[2]; }
      else { const vb = pick([['bewegt sich nach','in Bewegung'], ['greift an Richtung','Angriff'], ['klärt auf Richtung','Aufklärung'], ['zieht sich zurück nach','Rückzug'], ['stößt vor Richtung','Vorstoß']]); txt += `, ${vb[0]} ${d[2]}`; act = vb[1]; }
    } else {
      const vb = kind === 'e' ? pick(A.dummy ? [['steht','stehen','Halt'], ['ist in Stellung','sind in Stellung','in Stellung']] : [['steht','stehen','Halt'], ['ist in Stellung','sind in Stellung','in Stellung'], ['feuert','feuern','feuert']]) : pick([['in Stellung','in Stellung'], ['gräbt sich ein','in Stellung'], ['hält','Halt'], ['in Bereitstellung','Bereitstellung']]);
      txt += ', ' + (kind === 'e' ? (plural ? vb[1] : vb[0]) : vb[0]); act = vb[vb.length - 1];
    }
    A.W = sol.W = dtgRnd(); txt += `. Zeit ${A.W}`;
  }
  sol.H = act;
  return {txt: txt + '.', A, sol, why};
}
function genVeh(){

  const v = pick(list), im = pick(VIMG[v.f].img), k = v.ek[0];

/* ---------- Prüfen ---------- */
const normT = x => String(x || '').trim().toUpperCase().replace(/\s+/g, '');
const normC = x => { x = String(x || '').trim().replace(/[x×]/gi, '').trim(); return x === '1' ? '' : x; };
const normW = x => String(x || '').toUpperCase().replace(/\s+/g, '').replace(/([A-Z]{3})20(\d{2})$/, '$1$2');
function vMatch(inp, toks){
  const n = String(inp || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (!n) return false;
  return toks.some(t => { let i = n.indexOf(t); while (i >= 0){ if (!/[0-9]$/.test(t) || !/[0-9]/.test(n.charAt(i + t.length))) return true; i = n.indexOf(t, i + 1); } return false; });
}
function checks(s, A){
  const r = [], add = (l, ok) => r.push([l, !!ok]);
  add('Einheit oder Gerät', s.kind === A.kind);
  add('Rahmen', s.id === A.id);
  if (A.kind === 'u'){
    add('Icon', s.kind === 'u' && A.ue.includes(s.ue));
    const am1 = A.m1 || ['00'], am2 = A.m2 || ['00'];
    if (am1.join() !== '00' || (s.m1 || '00') !== '00') add('Zusatz oben im Rahmen', am1.includes(s.m1 || '00'));
    if (am2.join() !== '00' || (s.m2 || '00') !== '00') add('Zusatz unten im Rahmen', am2.includes(s.m2 || '00'));
    add('Echelon', s.kind === 'u' && s.ech === A.ech);
    if (A.hq || s.hq) add('Gefechtsstand', s.hq === A.hq);
    if (A.rr || s.rr) add('Verstärkt / vermindert', s.rr === A.rr);
    if (A.T || s.T) add('Links (T)', normT(s.T) === normT(A.T));
    if (A.M || s.M) add('Rechts (M)', normT(s.M) === normT(A.M));
  } else {
    const okI = s.kind === 'e' && A.ek.includes(s.ek);
    add('Icon', okI);
    if (okI){
      const q = eqOf(s.ek), sz = byEk(A.sz, s.ek);
      if (q.sz) add(q.ada ? 'Reichweite' : 'Größe (Striche)', (sz || [0]).includes(s.sz));
      const rd = byEk(A.rad, s.ek);
      if (q.ada) add('Radar', (rd || [0]).includes(s.rad));
    }
    if (A.mob) add('Mobilität', s.kind === 'e' && A.mob.includes(s.mob));
    add('Anzahl (C)', normC(s.C) === normC(A.C));
    if (A.V) add('Typ (V)', vMatch(s.V, A.V));
  }
  if (!unsure(A.id) && (A.st !== '0' || (s.st !== '0' && !unsure(s.id)))) add('Linie (Status)', (unsure(s.id) ? '0' : s.st) === A.st);
  if (A.dummy || s.dummy) add('Attrappe', s.dummy === A.dummy);
  if (A.lvl >= 3 || s.W) add('Zeit (W)', normW(s.W) === normW(A.W));
  if (A.lvl >= 3 || s.dir !== '') add('Richtung', String(s.dir) === String(A.dir));
  return r;
}
function altText(A){
  if (!A.veh) return '';
  const n = [];
  if (A.veh.ein) n.push('Grenzfall: Die Vorschrift regelt dieses Fahrzeug nicht eindeutig – das Zeichen ist eine Einordnung nach Bauart und Hauptbewaffnung.');
  if (!A.mob) n.push('Mobilität wird hier nicht bewertet, weil das Fahrzeug auf verschiedenen Trägern vorkommt.');
  return n.join(' ');
}

  else W.task = genVeh();
  W.t0 = performance.now();
  renderWork(true);
  startTimer();
  window.scrollTo(0, 0);
}
function startTimer(){
  clearInterval(tick);
  if (!W || W.mode === 'baukasten' || W.done) return;
  const upd = () => { const el = $('#w-tm'); if (el) el.textContent = Math.round((performance.now() - W.t0) / 1000) + ' s'; };
  upd(); tick = setInterval(upd, 500);
}
function resultHtml(ok, list, sec){
  const t = W.task;
  const alt = altText(t.A);
  return `<div class="fb" style="--c:${ok ? 'var(--ok)' : 'var(--bad)'}"><div class="v">${ok ? 'Richtig' : 'Noch nicht ganz'}${sec != null ? ` <span class="muted" style="font-size:1rem;font-weight:600">· ${Math.round(sec)} s</span>` : ''}</div>
    <ul class="chk">${list.map(([l, k]) => `<li class="${k ? 'ok' : 'bad'}">${k ? '✓' : '✗'} ${esc(l)}</li>`).join('')}</ul>
    ${W.shown ? `<p style="margin-top:10px"><b>Lösung:</b> ${esc(desc(t.sol))}</p>${t.sol.H ? `<p class="muted">Tätigkeit „${esc(t.sol.H)}“ darf als Text in Feld H stehen – wird nicht bewertet.</p>` : ''}<p>${esc(t.why || '')}</p>${alt ? `<p class="muted">${esc(alt)}</p>` : ''}` : ''}</div>`;
}
function doCheck(){
  const list = checks(W.s, W.task.A), ok = list.every(x => x[1]);
  let sec = null;
  if (!W.done){
    W.done = true; clearInterval(tick);
    sec = (performance.now() - W.t0) / 1000;
    const mode = W.mode === 'meldung' ? 'meldung' : 'fahrzeug';
    rec(mode, ok);
    if (ok && W.mode === 'meldung' && (S.best == null || sec < S.best)){ S.best = sec; save(); }
    W.sec = sec;
  }
  if (ok) W.shown = true;
  $('#w-res').innerHTML = resultHtml(ok, list, W.sec);
  refreshPrev(); $('#w-act').innerHTML = actHtml();
  $('#w-head').scrollIntoView({block:'start'});
}
function doSolve(){
  if (!W.done){ W.done = true; clearInterval(tick); W.sec = null; rec(W.mode === 'meldung' ? 'meldung' : 'fahrzeug', false); }
  W.shown = true;
  const list = checks(W.s, W.task.A);
  $('#w-res').innerHTML = resultHtml(list.every(x => x[1]), list, W.sec);
  refreshPrev(); $('#w-act').innerHTML = actHtml();
  $('#w-head').scrollIntoView({block:'start'});
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || !W || $('#v-work').hidden) return;
  if (b.dataset.b != null){
    const i = b.dataset.b.indexOf(':'), k = b.dataset.b.slice(0, i), v = b.dataset.b.slice(i + 1), s = W.s;
    if (k === 'kind'){ if (s.kind !== v){ Object.assign(s, {kind:v, ue:'', m1:'00', m2:'00', ek:'', sz:0, rad:0, mob:'00', ech:'00', hq:false, rr:'', C:v === 'e' ? s.C : ''}); } }
    else if (k === 'id'){ s.id = v; if (unsure(v)) s.st = '0'; }
    else if (k === 'ek'){ if (s.ek !== v){ s.ek = v; s.sz = 0; s.rad = 0; } }
    else if (k === 'sz'){ s.sz = +v; if (!s.sz) s.rad = 0; }
    else if (k === 'rad'){ s.rad = +v; }
    else if (k === 'hq'){ s.hq = !s.hq; }
    else if (k === 'dummy'){ s.dummy = !s.dummy; }
    else if (k === 'st'){ s.st = v; }
    else if (k === 'now'){ s.W = dtgNow(); }
    else s[k] = v;
    const y = window.scrollY;
    refreshPrev(); $('#w-b').innerHTML = builderHtml();
    window.scrollTo(0, y);
    return;
  }
  const a = b.dataset.w; if (!a) return;
  if (a === 'check') doCheck();
  else if (a === 'solve') doSolve();
  else if (a === 'next') startWork(W.mode);
  else if (a === 'reset'){ W.s = blank(); renderWork(false); }
  else if (a === 'png' && W.s.kind){ try { const sid = sidc(W.s); const c = new ms.Symbol(sid, Object.assign({size:90}, symOpts(W.s))).asCanvas(3); c.toBlob(bl => { if (!bl) return; const l = document.createElement('a'); l.href = URL.createObjectURL(bl); l.download = 'zeichen.png'; document.body.append(l); l.click(); l.remove(); }, 'image/png'); } catch (err){} }
});
function symOpts(s){ const o = {}; if (s.kind === 'e' && s.C) o.quantity = s.C; if (s.V) o.type = s.V; if (s.T) o.uniqueDesignation = s.T; if (s.M) o.higherFormation = s.M; if (s.H) o.additionalInformation = s.H; if (s.W) o.dtg = s.W; if (s.kind !== 'e' && s.rr) o.reinforcedReduced = s.rr; if (s.dir !== '') o.direction = +s.dir; return o; }
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.t; if (!k || !W) return;
  W.s[k] = e.target.value; refreshPrev();
});
document.addEventListener('change', e => {
  if (e.target.id === 'w-lvl'){ S.lvl = +e.target.value; save(); startWork('meldung'); }
  else if (e.target.id === 'w-lab'){ S.labels = e.target.checked; save(); $('#w-b').innerHTML = builderHtml(); }
  else if (e.target.id === 'w-names'){ S.names = e.target.checked; save(); $('#w-head').innerHTML = headHtml(); startTimer(); }
});

/* ---------- Symbole lesen ---------- */
let R = null;
function mutate(s){
  const m = Object.assign({}, s);
  const keys = ['id', 'icon', 'dir', 'dummy'];
  if (s.kind === 'u') keys.push('ech', 'ech', 'hq', 'm2'); else { keys.push('mob', 'mob'); if (eqOf(s.ek).sz) keys.push('sz', 'sz'); }
  if (!unsure(s.id)) keys.push('st');
  for (const k of shuffle(keys).slice(0, rnd(1, 2))){
    if (k === 'id') m.id = pick(IDS.filter(i => i.c !== s.id)).c;
    if (k === 'icon'){ if (s.kind === 'u') m.ue = pick(UNITS.filter(u => u.e !== s.ue)).e; else { m.ek = pick(EQI.filter(q => q.k !== s.ek && q.k.slice(0, 2) !== s.ek.slice(0, 2))).k; m.sz = 0; m.rad = 0; } }
    if (k === 'dir') m.dir = s.dir === '' ? pick(DIRS)[0] : pick(DIRS.filter(d => d[0] !== s.dir).concat([['']]))[0];
    if (k === 'dummy') m.dummy = !s.dummy;
    if (k === 'ech') m.ech = pick(['11','12','13','14','15'].filter(x => x !== s.ech));
    if (k === 'hq') m.hq = !s.hq;
    if (k === 'm2') m.m2 = pick(M2.filter(x => x[0] !== (s.m2 || '00')).slice(0, 3))[0];
    if (k === 'mob') m.mob = pick(MOBS.filter(x => x[0] !== s.mob))[0];
    if (k === 'sz'){ m.sz = pick([0, 1, 2, 3].filter(x => x !== s.sz)); if (!m.sz) m.rad = 0; }
    if (k === 'st') m.st = s.st === '1' ? '0' : '1';
  }
  if (unsure(m.id)) m.st = '0';
  return m;
}
function nextRead(){
  const t = genTask(3);
  const s = Object.assign({}, t.sol, {V:'', H:''});
  if (chance(.5)) s.W = '';
  const right = desc(s), set = new Set([right]); let n = 0;
  while (set.size < 4 && n++ < 120) set.add(desc(mutate(s)));
  R = {s, right, opts:shuffle([...set]), done:false, why:t.why};
  renderRead();
}
function renderRead(){
  const m = S.m.lesen || {n:0, ok:0};
  $('#v-read').innerHTML = `<a class="hublink" href="#">‹ Übersicht</a>
    <div class="qmeta"><span class="chip-cat">Symbol lesen</span><span>${m.ok} von ${m.n} richtig</span></div>
    <p class="prompt">Was zeigt das Zeichen?</p>
    <div class="symbox">${svgOf(R.s, 84)}</div>
    <div class="opts" style="margin-top:14px">${R.opts.map((o, i) => `<button type="button" class="opt${R.done ? (o === R.right ? ' correct' : o === R.pick ? ' wrong' : ' dim') : ''}" data-o="${i}"${R.done ? ' disabled' : ''}><span class="k">${'ABCD'[i]}</span><span class="ot">${esc(o)}</span></button>`).join('')}</div>
    ${R.done ? `<div class="fb" style="--c:${R.pick === R.right ? 'var(--ok)' : 'var(--bad)'}"><div class="v">${R.pick === R.right ? 'Richtig' : 'Falsch'}</div><p>${esc(R.right)}</p>${R.s.kind === 'e' && R.why ? `<p class="muted">${esc(R.why)}</p>` : ''}</div><div class="row"><button type="button" class="btn main" data-r="next">Weiter</button></div>` : ''}`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || $('#v-read').hidden) return;
  if (b.dataset.o != null && R && !R.done){ R.done = true; R.pick = R.opts[+b.dataset.o]; rec('lesen', R.pick === R.right); renderRead(); }
  else if (b.dataset.r === 'next'){ nextRead(); window.scrollTo(0, 0); }
});

/* ---------- Fahrzeugliste ---------- */
function vehSol(v){ const k = v.ek[0], sz = byEk(v.sz, k), rd = byEk(v.rad, k); return Object.assign(blank(), {kind:'e', id:'6', ek:k, sz:sz ? sz[0] : 0, rad:rd ? rd[0] : 0, mob:v.mob[0]}); }
function renderList(){
  const q = ($('#l-q') && $('#l-q').value || '').toLowerCase();
  if (!$('#l-out')){
    $('#v-list').innerHTML = `<a class="hublink" href="#">‹ Übersicht</a><h2 class="wt">Fahrzeuge KR Rot und ihr Zeichen</h2>
      <p class="muted" style="margin:4px 0 10px">Alle Fahrzeuge aus Manöver-, Artillerie- und Flugabwehr-Trainer als Gerätezeichen (feindlich), je eine Musterlösung. Größen nach APP-6(D), Table 3-19. „Grenzfall“ heißt: Die Vorschrift regelt das Fahrzeug nicht eindeutig, das Zeichen ist eine Einordnung nach Bauart und Hauptbewaffnung.</p>
      <input class="search" id="l-q" type="search" placeholder="Suchen, z. B. BMP, 2S19, Tor" aria-label="Fahrzeug suchen"><div id="l-out"></div>`;
  }
  let h = '';
  for (const src of ['m', 'a', 'f']){
    const list = VEH.filter(v => v.s === src && (!q || (vName(v) + ' ' + v.v.join(' ') + ' ' + eqOf(v.ek[0]).de).toLowerCase().includes(q)));
    if (!list.length) continue;
    h += `<h3 class="lh3">${SRC[src]}</h3>` + list.map(v => {
      const s = vehSol(v), im = VIMG[v.f] && VIMG[v.f].img && VIMG[v.f].img[0];
      return `<div class="vrow">${im ? `<img src="${esc(im[0])}" alt="" loading="lazy">` : '<span class="noimg"></span>'}<div class="vt"><b>${esc(vName(v))}</b><p>${esc(eqLabel(s.ek, s.sz, s.rad))} · ${v.repMob ? 'Mobilität nach Träger' : 'Mobilität ' + esc(mobDe(s.mob))}${v.ein ? ' · <span class="gf">Grenzfall</span>' : ''}</p><p class="vw">${esc(v.w)}</p></div><div class="vs">${svgOf(s, 34, true)}</div></div>`;
    }).join('');
  }
  $('#l-out').innerHTML = h || '<p class="muted">Nichts gefunden.</p>';
}
document.addEventListener('input', e => { if (e.target.id === 'l-q') renderList(); });

/* ---------- Übersicht ---------- */
function cell(label, m){ const p = m && m.n ? m.ok / m.n : null; return `<div class="cell" data-s="${p == null ? '' : p >= .8 ? 'ok' : p >= .5 ? 'mid' : 'bad'}"><b>${p == null ? '–' : Math.round(p * 100) + ' %'}</b><span>${label}${m && m.n ? ` · ${m.n}` : ''}</span><i style="width:${p == null ? 0 : Math.max(4, p * 100)}%"></i></div>`; }
function renderHome(){
  const ex = Object.assign(blank(), {kind:'e', id:'6', ek:'kpz', mob:'33', C:'3', V:'T-72B3', dir:'270'});
  $('#v-home').innerHTML = `<section class="hero"><a class="hublink" href="../">‹ Alle Trainer</a><h1>Symbole</h1>
      <p>Aus der Feindmeldung schnell das richtige taktische Zeichen nach APP-6 – Einheiten vom Trupp bis zur Kompanie und alle Fahrzeuge KR Rot aus den Trainern.</p></section>
    <a class="cta" href="#meldung"><span><strong>Feindmeldung zeichnen</strong><small>Meldung lesen, Zeichen aus Bausteinen bauen, auf Zeit</small></span><span class="go">›</span></a>
    <div class="board"><div class="cells">${cell('Meldungen', S.m.meldung)}${cell('Fahrzeuge', S.m.fahrzeug)}${cell('Lesen', S.m.lesen)}<div class="cell"><b>${S.best != null ? Math.round(S.best) + ' s' : '–'}</b><span>Bestzeit Meldung</span><i style="width:0"></i></div></div></div>
    <div class="modes"><h3>Üben</h3>
      <a class="mode" href="#fahrzeug"><span class="mi"><strong>Fahrzeug zeichnen</strong><small>Bild eines Fahrzeugs KR Rot – das Gerätezeichen mit Größe und Mobilität bauen</small></span><span class="n">›</span></a>
      <a class="mode" href="#lesen"><span class="mi"><strong>Symbol lesen</strong><small>Ein Zeichen, vier Beschreibungen – welche stimmt?</small></span><span class="n">›</span></a>
      <h3>Nachschlagen und Werkzeuge</h3>
      <a class="mode" href="#liste"><span class="mi"><strong>Fahrzeugliste</strong><small>Alle ${VEH.length} Fahrzeuge mit ihrem Zeichen und der Begründung</small></span><span class="n">›</span></a>
      <a class="mode" href="#baukasten"><span class="mi"><strong>Baukasten</strong><small>Zeichen frei zusammensetzen – mit Namen unter den Bausteinen</small></span><span class="n">›</span></a>
      <a class="mode" href="#generator"><span class="mi"><strong>Generator</strong><small>Lage eintippen, das Zeichen wird gezeichnet – mit Katalog aller Symbole und Legende</small></span><span class="n">›</span></a>
    </div>
    <div class="demo" style="margin-top:20px">${svgOf(ex, 60)}</div>
    <div class="foot"><p>Zeichen nach APP-6(D) (Study Draft 1, Okt. 2015) bzw. MIL-STD-2525D, gezeichnet mit milsymbol (MIT-Lizenz, © Måns Beckman). Größen und Reichweiten nach Table 3-19; wo die Vorschrift keine Klassen nennt, ohne Striche. Fahrzeuge, die die Vorschrift nicht eindeutig regelt, sind in der Fahrzeugliste als Grenzfall markiert. Für verbindliche Lagedarstellung gelten die Vorschriften deines Verbands.</p></div>`;
}

/* ---------- Ansichten ---------- */
const ROUTES = {'':'home', meldung:'work', fahrzeug:'work', baukasten:'work', lesen:'read', liste:'list', generator:'gen'};
const TITLES = {'':'Symbole', meldung:'Feindmeldung zeichnen', fahrzeug:'Fahrzeug zeichnen', baukasten:'Baukasten', lesen:'Symbol lesen', liste:'Fahrzeugliste', generator:'Generator'};
function route(){
  const h = location.hash.replace(/^#/, '');
  const v = ROUTES[h] || 'home';
  for (const id of ['home', 'work', 'read', 'list', 'gen']) $('#v-' + id).hidden = id !== v;
  $('#bart').textContent = TITLES[h] || 'Symbole';
  if (v !== 'work') clearInterval(tick);
  if (v === 'work') startWork(h, true);
  else if (v === 'read'){ if (!R) nextRead(); else renderRead(); }
  else if (v === 'list') renderList();
  else if (v === 'home') renderHome();
  if (v !== 'work') window.scrollTo(0, 0);
}
addEventListener('hashchange', route);
route();
/* Für den Generator: Kurzbezeichnung → Zeichen aus der Fahrzeugliste (längster passender Typ gewinnt) */
window.__vehSym = label => {
  const n = String(label || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); if (!n) return null;
  let best = null, bl = 0;
  for (const v of VEH){ if (v.noGen) continue; for (const t of v.tok){ if (t.length > bl && vMatch(n, [t])){ best = v; bl = t.length; } } }
  if (!best) return null;
  const k = best.ek[0], sz = byEk(best.sz, k), rd = byEk(best.rad, k);
  return {ent:eqCode(k, sz ? sz[0] : 0, rd ? rd[0] : 0), mob:best.repMob ? null : best.mob[0], n:vName(best)};
};
window.__st = {genTask, genVeh, checks, sidc, VEH, VIMG, EQI, get W(){ return W; }};
})();
