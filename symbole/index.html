<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Symbol-Generator</title>
<meta name="theme-color" content="#E4E9E7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1517" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="JTAC">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/app.css">
<style>
/* Symbol-Generator im Look der Trainer-Reihe */
:root{
  --bg:#E4E9E7; --surface:#F4F7F5; --surface2:#E9EEEC; --ink:#1A2326; --muted:#55615F; --line:#C3CCC9;
  --ok:#2A7848; --ok-bg:#DCEEE2; --bad:#B0382B; --bad-bg:#F6DEDA; --unk:#7A6A2E; --unk-bg:#F1E9CF;
  --cta:#E0A526; --cta-ink:#1A2326; --radio:#0F1A1C; --radio-ink:#F2B632;
  --font-d:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --font-b:"Barlow","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-m:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1517; --surface:#172022; --surface2:#1D282B; --ink:#E1E7E5; --muted:#93A09D; --line:#2A3639;
    --ok:#56B57F; --ok-bg:#16301F; --bad:#E36D5E; --bad-bg:#3A1C18; --unk:#D9C17A; --unk-bg:#2E2913;
    --cta:#E3AA2E; --cta-ink:#111719; --radio:#06090A; --radio-ink:#F2B632; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1517; --surface:#172022; --surface2:#1D282B; --ink:#E1E7E5; --muted:#93A09D; --line:#2A3639;
  --ok:#56B57F; --ok-bg:#16301F; --bad:#E36D5E; --bad-bg:#3A1C18; --unk:#D9C17A; --unk-bg:#2E2913;
  --cta:#E3AA2E; --cta-ink:#111719; --radio:#06090A; --radio-ink:#F2B632; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--cta);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-block:12px 56px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-d);line-height:1.1;margin:0;text-wrap:balance}
h2{font-size:1.35rem;font-weight:600}
.muted{color:var(--muted)}
.code{font-family:var(--font-m);font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}

/* Kopfleiste */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:720px;margin:0 auto;padding-block:8px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px;min-height:52px}
.bar .t{font-family:var(--font-d);font-weight:600;font-size:1.2rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:40px;height:40px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:500;white-space:nowrap}
.tag{font-family:var(--font-d);font-size:1rem;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.prog{height:3px;background:var(--line)}
.prog>i{display:block;height:100%;background:var(--cta);transition:width .25s}

/* Übersicht */
.hero{padding:26px 0 14px}
.hero h1{font-size:clamp(3rem,13vw,5.2rem);font-weight:700;letter-spacing:-.015em;line-height:.9}
.hero p{max-width:34em;margin:12px 0 0;color:var(--muted);font-size:1.05rem}
.radioline{display:inline-block;margin-top:14px;background:var(--radio);color:var(--radio-ink);font-family:var(--font-m);font-size:.82rem;font-weight:500;letter-spacing:.04em;padding:6px 12px;border-radius:6px;max-width:100%;overflow-wrap:anywhere}
.board{margin:16px 0 22px}
.board h3{font-size:1rem;color:var(--muted);margin:14px 0 6px;letter-spacing:.06em;text-transform:uppercase}
.cells{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
@media (min-width:560px){.cells{grid-template-columns:repeat(4,minmax(0,1fr))}}
.cell{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 9px 12px;overflow:hidden;min-width:0}
.cell[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.cell b{display:block;font-family:var(--font-d);font-weight:700;font-size:1.25rem;line-height:1;font-variant-numeric:tabular-nums}
.cell span{display:block;font-size:.78rem;color:var(--muted);line-height:1.25;margin-top:3px}
.cell i{position:absolute;left:0;bottom:0;height:5px;background:var(--line)}
.cell[data-s="bad"] i{background:var(--bad)} .cell[data-s="mid"] i{background:var(--cta)} .cell[data-s="ok"] i{background:var(--ok)}
.filtnote{font-size:.88rem;color:var(--muted);margin-top:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cta{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;background:var(--cta);color:var(--cta-ink);border:0;border-radius:10px;padding:16px 18px;text-align:left}
.cta strong{font-family:var(--font-d);font-size:1.5rem;font-weight:700;display:block;line-height:1.05}
.cta small{display:block;font-size:.9rem;opacity:.85}
.cta .go{font-family:var(--font-d);font-size:1.6rem;font-weight:700}
.modes{margin-top:20px;border-top:1px solid var(--line)}
.modes h3{font-size:1rem;color:var(--muted);margin:16px 0 2px;letter-spacing:.06em;text-transform:uppercase}
.mode{display:flex;width:100%;gap:14px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:13px 2px}
.mode .mi{flex:1;min-width:0}
.mode strong{display:block;font-family:var(--font-d);font-size:1.3rem;font-weight:600;line-height:1.1}
.mode small{display:block;color:var(--muted);font-size:.9rem;margin-top:2px}
.mode .n{font-family:var(--font-d);font-size:1.05rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.mode:hover strong{text-decoration:underline;text-underline-offset:3px}
.mode[disabled]{opacity:.45;cursor:default}
.foot{margin-top:26px;font-size:.84rem;color:var(--muted);max-width:42em}
.foot p{margin:0 0 8px}
.foot a{color:var(--ink);text-underline-offset:3px}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-weight:600}

/* Frage */
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0 10px;font-size:.9rem;color:var(--muted)}
.chip-cat{display:inline-block;font-family:var(--font-d);font-weight:700;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;background:var(--ink);color:var(--bg);border-radius:5px;padding:2px 9px}
.prompt{font-family:var(--font-d);font-size:1.55rem;font-weight:600;line-height:1.15;margin:6px 0 14px}
.bigcode{display:inline-block;background:var(--radio);color:var(--radio-ink);font-family:var(--font-m);font-weight:700;font-size:clamp(1.5rem,7vw,2.1rem);letter-spacing:.06em;padding:10px 18px;border-radius:8px;margin:4px 0 14px;max-width:100%;overflow-wrap:anywhere}
.defbox{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--cta);border-radius:0 10px 10px 0;padding:12px 16px;margin:4px 0 14px;font-size:1.05rem}
.lage{background:var(--radio);color:#DCE5E2;border-radius:10px;padding:12px 16px;margin:4px 0 12px}
.lage .lh{font-family:var(--font-m);font-size:.74rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--radio-ink)}
.lage p{margin:4px 0 0}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;line-height:1.35}
.opt .k{flex:none;width:26px;height:26px;border-radius:6px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-weight:700;color:var(--muted);font-size:.95rem}
.opt .ot{min-width:0;overflow-wrap:anywhere}
.opt .ot.code{white-space:normal;font-size:1.02rem}
.opt:not([disabled]):hover{border-color:var(--ink)}
.opt[disabled]{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)} .opt.correct .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)} .opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.seq{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.seq .code{font-size:.92rem}
.seq .ar{color:var(--muted);font-weight:700}
.inp{display:block;width:100%;font-family:var(--font-m);font-weight:700;font-size:1.15rem;letter-spacing:.05em;text-transform:uppercase;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:13px 14px}
.inp:focus{border-color:var(--ink);outline:none}
.inp[readonly]{border-style:dashed}
.fhint{font-size:.86rem;color:var(--muted);margin-top:5px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:11px 15px;font-weight:600}
.btn.main{background:var(--ink);color:var(--bg);border-color:var(--ink);flex:1;min-width:9em}
.btn.flagged{border-color:var(--bad);color:var(--bad)}
.fb{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c,var(--ok));border-radius:10px;padding:14px 16px}
.fb .v{font-family:var(--font-d);font-size:1.4rem;font-weight:700;color:var(--c)}
.fb p{margin:6px 0 0}
.entry{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.entry .hd{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.entry .hd .code{font-size:1.05rem}
.entry .lf{font-family:var(--font-d);font-size:1.15rem;font-weight:600}
.entry .en{font-size:.88rem;color:var(--muted);font-style:italic;margin-top:4px}
.entry .nt{font-size:.94rem;margin-top:6px}
.pill{display:inline-block;font-size:.78rem;font-weight:600;border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:1px 9px;color:var(--muted)}

/* Ergebnis */
.score{font-family:var(--font-d);font-size:5rem;font-weight:700;line-height:.9;margin:26px 0 4px;font-variant-numeric:tabular-nums}
.score small{font-size:2rem;color:var(--muted);font-weight:600}
.misslist{list-style:none;padding:0;margin:12px 0 0;border-top:1px solid var(--line)}
.misslist li{padding:10px 0;border-bottom:1px solid var(--line)}
.misslist .code{font-size:.95rem}

/* Glossar */
.seg{display:flex;gap:0;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;margin:14px 0 10px}
.seg button{flex:1;border:0;background:var(--surface);padding:10px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.search{display:block;width:100%;font:inherit;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px}
.gl h3{font-size:1rem;color:var(--muted);margin:20px 0 4px;letter-spacing:.06em;text-transform:uppercase}
.gl dl{margin:0}
.gl .it{padding:10px 0;border-bottom:1px solid var(--line)}
.gl .it .hd{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.gl .it .code{font-size:1rem}
.gl .it p{margin:3px 0 0}
.gl .it .en{font-size:.86rem;color:var(--muted);font-style:italic}
.gl .empty{color:var(--muted);margin-top:16px}

/* Statistik */
.stat-top{display:flex;gap:28px;margin:18px 0 6px;flex-wrap:wrap}
.stat-top b{display:block;font-family:var(--font-d);font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.srow{display:grid;grid-template-columns:minmax(0,10em) 1fr 4.2em;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.94rem}
.sbar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.sbar i{display:block;height:100%}
.confirm{margin-top:10px;padding:12px 14px;border:1px solid var(--bad);background:var(--bad-bg);border-radius:8px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* Symbol-Generator */
.lbl{display:block;font-weight:600;color:var(--muted);margin:6px 0 5px}
.inp.big{text-transform:none;letter-spacing:0;font-family:var(--font-b);font-weight:600;font-size:1.08rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:.84rem;text-align:left;line-height:1.25}
.chip:hover{border-color:var(--ink)}
.result{margin-top:14px}
.symbox{background:#fff;border:1px solid var(--line);border-radius:12px;min-height:160px;display:flex;align-items:center;justify-content:center;padding:16px;overflow-x:auto}
.symbox svg{max-width:100%;height:auto}
.kv{display:grid;grid-template-columns:minmax(0,12em) minmax(0,1fr);gap:6px 14px;margin:12px 0 6px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
@media (max-width:440px){.kv{grid-template-columns:1fr;gap:2px}.kv dd{margin-bottom:8px}}
.sidc{font-size:.8rem;color:var(--muted);margin:4px 0}
.sidc span{font-family:var(--font-m);overflow-wrap:anywhere}
.warn{color:var(--bad);margin:10px 0 0}
.note{color:var(--unk);margin:8px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:16px}
.card h2{margin-bottom:6px}
.card h3{font-size:1.02rem;margin:12px 0 2px}
.card p{margin:4px 0}
details summary{cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary h2::before{content:"▸ "}
details[open] summary h2::before{content:"▾ "}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,14em),1fr));gap:10px;margin-top:12px}
.fgrid label{display:flex;flex-direction:column;gap:4px;font-weight:600;color:var(--muted);font-size:.88rem;min-width:0}
.fgrid select,.fgrid input{font:inherit;font-size:.95rem;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:9px 10px;font-weight:400;min-width:0;max-width:100%}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(7.5em,1fr));gap:8px}
.hit{display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 6px;color:#1A2326;font-size:.74rem;line-height:1.2;min-width:0}
.hit svg{max-width:100%;height:auto}
.hit span{overflow-wrap:anywhere}
.tabw{overflow-x:auto}
.ftab{border-collapse:collapse;background:#fff;border-radius:8px;margin:6px 0}
.ftab th,.ftab td{padding:5px 4px;text-align:center;color:#1A2326;font-size:.8rem;font-weight:600}
.ftab svg{height:auto;max-width:52px}
.demo{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:center;background:#fff;border-radius:10px;padding:12px;margin:8px 0}
.demo svg{max-width:100%;height:auto}

.catbar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.catbar .search{flex:1 1 14em;min-width:0;font:inherit;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px}
.sel2{font:inherit;font-size:.92rem;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:9px 8px;max-width:100%}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(9em,1fr));gap:8px}
.hit small{color:#55615F;font-size:.68rem}
</style>
</head>
<body>
<header class="bar"><div class="bar-in"><span class="t">Symbol-Generator</span></div></header>
<main class="wrap" id="app" aria-live="polite"></main>
<script src="milsymbol.js"></script>
<script>
(() => {
/* Symbol-Generator: Freitext → taktisches Zeichen nach APP-6(D) (Symbolcodes wie MIL-STD-2525D), gezeichnet mit milsymbol (MIT-Lizenz) */
ms.setStandard('APP6');
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- Symbole (Symbolsatz 15 Landgerät, 10 Landeinheit, 01 Luft) ---------- */
const SYMS = {
  kpz:{s:'15',e:'120200',de:'Kampfpanzer',en:'Tank'},

  sam:{s:'15',e:'111100',de:'Flugabwehrraketen-Startgerät',en:'Air Defence Missile Launcher'},

  atgm:{s:'15',e:'111200',de:'Panzerabwehrlenkflugkörper-Startgerät',en:'Antitank Missile Launcher'},
  atrl:{s:'15',e:'111700',de:'Panzerabwehr-Raketenwerfer (z. B. RPG)',en:'Antitank Rocket Launcher'},
  pak:{s:'15',e:'110600',de:'Panzerabwehrkanone',en:'Antitank Gun'},
  mg:{s:'15',e:'110200',de:'Maschinengewehr',en:'Machine Gun'},

  rfg:{s:'15',e:'110800',de:'Rückstoßfreies Geschütz',en:'Recoilless Gun'},
  radar:{s:'15',e:'220300',de:'Radar',en:'Radar'},
  bruecke:{s:'15',e:'130100',de:'Brückenleger',en:'Bridge'},
  minr:{s:'15',e:'130902',de:'Minenräumgerät auf Panzerfahrgestell',en:'Mine Clearing Equipment on Tank Chassis'},
  minl:{s:'15',e:'131000',de:'Minenlegegerät',en:'Mine Laying Equipment'},
  doz:{s:'15',e:'131101',de:'Pionierpanzer (gepanzerte Planierraupe)',en:'Dozer, Armoured'},
  lkw:{s:'15',e:'140800',de:'Geländegängiger Lkw',en:'Cross Country Truck'},
  pol:{s:'15',e:'140900',de:'Kraftstofftransporter',en:'Petroleum, Oil and Lubricant'},
  san:{s:'15',e:'140200',de:'Sanitätsfahrzeug',en:'Medical'},
  kfz:{s:'15',e:'140100',de:'Nutzfahrzeug',en:'Utility'},
  pickup:{s:'15',e:'160201',de:'Pickup (z. B. Technical)',en:'Open-Bed Truck, Pickup'},
  hel:{s:'01',e:'110200',de:'Hubschrauber',en:'Rotary Wing'},
  helA:{s:'01',e:'110200',m1:'01',de:'Kampfhubschrauber',en:'Rotary Wing, Attack/Strike'},
  helU:{s:'01',e:'110200',m1:'07',de:'Mehrzweckhubschrauber',en:'Rotary Wing, Utility'},

const ECHW = [['trupp', '12'], ['team', '11'], ['besatzung', '11'], ['halbzug', '13'], ['gruppe', '13'], ['zug', '14'], ['kompanie', '15'], ['kp', '15'], ['batterie', '15'], ['staffel', '15'], ['bataillon', '16'], ['btl', '16'], ['abteilung', '16'], ['regiment', '17'], ['rgt', '17'], ['brigade', '18'], ['division', '21'], ['div', '21'], ['korps', '22'], ['armee', '23']];

const ACTS = [

const EQ2UNIT = {kpz:'u_pz', spz:'u_mech', tpz:'u_mech', lgf:'u_aufkl', hb:'u_art', mrs:'u_mrs', mrl:'u_rak', ssm:'u_art', sam:'u_fla', manpads:'u_fla', flak:'u_fla', atgm:'u_pzabw', atrl:'u_pzabw', pak:'u_pzabw', uav:'u_uav', bruecke:'u_pi', minr:'u_pi', minl:'u_pi', doz:'u_pi', san:'u_san', lkw:'u_vers', pol:'u_vers', fue:'u_c2'};
const NUMW = {ein:1, eine:1, einen:1, zwei:2, drei:3, vier:4, fuenf:5, sechs:6, sieben:7, acht:8, neun:9, zehn:10, elf:11, zwoelf:12};
const STOP = new Set('mit und der die das den dem des ein eine einen einem einer auf in im am an bei von vom zu zur zum sich ist sind wird werden hat haben ca etwa gegen aus um bis ueber unter vor hinter neben als sowie oder x stueck stk'.split(' '));
const DIRW = {nordwesten:315, nordosten:45, suedwesten:225, suedosten:135, nordwest:315, nordost:45, suedwest:225, suedost:135, norden:0, sueden:180, osten:90, westen:270, nord:0, sued:180, ost:90, west:270, nw:315, no:45, sw:225, so:135, n:0, s:180, o:90, w:270};

const norm = s => ' ' + String(s || '').toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss') + ' ';

/* ---------- Freitext auswerten ---------- */
function parse(input){
  const F = {ident:'', key:'', mob:'00', ech:'00', hq:'0', status:'0', dir:'', qty:'', type:'', info:'', t:'', dtg:'', speed:'', lead:'00', rank:'00', sphq:''};
  const notes = [];
  let t = norm(input);
  const cut = (re, fn) => { t = t.replace(re, function(){ fn.apply(null, arguments); return ' '; }); };
  // Zeit, Geschwindigkeit, Richtung in Grad bzw. Strich (vor dem Entfernen der Satzzeichen)
  cut(/\s(?:um\s+)?(\d{1,2})[:.](\d{2})\s*(?:uhr|z|zulu)?(?=\s)/, (m, h, mi) => { F.dtg = h.padStart(2, '0') + mi; });
  cut(/\s(?:um\s+)(\d{4})\s*(?:uhr|z|zulu)?(?=\s)|\s(\d{4})\s*(?:uhr|z|zulu)(?=\s)/, (m, a, b) => { F.dtg = a || b; });
  cut(/\s(?:mit\s+)?(\d{1,4})\s*(km\/h|kmh|km\s+h|kn|knoten|kts)(?=\s)/, (m, v, u) => { F.speed = v + (/^k(n|nots|ts)|knoten/.test(u) ? ' KN' : ' KM/H'); });
  cut(/\s(?:in\s+)?(?:richtung|kurs|bewegungsrichtung|marschrichtung)\s+(\d{1,4})\s*(grad|°|strich|mil|mils)?(?=\s)/, (m, v, u) => {
    let d = +v; if (/strich|mil/.test(u || '') || (!u && d > 360)) d = Math.round(d * 360 / 6400); F.dir = String(d % 360);
  });
  t = t.replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ');
  t = ' ' + t.trim() + ' ';
  cut(/\s(?:in\s+)?(?:richtung|nach|kurs|bewegungsrichtung|marschrichtung)\s+(?:dem\s+|den\s+)?(nordwesten|nordosten|suedwesten|suedosten|nordwest|nordost|suedwest|suedost|norden|sueden|osten|westen|nord|sued|ost|west|nw|no|sw|so|n|s|o|w)(?=\s)/, (m, w) => { F.dir = String(DIRW[w]); });
  cut(/\s(nordwaerts|suedwaerts|ostwaerts|westwaerts)(?=\s)/, (m, w) => { F.dir = String({nordwaerts:0, suedwaerts:180, ostwaerts:90, westwaerts:270}[w]); });
  // Tätigkeiten
  const acts = [];
  for (const a of ACTS){ let hit = false; t = t.replace(a.re, () => { hit = true; return ' '; }); if (hit && !acts.includes(a.l)) acts.push(a.l); }
  // Zugehörigkeit
  cut(/\s(?:vermutlich\s+feindlich\w*|verdacht\s+feindlich|feindverdaechtig\w*|verdaechtig\w*)(?=\s)/, () => F.ident = '5');
  cut(/\s(?:vermutlich\s+eigen\w*|angenommen\s+eigen\w*)(?=\s)/, () => F.ident = '2');
  cut(/\s(?:feindlich\w*|feind|feinde|gegner\w*|rot|hostile|enemy)(?=\s)/, () => F.ident = F.ident || '6');
  cut(/\s(?:eigen\w*|freund\w*|blau|friendly|verbuendet\w*)(?=\s)/, () => F.ident = F.ident || '3');
  cut(/\s(?:neutral\w*|gruen)(?=\s)/, () => F.ident = F.ident || '4');
  cut(/\s(?:unbekannt\w*|gelb)(?=\s)/, () => F.ident = F.ident || '1');
  // Zustand, Stab, Attrappe, Mobilität, Gewichtsklasse
  cut(/\s(?:zerstoert|vernichtet|ausgeschaltet|abgeschossen)(?=\s)/, () => F.status = '4');
  cut(/\s(?:beschaedigt|getroffen)(?=\s)/, () => F.status = '3');
  cut(/\s(?:vermutet\w*|vermutlich|geplant\w*|erwartet\w*)(?=\s)/, () => F.status = F.status === '0' ? '1' : F.status);
  let dummy = false, hq = false, tf = false;
  cut(/\s(?:attrappe\w*|scheinziel\w*|scheinstellung\w*)(?=\s)/, () => dummy = true);
  let mobW = '', weight = '';
  cut(/\s(?:auf\s+)?(?:raedern|rad|radfahrzeug\w*|bereift)(?=\s)/, () => mobW = '32');
  cut(/\s(?:auf\s+)?(?:ketten|kette|kettenfahrzeug\w*)(?=\s)/, () => mobW = '33');
  cut(/\s(?:gezogen\w*)(?=\s)/, () => mobW = '35');
  cut(/\s(?:amphibisch\w*|schwimmfaehig\w*)(?=\s)/, () => mobW = '52');
  cut(/\s(leicht\w*|mittel\w*|mittelschwer\w*|schwer\w*)(?=\s)/, (m, w) => weight = /^mittel/.test(w) ? 'm' : /^leicht/.test(w) ? 'l' : 'h');
  // Kampfgruppe (BTG)
  cut(/\s(?:btg|bataillonskampfgruppe|bataillonstaktische\s+gruppe)(?=\s)/, () => { F.key = 'u_ca'; F.ech = '16'; tf = true; });
  cut(/\s(?:kampfgruppe|task\s+force)(?=\s)/, () => { tf = true; });
  // Besondere Gefechtsstände (Feld AA)
  cut(/\s(?:hauptgefechtsstand\w*)(?=\s)/, () => { hq = true; F.sphq = 'MAIN'; });
  cut(/\s(?:gefechtsstand\s+vorne|vorgeschobene\w*\s+gefechtsstand\w*|taktische\w*\s+gefechtsstand\w*|tac\s+cp|tac)(?=\s)/, () => { hq = true; F.sphq = 'TAC'; });
  cut(/\s(?:ausweichgefechtsstand\w*)(?=\s)/, () => { hq = true; F.sphq = 'ALT'; });
  cut(/\s(?:rueckwaertige\w*\s+gefechtsstand\w*)(?=\s)/, () => { hq = true; F.sphq = 'REAR'; });
  // Punkte (Beobachtungsposten, TRP, Checkpoint …)
  let cmKey = '';
  for (const c of CMW){ const m = t.match(c.re); if (m){ cmKey = c.k; t = t.replace(m[0], ' '); break; } }
  // Dienstgrad
  for (const r of RANKW){ const m = t.match(r.re); if (m){ F.rank = r.c; t = t.replace(m[0], ' '); break; } }
  // Gefechtsstand / Stab (auch zusammengesetzt, z. B. Bataillonsgefechtsstand)
  t = t.replace(/\s(\w*?)(gefechtsstand\w*|gefstd|stab|hauptquartier|hq|kommandoposten)(?=\s)/g, (m, pre) => { hq = true; return ' ' + (pre ? pre.replace(/s$/, '') : '') + ' '; });
  // Größe (Echelon), auch als Wortende: Panzerkompanie, Aufklärungszug, Spähtrupp
  let unitWord = '';
  const toks = t.trim().split(/\s+/).filter(Boolean), keep = [];
  for (const w of toks){
    let used = false;
    for (const [e, c] of ECHW){
      if (w === e || w === e + 'n' || w === e + 'en'){ F.ech = c; used = true; break; }
      if (w.length > e.length + 2 && w.endsWith(e) && e.length >= 3){
        const pre = w.slice(0, -e.length).replace(/s$/, '');
        if (UNIT.some(u => u.re.test(pre))){ F.ech = c; unitWord = unitWord || pre; used = true; break; }
      }
    }
    if (!used) keep.push(w);
  }
  t = ' ' + keep.join(' ') + ' ';
  // Einzelpersonen: Führer (Truppführer … Kommandeur) und Funktionen
  const unitIn = w => { const u = UNIT.find(x => x.re.test(w)); return u ? u.k : ''; };
  let indiv = '', leadW = false;
  t = t.replace(/\s(\w*?)(truppfuehrer|gruppenfuehrer|halbzugfuehrer|zugfuehrer|fahrzeugkommandant|kommandant|kompaniechef|kompaniefuehrer|batteriechef|staffelkapitaen|bataillonskommandeur|abteilungskommandeur|regimentskommandeur|brigadekommandeur|divisionskommandeur|kommandeur|kdr|fuehrer)(?=\s)/, (m, pre, w) => {
    leadW = true; F.lead = LEADW[w] || '00'; const p = pre.replace(/s$/, ''); indiv = (p && UNIT2IND[unitIn(p)]) || 'i_mil'; return ' ';
  });
  if (!indiv && !cmKey && F.ech === '00') for (const r of IND){ const m = t.match(r.re); if (m){ indiv = r.k; t = t.replace(m[0], ' '); break; } }
  if (!indiv && !cmKey && F.rank !== '00' && F.ech === '00') indiv = 'i_mil';
  // Gerät
  let eq = null, eqLabel = '';
  for (const e of EQ){ const m = t.match(e.re); if (m){ eq = e; eqLabel = e.lab(m[1]); t = t.replace(m[0], ' '); let r; while ((r = t.match(e.re))) t = t.replace(r[0], ' '); break; } }
  // Einheitenwort
  if (unitWord) F.key = F.key || unitIn(unitWord);
  const isUnit = !indiv && !cmKey && (F.ech !== '00' || hq || tf || (!eq && t.trim().split(/\s+/).some(w => unitIn(w))));
  const keep2 = [];
  for (const w of t.trim().split(/\s+/).filter(Boolean)){
    const k = unitIn(w);
    if (k && (isUnit || !eq)){ if (!F.key || F.key === 'u_none') F.key = k; continue; }
    if (k === 'u_aufkl' && eq){ if (!acts.includes('Aufklärung')) acts.push('Aufklärung'); continue; }
    keep2.push(w);
  }
  // Anzahl
  let qty = '';
  const keep3 = [];
  for (const w of keep2){
    let m;
    if (!qty && (m = w.match(/^(\d{1,3})x?$/) || w.match(/^x(\d{1,3})$/))) { qty = m[1]; continue; }
    if (!qty && NUMW[w]) { qty = String(NUMW[w]); continue; }
    if (w === 'mehrere') { qty = qty || 'mehrere'; continue; }
    keep3.push(w);
  }
  // Ergebnis zusammensetzen
  if (!indiv) F.rank = '00';
  if (!indiv) F.lead = '00';
  if (cmKey){
    F.key = cmKey; F.hq = '0'; F.ech = '00'; F.sphq = '';
    if (eq && eqLabel) acts.unshift('mit ' + eqLabel);
    if (qty && /^\d+$/.test(qty)) F.t = qty;
  } else if (indiv){
    if (indiv === 'i_mil' && F.key && UNIT2IND[F.key]) indiv = UNIT2IND[F.key];
    F.key = indiv; F.hq = '0'; F.sphq = '';
    if (leadW && F.lead === '00') F.lead = ECH2LEAD[F.ech] || '00';
    F.ech = '00';
    if (eq && eqLabel) acts.unshift('mit ' + eqLabel);
    if (qty && qty !== '1') acts.unshift(qty + '×');
  } else if (isUnit){
    if (eq && (!F.key || F.key === 'u_none') && EQ2UNIT[eq.k]){ F.key = EQ2UNIT[eq.k]; notes.push(`„${SYMS[eq.k].de}“ als Hinweis auf die Truppengattung gewertet: ${SYMS[F.key].de}.`); }
    F.key = F.key || 'u_none';
    if (eq && eqLabel) acts.unshift('mit ' + eqLabel);
    if (qty) acts.unshift(qty + '×');
    F.hq = String((tf ? 4 : 0) + (hq ? 2 : 0) + (dummy ? 1 : 0));
  } else if (eq){
    F.key = eq.k; F.mob = SYMS[eq.k].s === '15' ? (mobW || eq.mob) : '00'; F.type = eqLabel;
    if (qty && qty !== '1') F.qty = qty === 'mehrere' ? 'MEHRERE' : qty;
    F.hq = dummy ? '1' : '0';
    if (weight){ const s = SYMS[eq.k]; const base = s.e.slice(0, 4);
      const ok = {'1202':1, '1109':1, '1114':1, '1116':1, '1105':1, '1112':1, '1102':1, '1203':1};
      if (ok[base]) F.ent = base + '0' + {l:1, m:2, h:3}[weight];
      if (base === '1111') F.ent = base + {l:'01', m:'04', h:'07'}[weight];
    }
  }
  F.info = acts.join(' / ');
  if (!F.ident){ F.ident = '1'; notes.push('Keine Zugehörigkeit erkannt – als „unbekannt“ gezeichnet. Ergänze z. B. „feindlich“ oder „eigen“.'); }
  if (!F.key) notes.push('Kein Gerät und keine Einheit erkannt – Beispiele unten unter „Was der Generator versteht“.');
  const unknown = keep3.filter(w => !STOP.has(w) && !/^\d+$/.test(w));
  return {F, notes, unknown};
}

/* ---------- Zeichnen ---------- */
function sidcOf(F){
  const S = SYMS[F.key] || SYMS.u_none;
  const ent = F.ent && F.key && SYMS[F.key].s === '15' ? F.ent : S.e;
  const amp = S.s === '10' ? (F.ech || '00') : S.s === '15' ? (F.mob || '00') : '00';
  const hq = S.s === '10' ? (F.hq || '0') : /^(15|01|20|27)$/.test(S.s) && F.hq === '1' ? '1' : '0';
  let m1 = S.m1 || '00', m2 = S.m2 || '00';
  if (S.s === '27'){ if (F.lead && F.lead !== '00') m1 = F.lead; if (F.rank && F.rank !== '00') m2 = F.rank; }
  return '10' + '0' + F.ident + S.s + F.status + hq + amp + ent + m1 + m2;
}
function symOf(F, size){
  const o = {size:size || 90};
  if (F.qty) o.quantity = F.qty;
  if (F.type) o.type = F.type;
  if (F.info) o.additionalInformation = F.info;
  if (F.t) o.uniqueDesignation = F.t;
  if (F.dtg) o.dtg = F.dtg;
  if (F.speed) o.speed = F.speed;
  if (F.sphq && SYMS[F.key] && SYMS[F.key].s === '10') o.specialHeadquarters = F.sphq;
  if (F.dir !== '' && F.dir != null && !isNaN(+F.dir)) o.direction = +F.dir;
  return new ms.Symbol(sidcOf(F), o);
}

function opt(map, sel){ return Object.entries(map).map(([k, v]) => `<option value="${k}"${k === sel ? ' selected' : ''}>${esc(v)}</option>`).join(''); }
function symOptions(sel){
  const grp = (t, f) => `<optgroup label="${t}">${Object.entries(SYMS).filter(([k, s]) => f(k, s)).map(([k, s]) => `<option value="${k}"${k === sel ? ' selected' : ''}>${esc(s.de)}</option>`).join('')}</optgroup>`;
  const x = k => k.charAt(0) === 'x';
  return `<option value=""${!sel ? ' selected' : ''}>– bitte wählen –</option>` + grp('Landgerät', (k, s) => s.s === '15' && !x(k)) + grp('Einheiten', (k, s) => s.s === '10' && !x(k)) + grp('Einzelpersonen', (k, s) => s.s === '27' && !x(k)) + grp('Luftfahrzeuge', (k, s) => s.s === '01' && !x(k)) + grp('Punkte', (k, s) => s.s === '25' && !x(k)) + (Object.keys(SYMS).some(x) ? grp('Aus dem Katalog', k => x(k)) : '');
}
function dirOptions(sel){
  const s = sel == null ? '' : String(sel);
  let o = DIRS.map(([v, l]) => `<option value="${v}"${v === s ? ' selected' : ''}>${l}${v !== '' ? ' (' + v + '°)' : ''}</option>`).join('');
  if (s !== '' && !DIRS.some(d => d[0] === s)) o += `<option value="${s}" selected>${s}°</option>`;
  return o;
}
function rows(F){
  const S = SYMS[F.key];
  const r = [];
  r.push(['Rahmen', `${esc(IDENT[F.ident])}`]);
  if (S){
    r.push([{'10':'Einheit', '01':'Luftfahrzeug', '15':'Gerät', '27':'Einzelperson', '25':'Punkt (Führungs-/Koordinierungsmaßnahme)'}[S.s] || 'Symbol (' + (CATN[S.s] || S.s) + ')', S.de === S.en ? `APP-6: ${esc(S.en)}` : `${esc(S.de)} <span class="muted">(APP-6: ${esc(S.en)})</span>`]);
    if (S.s === '27' && F.lead && F.lead !== '00') r.push(['Führer von (Zeichen oben im Rahmen)', esc(LEAD[F.lead])]);
    if (S.s === '27' && F.rank && F.rank !== '00') r.push(['Dienstgrad (unten im Rahmen)', esc(RANKS[F.rank])]);
    if (S.s === '10' && F.sphq) r.push(['Art des Gefechtsstands – Feld AA (im Rahmen)', esc(SPHQ[F.sphq])]);
    if (S.s === '15' && F.mob !== '00') r.push(['Mobilität', esc(MOB[F.mob])]);
    if (S.s === '10' && F.ech !== '00') r.push(['Größe (über dem Rahmen)', esc(ECH[F.ech])]);
    if (F.hq !== '0') r.push(['Stab / Kampfgruppe / Attrappe', esc(HQS[F.hq] || '')]);
  }
  if (F.qty) r.push(['Anzahl – Feld C (oben)', esc(F.qty)]);
  if (F.type) r.push(['Typ – Feld V (links)', esc(F.type)]);
  if (F.t) r.push(['Bezeichnung – Feld T (links)', esc(F.t)]);
  if (F.info) r.push(['Tätigkeit / Zusatz – Feld H (rechts)', esc(F.info)]);
  if (F.dtg) r.push(['Zeit – Feld W (links)', esc(F.dtg)]);
  if (F.speed) r.push(['Geschwindigkeit – Feld Z (rechts)', esc(F.speed)]);
  if (F.dir !== '' && F.dir != null) r.push(['Bewegungsrichtung – Pfeil (Feld Q)', `${DIRN[+F.dir] || ''} ${esc(F.dir)}°`]);
  if (F.status !== '0') r.push(['Zustand', esc(STATUS[F.status])]);
  return r;
}
function renderSym(){
  const box = $('#symbox'), info = $('#syminfo');
  if (!F || !F.key){ box.innerHTML = `<p class="muted" style="padding:28px 12px;text-align:center">${P ? 'Kein Symbol erkannt.' : 'Eingabe oben – das Zeichen erscheint hier.'}</p>`; info.innerHTML = P ? notesHtml() : ''; $('#tools').hidden = true; if (F) fillForm(); return; }
  const sym = symOf(F, 90);
  box.innerHTML = sym.asSVG();
  info.innerHTML = notesHtml() + `<dl class="kv">${rows(F).map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl><p class="sidc">Symbolcode (SIDC, APP-6(D)): <span>${sidcOf(F)}</span></p>`;
  $('#tools').hidden = false;
  fillForm();
}
function notesHtml(){
  if (!P) return '';
  return (P.unknown.length ? `<p class="warn">Nicht verstanden: <b>${P.unknown.map(esc).join(', ')}</b></p>` : '') + P.notes.map(n => `<p class="note">${esc(n)}</p>`).join('');
}
function fillForm(){
  const S = SYMS[F.key] || {};
  $('#f-ident').innerHTML = opt(IDENT, F.ident);
  $('#f-key').innerHTML = symOptions(F.key);
  $('#f-mob').innerHTML = opt(MOB, F.mob); $('#w-mob').hidden = S.s !== '15';
  $('#f-ech').innerHTML = opt(ECH, F.ech); $('#w-ech').hidden = S.s !== '10';
  $('#f-hq').innerHTML = opt(S.s === '10' ? HQS : {'0':'–', '1':'Attrappe'}, F.hq);
  $('#f-status').innerHTML = opt(STATUS, F.status);
  $('#f-lead').innerHTML = opt(LEAD, F.lead || '00'); $('#w-lead').hidden = S.s !== '27';
  $('#f-rank').innerHTML = opt(RANKS, F.rank || '00'); $('#w-rank').hidden = S.s !== '27';
  $('#f-sphq').innerHTML = opt(SPHQ, F.sphq || ''); $('#w-sphq').hidden = S.s !== '10';
  $('#f-dir').innerHTML = dirOptions(F.dir);
  for (const k of ['qty', 'type', 'info', 't', 'dtg', 'speed']){ const el = $('#f-' + k); if (el && document.activeElement !== el) el.value = F[k] || ''; }
}
function run(text){
  lastText = text;
  if (!text.trim()){ P = null; F = null; renderSym(); return; }
  P = parse(text); F = P.F; renderSym();
}
function addHist(){
  if (!F || !F.key) return;
  const item = {txt:lastText, F:Object.assign({}, F), ts:Date.now()};
  if (F.key.charAt(0) === 'x') item.S = SYMS[F.key];
  store.hist = [item].concat(store.hist.filter(h => sidcOf(h.F) + JSON.stringify([h.F.qty, h.F.type, h.F.info, h.F.dir]) !== sidcOf(F) + JSON.stringify([F.qty, F.type, F.info, F.dir]))).slice(0, 16);
  saveStore(); renderHist();
}
function renderHist(){
  const el = $('#hist');
  if (!store.hist.length){ el.innerHTML = '<p class="muted">Noch nichts gespeichert. Mit „Merken“ legst du ein Zeichen hier ab.</p>'; return; }
  store.hist.forEach(h => { if (h.S && !SYMS[h.F.key]) SYMS[h.F.key] = h.S; });
  store.hist = store.hist.filter(h => SYMS[h.F.key]);
  el.innerHTML = `<div class="hgrid">${store.hist.map((h, i) => { let svg = ''; try { svg = symOf(h.F, 34).asSVG(); } catch(e){} return `<button class="hit" data-h="${i}" title="${esc(h.txt)}">${svg}<span>${esc(h.txt || SYMS[h.F.key].de)}</span></button>`; }).join('')}</div><button class="linkbtn" data-act="clearhist" style="margin-top:8px">Liste leeren</button>`;
}
function download(name, blob){

    <p class="muted" style="font-size:.88rem">APP-6 kennt für Gerät kein eigenes Zeichen für eine Tätigkeit. Die Tätigkeit steht deshalb als Text in Feld H, die Bewegung als Pfeil. Aufklärung als <b>Einheit</b> hat dagegen ein eigenes Zeichen (Schrägstrich), z. B. „Aufklärungszug feindlich“.</p></section>

    P = {unknown:[], notes:[]}; lastText = ent[1]; $('#q').value = ''; renderSym(); window.scrollTo({top:0, behavior:'smooth'}); return; }
  if (b.dataset.ex){ $('#q').value = b.dataset.ex; run(b.dataset.ex); return; }
  if (b.dataset.h != null){ const h = store.hist[+b.dataset.h]; if (h){ $('#q').value = h.txt; P = {unknown:[], notes:[]}; F = Object.assign({}, h.F); lastText = h.txt; renderSym(); window.scrollTo({top:0, behavior:'smooth'}); } return; }

  else if (a === 'svg' && F){ download(fname() + '.svg', new Blob([symOf(F, 90).asSVG()], {type:'image/svg+xml'})); }
});

function catSearch(){
  const res = $('#cres'); if (!res) return;
  const q = norm($('#cq').value).trim(), st = $('#cs').value, id = $('#ci').value;
  if (!q && !st){ res.innerHTML = '<p class="muted">Suchbegriff eingeben oder Bereich wählen.</p>'; return; }
  const terms = q ? q.split(/\s+/).map(t => [t].concat(...Object.entries(DE2EN).filter(([k]) => k.startsWith(t) || (t.length > 3 && t.startsWith(k))).map(([, v]) => v.split('|')))) : [];
  const out = []; let total = 0;
  for (const [set, list] of Object.entries(CAT)){
    if (st && set !== st) continue;
    for (const [code, name] of list){
      const n = name.toLowerCase();
      if (terms.every(alts => alts.some(a => n.includes(a)))){ total++; if (out.length < 60) out.push([set, code, name]); }
    }
  }
  if (!out.length){ res.innerHTML = '<p class="muted">Nichts gefunden – versuche es mit einem anderen oder englischen Begriff.</p>'; return; }
  res.innerHTML = `<p class="muted" style="font-size:.86rem">${total} Treffer${total > out.length ? ', die ersten ' + out.length + ' angezeigt' : ''}</p><div class="cgrid">${out.map(([set, code, name]) => {
    let svg = '';
    try { const sym = new ms.Symbol('100' + id + set + '0000' + code + '0000', {size:30}); if (!sym.isValid()) return ''; svg = sym.asSVG(); } catch(e){ return ''; }
    return `<button class="hit" data-cat="${set}:${code}">${svg}<span>${esc(name)}</span><small>${esc(CATN[set])}</small></button>`; }).join('')}</div>`;
}
let ctm = null;
document.addEventListener('input', e => { if (e.target.id === 'cq'){ clearTimeout(ctm); ctm = setTimeout(catSearch, 200); } });
document.addEventListener('change', e => { if (e.target.id === 'cs' || e.target.id === 'ci') catSearch(); });
renderHist(); renderSym(); catSearch();
