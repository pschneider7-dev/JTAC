<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Funk-Trainer</title>
<meta name="theme-color" content="#E4E9E7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1517" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="JTAC">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/app.css">
<style>
/* Funk-Trainer im Look der Trainer-Reihe (Grundgerüst wie Brevity-Trainer) */
:root{
  --bg:#E4E9E7; --surface:#F4F7F5; --surface2:#E9EEEC; --ink:#1A2326; --muted:#55615F; --line:#C3CCC9;
  --ok:#2A7848; --ok-bg:#DCEEE2; --bad:#B0382B; --bad-bg:#F6DEDA; --unk:#7A6A2E; --unk-bg:#F1E9CF;
  --cta:#E0A526; --cta-ink:#1A2326; --radio:#0F1A1C; --radio-ink:#F2B632; --f1:#CFDCD7; --f2:#B9CCC5; --f3:#A3BBB3;
  --font-d:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --font-b:"Barlow","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-m:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1517; --surface:#172022; --surface2:#1D282B; --ink:#E1E7E5; --muted:#93A09D; --line:#2A3639;
    --ok:#56B57F; --ok-bg:#16301F; --bad:#E36D5E; --bad-bg:#3A1C18; --unk:#D9C17A; --unk-bg:#2E2913;
    --cta:#E3AA2E; --cta-ink:#111719; --radio:#06090A; --radio-ink:#F2B632; --f1:#22312F; --f2:#2B3D3A; --f3:#365049; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1517; --surface:#172022; --surface2:#1D282B; --ink:#E1E7E5; --muted:#93A09D; --line:#2A3639;
  --ok:#56B57F; --ok-bg:#16301F; --bad:#E36D5E; --bad-bg:#3A1C18; --unk:#D9C17A; --unk-bg:#2E2913;
  --cta:#E3AA2E; --cta-ink:#111719; --radio:#06090A; --radio-ink:#F2B632; --f1:#22312F; --f2:#2B3D3A; --f3:#365049; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--cta);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-block:12px 56px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-d);line-height:1.1;margin:0;text-wrap:balance}
h2{font-size:1.35rem;font-weight:600}
.muted{color:var(--muted)}
.code{font-family:var(--font-m);font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}

/* Kopfleiste */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:720px;margin:0 auto;padding-block:8px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px;min-height:52px}
.bar .t{font-family:var(--font-d);font-weight:600;font-size:1.2rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:40px;height:40px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:500;white-space:nowrap}
.tag{font-family:var(--font-d);font-size:1rem;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.prog{height:3px;background:var(--line)}
.prog>i{display:block;height:100%;background:var(--cta);transition:width .25s}

/* Übersicht */
.hero{padding:26px 0 14px}
.hero h1{font-size:clamp(3rem,13vw,5.2rem);font-weight:700;letter-spacing:-.015em;line-height:.9}
.hero p{max-width:34em;margin:12px 0 0;color:var(--muted);font-size:1.05rem}
.radioline{display:inline-block;margin-top:14px;background:var(--radio);color:var(--radio-ink);font-family:var(--font-m);font-size:.82rem;font-weight:500;letter-spacing:.04em;padding:6px 12px;border-radius:6px;max-width:100%;overflow-wrap:anywhere}
.board{margin:16px 0 22px}
.board h3{font-size:1rem;color:var(--muted);margin:14px 0 6px;letter-spacing:.06em;text-transform:uppercase}
.cells{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
@media (min-width:560px){.cells{grid-template-columns:repeat(4,minmax(0,1fr))}}
.cell{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 9px 12px;overflow:hidden;min-width:0}
.cell[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.cell b{display:block;font-family:var(--font-d);font-weight:700;font-size:1.25rem;line-height:1;font-variant-numeric:tabular-nums}
.cell span{display:block;font-size:.78rem;color:var(--muted);line-height:1.25;margin-top:3px}
.cell i{position:absolute;left:0;bottom:0;height:5px;background:var(--line)}
.cell[data-s="bad"] i{background:var(--bad)} .cell[data-s="mid"] i{background:var(--cta)} .cell[data-s="ok"] i{background:var(--ok)}
.filtnote{font-size:.88rem;color:var(--muted);margin-top:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cta{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;background:var(--cta);color:var(--cta-ink);border:0;border-radius:10px;padding:16px 18px;text-align:left}
.cta strong{font-family:var(--font-d);font-size:1.5rem;font-weight:700;display:block;line-height:1.05}
.cta small{display:block;font-size:.9rem;opacity:.85}
.cta .go{font-family:var(--font-d);font-size:1.6rem;font-weight:700}
.modes{margin-top:20px;border-top:1px solid var(--line)}
.modes h3{font-size:1rem;color:var(--muted);margin:16px 0 2px;letter-spacing:.06em;text-transform:uppercase}
.mode{display:flex;width:100%;gap:14px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:13px 2px}
.mode .mi{flex:1;min-width:0}
.mode strong{display:block;font-family:var(--font-d);font-size:1.3rem;font-weight:600;line-height:1.1}
.mode small{display:block;color:var(--muted);font-size:.9rem;margin-top:2px}
.mode .n{font-family:var(--font-d);font-size:1.05rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.mode:hover strong{text-decoration:underline;text-underline-offset:3px}
.mode[disabled]{opacity:.45;cursor:default}
.foot{margin-top:26px;font-size:.84rem;color:var(--muted);max-width:42em}
.foot p{margin:0 0 8px}
.foot a{color:var(--ink);text-underline-offset:3px}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-weight:600}

/* Frage */
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0 10px;font-size:.9rem;color:var(--muted)}
.chip-cat{display:inline-block;font-family:var(--font-d);font-weight:700;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;background:var(--ink);color:var(--bg);border-radius:5px;padding:2px 9px}
.prompt{font-family:var(--font-d);font-size:1.55rem;font-weight:600;line-height:1.15;margin:6px 0 14px}
.bigcode{display:inline-block;background:var(--radio);color:var(--radio-ink);font-family:var(--font-m);font-weight:700;font-size:clamp(1.5rem,7vw,2.1rem);letter-spacing:.06em;padding:10px 18px;border-radius:8px;margin:4px 0 14px;max-width:100%;overflow-wrap:anywhere}
.defbox{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--cta);border-radius:0 10px 10px 0;padding:12px 16px;margin:4px 0 14px;font-size:1.05rem}
.lage{background:var(--radio);color:#DCE5E2;border-radius:10px;padding:12px 16px;margin:4px 0 12px}
.lage .lh{font-family:var(--font-m);font-size:.74rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--radio-ink)}
.lage p{margin:4px 0 0}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;line-height:1.35}
.opt .k{flex:none;width:26px;height:26px;border-radius:6px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-weight:700;color:var(--muted);font-size:.95rem}
.opt .ot{min-width:0;overflow-wrap:anywhere}
.opt .ot.code{white-space:normal;font-size:1.02rem}
.opt:not([disabled]):hover{border-color:var(--ink)}
.opt[disabled]{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)} .opt.correct .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)} .opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.seq{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.seq .code{font-size:.92rem}
.seq .ar{color:var(--muted);font-weight:700}
.inp{display:block;width:100%;font-family:var(--font-m);font-weight:700;font-size:1.15rem;letter-spacing:.05em;text-transform:uppercase;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:13px 14px}
.inp:focus{border-color:var(--ink);outline:none}
.inp[readonly]{border-style:dashed}
.fhint{font-size:.86rem;color:var(--muted);margin-top:5px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:11px 15px;font-weight:600}
.btn.main{background:var(--ink);color:var(--bg);border-color:var(--ink);flex:1;min-width:9em}
.btn.flagged{border-color:var(--bad);color:var(--bad)}
.fb{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c,var(--ok));border-radius:10px;padding:14px 16px}
.fb .v{font-family:var(--font-d);font-size:1.4rem;font-weight:700;color:var(--c)}
.fb p{margin:6px 0 0}
.entry{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.entry .hd{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.entry .hd .code{font-size:1.05rem}
.entry .lf{font-family:var(--font-d);font-size:1.15rem;font-weight:600}
.entry .en{font-size:.88rem;color:var(--muted);font-style:italic;margin-top:4px}
.entry .nt{font-size:.94rem;margin-top:6px}
.pill{display:inline-block;font-size:.78rem;font-weight:600;border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:1px 9px;color:var(--muted)}

/* Ergebnis */
.score{font-family:var(--font-d);font-size:5rem;font-weight:700;line-height:.9;margin:26px 0 4px;font-variant-numeric:tabular-nums}
.score small{font-size:2rem;color:var(--muted);font-weight:600}
.misslist{list-style:none;padding:0;margin:12px 0 0;border-top:1px solid var(--line)}
.misslist li{padding:10px 0;border-bottom:1px solid var(--line)}
.misslist .code{font-size:.95rem}

/* Glossar */
.seg{display:flex;gap:0;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;margin:14px 0 10px}
.seg button{flex:1;border:0;background:var(--surface);padding:10px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.search{display:block;width:100%;font:inherit;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px}
.gl h3{font-size:1rem;color:var(--muted);margin:20px 0 4px;letter-spacing:.06em;text-transform:uppercase}
.gl dl{margin:0}
.gl .it{padding:10px 0;border-bottom:1px solid var(--line)}
.gl .it .hd{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.gl .it .code{font-size:1rem}
.gl .it p{margin:3px 0 0}
.gl .it .en{font-size:.86rem;color:var(--muted);font-style:italic}
.gl .empty{color:var(--muted);margin-top:16px}

/* Statistik */
.stat-top{display:flex;gap:28px;margin:18px 0 6px;flex-wrap:wrap}
.stat-top b{display:block;font-family:var(--font-d);font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.srow{display:grid;grid-template-columns:minmax(0,10em) 1fr 4.2em;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.94rem}
.sbar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.sbar i{display:block;height:100%}
.confirm{margin-top:10px;padding:12px 14px;border:1px solid var(--bad);background:var(--bad-bg);border-radius:8px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* Kurzlehre */
.ph{font-size:clamp(2rem,8vw,2.8rem);font-weight:700;margin:18px 0 6px}
.kick{font-family:var(--font-d);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-size:.9rem;margin:18px 0 0}
.lesson .ph{margin-top:2px}
.lb{margin-top:18px}
.lb h2{margin:0 0 6px}
.lb p,.lb li{max-width:40em}
.lb p{margin:6px 0}
.lb ul{margin:6px 0;padding-left:1.15em}
.lb li{margin:4px 0}
.tip{background:var(--unk-bg);border-left:4px solid var(--unk);border-radius:0 8px 8px 0;padding:10px 14px}
.tlist{margin-top:10px;border-top:1px solid var(--line)}
.abc{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--font-m);font-size:.9rem}
.abc b{display:inline-block;width:1.1em;color:var(--muted)}

/* Skizzen */
.figbox{margin:8px 0 6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.fig{display:block;width:100%;max-width:560px;height:auto;margin:0 auto}
.fig text{font-family:var(--font-b);font-size:11px;fill:var(--ink)}
.fig .sm{font-size:9.5px}
.fig .tc{text-anchor:middle}
.fig .te{text-anchor:end}
.fig .mu{fill:var(--muted)}
.fig .b1{fill:var(--f1)} .fig .b2{fill:var(--f2)} .fig .b3{fill:var(--f3)}
.fig .m{fill:var(--muted);opacity:.55}
.fig .a{fill:var(--cta)}
.fig .gr{stroke:var(--muted);stroke-width:2;fill:none}
.fig .io{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4;fill:none}
.fig .pt{fill:var(--ink)} .fig .pt.ok{fill:var(--ok)} .fig .pt.bad{fill:var(--bad)} .fig .pt.mid{fill:var(--cta)}
.fig .w1{stroke:var(--cta);stroke-width:2.2;fill:none;stroke-dasharray:6 3}
.fig .w2{stroke:var(--cta);stroke-width:2.2;fill:none}
.fig .w3{stroke:var(--ok);stroke-width:2.2;fill:none}
.fig .dz{stroke:var(--bad);stroke-width:3}
.fig .ax{stroke:var(--muted);stroke-width:1.2}
.fig .lfz{fill:var(--ink)}
.fig .mast{stroke:var(--muted);stroke-width:3}
.fig .rope{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 2}
.fig .iso{fill:var(--surface);stroke:var(--ink);stroke-width:1}
.fig .ant{stroke:var(--cta);stroke-width:2.6;stroke-linecap:round}
.fig .ant.dash{stroke-dasharray:5 3}
.fig .coax{stroke:var(--ink);stroke-width:2;fill:none}
.fig .rad{fill:var(--ink)}
.fig .tree{stroke:var(--ok);stroke-width:2;fill:none}
.fig .hill{fill:var(--f2);stroke:var(--muted);stroke-width:1.5}
.fig .arc{stroke:var(--ink);stroke-width:1;fill:none}
.fig .lobe{fill:var(--cta);fill-opacity:.18;stroke:var(--cta);stroke-width:1}
.fig .pl{stroke:var(--bad);stroke-width:2}
.fig .gnd{stroke:var(--ok);stroke-width:2.6;fill:none}

/* Fragen */
.qimg{margin:4px 0 14px}
.qimg img,.devc img{display:block;width:100%;max-height:300px;object-fit:contain;background:#fff;border-radius:8px;border:1px solid var(--line)}
.credit{font-size:.74rem;color:var(--muted);margin-top:3px}
.inp.num{text-transform:none;max-width:12em}
.seq .sq{font-weight:600;font-size:.95rem}

/* Rechner und Funkgeräte */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:14px}
.card h2{margin-bottom:8px}
.lbl{display:block;font-weight:600;color:var(--muted);margin:8px 0 4px;min-width:11em}
.inrow{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 10px;margin-bottom:6px}
.inrow .lbl{width:100%;margin-bottom:0}
.sel{font:inherit;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:12px 10px}
.kv{display:grid;grid-template-columns:minmax(0,10em) minmax(0,1fr);gap:6px 14px;margin:10px 0 6px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.kv dt.code{color:var(--ink);white-space:normal}
.res dd{font-family:var(--font-m);font-weight:700}
.devc figure{margin:0 0 10px}
@media (max-width:420px){.kv{grid-template-columns:1fr}.kv dd{margin-bottom:6px}}
</style>
</head>
<body>
<header class="bar"><div class="bar-in" id="barin"></div><div class="prog" id="prog" hidden><i></i></div></header>
<main class="wrap" id="app" aria-live="polite"></main>

<script>
(() => {
/* Funk-Trainer – Kurzlehre, Skizzen und Gerätedaten (öffentliche Quellen: ATP 6-02.53, FM 24-18, ACP 125, Herstellerdatenblätter) */
const GROUPS = {
  grund:   {l:"Grundlagen", i:"Frequenz, Wellenlänge, Bänder, AM und FM"},
  ausb:    {l:"Ausbreitung und Reichweite", i:"Bodenwelle, Raumwelle, Sichtlinie, Funkhorizont"},
  ant:     {l:"Antennen", i:"Länge, Polarisation, Richtwirkung, Kabel und Anpassung"},
  behelf:  {l:"Behelfsantennen", i:"Dipol, Inverted-V, Ground-Plane, Langdraht, NVIS"},
  aufbau:  {l:"Aufbau, Standort, Erdung", i:"Wo und wie du die Antenne aufbaust"},
  sicher:  {l:"Sicherheit", i:"Stromleitungen, Strahlung, Gewitter, Akkus"},
  sprech:  {l:"Sprechfunk", i:"Betriebswörter, Buchstabieren, Zahlen, Funkprobe"},
  netze:   {l:"JTAC-Netze und PACE", i:"Welches Netz auf welchem Band, Ausweichplan"},
  stoer:   {l:"Störung, Peilung, Schutz", i:"Störung erkennen, Gegenmaßnahmen, Frequenzsprung, Krypto"},
  satcom:  {l:"SATCOM", i:"UHF-Satellitenfunk, Antenne ausrichten, MUOS"},
  strom:   {l:"Strom und Akkus", i:"Laufzeit, Kälte, Pufferbatterie"},
  fehler:  {l:"Fehlersuche", i:"Keine Verbindung – was prüfst du zuerst?"},
  geraete: {l:"Funkgeräte", i:"PRC-117G, -152A, -148, -160 und -163"}
};
const G_ORDER = ["grund","ausb","ant","behelf","aufbau","sicher","sprech","netze","stoer","satcom","strom","fehler","geraete"];

/* ---------- Skizzen (SVG, Farben aus den Theme-Variablen) ---------- */
const SV = (vb, body, label) => `<svg class="fig" viewBox="${vb}" role="img" aria-label="${label}">${body}</svg>`;
const T = (x, y, t, o) => `<text x="${x}" y="${y}"${o ? ' ' + o : ''}>${t}</text>`;
const FIG = {
  baender(){
    const x = f => 14 + (Math.log10(f) - Math.log10(2)) / (Math.log10(3200) - Math.log10(2)) * 312;
    const band = (a, b, y, h, cls, t) => `<rect class="${cls}" x="${x(a)}" y="${y}" width="${x(b) - x(a)}" height="${h}" rx="2"/>` + (t ? T((x(a) + x(b)) / 2, y + h / 2 + 4, t, 'class="tc"') : '');
    return SV('0 0 340 176',
      band(3, 30, 18, 26, 'b1', 'HF') + band(30, 300, 18, 26, 'b2', 'VHF') + band(300, 3000, 18, 26, 'b3', 'UHF') +

const MODES = {
  mix:{name:'Gemischte Runde', desc:'Alle Fragetypen aus allen Themen', kinds:null, n:20},
  mc:{name:'Verständnis', desc:'Grundlagen, Antennen, Aufbau, Netze, SATCOM, Reihenfolgen', kinds:['mc','seq'], n:15},
  lage:{name:'Fehlersuche-Lagen', desc:'Keine Verbindung – was prüfst du?', kinds:['lage'], n:10},
  calc:{name:'Rechnen', desc:'Wellenlänge, Antennenlänge, Funkhorizont', kinds:['calc'], n:10},
  sprech:{name:'Sprechfunk', desc:'Betriebswörter, Buchstabieralphabet, Zahlen', kinds:['pwm','pwc','abc','num'], n:15},
  dev:{name:'Funkgeräte', desc:'Erkennen und Leistungsdaten', kinds:['dev','img'], n:12},
  weak:{name:'Fehler üben', desc:'Nur Fragen, die du zuletzt falsch hattest', kinds:null, n:15},
  topic:{name:'Thema', desc:'', kinds:null, n:12}

function poolFor(mode, g){
  const m = MODES[mode];
  let p = BANK.filter(q => !m.kinds || m.kinds.includes(q.kind));
  if (g) p = p.filter(q => q.g === g);
  if (mode === 'weak') p = p.filter(q => S.q[q.id] && S.q[q.id].last === 0);
  return p;
}
function pick(pool, n){
  const recent = new Set(S.recent.slice(-40));
  let cand = pool.filter(q => !recent.has(q.id));
  if (cand.length < n) cand = pool.slice();
  const wt = q => { const r = S.q[q.id]; if (!r) return 3; if (r.last === 0) return 5; return 1 / (1 + (r.streak || 0)); };
  const out = [];
  let bag = cand.map(q => ({q, w:wt(q) * (0.6 + Math.random() * 0.8)}));
  while (out.length < n && bag.length){
    const tot = bag.reduce((s, x) => s + x.w, 0);
    let r = Math.random() * tot, i = 0;
    for (; i < bag.length - 1; i++){ r -= bag[i].w; if (r <= 0) break; }
    const q = bag[i].q; out.push(q);
    const key = q.kind.startsWith('pw') ? q.ref[0] : q.ref;
    bag = bag.filter((x, j) => j !== i && (x.q.kind.startsWith('pw') ? x.q.ref[0] : x.q.ref) !== key);
  }
  return shuffle(out);
}

/* ---------- Rechenaufgaben ---------- */
function calcSpec(c){
  if (c.t === 'lam'){ const v = 300 / c.f; return {q:`Wie lang ist die Welle bei ${nf(c.f)} MHz?`, unit:'m', v, tol:.05, hint:'λ (m) = 300 / f (MHz)', sol:`λ = 300 / ${nf(c.f)} = ${nf(r2(v), 2)} m`}; }
  if (c.t === 'dip'){ const v = 143 / c.f; return {q:`Halbwellendipol für ${nf(c.f)} MHz – wie lang ist er insgesamt?`, unit:'m', v, tol:.08, hint:'Dipol gesamt ≈ 143 / f (MHz)', sol:`143 / ${nf(c.f)} ≈ ${nf(r2(v), 2)} m gesamt, also je Schenkel ≈ ${nf(r2(v / 2), 2)} m`}; }
  if (c.t === 'qw'){ const v = 71 / c.f; return {q:`λ/4-Strahler bzw. Radial für ${nf(c.f)} MHz – wie lang?`, unit:'m', v, tol:.08, hint:'λ/4 ≈ 71 / f (MHz)', sol:`71 / ${nf(c.f)} ≈ ${nf(r2(v), 2)} m${v < 1 ? ' (' + Math.round(v * 100) + ' cm)' : ''}`}; }
  const v = 1.23 * (Math.sqrt(c.a) + Math.sqrt(c.b));
  return {q:`Funkhorizont: deine Antenne ${nf(c.a, 0)} ft hoch, die Gegenstelle in ${nf(c.b, 0)} ft. Reichweite in NM?`, unit:'NM', v, tol:.1, hint:'NM ≈ 1,23 × (√h₁ + √h₂), h in ft',
    sol:`1,23 × (√${nf(c.a, 0)} + √${nf(c.b, 0)}) = 1,23 × (${nf(Math.sqrt(c.a), 1)} + ${nf(Math.sqrt(c.b), 1)}) ≈ ${nf(Math.round(v))} NM`};
}

/* ---------- Frage erzeugen ---------- */
function figHtml(k){ return k && FIG[k] ? `<div class="figbox">${FIG[k]()}</div>` : ''; }
function imgHtml(im){ return `<figure class="qimg"><img src="${esc(im.src)}" alt="Funkgerät" loading="lazy"><figcaption class="credit">${esc(im.cred)}</figcaption></figure>`; }
function others(list, a, n){ return shuffle(list.filter(x => x !== a)).slice(0, n); }
function materialize(q){
  const m = {q, kind:q.kind};
  const r = q.ref;
  if (q.kind === 'mc' || q.kind === 'dev'){
    m.html = `<p class="prompt">${esc(r.q)}</p>${figHtml(r.fig)}`; m.plain = r.q;
    m.correct = r.a; m.wrong = r.w.slice(); m.ex = r.ex;
  } else if (q.kind === 'lage'){
    m.html = `<div class="lage"><div class="lh">Lage</div><p>${esc(r.lage)}</p></div><p class="prompt">${esc(r.q)}</p>`;
    m.plain = r.lage + ' ' + r.q; m.correct = r.a; m.wrong = r.w.slice(); m.ex = r.ex;
  } else if (q.kind === 'seq'){
    m.html = `<p class="prompt">${esc(r.q)}</p>`; m.plain = r.q; m.seq = true;
    const j = a => a.join(' → ');
    m.correct = j(r.a); m.wrong = r.w.map(j); m.ex = r.ex;
  } else if (q.kind === 'pwm'){
    m.html = `<p class="prompt">Was bedeutet dieses Betriebswort?</p><div class="bigcode">${esc(r[0])}</div>`; m.plain = 'Was bedeutet ' + r[0] + '?';
    m.correct = r[1]; m.wrong = others(PW.map(p => p[1]), r[1], 3); m.ex = '';
  } else if (q.kind === 'pwc'){
    m.html = `<p class="prompt">Welches Betriebswort passt?</p><div class="defbox">${esc(r[1])}</div>`; m.plain = 'Betriebswort: ' + r[1];
    m.correct = r[0]; m.wrong = others(PW.map(p => p[0]), r[0], 3); m.optCode = true;
  } else if (q.kind === 'abc'){
    const L = ABC[r][0];
    m.html = `<p class="prompt">Buchstabierwort im NATO-Alphabet?</p><div class="bigcode">${L}</div>`; m.plain = 'Buchstabierwort für ' + L;
    m.typed = 'abc'; m.correct = ABC[r];
  } else if (q.kind === 'num'){
    m.html = `<p class="prompt">Wie sprichst du diese Ziffer im Sprechfunk?</p><div class="bigcode">${r}</div>`; m.plain = 'Ziffer ' + r;
    m.correct = NUMS[r]; m.wrong = NUMW[r].slice(); m.optCode = true;
  } else if (q.kind === 'calc'){
    const c = calcSpec(r); m.calc = c;
    m.html = `<p class="prompt">${esc(c.q)}</p>`; m.plain = c.q; m.typed = 'num'; m.correct = '≈ ' + nf(r2(c.v), 2) + ' ' + c.unit; m.ex = c.sol;
  } else if (q.kind === 'img'){
    const d = DEVBY[r.dev];
    m.html = `<p class="prompt">Welches Funkgerät ist das?</p>${imgHtml(r)}`; m.plain = 'Bild: ' + d.n;
    m.correct = d.n; m.wrong = others(DEVN, d.n, 3); m.optCode = true; m.dev = d;
  }
  if (!m.typed) m.opts = shuffle(uniq([m.correct].concat(m.wrong)).slice(0, 4));
  return m;
}

/* ---------- Eingabe prüfen ---------- */
const normW = s => String(s || '').toUpperCase().replace(/[^A-Z]/g, '');
function checkTyped(m, raw){
  if (m.typed === 'abc'){
    const n = normW(raw);
    if (!n) return {v:'bad', msg:'Keine Eingabe.'};
    if (n === normW(m.correct)) return {v:'ok'};
    const alt = {ALPHA:'ALFA', JULIET:'JULIETT', WHISKY:'WHISKEY'};
    if (alt[n] && alt[n] === m.correct) return {v:'ok', msg:`Gilt – im NATO-Alphabet geschrieben: ${m.correct}.`};
    return {v:'bad'};
  }
  const t = String(raw || '').trim().replace(/\s/g, '').replace(',', '.').replace(/[^0-9.]/g, '');
  if (!t) return {v:'bad', msg:'Keine Eingabe.'};
  let x = parseFloat(t);
  const c = m.calc;
  if (!isFinite(x)) return {v:'bad'};
  const ok = v => Math.abs(v - c.v) / c.v <= c.tol;
  if (ok(x)) return {v:'ok'};
  if (c.unit === 'm' && c.v < 1 && ok(x / 100)) return {v:'ok', msg:'Als Zentimeter gewertet.'};
  if (Math.abs(x - c.v) / c.v <= c.tol * 2.5) return {v:'near', msg:'Knapp daneben – rechne mit der Faustformel nach.'};
  return {v:'bad'};
}

/* ---------- Ablauf ---------- */
let view = 'home', R = null, topic = null, statsConfirm = false;
function startRound(mode, list, g){
  const pool = list || poolFor(mode, g);
  if (!pool.length) return;
  const qs = list ? shuffle(list).slice(0, 30) : pick(pool, Math.min(MODES[mode].n, pool.length));
  R = {mode, g, qs, i:0, res:[], cur:materialize(qs[0]), answered:false, verdict:null};
  view = 'quiz'; render(); window.scrollTo(0, 0);
}
function record(q, ok){
  const r = S.q[q.id] || {n:0, ok:0, streak:0, last:null};
  r.n++; if (ok){ r.ok++; r.streak = (r.streak || 0) + 1; r.last = 1; } else { r.streak = 0; r.last = 0; }
  S.q[q.id] = r; S.answered++; if (ok) S.correct++;
  S.recent.push(q.id); if (S.recent.length > 80) S.recent = S.recent.slice(-80);
  save();
}
function answerMC(idx){
  if (!R || R.answered) return;
  const m = R.cur, chosen = m.opts[idx], ok = chosen === m.correct;
  R.answered = true; R.chosen = chosen; R.verdict = ok ? 'ok' : 'bad';
  R.res.push({q:m.q, ok, m, given:chosen}); record(m.q, ok); render();
}
function answerTyped(raw){
  if (!R || R.answered) return;
  const m = R.cur, r = checkTyped(m, raw);
  R.answered = true; R.typedRaw = raw; R.verdict = r.v; R.vmsg = r.msg;
  const ok = r.v === 'ok';
  R.res.push({q:m.q, ok, m, given:raw}); record(m.q, ok); render();
}
function next(){
  if (!R) return;
  R.i++;
  if (R.i >= R.qs.length){ view = 'end'; render(); window.scrollTo(0, 0); return; }
  R.cur = materialize(R.qs[R.i]); R.answered = false; R.verdict = null; R.chosen = null; R.vmsg = null; R.typedRaw = '';
  render(); window.scrollTo(0, 0);
}
function toggleFlag(){
  const m = R && R.cur; if (!m) return;
  const id = m.q.id;
  if (S.flags[id]) delete S.flags[id]; else S.flags[id] = {t:m.plain.slice(0, 160), ts:Date.now()};
  save(); render();
}

function groupScore(g){
  const qs = BANK.filter(q => q.g === g);
  const seen = qs.filter(q => S.q[q.id]).length;
  const good = qs.filter(q => S.q[q.id] && S.q[q.id].last === 1).length;
  return {n:qs.length, seen, good, frac: qs.length ? good / qs.length : 0};
}
function cellHtml(g){
  const s = groupScore(g), pct = Math.round(s.frac * 100);
  const st = !s.seen ? 'none' : s.frac >= .8 ? 'ok' : s.frac >= .4 ? 'mid' : 'bad';
  return `<button class="cell" data-s="${st}" data-lesson="${g}"><b>${s.seen ? pct + ' %' : '–'}</b><span>${esc(GROUPS[g].l)}</span><i style="width:${pct}%"></i></button>`;
}
function renderHome(){
  const nF = Object.keys(S.flags).length;
  const modeBtn = k => { const n = poolFor(k).length; return `<button class="mode" data-start="${k}" ${n ? '' : 'disabled'}><span class="mi"><strong>${esc(MODES[k].name)}</strong><small>${esc(MODES[k].desc)}</small></span><span class="n">${n} Fragen</span></button>`; };
  const goBtn = (v, t, d, n) => `<button class="mode" data-go="${v}"><span class="mi"><strong>${t}</strong><small>${d}</small></span><span class="n">${n || '→'}</span></button>`;
  $('#app').innerHTML = `
  <section class="hero"><a class="hublink" href="../">‹ Alle Trainer</a><h1>Funk</h1>
    <p>Funk verstehen statt auswendig lernen: Bänder, Ausbreitung, Antennen und Behelfsantennen, Aufbau und Erdung, Sprechfunk, Störung, SATCOM und die gängigen Funkgeräte.</p>
    <span class="radioline">STALKER 11, THIS IS HOG 31, LOUD AND CLEAR, OVER</span></section>
  <section class="board">
    <h3>Kurzlehre – Thema antippen</h3><div class="cells">${G_ORDER.map(cellHtml).join('')}</div>
  </section>
  <button class="cta" data-start="mix"><span><strong>Gemischte Runde</strong><small>${MODES.mix.n} Fragen aus allen Themen</small></span><span class="go">→</span></button>
  <nav class="modes">
    <h3>Üben</h3>${['mc','lage','calc','sprech','dev'].map(modeBtn).join('')}
    <h3>Wiederholen</h3>${modeBtn('weak')}
    <h3>Werkzeuge</h3>
    ${goBtn('tools', 'Rechner', 'Antennenlänge aus der Frequenz, Funkhorizont aus den Höhen')}
    ${goBtn('dev', 'Funkgeräte', 'PRC-117G, -152A, -148, -160 und -163 mit Bild und Daten')}
    ${goBtn('lehre', 'Kurzlehre', 'Alle 13 Themen kompakt mit Skizzen')}
    ${goBtn('stats', 'Statistik und gemeldete Fragen', 'Trefferquote je Thema, markierte Fragen', nF ? nF + ' gemeldet' : '')}
  </nav>
  <div class="foot">
    <p>Grundlage sind öffentlich freigegebene Unterlagen: US Army ATP 6-02.53 „Techniques for Tactical Radio Operations“, FM 24-18 „Tactical Single-Channel Radio Communications Techniques“, ACP 125 (Sprechfunkverfahren) und die Datenblätter der Hersteller. Nationale Vorschriften und Fernmeldeunterlagen deines Verbands gehen vor.</p>
    <p>Fortschritt wird nur auf diesem Gerät gespeichert.</p>
  </div>`;
}
function renderLehre(){
  $('#app').innerHTML = `<h1 class="ph">Kurzlehre</h1><p class="muted">Jedes Thema in wenigen Minuten – danach direkt üben.</p>
    <div class="tlist">${G_ORDER.map((g, i) => `<button class="mode" data-lesson="${g}"><span class="mi"><strong>${i + 1}. ${esc(GROUPS[g].l)}</strong><small>${esc(GROUPS[g].i)}</small></span><span class="n">${groupScore(g).n} Fragen</span></button>`).join('')}</div>`;
}
function renderTopic(){
  const g = topic, i = G_ORDER.indexOf(g), blocks = LEHRE[g] || [];
  const blk = b => `<section class="lb"><h2>${esc(b.h)}</h2>${b.fig ? figHtml(b.fig) : ''}${(b.p || []).map(p => `<p>${fmt(p)}</p>`).join('')}${b.li ? `<ul>${b.li.map(x => `<li>${fmt(x)}</li>`).join('')}</ul>` : ''}${b.tip ? `<p class="tip">${fmt(b.tip)}</p>` : ''}</section>`;
  const extra = g === 'geraete' ? `<button class="btn" data-go="dev" style="margin-top:10px">Funkgeräte mit Bild und Daten</button>`
    : g === 'sprech' ? `<div class="lb"><h2>Betriebswörter (ACP 125)</h2><dl class="kv">${PW.map(p => `<dt class="code">${esc(p[0])}</dt><dd>${esc(p[1])}</dd>`).join('')}</dl><h2 style="margin-top:18px">NATO-Alphabet</h2><p class="abc">${ABC.map(w => `<span><b>${w[0]}</b> ${w}</span>`).join('')}</p></div>`
    : (g === 'behelf' || g === 'ausb') ? `<button class="btn" data-go="tools" style="margin-top:10px">Zum Rechner</button>` : '';
  const n = groupScore(g).n;
  $('#app').innerHTML = `<article class="lesson"><p class="kick">Thema ${i + 1} von ${G_ORDER.length}</p><h1 class="ph">${esc(GROUPS[g].l)}</h1>${blocks.map(blk).join('')}${extra}
    <button class="cta" data-topic="${g}" style="margin-top:22px"><span><strong>Thema üben</strong><small>${Math.min(MODES.topic.n, n)} von ${n} Fragen</small></span><span class="go">→</span></button>
    <div class="row">${i > 0 ? `<button class="btn" data-lesson="${G_ORDER[i - 1]}">‹ ${esc(GROUPS[G_ORDER[i - 1]].l)}</button>` : ''}${i < G_ORDER.length - 1 ? `<button class="btn" data-lesson="${G_ORDER[i + 1]}">${esc(GROUPS[G_ORDER[i + 1]].l)} ›</button>` : ''}</div></article>`;
}
function optLabel(m, t){
  if (m.seq) return `<span class="ot seq">${t.split(' → ').map(x => `<span class="sq">${esc(x)}</span>`).join('<span class="ar">→</span>')}</span>`;
  return `<span class="ot${m.optCode ? ' code' : ''}">${esc(t)}</span>`;
}
function devCard(d, short){
  const ims = IMGS.filter(x => x.dev === d.id);
  return `<article class="card devc"><h2>${esc(d.n)}</h2><p class="muted" style="margin:2px 0 8px">${esc(d.typ)} · ${esc(d.h)}</p>
    ${ims.length && !short ? ims.map(imgHtml).join('') : ''}
    <dl class="kv"><dt>Frequenz</dt><dd>${esc(d.f)}${d.fx ? `<br><span class="muted">${esc(d.fx)}</span>` : ''}</dd><dt>Leistung</dt><dd>${esc(d.p)}</dd><dt>Gewicht</dt><dd>${esc(d.w)}</dd><dt>Betriebsarten</dt><dd>${esc(d.wf)}</dd><dt>Beim JTAC</dt><dd>${esc(d.jtac)}</dd></dl></article>`;
}
function renderQuiz(){
  const m = R.cur, q = m.q, ans = R.answered;
  let body = '';
  if (m.typed){
    const isN = m.typed === 'num';
    body = `<form id="tform" autocomplete="off"><label class="muted" for="tin" style="display:block;margin-bottom:5px;font-weight:600">${isN ? 'Ergebnis in ' + m.calc.unit : 'Buchstabierwort'}</label>
      <input class="inp${isN ? ' num' : ''}" id="tin" name="tin" ${ans ? 'readonly' : ''} value="${esc(R.typedRaw || '')}" ${isN ? 'inputmode="decimal" placeholder="z. B. 2,9"' : 'placeholder="z. B. ALFA" autocapitalize="characters"'} autocorrect="off" spellcheck="false" enterkeyhint="done">
      ${isN && !ans ? `<p class="fhint">Faustformel: ${esc(m.calc.hint)} – Abweichung bis ${Math.round(m.calc.tol * 100)} % zählt als richtig.</p>` : ''}
      ${ans ? '' : `<div class="row"><button class="btn main" type="submit">Prüfen</button><button class="btn" type="button" data-act="giveup">Weiß ich nicht</button></div>`}</form>`;
  } else {
    body = `<div class="opts">${m.opts.map((o, i) => {
      let cls = 'opt';
      if (ans){ if (o === m.correct) cls += ' correct'; else if (o === R.chosen) cls += ' wrong'; else cls += ' dim'; }
      return `<button class="${cls}" data-ans="${i}" ${ans ? 'disabled' : ''}><span class="k">${i + 1}</span>${optLabel(m, o)}</button>`;
    }).join('')}</div>`;
  }
  let fb = '';
  if (ans){
    const v = R.verdict, col = v === 'ok' ? 'var(--ok)' : v === 'near' ? 'var(--unk)' : 'var(--bad)';
    const head = v === 'ok' ? 'Richtig' : v === 'near' ? 'Fast – zählt als falsch' : 'Falsch';
    const sol = v === 'ok' && !m.typed ? '' : `<p>Richtig: ${m.optCode || m.typed === 'abc' ? `<span class="code" style="white-space:normal">${esc(m.correct)}</span>` : m.seq ? esc(m.correct) : `<b>${esc(m.correct)}</b>`}</p>`;
    let more = '';
    if (q.kind === 'pwm' || q.kind === 'pwc') more = `<div class="entry"><div class="hd"><span class="code">${esc(q.ref[0])}</span></div><p style="margin:6px 0 0">${esc(q.ref[1])}</p></div>`;
    if (m.dev) more = devCard(m.dev, true);
    if (q.kind === 'num') more = `<p class="muted">Zahlen 0–9: ${NUMS.join(', ')}.</p>`;
    fb = `<div class="fb" style="--c:${col}"><div class="v">${head}</div>${sol}${R.vmsg ? `<p>${esc(R.vmsg)}</p>` : ''}${m.ex ? `<p>${esc(m.ex)}</p>` : ''}${more}
      <p class="muted" style="font-size:.88rem">Thema: <button class="linkbtn" data-lesson="${q.g}">${esc(GROUPS[q.g].l)} nachlesen</button></p></div>
      <div class="row"><button class="btn main" data-act="next">${R.i + 1 >= R.qs.length ? 'Auswertung' : 'Weiter'}</button>
      <button class="btn${S.flags[q.id] ? ' flagged' : ''}" data-act="flag">${S.flags[q.id] ? 'Gemeldet' : 'Frage melden'}</button></div>`;
  }
  $('#app').innerHTML = `<div class="qmeta"><span class="chip-cat">${esc(KINDS[q.kind].l)}</span><span>${esc(GROUPS[q.g].l)}</span></div>${m.html}${body}${fb}`;
  if (m.typed && !ans){ const t = $('#tin'); if (t) setTimeout(() => { try { t.focus({preventScroll:true}); } catch(e){} }, 30); }
}
function renderEnd(){
  const ok = R.res.filter(r => r.ok).length, n = R.res.length, miss = R.res.filter(r => !r.ok);
  $('#app').innerHTML = `<div class="score">${ok}<small> / ${n}</small></div>
    <p class="muted">${ok === n ? 'Alles richtig.' : miss.length + ' Fehler – unten mit Lösung.'}</p>
    <div class="row"><button class="btn main" ${R.mode === 'topic' ? `data-topic="${R.g}"` : `data-start="${R.mode}"`}>Neue Runde</button>${miss.length ? `<button class="btn" data-act="retrymiss">Fehler wiederholen</button>` : ''}<button class="btn" data-go="home">Übersicht</button></div>
    ${miss.length ? `<ul class="misslist">${miss.map(r => `<li><div>${esc(r.m.plain)}</div><div class="muted" style="font-size:.9rem">Deine Antwort: ${esc(r.given || '–')}</div><div>Richtig: <b>${esc(r.m.correct)}</b></div></li>`).join('')}</ul>` : ''}`;
}
let TV = {f:'40', h1:'6', h2:'15000', u1:'ft', u2:'ft'};
function toolsOut(){
  const f = parseFloat(String(TV.f).replace(',', '.'));
  let a = '<p class="muted">Frequenz in MHz eingeben.</p>';
  if (isFinite(f) && f > 0){
    const lam = 300 / f, dip = 143 / f, qw = 71 / f;
    const m = x => x >= 1 ? nf(r2(x), 2) + ' m' : Math.round(x * 100) + ' cm';
    a = `<dl class="kv res"><dt>Wellenlänge λ</dt><dd>${m(lam)}</dd><dt>Halbwellendipol gesamt</dt><dd>${m(dip)}</dd><dt>je Dipolschenkel</dt><dd>${m(dip / 2)}</dd><dt>λ/4-Strahler, Radial</dt><dd>${m(qw)}</dd>${f <= 30 ? `<dt>NVIS-Höhe (0,1–0,25 λ)</dt><dd>${m(lam * .1)} – ${m(lam * .25)}</dd>` : ''}</dl>
      <p class="muted" style="font-size:.88rem">${f < 3 || f > 3000 ? 'Außerhalb HF/VHF/UHF. ' : ''}Band: ${f < 30 ? 'HF' : f < 300 ? 'VHF' : 'UHF'}${f >= 225 && f <= 400 ? ' (militärischer UHF-Flugfunk)' : ''}. Längen mit Verkürzungsfaktor 0,95 – Draht etwas länger schneiden und abgleichen.</p>`;
  }
  const toFt = (v, u) => { const x = parseFloat(String(v).replace(',', '.')); return isFinite(x) && x >= 0 ? (u === 'm' ? x / 0.3048 : x) : NaN; };
  const h1 = toFt(TV.h1, TV.u1), h2 = toFt(TV.h2, TV.u2);
  let b = '<p class="muted">Beide Höhen eingeben.</p>';
  if (isFinite(h1) && isFinite(h2)){
    const nm = 1.23 * (Math.sqrt(h1) + Math.sqrt(h2));
    b = `<dl class="kv res"><dt>Funkhorizont</dt><dd>${nf(Math.round(nm))} NM ≈ ${nf(Math.round(nm * 1.852))} km</dd></dl><p class="muted" style="font-size:.88rem">Gilt nur bei freier Sicht – Gelände, Bewuchs und Gebäude verkürzen die Reichweite.</p>`;
  }
  return {a, b};
}
function renderTools(){
  const o = toolsOut();
  const unit = (k) => `<select class="sel" data-tv="${k}"><option value="ft"${TV[k] === 'ft' ? ' selected' : ''}>ft</option><option value="m"${TV[k] === 'm' ? ' selected' : ''}>m</option></select>`;
  $('#app').innerHTML = `<h1 class="ph">Rechner</h1>
    <section class="card"><h2>Antennenlänge</h2><label class="lbl" for="tf">Frequenz (MHz)</label><input class="inp num" id="tf" data-tv="f" inputmode="decimal" value="${esc(TV.f)}"><div id="ta">${o.a}</div>${figHtml('gp')}</section>
    <section class="card"><h2>Funkhorizont</h2>
      <div class="inrow"><label class="lbl" for="th1">Deine Antenne</label><input class="inp num" id="th1" data-tv="h1" inputmode="decimal" value="${esc(TV.h1)}">${unit('u1')}</div>
      <div class="inrow"><label class="lbl" for="th2">Gegenstelle bzw. Lfz</label><input class="inp num" id="th2" data-tv="h2" inputmode="decimal" value="${esc(TV.h2)}">${unit('u2')}</div>
      <div id="tb">${o.b}</div></section>`;
}
function renderDev(){
  $('#app').innerHTML = `<h1 class="ph">Funkgeräte</h1><p class="muted">Öffentliche Herstellerangaben (L3Harris, Thales). Je nach Ausführung und Software-Stand weichen Daten ab – maßgeblich ist die Dokumentation deines Geräts.</p>${DEV.map(d => devCard(d)).join('')}
    <button class="cta" data-start="dev" style="margin-top:18px"><span><strong>Funkgeräte üben</strong><small>Erkennen und Leistungsdaten</small></span><span class="go">→</span></button>`;
}
function renderStats(){
  const pct = S.answered ? Math.round(S.correct / S.answered * 100) : 0;
  const rows = G_ORDER.map(g => {
    const s = groupScore(g), p = Math.round(s.frac * 100);
    const col = !s.seen ? 'var(--line)' : s.frac >= .8 ? 'var(--ok)' : s.frac >= .4 ? 'var(--cta)' : 'var(--bad)';
    return `<div class="srow"><span>${esc(GROUPS[g].l)}</span><span class="sbar"><i style="width:${p}%;background:${col}"></i></span><span class="muted" style="text-align:right">${s.good}/${s.n}</span></div>`;
  }).join('');
  const flags = Object.entries(S.flags).sort((a, b) => b[1].ts - a[1].ts);
  $('#app').innerHTML = `<div class="stat-top"><div><b>${S.answered}</b><span class="muted">Antworten</span></div><div><b>${pct} %</b><span class="muted">richtig</span></div><div><b>${Object.keys(S.q).length}</b><span class="muted">von ${BANK.length} Fragen gesehen</span></div></div>
    <h2 style="margin-top:18px">Je Thema <span class="muted" style="font-size:.95rem;font-weight:500">zuletzt richtig beantwortet</span></h2>${rows}
    <h2 style="margin-top:24px">Gemeldete Fragen</h2>
    ${flags.length ? `<ul class="misslist">${flags.map(([id, f]) => `<li><div>${esc(f.t)}</div><button class="linkbtn" data-unflag="${esc(id)}">Meldung entfernen</button></li>`).join('')}</ul>` : '<p class="muted">Keine. Melde eine Frage nach dem Beantworten mit „Frage melden“.</p>'}
    <h2 style="margin-top:24px">Fortschritt</h2>
    ${statsConfirm ? `<div class="confirm"><p style="margin:0 0 8px">Gesamten Fortschritt löschen? Gemeldete Fragen bleiben erhalten.</p><div class="row" style="margin-top:0"><button class="btn" data-act="resetyes" style="border-color:var(--bad);color:var(--bad)">Löschen</button><button class="btn" data-act="resetno">Abbrechen</button></div></div>`
      : `<button class="btn" data-act="reset" style="margin-top:8px">Fortschritt zurücksetzen</button>`}`;
}
function render(){
  bar();
  if (view === 'home') renderHome();
  else if (view === 'quiz') renderQuiz();
  else if (view === 'end') renderEnd();
  else if (view === 'lehre') renderLehre();
  else if (view === 'topic') renderTopic();
  else if (view === 'tools') renderTools();
  else if (view === 'dev') renderDev();
  else if (view === 'stats') renderStats();
}

/* ---------- Ereignisse ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.go){ view = t.dataset.go; statsConfirm = false; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.lesson){ topic = t.dataset.lesson; view = 'topic'; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.topic){ startRound('topic', null, t.dataset.topic); return; }
  if (t.dataset.start){ startRound(t.dataset.start); return; }
  if (t.dataset.ans != null){ answerMC(+t.dataset.ans); return; }
  if (t.dataset.unflag){ delete S.flags[t.dataset.unflag]; save(); render(); return; }
  const act = t.dataset.act;
  if (act === 'next') next();
  else if (act === 'flag') toggleFlag();
  else if (act === 'giveup') answerTyped('');
  else if (act === 'retrymiss'){ const miss = R.res.filter(r => !r.ok).map(r => r.q); R.mode === 'topic' ? startRound('topic', miss, R.g) : startRound(R.mode, miss); }
  else if (act === 'reset'){ statsConfirm = true; render(); }
  else if (act === 'resetno'){ statsConfirm = false; render(); }
  else if (act === 'resetyes'){ const fl = S.flags; S = blank(); S.flags = fl; statsConfirm = false; save(); render(); }
});
document.addEventListener('submit', e => {
  if (e.target.id === 'tform'){ e.preventDefault(); const v = $('#tin') ? $('#tin').value : ''; answerTyped(v); }
});
function toolsInput(e){
  const k = e.target.dataset && e.target.dataset.tv; if (!k || view !== 'tools') return;
  TV[k] = e.target.value; const o = toolsOut(); $('#ta').innerHTML = o.a; $('#tb').innerHTML = o.b;
}
document.addEventListener('input', toolsInput);
document.addEventListener('change', toolsInput);
document.addEventListener('keydown', e => {
  if (view !== 'quiz' || !R) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (!R.answered && !R.cur.typed && /^[1-4]$/.test(e.key) && tag !== 'input'){ const i = +e.key - 1; if (i < R.cur.opts.length) answerMC(i); }
  else if (R.answered && e.key === 'Enter'){ e.preventDefault(); next(); }
});

window.__ft = {BANK, materialize, checkTyped, MODES, poolFor, pick, FIG};
render();
})();
</script>
<script src="../assets/app.js" defer></script>
