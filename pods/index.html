<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pod-Trainer</title>
<meta name="theme-color" content="#E4E9E7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1517" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="JTAC">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/app.css">
<style>
:root{
  --bg:#E4E9E7; --surface:#F4F7F5; --surface2:#E9EEEC; --ink:#1A2326; --muted:#55615F; --line:#C3CCC9;
  --ok:#2A7848; --ok-bg:#DCEEE2; --bad:#B0382B; --bad-bg:#F6DEDA; --unk:#7A6A2E; --unk-bg:#F1E9CF;
  --cta:#E0A526; --cta-ink:#1A2326; --feed:#0B1113; --hud:#F2B632;
  --font-d:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --font-b:"Barlow","Segoe UI",system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1517; --surface:#172022; --surface2:#1D282B; --ink:#E1E7E5; --muted:#93A09D; --line:#2A3639;
    --ok:#56B57F; --ok-bg:#16301F; --bad:#E36D5E; --bad-bg:#3A1C18; --unk:#D9C17A; --unk-bg:#2E2913;
    --cta:#E3AA2E; --cta-ink:#111719; --feed:#06090A;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1517; --surface:#172022; --surface2:#1D282B; --ink:#E1E7E5; --muted:#93A09D; --line:#2A3639;
  --ok:#56B57F; --ok-bg:#16301F; --bad:#E36D5E; --bad-bg:#3A1C18; --unk:#D9C17A; --unk-bg:#2E2913;
  --cta:#E3AA2E; --cta-ink:#111719; --feed:#06090A;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--cta);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:12px 18px 48px}
h1,h2,h3{font-family:var(--font-d);line-height:1.1;margin:0}
h2{font-size:1.45rem;font-weight:600;letter-spacing:.005em}
h3{font-size:1.25rem;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.875rem}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:720px;margin:0 auto;padding:8px 18px;display:flex;align-items:center;gap:12px;min-height:52px}
.bar .t{font-family:var(--font-d);font-weight:600;font-size:1.2rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:40px;height:40px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:500}
.prog{height:3px;background:var(--line)}
.prog>i{display:block;height:100%;background:var(--cta);transition:width .25s}

/* home */
.hero{padding:28px 0 20px}
.hero h1{font-size:clamp(3rem,13vw,5.2rem);font-weight:700;letter-spacing:-.015em;line-height:.9}
.hero p{max-width:34em;margin:12px 0 0;color:var(--muted);font-size:1.05rem}
.board{margin:8px 0 24px}
.board-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.cells{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media (min-width:600px){.cells{grid-template-columns:repeat(8,1fr)}}
.cell{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 8px 12px;min-height:66px;overflow:hidden}
.cell b{display:block;font-family:var(--font-d);font-weight:700;font-size:1.25rem;line-height:1}
.cell span{display:block;font-size:.72rem;color:var(--muted);line-height:1.2;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell i{position:absolute;left:0;bottom:0;height:5px;background:var(--line)}
.cell[data-s="bad"] i{background:var(--bad)} .cell[data-s="mid"] i{background:var(--cta)} .cell[data-s="ok"] i{background:var(--ok)}
.cell[data-s="none"]{border-style:dashed}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:.8rem;color:var(--muted)}
.legend em{font-style:normal;display:inline-flex;align-items:center;gap:5px}
.legend em::before{content:"";width:12px;height:5px;background:var(--c)}
.cta{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;background:var(--cta);color:var(--cta-ink);border:0;border-radius:10px;padding:16px 18px;text-align:left}
.cta strong{font-family:var(--font-d);font-size:1.5rem;font-weight:700;display:block;line-height:1.05}
.cta small{display:block;font-size:.9rem;opacity:.85}
.cta .go{font-family:var(--font-d);font-size:1.6rem;font-weight:700}
.modes{margin-top:22px;border-top:1px solid var(--line)}
.mode{display:flex;width:100%;gap:14px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 2px}
.mode .mi{flex:1}
.mode strong{display:block;font-family:var(--font-d);font-size:1.3rem;font-weight:600;line-height:1.1}
.mode small{display:block;color:var(--muted);font-size:.9rem;margin-top:2px}
.mode .n{font-family:var(--font-d);font-size:1.1rem;color:var(--muted);white-space:nowrap}
.mode:hover strong{text-decoration:underline;text-underline-offset:3px}
.foot{margin-top:28px;font-size:.82rem;color:var(--muted);max-width:40em}

/* feed */
.feed{position:relative;margin:0;background:var(--feed);border-radius:10px;overflow:hidden;aspect-ratio:4/3;cursor:zoom-in}
.feed img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.feed svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.feed .hud{position:absolute;font-family:var(--font-d);font-weight:600;font-size:.8rem;letter-spacing:.06em;color:var(--hud);opacity:.85;text-shadow:0 1px 2px #000}
.feed .hud.tl{top:10px;left:14px} .feed .hud.tr{top:10px;right:14px} .feed .hud.bl{bottom:10px;left:14px}
.feed .nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:1.4rem;display:flex;align-items:center;justify-content:center;pointer-events:auto}
.feed .nav.l{left:8px} .feed .nav.r{right:8px}

/* quiz */
.qmeta{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 10px;font-size:.9rem;color:var(--muted)}
.prompt{font-family:var(--font-d);font-size:1.55rem;font-weight:600;line-height:1.15;margin:14px 0 14px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;line-height:1.35}
.opt .k{flex:none;width:26px;height:26px;border-radius:6px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-weight:700;color:var(--muted);font-size:.95rem}
.opt:not([disabled]):hover{border-color:var(--ink)}
.opt[disabled]{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)} .opt.correct .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)} .opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.fb{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c,var(--ok));border-radius:10px;padding:14px 16px}
.fb .v{font-family:var(--font-d);font-size:1.35rem;font-weight:700;color:var(--c)}
.fb p{margin:6px 0 0}
.profile{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.profile h3 small{font-family:var(--font-b);font-size:.85rem;font-weight:500;color:var(--muted);margin-left:6px}
.kv{display:grid;grid-template-columns:7.5em 1fr;gap:4px 12px;margin:10px 0 0;font-size:.94rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;padding:0;list-style:none}
.chips li{font-size:.82rem;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--surface2);border:1px solid var(--line)}
.chips li[data-v="1"]{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.chips li[data-v="0"]{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.chips li[data-v="?"]{background:var(--unk-bg);border-color:var(--unk);color:var(--unk)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:10px 14px;font-weight:600}
.btn.main{background:var(--ink);color:var(--bg);border-color:var(--ink);flex:1;min-width:9em}
.btn.flagged{border-color:var(--bad);color:var(--bad)}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-weight:600}

/* end */
.score{font-family:var(--font-d);font-size:5rem;font-weight:700;line-height:.9;margin:24px 0 4px}
.misslist{list-style:none;padding:0;margin:12px 0 0;border-top:1px solid var(--line)}
.misslist li{padding:10px 0;border-bottom:1px solid var(--line)}

/* cards list */
.group{margin-top:24px}
.group h2{margin-bottom:6px}
.fam{display:flex;width:100%;align-items:center;gap:12px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 2px}
.fam .code{font-family:var(--font-d);font-weight:700;font-size:1.1rem;width:3em;color:var(--muted)}
.fam .nm{flex:1;font-weight:600}
.fam .pct{font-family:var(--font-d);font-size:1.05rem;color:var(--muted)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch}
.sheet[hidden]{display:none}
.sec{margin-top:18px}
.sec h3{font-size:1.1rem;margin-bottom:4px}
.sec ul{margin:4px 0 0;padding-left:1.15em}
.sec li{margin:2px 0}
.desig{font-size:.95rem;color:var(--muted);margin-top:4px}
.bw{margin-top:12px;border-left:4px solid var(--cta);background:var(--surface);padding:8px 12px;border-radius:0 8px 8px 0;font-size:.95rem}
.lightbox{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:12px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}

/* stats */
.stat-top{display:flex;gap:28px;margin:18px 0 6px}
.stat-top b{display:block;font-family:var(--font-d);font-size:2.4rem;line-height:1}
.srow{display:grid;grid-template-columns:8.5em 1fr 4.2em;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.94rem}
.sbar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.sbar i{display:block;height:100%}
textarea{width:100%;min-height:120px;font:inherit;font-size:.85rem;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
.sync{font-size:.8rem;color:var(--muted)}
.annobox{margin-top:12px}
.annobox #annoarea{margin-top:12px}
.anno{position:relative;margin:0;max-width:100%;border-radius:10px;overflow:hidden;background:var(--feed);cursor:zoom-in}
.anno img{display:block;width:100%;height:100%;object-fit:cover}
.anno .pin{position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:var(--hud);color:#111;border:2px solid #111;font-family:var(--font-d);font-weight:700;font-size:.95rem;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.6);pointer-events:none}
.legendlist{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:6px}
.legendlist li{display:flex;gap:10px;align-items:flex-start;font-size:.94rem;line-height:1.35}
.legendlist b{flex:none;width:22px;height:22px;border-radius:50%;background:var(--hud);color:#111;font-family:var(--font-d);font-size:.85rem;display:flex;align-items:center;justify-content:center;margin-top:1px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.guide-link{display:flex;gap:14px;align-items:center;margin-top:18px;padding:14px 16px;border:1px solid var(--line);border-left:4px solid var(--cta);border-radius:10px;background:var(--surface);color:var(--ink);text-decoration:none}.guide-link .mi{flex:1}.guide-link strong{display:block;font-family:var(--font-d);font-size:1.3rem;font-weight:600;line-height:1.1}.guide-link small{display:block;color:var(--muted);font-size:.9rem;margin-top:2px}.guide-link .n{font-family:var(--font-d);font-size:1.1rem;color:var(--muted);white-space:nowrap}.guide-link:hover strong{text-decoration:underline;text-underline-offset:3px}
.foot a{color:var(--ink);text-underline-offset:3px}
</style>
</head>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>

effects": "Primär Aufklärung und Markierung – Laserzielbeleuchtung für Waffen nicht voraussetzen", "recon": "Überwachung, Personen- und Fahrzeugverfolgung, SAR, PID-Unterstützung", "range": "Plattformabhängig.", "jtac": ["Oft auf Koalitions-, Behörden- oder SAR-Plattformen: gute ISR-Quelle, Wirkung meist über andere Lfz.", "Fähigkeiten im Check-in klären."], "recog": "Kompakter Kugel-Gimbal mit mehreren runden Fenstern, meist dunkel; unter der Nase von Hubschraubern.", "confuse": ["mx", "mts"], "plat": ["Hubschrauber von Behörden und Küstenwache", ["F-35A", "Eurofighter", "F-15E", "Rafale"]]}], "curated": [["c-lit1", "litening", "Ein deutscher Eurofighter meldet im Check-in „LDP“. Welcher Pod ist gemeint?", ["Litening", "RecceLite", "Sniper", "Damocles"], "Die Luftwaffe bezeichnet den Litening am Eurofighter als Laser Designator Pod (LDP). RecceLite ist der Aufklärungspod ohne Laser."], ["c-lit2", "litening", "Der Pilot meldet Litening G4 mit VDL. Was bringt dir das?", ["Pod-Video live am ROVER – gemeinsames Bild für Talk-on und Ziel-ID", "Lenkung der Waffe über deinen Bodenlaser", "Automatischen Abgleich der Lasercodes", "Nur Aufzeichnung für die BDA nach der Landung"], "VDL (Video Downlink) überträgt das Pod-Bild an dein ROVER-Terminal. Ihr schaut auf dasselbe Bild – das beschleunigt Talk-on und Ziel-ID."], ["c-lit3", "litening", "Mit welcher Funktion findet ein Lfz mit Litening deine Bodenlaser-Markierung?", ["Laser Spot Tracker (LST)", "IR-Marker", "NAVFLIR", "IRST"], "Der LST sucht nach Laserenergie mit dem eingestellten Code. Erfasst er sie, meldet der Pilot „SPOT“."], ["c-snp1", "sniper", "Welche Plattform mit Sniper-Pod bietet dir die größte Waffenzuladung und Verweildauer?", ["B-1B", "A-10C", "F-16", "F-15E"], "Der B-1B trägt Sniper und eine sehr große Zuladung an GPS- und Lasermunition bei langer Verweildauer – gut für mehrere Ziele nacheinander."], ["c-snp2", "sniper", "Woran erkennst du den Sniper gegenüber dem Litening?", ["Kantige, facettierte Frontscheibe", "Runder Kugelkopf mit gelblicher Optik", "Sichtbare Datenlink-Antenne", "Sitzt immer an der Rumpfmittelstation"], "Der Sniper hat eine Front aus flachen Glasflächen. Litening und RecceLite haben einen runden, drehbaren Kopf."], ["c-atf1", "atflir", "Ein Super Hornet der US Navy checkt ein. Welcher Targeting-Pod ist am wahrscheinlichsten?", ["ATFLIR", "Talios", "Damocles", "LANTIRN"], "Der ATFLIR ist der Standard-Targeting-Pod der US-Navy-Hornets."], ["c-atf2", "atflir", "Was solltest du beim ATFLIR nicht ungeprüft voraussetzen?", ["IR-Marker und Video-Downlink", "Laserzielbeleuchtung", "Laserentfernungsmessung", "Wärmebild"], "Laser, Entfernungsmesser und FLIR gehören zum ATFLIR. IR-Marker und VDL solltest du im Check-in abfragen."], ["c-dam1", "damocles", "Wozu dient das NAVFLIR im Damocles-Pylon?", ["Weitwinkel-Wärmebild zur Navigation bei Nacht und im Tiefflug", "Laser Spot Tracker", "Datenlink-Antenne", "Zielbeleuchtung für Raketen"], "Das NAVFLIR liefert dem Piloten ein Weitwinkel-Wärmebild für die Navigation; das Zielen übernimmt der Pod selbst."], ["c-dam2", "damocles", "Welcher Pod löst Damocles an der Rafale ab?", ["Talios", "Reco NG", "Litening", "Sniper"], "Talios ist der moderne Thales-Targeting-Pod der Rafale."], ["c-tal1", "talios", "Was ist für Talios charakteristisch?", ["Weitwinkel-Daueraufklärung zusätzlich zum Zoom", "Integrierter Geländefolgeradar", "Reiner Aufklärungspod ohne Laser", "Nur Nacht-FLIR ohne Tageslichtkamera"], "Talios kombiniert Zoom-Optik mit permanenter Weitwinkelsicht („vision permanente“), dazu HD-Farbbild und Laser."], ["c-lan1", "lantirn", "Ein Lfz checkt mit LANTIRN-Targeting-Pod ein. Was bedeutet das für dich?", ["Nur Wärmebild in geringer Auflösung, kein Video-Downlink – PID-Unterstützung begrenzt", "Bestes HD-Bild mit ROVER-Downlink", "Keine Laserfähigkeit", "Reine Aufklärungsmission"], "LANTIRN ist ein Altsystem: Lasern ja, aber nur IR in geringer Auflösung und ohne VDL."], ["c-lan2", "lantirn", "Was steckt im LANTIRN-Navigationspod AN/AAQ-13?", ["Geländefolgeradar und Weitwinkel-FLIR", "Laserzielbeleuchter", "Aufklärungskamera", "Datenlink zum JTAC"], "Der Nav-Pod dient dem Nacht- und Tiefflug: Terrain-Following-Radar und FLIR-Bild fürs HUD. Gelasert wird mit dem AAQ-14."], ["c-db1", "db110", "Ein polnischer F-16 trägt den DB-110. Kann er deine GBU-12 lasern?", ["Nein – reiner Aufklärungspod", "Ja, mit jedem gültigen Lasercode", "Nur mit IR-Marker", "Nur bei Tag"], "Der DB-110 ist ein Aufklärungssystem ohne Laserzielbeleuchter. Für eine GBU-12 brauchst du ein anderes Lfz oder einen Bodenlaser."], ["c-db2", "db110", "Wie hieß das DB-110-System am Tornado GR4 der RAF?", ["RAPTOR", "SHARP", "TARPS", "RecceLite"], "Die RAF nutzte den DB-110 als RAPTOR (Reconnaissance Airborne Pod for Tornado)."], ["c-shp1", "sharp", "Womit wird der SHARP an der Super Hornet leicht verwechselt?", ["Mit einem Zusatztank", "Mit einer GBU-31", "Mit einem Störsender-Pod", "Mit dem Tankschlauch-Pod"], "Der SHARP hat eine tankähnliche Form an der Rumpfmittelstation. Unterscheidungsmerkmal sind die Kamerafenster."], ["c-shp2", "sharp", "SHARP ist der Nachfolger von …", ["TARPS der F-14", "LANTIRN", "RAPTOR", "ATFLIR"], "SHARP ersetzte das Tactical Airborne Reconnaissance Pod System (TARPS) der F-14 Tomcat."], ["c-rng1", "reco_ng", "Rafale mit großem Fensterpod an der Rumpfmittelstation checkt ein. Was erwartest du?", ["Aufklärung (Reco NG) – keine Zielbeleuchtung", "Laser-Targeting für LGB", "Elektronischen Kampf", "Luftbetankung"], "Reco NG ist ein Aufklärungspod. Ob die Rafale zusätzlich einen Targeting-Pod trägt, klärst du im Check-in."], ["c-rcl1", "reccelite", "Woran unterscheidest du RecceLite optisch vom Litening?", ["Datenlink-Antenne", "Farbe", "Zwei getrennte Fenster", "Kantige Frontscheibe"], "RecceLite basiert auf der Litening-Bauweise. Die Datenlink-Antenne ist die auffälligste bauliche Abweichung."], ["c-rcl2", "reccelite", "Seit wann setzt die Luftwaffe RecceLite am Eurofighter ein?", [" 11 (erste Ziffer 2) und 1811 (zweite Ziffer 8) sind ungültig."], ["g-code2", "gen", "Du beleuchtest das Ziel mit deinem Bodenlaser für eine LGB. Was muss übereinstimmen?", ["Lasercode der Bombe und Code deines Bodenlasers", "Code des Pods und Code der Bombe des anderen Lfz", "Frequenz des ROVER und Lasercode", "Nichts – LGB folgen jedem Laser"], "Die LGB folgt nur Laserenergie mit ihrem eingestellten Code. Bei vielen LGB wird er am Boden eingestellt – früh abstimmen."], ["g-nvg", "gen", "Warum siehst du mit NVG den IR-Pointer, aber nicht den Laserzielbeleuchter?", ["Der Designator arbeitet bei ca. 1064 nm, außerhalb der NVG-Empfindlichkeit", "Der Designator ist zu schwach", "Der Designator ist nur gepulst", "NVG filtern Laser aktiv heraus"], "IR-Pointer arbeiten im Bereich, den NVG verstärken. Der 1064-nm-Designator liegt außerhalb – er dient der Waffenlenkung, nicht der Sichtmarkierung."], ["g-ntisr", "gen", "Was bedeutet NTISR?", ["Aufklärung mit Kampf-Lfz und Targeting-Pod (Non-Traditional ISR)", "Nachtaufklärung mit Spezial-UAS", "Funkaufklärung", "Satellitenaufklärung"], "Non-Traditional ISR: Kampfflugzeuge nutzen ihren Targeting-Pod für Aufklärungsaufträge."], ["g-buddy", "gen", "Was ist Buddy-Lasing?", ["Ein Lfz lasert für die Waffe eines anderen Lfz", "Zwei Bodenlaser auf dasselbe Ziel", "Pilot und WSO lasern abwechselnd", "Laser-Markierung des eigenen Standorts"], "Typisch z. B. Apache oder Reaper lasert für die GBU-12 eines Fast-Jets – Lasercode abstimmen."], ["g-recce", "gen", "Welcher Pod kann keine LGB beleuchten?", ["RecceLite", "Litening", "Sniper", "Talios"], "RecceLite, DB-110, SHARP und Reco NG sind Aufklärungspods ohne Laserzielbeleuchter."], ["g-zone", "gen", "Laser-Ziel-Linie: Was ist die Safety Zone?", ["Ein 20°-Kegel (±10°) um die Linie Ziel–Designator, in dem das Lfz nicht anfliegen soll", "Ein 120°-Sektor, in dem der Angriff optimal ist", "Der Bereich hinter dem Ziel", "Ein Mindestabstand von 1 NM zum Designator"], "Aus der Safety Zone könnt const famIdOf = q => q.fam;
function buildBank(){
  const bank = [];
  for (const f of FAMS){
    (IMG[f.id] || []).forEach((_, i) => bank.push({id:`img:${f.id}:${i}`, kind:'img', fam:f.id, i}));
    bank.push({id:`cap:${f.id}`, kind:'cap', fam:f.id});
    bank.push({id:`type:${f.id}`, kind:'type', fam:f.id});
    bank.push({id:`plat:${f.id}`, kind:'plat', fam:f.id});
    if (f.des === 0 || f.des === 1) bank.push({id:`laser:${f.id}`, kind:'laser', fam:f.id});
  }
  for (const [id, fam, q, opts, ex] of DATA.curated) bank.push({id, kind:'cur', fam, q, opts, ex});
  DATA.brevity.forEach(([t, d], i) => {
    bank.push({id:`brev:${i}`, kind:'brev', fam:'gen', t, d});
    bank.push({id:`brevr:${i}`, kind:'brevr', fam:'gen', t, d});
  });
  return bank;
}
const BANK = buildBank();
const BANK_BY_ID = Object.fromEntries(BANK.map(q => [q.id, q]));

function famAcc(id){ const s = S.fam[id]; if (!s || (s.c + s.w) === 0) return null; return s.c / (s.c + s.w); }
function weight(q, prevFam){
  const fa = famAcc(q.fam);
  const weak = fa === null ? 0.45 : 1 - fa;
  const s = S.q[q.id];
  let w = (1 + 2 * weak) * (s ? Math.max(0.25, 1 + 1.6 * (s.w / Math.max(1, s.c + s.w)) - 0.08 * Math.min(s.c, 6)) : 1.35);
  if (S.recent.includes(q.id)) w *= 0.12;
  if (q.fam === prevFam) w *= 0.25;
  if (q.kind === 'img') w *= 0.9;
  return w;
}
function pickRound(mode){
  const M = MODES[mode];
  let pool = BANK.filter(q => M.kinds.includes(q.kind));
  if (M.noGen) pool = pool.filter(q => q.fam !== 'gen');
  if (M.onlyGen) pool = pool.filter(q => q.fam === 'gen');
  if (M.confusion) pool = pool.filter(q => FAM[q.fam] && FAM[q.fam].confuse.length);
  const out = []; let prevFam = null;
  const n = Math.min(ROUND_LEN, pool.length);
  const usedImgFam = {};
  while (out.length < n && pool.length){
    const ws = pool.map(q => weight(q, prevFam) * (q.kind === 'img' && usedImgFam[q.fam] ? 0.2 : 1));
    let r = Math.random() * ws.reduce((a, b) => a + b, 0), k = 0;
    while (k < ws.length - 1 && (r -= ws[k]) > 0) k++;
    const q = pool.splice(k, 1)[0];
    if (q.kind === 'img') usedImgFam[q.fam] = true;
    out.push(q); prevFam = q.fam;
  }
  return out;
}

/* distractor helpers */
// type pairs too close to each other to serve as clean distractors
const TYPE_EXCLUDE = {gimbal:['uas','heli'], uas:['gimbal'], heli:['gimbal'], tgp:['internal'], internal:['tgp']};
const typeAlternatives = t => Object.keys(TYPES).filter(x => x !== t && !(TYPE_EXCLUDE[t] || []).includes(x));
function nameDistractors(f, strict){
  const conf = shuffle(f.confuse.map(id => FAM[id]).filter(Boolean));
  const same = shuffle(FAMS.filter(x => x.type === f.type && x.id !== f.id && !f.confuse.includes(x.id)));
  const rest = shuffle(FAMS.filter(x => x.id !== f.id && x.type !== f.type && !f.confuse.includes(x.id)));
  let list = strict ? [...conf, ...same, ...rest] : [...conf.slice(0, 2), ...shuffle([...conf.slice(2), ...same, ...rest])];
  return list.slice(0, 3).map(x => x.name);
}
function materialize(q, mode){
  const f = FAM[q.fam];
  const strict = MODES[mode].confusion;
  if (q.kind === 'img'){
    return {prompt:'Welcher Pod bzw. Sensor ist das?', img:[f.id, q.i], correct:f.name, wrong:nameDistractors(f, strict),
      ex:`${f.name}: ${TYPES[f.type].label}. Erkennung: ${f.recog}` + (f.confuse.length ? ` Verwechslungsgefahr mit ${f.confuse.map(c => FAM[c].name).join(', ')}.` : '')};
  }
  if (q.kind === 'cap'){
    const imgs = IMG[f.id]; let i = Math.floor(Math.random() * imgs.length);
    if (imgs.length > 1 && S.lastImg[f.id] === i) i = (i + 1) % imgs.length;
    const others = shuffle(typeAlternatives(f.type));
    const anchor = f.type === 'recce' ? 'tgp' : 'recce';
    const pickTypes = [anchor, ...others.filter(t => t !== anchor)].slice(0, 3);
    return {prompt:'Was kann ein Lfz mit diesem Sensor für dich leisten?', img:[f.id, i], correct:TYPES[f.type].cap, wrong:pickTypes.map(t => TYPES[t].cap),
      ex:`Das ist ${f.name} (${TYPES[f.type].label}). Wirkung: ${f.effects}. Aufklärung: ${f.recon}.`};
  }
  if (q.kind === 'type'){
    const wrong = shuffle(typeAlternatives(f.type)).slice(0, 3).map(t => TYPES[t].label);
    return {prompt:`Was ist ${f.name}?`, correct:TYPES[f.type].label, wrong, ex:`${f.name} ist ein ${TYPES[f.type].label}. ${TYPES[f.type].cap}.`};
  }
  if (q.kind === 'plat'){
    return {prompt:`An welcher Plattform triffst du ${f.name} typischerweise?`, correct:f.plat[0], wrong:shuffle(f.plat[1]).slice(0, 3),
      ex:`Typisch: ${f.primary}. Plattformen: ${f.platforms.join('; ')}.` + (f.bw ? ` ${f.bw}` : '')};
  }
  if (q.kind === 'laser'){
    const yes = 'Ja – eigener Laserzielbeleuchter', no = 'Nein – kein Laserzielbeleuchter';
    return {prompt:`Kann ein Lfz mit ${f.name} ein Ziel selbst für LGB oder Hellfire beleuchten?`, correct:f.des ? yes : no, wrong:[f.des ? no : yes, 'Nur über den IR-Marker', 'Nur bei Tageslicht'],
      ex:f.des ? `${f.name} hat einen Laserzielbeleuchter. Wirkung: ${f.effects}.` : `${f.name} ist ein reiner Aufklärungspod ohne Laserzielbeleuchter. ${f.jtac[0]}`};
  }
  if (q.kind === 'cur'){
    return {prompt:q.q, correct:q.opts[0], wrong:q.opts.slice(1), ex:q.ex};
  }
  if (q.kind === 'brev'){
    const others = shuffle(DATA.brevity.filter(b => b[0] !== q.t)).slice(0, 3).map(b => b[1]);
    return {prompt:`Was bedeutet „${q.t}“?`, correct:q.d, wrong:others, ex:`${q.t}: ${q.d}.`};
  }
  if (q.kind === 'brevr'){
    const others = shuffle(DATA.brevity.filter(b => b[0] !== q.t)).slice(0, 3).map(b => b[0]);
    return {prompt:`Welches Brevity-Wort passt? „${q.d}“`, correct:q.t, wrong:others, ex:`${q.t}: ${q.d}.`};
  }
}

    ${f ? profileHtml(f) : ''}
    <div class="row">
      <button class="btn main" data-act="next">${R.i + 1 < R.qs.length ? 'Nächste Frage' : 'Auswertung'}</button>
      <button class="btn ${flagged ? 'flagged' : ''}" data-flag="${esc(q.id)}">${flagged ? 'Gemeldet' : 'Frage melden'}</button>
    </div>
  </section>`;
  const fb = $('#fb .btn.main'); if (fb) fb.focus({preventScroll:true});
  $('#fb').scrollIntoView({behavior:'smooth', block:'nearest'});
}
function annoHtml(f){
  const a = ANNO[f.id]; if (!a || !IMG[f.id] || !IMG[f.id][a.i]) return '';
  return `<figure class="anno" style="aspect-ratio:${a.ar};width:min(100%, ${Math.round(540 * a.ar)}px)" data-zoom="${f.id}:${a.i}">
      <img src="${IMG[f.id][a.i]}" alt="${esc(f.name)} mit markierten Erkennungsmerkmalen">
      ${a.p.map(([x, y], k) => `<span class="pin" style="left:${x}%;top:${y}%">${k + 1}</span>`).join('')}
    </figure>
    <ol class="legendlist">${a.p.map(([, , t], k) => `<li><b>${k + 1}</b><span>${esc(t)}</span></li>`).join('')}</ol>`;
}
function chipVal(v){ return v === 1 ? '1' : v === 0 ? '0' : '?'; }
function chipsHtml(f){
  const lab = (n, v) => `<li data-v="${chipVal(v)}">${n}: ${v === 1 ? 'ja' : v === 0 ? 'nein' : 'erfragen'}</li>`;
  const vdlV = f.vdl === 0 || f.vdl === 'nein' ? 0 : f.vdl == null ? null : 1;
  const vdlTxt = f.vdl === 0 || f.vdl === 'nein' ? 'nein' : f.vdl == null ? 'erfragen' : f.vdl;
  return `<ul class="chips">${lab('Laser', f.des)}${lab('LST', f.lst)}${lab('IR-Marker', f.ir)}<li data-v="${chipVal(vdlV)}">VDL: ${esc(vdlTxt)}</li></ul>`;
}
function profileHtml(f){
  return `<div class="profile">
    <h3>${esc(f.name)}<small>${esc(TYPES[f.type].label)}</small></h3>
    ${chipsHtml(f)}
    <dl class="kv"><dt>Plattform</dt><dd>${esc(f.primary)}</dd><dt>Wirkung</dt><dd>${esc(f.effects)}</dd><dt>Reichweite</dt><dd>${esc(f.range)}</dd></dl>
    <div class="row" style="margin-top:10px"><button class="linkbtn" data-card="${f.id}">Steckbrief öffnen</button></div>
  </div>`;
}
function renderEnd(){
  $('#bar').style.display = '';
  setBar('Auswertung', {back:'home'});
  const n = R.qs.length;
  const byFam = {};
  R.missed.forEach(x => { byFam[x.fam] = (byFam[x.fam] || 0) + 1; });
  $('#app').innerHTML = `
    <div class="score">${R.score}<span class="muted" style="font-size:.45em"> / ${n}</span></div>
    <p class="muted">${MODES[R.mode].name} – ${Math.round(100 * R.score / n)} % richtig.</p>
    ${R.missed.length ? `<h2 style="margin-top:22px">Nacharbeiten</h2><ul class="misslist">${R.missed.map(x => `<li><div>${esc(x.prompt)}</div><div class="small"><strong>${esc(x.correct)}</strong>${FAM[x.fam] ? ` – <button class="linkbtn" data-card="${x.fam}">Steckbrief ${esc(FAM[x.fam].name)}</button>` : ''}</div></li>`).join('')}</ul>` : '<p>Alles richtig.</p>'}
    <div class="row" style="margin-top:20px"><button class="btn main" data-start="${R.mode}">Neue Runde</button><button class="btn" data-act="home">Zur Übersicht</button></div>`;
}
function renderCards(){
  $('#bar').style.display = '';
  setBar('Steckbriefe', {back:'home'});
  $('#app').innerHTML = TYPE_ORDER.map(t => {
    const fs = FAMS.filter(f => f.type === t); if (!fs.length) return '';
    return `<section class="group"><h2>${esc(TYPES[t].label)}</h2><p class="small muted" style="margin:0 0 4px">${esc(TYPES[t].cap)}</p>
      ${fs.map(f => `<button class="fam" data-card="${f.id}"><span class="code">${esc(f.short)}</span><span class="nm">${esc(f.name)}<br><span class="small muted" style="font-weight:400">${esc(f.primary)}</span></span><span class="pct">${pct(f.id)}</span></button>`).join('')}</section>`;
  }).join('');
}
let cardState = null;
function openCard(id){
  const f = FAM[id]; if (!f) return;
  cardState = {id, i:0};
  drawCard();
  const sh = $('#sheet'); sh.hidden = false; sh.scrollTop = 0;
  document.body.style.overflow = 'hidden';
}
function drawCard(){
  const f = FAM[cardState.id]; const n = IMG[f.id].length;
  const list = a => `<ul>${a.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
  $('#sheet').innerHTML = `<div class="bar" style="position:sticky"><div class="bar-in"><button class="iconbtn" data-act="closecard" aria-label="Schließen">‹ Zurück</button><div class="t">${esc(f.name)}</div><span class="muted small">${pct(f.id)}</span></div></div>
  <div class="wrap">
    ${feedHtml(f.id, cardState.i, {nav:n > 1, counter:`${cardState.i + 1}/${n}`, alt:f.name})}
    <h1 style="font-size:2.6rem;margin-top:16px">${esc(f.name)}</h1>
    <div class="desig">${esc(f.designation)} – ${esc(f.maker)}</div>
    ${chipsHtml(f)}
    ${f.bw ? `<div class="bw"><strong>Bundeswehr:</strong> ${esc(f.bw)}</div>` : ''}
    <div class="sec"><h3>Plattformen</h3>${list(f.platforms)}</div>
    <div class="sec"><h3>Sensoren</h3>${list(f.sensors)}</div>
    <div class="sec"><h3>Wirkung</h3><p style="margin:0">${esc(f.effects)}</p></div>
    <div class="sec"><h3>Aufklärung</h3><p style="margin:0">${esc(f.recon)}</p></div>
    <div class="sec"><h3>Reichweite und Einsatzprofil</h3><p style="margin:0">${esc(f.range)}</p></div>
    <div class="sec"><h3>Video-Downlink und Koordinaten</h3><p style="margin:0">${esc(f.vdlText)} Koordinaten: ${esc(f.coords)}.</p></div>
    <div class="sec"><h3>Als JTAC beachten</h3>${list(f.jtac)}</div>
    ${ANNO[f.id] ? `<div class="sec"><h3>Erkennungsmerkmale</h3>${annoHtml(f)}<p style="margin:10px 0 0">${esc(f.recog)}</p></div>` : `<div class="sec"><h3>Erkennung</h3><p style="margin:0">${esc(f.recog)}</p></div>`}
    ${f.confuse.length ? `<div class="sec"><h3>Verwechslungsgefahr</h3><div class="row" style="margin-top:4px">${f.confuse.map(c => `<button class="btn" data-card="${c}">${esc(FAM[c].name)}</button>`).join('')}</div></div>` : ''}
  </div>`;
}
function closeCard(){ $('#sheet').hidden = true; document.body.style.overflow = ''; cardState = null; }

function renderStats(){
  $('#bar').style.display = '';
  setBar('Statistik', {back:'home'});
  const rows = FAMS.map(f => ({f, a:famAcc(f.id), s:S.fam[f.id] || {c:0, w:0}})).sort((x, y) => (x.a ?? -1) - (y.a ?? -1));
  const gen = S.fam.gen || {c:0, w:0};
  const flags = Object.entries(S.flags);
  const flagText = flags.map(([id, v]) => `• [${id}] ${v.t}`).join('\n');
  $('#app').innerHTML = `
    <div class="stat-top"><div><b>${S.answered}</b><span class="muted small">Antworten</span></div><div><b>${S.answered ? Math.round(100 * S.correct / S.answered) + ' %' : '–'}</b><span class="muted small">richtig</span></div></div>
    <p class="sync">${esc(syncLabel)}</p>
    <h2 style="margin-top:18px">Je Familie, schwächste zuerst</h2>
    <div style="margin-top:6px">${rows.map(({f, a, s}) => `<div class="srow"><button class="linkbtn" data-card="${f.id}" style="text-align:left">${esc(f.name)}</button><div class="sbar"><i style="width:${a === null ? 0 : a * 100}%;background:${a === null ? 'transparent' : a >= .8 ? 'var(--ok)' : a >= .5 ? 'var(--cta)' : 'var(--bad)'}"></i></div><span class="small muted" style="text-align:right">${a === null ? '–' : Math.round(a * 100) + ' %'} <br>${s.c + s.w}×</span></div>`).join('')}
    <div class="srow"><span>Laser und Brevity</span><div class="sbar"><i style="width:${gen.c + gen.w ? 100 * gen.c / (gen.c + gen.w) : 0}%;background:var(--cta)"></i></div><span class="small muted" style="text-align:right">${gen.c + gen.w ? Math.round(100 * gen.c / (gen.c + gen.w)) + ' %' : '–'}<br>${gen.c + gen.w}×</span></div></div>
    <h2 style="margin-top:26px">Gemeldete Fragen</h2>
    ${flags.length ? `<p class="small muted" style="margin:4px 0 8px">Kopiere die Liste und schick sie mir im Chat, dann prüfe und korrigiere ich die Fragen.</p><textarea readonly id="flagtxt">${esc(flagText)}</textarea><div class="row"><button class="btn" data-act="copyflags">Liste kopieren</button><button class="btn" data-act="clearflags">Meldungen löschen</button></div>` : '<p class="muted">Noch keine Frage gemeldet. Nach jeder Antwort kannst du eine Frage mit „Frage melden“ markieren.</p>'}
    <h2 style="margin-top:26px">Zurücksetzen</h2>
    <p class="small muted" style="margin:4px 0 8px">Löscht alle Antworten und die Trefferquoten. Gemeldete Fragen bleiben erhalten.</p>
    <button class="btn" data-act="reset">Statistik zurücksetzen</button>`;
}
function render(){
  if (view === 'home') renderHome();
  else if (view === 'quiz') renderQuiz();
  else if (view === 'end') renderEnd();
  else if (view === 'cards') renderCards();
  else if (view === 'stats') renderStats();
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-zoom]');
  if (!t) return;
  if (t.dataset.img && cardState){
    e.stopPropagation();
    const n = IMG[cardState.id].length;
    cardState.i = (cardState.i + Number(t.dataset.img) + n) % n; drawCard(); return;
  }
  if (t.dataset.zoom){
    const [fid, i] = t.dataset.zoom.split(':');
    const lb = document.createElement('div'); lb.className = 'lightbox'; lb.setAttribute('role', 'dialog');
    lb.innerHTML = `<img src="${IMG[fid][Number(i)]}" alt="Vergrößerte Ansicht">`;
    lb.addEventListener('click', () => lb.remove());
    document.body.appendChild(lb); return;
  }
  if (t.dataset.start){ closeCard(); startRound(t.dataset.start); return; }
  if (t.dataset.go){ view = t.dataset.go; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.card){ openCard(t.dataset.card); return; }
  if (t.dataset.ans != null){ answer(Number(t.dataset.ans)); return; }
  if (t.dataset.flag){
    const id = t.dataset.flag;
    if (S.flags[id]) delete S.flags[id]; else S.flags[id] = {t:R && R.cur ? R.cur.m.prompt : id, ts:Date.now()};
    save();
    t.classList.toggle('flagged', !!S.flags[id]); t.textContent = S.flags[id] ? 'Gemeldet' : 'Frage melden';
    return;
  }
  const act = t.dataset.act;
  if (act === 'home'){ closeCard(); view = 'home'; R = null; render(); window.scrollTo(0, 0); }
  else if (act === 'next') nextQ();
  else if (act === 'anno'){
    const ar = $('#annoarea'); if (!ar) return;
    S.annoOpen = ar.hidden; ar.hidden = !ar.hidden; save();
    t.textContent = S.annoOpen ? 'Erkennungsmerkmale ausblenden' : 'Erkennungsmerkmale zeigen';
    t.setAttribute('aria-expanded', S.annoOpen ? 'true' : 'false');
    if (S.annoOpen) ar.scrollIntoView({behavior:'smooth', block:'nearest'});
  }
  else if (act === 'closecard') closeCard();
  else if (act === 'copyflags'){
    const ta = $('#flagtxt'); ta.select();
    const done = () => { t.textContent = 'Kopiert'; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, () => { try { document.execCommand('copy'); done(); } catch(_){} });
    else { try { document.execCommand('copy'); done(); } catch(_){} }
  }
  else if (act === 'clearflags'){ S.flags = {}; save(); render(); }
  else if (act === 'reset'){
    if (t.dataset.confirm){ const fl = S.flags; S = blank(); S.flags = fl; save(); render(); }
    else { t.dataset.confirm = '1'; t.textContent = 'Wirklich zurücksetzen? Erneut tippen'; t.classList.add('flagged'); }
  }
});
document.addEventListener('keydown', e => {
  if (document.querySelector('.lightbox')){ if (e.key === 'Escape') document.querySelector('.lightbox').remove(); return; }
  if (!$('#sheet').hidden){ if (e.key === 'Escape') closeCard(); return; }
  if (view !== 'quiz' || !R) return;
  if (!R.answered && /^[1-4]$/.test(e.key)){ const k = Number(e.key) - 1; if (k < R.cur.opts.length) answer(k); }
  else if (R.answered && (e.key === 'Enter' || e.key === ' ') && !(e.target && e.target.dataset && e.target.dataset.flag)){ e.preventDefault(); nextQ(); }
});
render();
</script>
<script src="../assets/app.js" defer></script>
