<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Manöver-Trainer</title>
<meta name="theme-color" content="#E4E9E7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1517" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="JTAC">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/app.css">
<style>
:root{
  --bg:#E4E9E7; --surface:#F4F7F5; --surface2:#E9EEEC; --ink:#1A2326; --muted:#55615F; --line:#C3CCC9;
  --ok:#2A7848; --ok-bg:#DCEEE2; --bad:#B0382B; --bad-bg:#F6DEDA; --unk:#7A6A2E; --unk-bg:#F1E9CF;
  --cta:#E0A526; --cta-ink:#1A2326; --feed:#0B1113; --hud:#F2B632;
  --font-d:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --font-b:"Barlow","Segoe UI",system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1517; --surface:#172022; --surface2:#1D282B; --ink:#E1E7E5; --muted:#93A09D; --line:#2A3639;
    --ok:#56B57F; --ok-bg:#16301F; --bad:#E36D5E; --bad-bg:#3A1C18; --unk:#D9C17A; --unk-bg:#2E2913;
    --cta:#E3AA2E; --cta-ink:#111719; --feed:#06090A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1517; --surface:#172022; --surface2:#1D282B; --ink:#E1E7E5; --muted:#93A09D; --line:#2A3639;
  --ok:#56B57F; --ok-bg:#16301F; --bad:#E36D5E; --bad-bg:#3A1C18; --unk:#D9C17A; --unk-bg:#2E2913;
  --cta:#E3AA2E; --cta-ink:#111719; --feed:#06090A; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--cta);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:12px 18px 48px}
h1,h2,h3{font-family:var(--font-d);line-height:1.1;margin:0}
h2{font-size:1.45rem;font-weight:600;letter-spacing:.005em}
h3{font-size:1.25rem;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.875rem}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:720px;margin:0 auto;padding:8px 18px;display:flex;align-items:center;gap:12px;min-height:52px}
.bar .t{font-family:var(--font-d);font-weight:600;font-size:1.2rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:40px;height:40px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:500}
.prog{height:3px;background:var(--line)}
.prog>i{display:block;height:100%;background:var(--cta);transition:width .25s}

/* home */
.hero{padding:28px 0 20px}
.hero h1{font-size:clamp(3rem,13vw,5.2rem);font-weight:700;letter-spacing:-.015em;line-height:.9}
.hero p{max-width:34em;margin:12px 0 0;color:var(--muted);font-size:1.05rem}
.board{margin:8px 0 24px}
.board-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.cells{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.board h3{font-size:1.05rem;color:var(--muted);margin:14px 0 6px;letter-spacing:.04em;text-transform:uppercase}
@media (min-width:600px){.cells{grid-template-columns:repeat(8,minmax(0,1fr))}}
.cell{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 8px 12px;min-height:66px;overflow:hidden}
.cell b{display:block;font-family:var(--font-d);font-weight:700;font-size:1.25rem;line-height:1}
.cell span{display:block;font-size:.72rem;color:var(--muted);line-height:1.2;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell i{position:absolute;left:0;bottom:0;height:5px;background:var(--line)}
.cell[data-s="bad"] i{background:var(--bad)} .cell[data-s="mid"] i{background:var(--cta)} .cell[data-s="ok"] i{background:var(--ok)}
.cell[data-s="none"]{border-style:dashed}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:.8rem;color:var(--muted)}
.legend em{font-style:normal;display:inline-flex;align-items:center;gap:5px}
.legend em::before{content:"";width:12px;height:5px;background:var(--c)}
.cta{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;background:var(--cta);color:var(--cta-ink);border:0;border-radius:10px;padding:16px 18px;text-align:left}
.cta strong{font-family:var(--font-d);font-size:1.5rem;font-weight:700;display:block;line-height:1.05}
.cta small{display:block;font-size:.9rem;opacity:.85}
.cta .go{font-family:var(--font-d);font-size:1.6rem;font-weight:700}
.modes{margin-top:22px;border-top:1px solid var(--line)}
.mode{display:flex;width:100%;gap:14px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 2px}
.mode .mi{flex:1}
.mode strong{display:block;font-family:var(--font-d);font-size:1.3rem;font-weight:600;line-height:1.1}
.mode small{display:block;color:var(--muted);font-size:.9rem;margin-top:2px}
.mode .n{font-family:var(--font-d);font-size:1.1rem;color:var(--muted);white-space:nowrap}
.mode:hover strong{text-decoration:underline;text-underline-offset:3px}
.foot{margin-top:28px;font-size:.82rem;color:var(--muted);max-width:40em}

/* feed */
.feed{position:relative;margin:0;background:var(--feed);border-radius:10px;overflow:hidden;aspect-ratio:4/3;cursor:zoom-in}
.feed img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.feed svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.feed .hud{position:absolute;font-family:var(--font-d);font-weight:600;font-size:.8rem;letter-spacing:.06em;color:var(--hud);opacity:.85;text-shadow:0 1px 2px #000}
.feed .hud.tl{top:10px;left:14px} .feed .hud.tr{top:10px;right:14px} .feed .hud.bl{bottom:10px;left:14px}
.feed .nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:1.4rem;display:flex;align-items:center;justify-content:center;pointer-events:auto}
.feed .nav.l{left:8px} .feed .nav.r{right:8px}

/* quiz */
.qmeta{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 10px;font-size:.9rem;color:var(--muted)}
.prompt{font-family:var(--font-d);font-size:1.55rem;font-weight:600;line-height:1.15;margin:14px 0 14px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;line-height:1.35}
.opt .k{flex:none;width:26px;height:26px;border-radius:6px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-weight:700;color:var(--muted);font-size:.95rem}
.opt:not([disabled]):hover{border-color:var(--ink)}
.opt[disabled]{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)} .opt.correct .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)} .opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.fb{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c,var(--ok));border-radius:10px;padding:14px 16px}
.fb .v{font-family:var(--font-d);font-size:1.35rem;font-weight:700;color:var(--c)}
.fb p{margin:6px 0 0}
.profile{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.profile h3 small{font-family:var(--font-b);font-size:.85rem;font-weight:500;color:var(--muted);margin-left:6px}
.kv{display:grid;grid-template-columns:7.5em 1fr;gap:4px 12px;margin:10px 0 0;font-size:.94rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;padding:0;list-style:none}
.chips li{font-size:.82rem;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--surface2);border:1px solid var(--line)}
.chips li[data-v="1"]{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.chips li[data-v="0"]{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.chips li[data-v="?"]{background:var(--unk-bg);border-color:var(--unk);color:var(--unk)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:10px 14px;font-weight:600}
.btn.main{background:var(--ink);color:var(--bg);border-color:var(--ink);flex:1;min-width:9em}
.btn.flagged{border-color:var(--bad);color:var(--bad)}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-weight:600}

/* end */
.score{font-family:var(--font-d);font-size:5rem;font-weight:700;line-height:.9;margin:24px 0 4px}
.misslist{list-style:none;padding:0;margin:12px 0 0;border-top:1px solid var(--line)}
.misslist li{padding:10px 0;border-bottom:1px solid var(--line)}

/* cards list */
.group{margin-top:24px}
.group h2{margin-bottom:6px}
.fam{display:flex;width:100%;align-items:center;gap:12px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 2px}
.fam .code{font-family:var(--font-d);font-weight:700;font-size:1.1rem;width:3em;color:var(--muted)}
.fam .nm{flex:1;font-weight:600}
.fam .pct{font-family:var(--font-d);font-size:1.05rem;color:var(--muted)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch}
.sheet[hidden]{display:none}
.sec{margin-top:18px}
.sec h3{font-size:1.1rem;margin-bottom:4px}
.sec ul{margin:4px 0 0;padding-left:1.15em}
.sec li{margin:2px 0}
.desig{font-size:.95rem;color:var(--muted);margin-top:4px}
.bw{margin-top:12px;border-left:4px solid var(--cta);background:var(--surface);padding:8px 12px;border-radius:0 8px 8px 0;font-size:.95rem}
.lightbox{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:12px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}

/* stats */
.stat-top{display:flex;gap:28px;margin:18px 0 6px}
.stat-top b{display:block;font-family:var(--font-d);font-size:2.4rem;line-height:1}
.srow{display:grid;grid-template-columns:8.5em 1fr 4.2em;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.94rem}
.sbar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.sbar i{display:block;height:100%}
textarea{width:100%;min-height:120px;font:inherit;font-size:.85rem;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
.sync{font-size:.8rem;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.foot a{color:var(--ink);text-underline-offset:3px}
.annobox{margin-top:12px}
.annobox #annoarea{margin-top:12px}
.anno{position:relative;margin:0;max-width:100%;border-radius:10px;overflow:hidden;background:var(--feed);cursor:zoom-in}
.anno img{display:block;width:100%;height:100%;object-fit:cover}
.anno .pin{position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:var(--hud);color:#111;border:2px solid #111;font-family:var(--font-d);font-weight:700;font-size:.95rem;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.6);pointer-events:none}
.legendlist{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:6px}
.legendlist li{display:flex;gap:10px;align-items:flex-start;font-size:.94rem;line-height:1.35}
.legendlist b{flex:none;width:22px;height:22px;border-radius:50%;background:var(--hud);color:#111;font-family:var(--font-d);font-size:.85rem;display:flex;align-items:center;justify-content:center;margin-top:1px}
.unitrow{margin-top:10px}
.unitrow strong{font-family:var(--font-d);font-size:1.08rem;font-weight:600}
.unitrow .chips{margin-top:4px}
.vbox{margin-top:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.vbox h4{margin:0;font-family:var(--font-d);font-size:1.2rem;font-weight:600}
.vbox .kv{grid-template-columns:6.8em 1fr}
.sec h3 + .vbox{margin-top:6px}
.imgcap{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:8px}
.vlabel{font-family:var(--font-d);font-weight:700;font-size:1.25rem;background:var(--ink);color:var(--bg);border-radius:6px;padding:2px 10px}
.vlabel.none{background:var(--surface2);color:var(--muted);font-weight:600;font-size:1rem}
.capbtns{display:flex;gap:6px;flex-wrap:wrap}
.btn.sm{padding:6px 10px;font-size:.88rem}
.pinwrap{margin-top:10px}
.fam.sub{padding-left:18px;background:var(--surface)}
.fam.sub .nm{font-weight:600}
.unitrow.cur{border-left:4px solid var(--cta);padding-left:8px}
.tag{font-family:var(--font-b);font-size:.75rem;font-weight:600;background:var(--cta);color:var(--cta-ink);border-radius:999px;padding:1px 8px;vertical-align:middle}
.guide-link{display:flex;gap:14px;align-items:center;margin-top:18px;padding:14px 16px;border:1px solid var(--line);border-left:4px solid var(--cta);border-radius:10px;background:var(--surface);color:var(--ink);text-decoration:none}.guide-link .mi{flex:1}.guide-link strong{display:block;font-family:var(--font-d);font-size:1.3rem;font-weight:600;line-height:1.1}.guide-link small{display:block;color:var(--muted);font-size:.9rem;margin-top:2px}.guide-link .n{font-family:var(--font-d);font-size:1.1rem;color:var(--muted);white-space:nowrap}.guide-link:hover strong{text-decoration:underline;text-underline-offset:3px}
.foot a{color:var(--ink);text-underline-offset:3px}
</style>
<style>
.cmpwrap{margin-top:8px}
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cmpfig{margin:0;min-width:0}
.cmpfig>.ctag{display:inline-block;margin-bottom:4px;background:var(--ink);color:var(--bg);font-family:var(--font-d);font-weight:700;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;padding:1px 8px;border-radius:5px}
.cmpbox{display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;max-width:100%;background:var(--feed);border-radius:8px;overflow:hidden;cursor:zoom-in}
.cmpin{position:relative;max-height:100%}
.cmpin img{display:block;width:100%;height:100%;object-fit:cover}
.cmpin .pin{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:var(--hud);color:#111;border:2px solid #111;font-family:var(--font-d);font-weight:700;font-size:.85rem;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.6);pointer-events:none}
.czoom{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-height:100%}
.czoom .cmpin{max-width:100%}
.czoom .pin{width:28px;height:28px;font-size:1rem}
.czcap{margin:0;color:#eee;font-size:.92rem;line-height:1.35;display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;max-width:720px}
.czcap b{width:100%;text-align:center;font-family:var(--font-d);font-size:1.05rem}
.czcap i{font-style:normal;font-weight:700;display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--hud);color:#111;margin-right:6px;font-size:.8rem}
.cmpfig figcaption{margin-top:6px;font-size:.88rem;line-height:1.3}
.cmpfig figcaption>b{font-family:var(--font-d);font-size:1.02rem;font-weight:600}
.cmpfig .legendlist{margin-top:4px;gap:4px}
.cmpfig .legendlist li{font-size:.84rem;gap:6px}
.cmpfig .legendlist b{width:19px;height:19px;font-size:.78rem}
.vbox h4 .nato{display:inline-block;vertical-align:middle;margin-left:4px;background:var(--ink);color:var(--bg);font-family:var(--font-d);font-weight:600;font-size:.8rem;letter-spacing:.02em;padding:1px 7px;border-radius:5px}
.cmpkey{margin:10px 0 0;padding:8px 12px;border-left:4px solid var(--cta);background:var(--surface);border-radius:0 8px 8px 0;font-size:.95rem}
.confint{margin:4px 0 0;color:var(--muted);font-size:.92rem}
.vbox .cmpwrap{margin-top:6px}
</style>
</head>
<body>
<header class="bar" id="bar"><div class="bar-in" id="barin"></div><div class="prog" id="prog" hidden><i></i></div></header>
<main class="wrap" id="app" aria-live="polite"></main>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>
<script>
const DATA = {"cats": {"kpz": {"label": "Kampfpanzer", "cap": "Schwer gepanzert, große Kanone – braucht panzerbrechende Präzisionswaffen; Kanonen-LFK gefährden Hubschrauber"}, "ust": {"label": "Panzerunterstützungsfahrzeug", "cap": "KPz-Fahrgestell ohne Hauptkanone; Maschinenkanonen und LFK gegen Infanterie, Panzerabwehr und Hubschrauber"}, "spz": {"label": "Schützenpanzer (Kette)", "cap": "Transportiert Infanterie, Turm mit Kanone – mittel gepanzert"}, "ll": {"label": "Luftlande-Schützenpanzer", "cap": "Klein, leicht und luftverlastbar, Aluminiumpanzerung – Fallschirmjäger (VDV)"}, "tpzr": {"label": "Radschützenpanzer (8×8)", "cap": "Transportiert Infanterie auf Rädern, leicht gepanzert"}, "tpzk": {"label": "Transportpanzer auf Ketten, ohne Turmkanone", "cap": "Leicht gepanzert, nur MG – Transport, Zugmittel, Basis für Sonderaufbauten"}, "rad": {"label": "Spähwagen bzw. geschütztes Radfahrzeug", "cap": "Aufklärung, Führung, Transport – leicht geschützt"}, "pzj": {"label": "Panzerjäger (LFK-Träger)", "cap": "Lenkflugkörper auf leichtem Fahrgestell – Gefahr für KPz und Hubschrauber auf große Entfernung"}, "lkw": {"label": "Lkw bzw. ungeschütztes Radfahrzeug", "cap": "Transport, Versorgung und Führung – ungepanzert, Splitter genügen"}}, "catOrder": ["kpz", "ust", "spz", "ll", "tpzr", "tpzk", "rad", "pzj", "lkw"], "catExcl": {"ll": ["spz"], "spz": [], "ust": []}, "catX": {"kornet": ["rad"], "shturm": ["tpzk"]}, "lwr": {"lwr": "Ja – Laserwarner erkennt die Bestrahlung und löst automatisch Nebel bzw. Aerosol aus", "no": "Nein – kein Laserwarner, mit Bordmitteln bemerkt die Besatzung den Laser in der Regel nicht", "x1": "Nur den Designator – Entfernungsmesser sind dafür zu schwach", "x2": "Ja – im Wärmebildvisier ist der Laserstrahl sichtbar"}, "lwrOrder": ["lwr", "no", "x1", "x2"], "lwrNo": "Kein Laserwarnempfänger. Laser-Entfernungsmesser (meist ca. 1,5 µm) und Designatoren (1,06 µm) sind für das Auge und für Wärmebildgeräte unsichtbar. Sehen können sie nur Spezialsensoren (SWIR-Kameras) und – bei 1,06 µm – teils digitale Nachtsichtgeräte.", "tis": {"tis": "Wärmebildvisier – sieht Wärmequellen auf mehrere Kilometer, auch durch normalen Rauch, aber nicht durch feste Deckung", "ii": "Restlichtverstärker bzw. aktiver IR-Scheinwerfer – kein Wärmebild, nachts nur kurze Reichweite", "mix": "Je nach Baulos oder Modernisierung – teils Wärmebild, teils nur Restlichtverstärker", "day": "Nur Tagoptik bzw. einfache Fahrer-Nachtsicht – nachts auf Handgeräte der Besatzung angewiesen"}, "tisOrder": ["tis", "mix", "ii", "day"], "wcls": {"mbt": "Schwer gepanzert: LFK mit Tandem-Hohlladung (Hellfire/JAGM, Brimstone), Maverick oder Volltreffer mit Lenkbombe (GBU-12/-54) – Bordkanone (GAU-8) nur von Seite, Heck oder oben", "ifv": "Mittel gepanzert: 30-mm-Bordkanone (GAU-8, M230), Hellfire, Maverick oder kleine Lenkbombe – 20-mm-Kanone und APKWS nur eingeschränkt", "apc": "Leicht gepanzert: jede Bordkanone, APKWS bzw. Hydra und kleine Bomben genügen – die Panzerung hält nur Handwaffen und Splitter ab", "soft": "Ungepanzert: Splitterwirkung genügt – Airburst, ungelenkte Raketen, Bordkanone"}, "wOrder": ["mbt", "ifv", "apc", "soft"], "wlab": {"mbt": "schwer", "ifv": "mittel", "apc": "leicht", "soft": "ungepanzert"}, "fj": "Für Fast Jets mit ausreichend Höhe (grob über 3 km über Grund) sind die Bordwaffen kaum eine Gefahr – gefährlich sind dann MANPADS der abgesessenen Infanterie (Verba bis ca. 4,5 km Höhe) und die begleitende Flugabwehr (Flugabwehr-Trainer).", "airNotes": ["Draufsicht auf einen KPz mit Kontakt-1-Kacheln in Bogenform auf dem Turm; das lange Rohr ragt weit über die Wanne hinaus.", "Schräg von oben: links ein zerstörter KPz (Turm abgesprengt, Laufwerk erkennbar), rechts ein KPz mit Drohnenschutz.", "Drohnenbild mit Anzeige: KPz mit großem Turm und langem Rohr neben einem Busch, Besatzung daneben markiert.", "Schräg von oben: KPz in einer Grabenlinie – Turm in der Mitte, langes Rohr, Laufwerk mit großen Rollen.", "Draufsicht: KPz mit Reaktivpanzerung auf dem Turm, das Rohr ragt weit nach vorn – deutlich länger als bei jedem SPz.", "FPV-Drohne kurz vor dem Einschlag: großer, runder Turm mit Reaktivkacheln und Drohnenschutz, Motordeck mit Lüftungsgittern.", "Schräg von oben: KPz mit glattem Turm (T-72A) – großer, runder Turm in der Mitte, langes Rohr über die Wanne hinaus.", "Von oben: zwei KPz (T-90A) – kantige Türme, lange Rohre, breite Ketten."], "airTip": "Aus der Luft erkennst du einen KPz am langen Rohr, das weit über die Wanne ragt, und am großen Turm in der Mitte; ein SPz hat einen kleinen Turm und einen langen, flachen Kampfraum mit Dachluken. In der Zielbeschreibung reicht „KPz“ mit Anzahl und Lage.", "families": [{"id": "t62", "name": "T-62", "short": "62", "cat": "kpz", "wcls": "mbt", "designation": "T-62 – sowjetischer Kampfpanzer der 1960er; im Einsatz vor allem T-62M (Zusatzpanzerung „Augenbrauen“, Feuerleitanlage Wolna) und T-62MV (Kontakt-1)", "users": "Russland (seit 2022 aus Depots reaktiviert), dazu u. a. Syrien und Nordkorea", "weapons": ["115-mm-Glattrohrkanone U-5TS; T-62M auch Kanonen-LFK 9M117 Scheksna (bis ca. 4 km)", "12,7-mm-Fla-MG DShKM am Ladeschützenluk", "7,62-mm-MG koaxial"], "protection": "Gussturm und Stahlwanne; T-62M mit kastenförmiger Zusatzpanzerung an Turm und Bug, T-62MV mit Kontakt-1. Gegen moderne Panzerabwehr schwach, seit 2022 oft mit Käfig.", "weak": "Alte Panzerung: Seite und Heck sind auch für Hellfire, Maverick und die GAU-8 verwundbar. Munition im Kampfraum – Durchschläge führen oft zur Totalzerstörung.", "recog": "Fünf große Laufrollen ohne Stützrollen, die Abstände werden nach hinten größer; flacher, runder Kuppelturm; langes 115-mm-Rohr. T-62M: kastenförmige Zusatzpanzerung an der Turmfront („Augenbrauen“) und eine Zusatzplatte auf dem Bug.", "confuse": ["t64", "t72"], "jtac": ["Wird oft als Feuerunterstützung eingesetzt, auch indirekt aus Stellungen hinter Deckung.", "Das Fla-MG wird von außen bedient – Gefahr für Hubschrauber im Nahbereich bis ca. 1,5–2 km.", "Kein Laserwarner, nachts meist nur Restlichtverstärker – deutlich geringere Aufklärungsreichweite als T-72B3 oder T-90."], "vars": [{"v": null, "name": "T-62", "tis": "ii", "lwr": "no", "heli": "mittel", "sight": "Restlichtverstärker TPN-1 mit IR-Scheinwerfer Luna; einzelne modernisierte Fahrzeuge mit nachgerüstetem Wärmebildvisier.", "aa": "12,7-mm-Fla-MG DShKM für den Nahbereich; der T-62M kann zusätzlich Kanonen-LFK 9M117 verschießen, gegen Hubschrauber aber nur eingeschränkt.", "aaQ": ["12,7-mm-Fla-MG DShKM (Nahbereich) – T-62M zusätzlich Kanonen-LFK 9M117", ["30-mm-Maschinenkanone mit 74° Rohrerhöhung", "Fla-Raketen Strela-10 auf dem Fahrzeug", "Lenkflugkörper Kornet-EM mit Annäherungszünder (bis ca. 10 km)"]]}], "side": "ru"}, {"id": "t64", "name": "T-64", "short": "64", "cat": "kpz", "wcls": "mbt", "designation": "T-64BV – sowjetischer Kampfpanzer mit Kontakt-1; heute fast nur bei der Ukraine im Einsatz", "users": "Ukraine (Hauptnutzer); in Russland nur Einzelstücke bzw. Beutefahrzeuge", "weapons": ["125-mm-Glattrohrkanone 2A46M-1; Kanonen-LFK 9M112 Kobra (bis ca. 4 km)", "12,7-mm-Fla-MG NSVT", "7,62-mm-MG koaxial"], "protection": "Verbundpanzerung in Turm und Bug, Kontakt-1 an Turm und Bug, Gummischürzen.", "weak": "Seite, Heck und Dach; Munitionskarussell unter dem Turm.", "recog": "Sechs kleine Laufrollen mit vier Stützrollen (T-72 und T-90: große Laufrollen); Kontakt-1-Kacheln an Turm und Bug; flacher Turm.", "confuse": ["t72", "t80"], "jtac": ["Freund-Feind: Den T-64 nutzt fast nur die Ukraine. Er sieht aus wie Rot – Kennzeichnung (z. B. weißes Kreuz) und Lage prüfen.", "Das Laufwerk mit kleinen Laufrollen ist das sicherste Unterscheidungsmerkmal zu T-72 und T-80.", "Die Kobra-LFK können auch schwebende Hubschrauber treffen."], "vars": [{"v": null, "name": "T-64BV", "tis": "mix", "lwr": "no", "heli": "hoch", "sight": "Ursprünglich Restlichtverstärker mit IR-Scheinwerfer; ukrainische Modernisierungen (z. B. T-64BV Mod. 2017) mit neuen Visieren achstan, Algerien", "weapons": ["Zwei 30-mm-Maschinenkanonen 2A42 (Rohrerhöhung bis 45°)", "Vier LFK Ataka (bis ca. 6 km; Fla-Version 9M220O gegen Luftziele bis ca. 7 km)", "Zwei 30-mm-Granatmaschinenwaffen, 7,62-mm-MG"], "protection": "KPz-Panzerung mit Relikt an Front und Seiten; Laserwarner mit automatischem Nebelwurf.", "weak": "Panzerung wie ein KPz – Seite, Heck und Dach am schwächsten. Waffen und LFK-Behälter liegen außen am Turm.", "recog": "KPz-Fahrgestell, aber Turm ohne Hauptkanone: zwei dünne 30-mm-Rohre und je zwei LFK-Behälter links und rechts am Turm.", "confuse": ["t72", "t90", "t14"], "jtac": ["Hohe Gefahr für Hubschrauber: Ataka gibt es mit Annäherungszünder ausdrücklich gegen Luftziele.", "Fährt zusammen mit Kampfpanzern – wo ein BMPT ist, sind KPz in der Nähe.", "Laserwarner mit automatischem Nebel – Laserzeit kurz halten."], "vars": [{"v": null, "name": "BMPT", "tis": "tis", "lwr": "lwr", "heli": "hoch", "sight": "Richtschützenvisier mit Wärmebild und Laser-Entfernungsmesser, Panoramavisier für den Kommandanten.", "lwrx": "Laserwarner: Bei Laserbestrahlung schießt das Fahrzeug automatisch Nebelgranaten.", "aa": "LFK Ataka (Fla-Version mit Annäherungszünder bis ca. 7 km) und zwei 30-mm-Maschinenkanonen – hohe Gefahr für Hubschrauber.", "aaQ": ["LFK Ataka (Fla-Version bis ca. 7 km) und zwei 30-mm-Maschinenkanonen", ["Kanonen-Lenkflugkörper durch eine 125-mm-Kanone", "Fla-Raketen Strela-10 auf dem Fahrzeug", "Nur 7,62-mm-MG – keine weiter reichende Bordwaffe"]]}], "side": "ru"}, {"id": "bmp1", "name": "BMP-1", "short": "BMP1", "cat": "spz", "wcls": "ifv", "designation": "BMP-1 – erster sowjetischer Schützenpanzer (1966). Versionen: BMP-1 (73-mm-Kanone und LFK), BMP-1AM „Basurmanin“ (Turm des BTR-82A mit 30-mm-Kanone)", "users": "Russland (Reserve, seit 2022 wieder im Einsatz), sehr viele Staaten, auch die Ukraine", "weapons": ["BMP-1: 73-mm-Kanone 2A28 Grom, LFK Maljutka bzw. Fagot", "BMP-1AM: 30-mm-Maschinenkanone 2A72", "7,62-mm-MG koaxial"], "pr ction": "Wie MT-LB, 7–14 mm Stahl – nur gegen Gewehrmunition und Splitter.", "weak": "Dünne Panzerung, LFK im Fahrzeug.", "recog": "MT-LB-Wanne ohne MG-Turm; der Starter mit LFK-Rohr fährt aus dem Dach aus. Eingefahren sieht er aus wie ein normaler MT-LB.", "confuse": ["mtlb", "kornet"], "jtac": ["Harmloses Aussehen, hohe Gefahr: LFK auch gegen tief fliegende Hubschrauber.", "Priorisiertes Ziel – bedroht eigene KPz und Hubschrauber auf große Entfernung.", "Shturm-S hat nur eine Tagoptik; die Modernisierung Shturm-SM hat Wärmebild und Radar."], "vars": [{"v": null, "name": "Shturm-S", "tis": "day", "lwr": "no", "heli": "hoch", "sight": "Shturm-S: Tagvisier mit Laser-Entfernungsmesser, keine Nachtsicht. Shturm-SM: Fernseh- und Wärmebildkanal sowie Radar.", "aa": "LFK Kokon bzw. Ataka – auch gegen Hubschrauber; die Fla-Version 9M220O mit Annäherungszünder reicht bis ca. 7 km.", "aaQ": ["LFK Kokon bzw. Ataka – auch gegen Hubschrauber (Fla-Version bis ca. 7 km)", ["Nur 7,62-mm-MG – keine weiter reichende Bordwaffe", "30-mm-Maschinenkanone mit 74° Rohrerhöhung", "Kanonen-Lenkflugkörper durch eine 125-mm-Kanone"]]}]}, {"id": "kornet", "name": "Kornet-D", "short": "KOR", "cat": "pzj", "wcls": "apc", "designation": "Kornet-D bzw. Kornet-EM – Panzerjäger auf Tigr mit zwei ausfahrbaren Startern für je vier LFK", "users": "Russland", "weapons": ["8 LFK startbereit (Kornet-EM): gegen Bodenziele bis ca. 8–10 km", "Gegen Luftziele (Hubschrauber, Drohnen) mit Annäherungszünder bis ca. 8–10 km"], "protection": "Wie Tigr – nur gegen Gewehrmunition und Splitter.", "weak": "Leicht geschützt; in Feuerstellung mit ausgefahrenen Startern gut zu sehen.", "recog": "Tigr mit Klappdach; zwei Starter mit je vier LFK-Rohren fahren nach oben aus. Eingefahren sieht er aus wie ein normaler Tigr.", "confuse": ["tigr", "shturm"], "jtac": ["Größte Gefahr für Hubschrauber in dieser App: LFK mit Annäherungszünder bis ca. 10 km.", "Wärmebild und automatische Zielverfolgung – auch nachts voll einsatzfähi "Ungepanzert; im Krieg oft mit Zusatzplatten an der Kabine und Drohnenschutzgittern.", "weapons": ["Keine Bordwaffe"]}, {"id": "uaz469", "name": "UAZ-469", "short": "UAZ", "designation": "UAZ-469 – leichter Geländewagen 4×4 (1973) mit Plane oder Hardtop; Nachfolger UAZ Hunter sieht fast gleich aus", "users": "Russland, Ukraine und sehr viele weitere Staaten", "weak": "Ungeschützt – Splitter und Bordkanone genügen.", "recog": "Kleiner, kantiger Geländewagen 4×4, senkrechter Kühlergrill mit runden Scheinwerfern, Plane oder Hardtop.", "confuse": ["tigr", "uaz452"], "jtac": ["Führungs- und Verbindungsfahrzeug – kann Offiziere, Beobachter oder Funktrupps transportieren.", "Beide Seiten fahren den UAZ-469 – Freund oder Feind nicht am Typ festmachen."], "vars": [{"v": null, "tis": "day", "lwr": "no", "heli": "gering", "sight": "Keine Visiere – die Besatzung nutzt Handgeräte.", "aa": "Keine Bordwaffe – Gefahr nur durch Handwaffen und MANPADS der Besatzung.", "aaQ": ["Keine Bordwaffe – Gefahr nur durch Handwaffen und MANPADS der Besatzung", ["30-mm-Maschinenkanone mit 74° Rohrerhöhung", "Kanonen-Lenkflugkörper durch eine 125-mm-Kanone", "14,5-mm-MG KPWT mit 60° Rohrerhöhung"]], "name": "UAZ-469"}], "cat": "lkw", "wcls": "soft", "side": "both", "protection": "Ungepanzert; im Krieg oft mit Zusatzplatten an der Kabine und Drohnenschutzgittern.", "weapons": ["Keine Bordwaffe"]}, {"id": "uaz452", "name": "UAZ-452 „Buchanka“", "short": "UAZ452", "designation": "UAZ-452 „Buchanka“ (Brotlaib) – geländegängiger Kleinbus 4×4 (1965), bis heute gebaut; als Transport-, Sanitäts- und Funkfahrzeug", "users": "Russland, Ukraine und sehr viele weitere Staaten", "weak": "Ungeschützt – Splitter und Bordkanone genügen.", "recog": "Kastenförmiger Kleinbus mit kurzer, abgerundeter Front ohne Motorhaube, runde Scheinwerfer, große Seitenfenster.", "confuse": ["uaz469", "gaz66"], "jtac": ["Sehr häufig an der Front: Transport, Sanität und Funk.", "Sanitätsfahrzeuge mit Schutzzeichen sind nach Kriegsvölkerrecht geschützt.", "Beide Seiten fahren den UAZ-452 – Freund oder Feind nicht am Typ festmachen."], "vars": [{"v": null, "tis": "day", "lwr": "no", "heli": "gering", "sight": "Keine Visiere – die Besatzung nutzt Handgeräte.", "aa": "Keine Bordwaffe – Gefahr nur durch Handwaffen und MANPADS der Besatzung.", "aaQ": ["Keine Bordwaffe – Gefahr nur durch Handwaffen und MANPADS der Besatzung", ["30-mm-Maschinenkanone mit 74° Rohrerhöhung", "Kanonen-Lenkflugkörper durch eine 125-mm-Kanone", "14,5-mm-MG KPWT mit 60° Rohrerhöhung"]], "name": "UAZ-452 „Buchanka“"}], "cat": "lkw", "wcls": "soft", "side": "both", "protection": "Ungepanzert; im Krieg oft mit Zusatzplatten an der Kabine und Drohnenschutzgittern.", "weapons": ["Keine Bordwaffe"]}], "curated": [["l-1", "t72", "Du lasert einen T-72B3 mit dem Laser-Entfernungsmesser. Merkt die Besatzung das?", ["In der Regel nicht – der T-72B3 hat keinen Laserwarner", "Ja – der Laserwarner löst automatisch Nebel aus", "Ja – im Wärmebildvisier ist der Strahl sichtbar", "Nur wenn der Laser länger als 10 Sekunden strahlt"], "Der T-72B3 hat keinen Laserwarnempfänger. Laser-Entfernungsmesser (meist ca. 1,5 µm) und Designatoren (1,06 µm) sind für das Auge und für Wärmebildgeräte unsichtbar."], ["l-2", "gen", "Was sieht ein Gegner mit Restlichtverstärker (NVG) von deinen Lasergeräten?", ["Den IR-Pointer bzw. IR-Marker deutlich – den Designator in der Regel nicht", "Den Designator, aber nicht den IR-Pointer", "Beides gleich gut", "Nichts – Laser sind für NVG grundsätzlich unsichtbar"], "IR-Pointer und -Marker (ca. 0,8–0,9 µm) liegen im Empfindlichkeitsbereich der Restlichtverstärker und sind gut sichtbar – auch für den Gegner. Designatoren (1,06 µm) liegen am Rand bzw. außerhalb, augensichere Entfernungsmesser (ca. 1,5 µm) ganz außerhalb. SWIR-Kameras und teils digitale Nachtsichtgeräte können 1,06 µm dagegen sehen."], ["l-3", "t90", "Du beleuchtest einen T-90M für eine GBU-12. Was musst du erwarten?", ["Laserwarner erkennt die Bestrahlung, Nebel bzw. Aerosol wird in deine Richtung geschossen", "Nichts – der T-90M hat keinen Laserwarner", "Die Relikt-Panzerung reflektiert den Laser und blendet dich", "Er erkennt nur den Entfernungsmesser, nicht den Designator"], "Der T-90M hat Laserwarnsensoren, die automatisch Nebel- bzw. Aerosolgranaten in Richtung der Bedrohung auslösen. Aerosol kann den Laserpunkt abschirmen – die Bombe verliert dann die Führung. Laserzeit kurz halten oder eine Koordinaten- bzw. Dual-Mode-Waffe wählen."], ["l-4", "gen", "Welche Fahrzeuge dieser App haben einen Laserwarner, der automatisch Nebel auslöst?", ["T-90A, T-90M, BMPT und T-14", "Alle Kampfpanzer ab T-72B", "Nur der T-14 Armata", "T-72B3M und T-80BVM"], "T-90A (Shtora-1), T-90M, BMPT und T-14 (Afganit) haben Laserwarner mit automatischem Nebel. T-72B3, T-72B3M und T-80BVM haben trotz Modernisierung keinen."], ["l-5", "gen", "Wie verringerst du das Risiko, dass ein Fahrzeug mit Laserwarner deinen Laser erkennt und reagiert?", ["Laser erst in der Endphase einschalten und nur so kurz wie nötig lasern", "Mit dem IR-Pointer statt dem Designator markieren", "Nur nachts lasern, dann ist der Laserwarner abgeschaltet", "Aus großer Entfernung lasern – Laserwarner erfassen nur bis 1 km"], "Laserwarner reagieren auf die Bestrahlung, unabhängig von der Entfernung. Je kürzer gelasert wird, desto weniger Zeit hat die Besatzung. Bei LGBs muss der Laser nur in der Endphase leuchten (Laser-on-Zeit im Briefing festlegen); Entfernungen besser mit Pod, Karte oder Koordinaten bestimmen."], ["l-6", "gen", "Kannst du einen Laserstrahl im Wärmebildgerät sehen?", ["Nein – 1,06 und 1,5 µm liegen außerhalb des Wärmebildbereichs", "Ja, als hellen Strahl", "Nur den Laserpunkt auf dem Ziel", "Nur bei Designatoren mit hoher Leistung"], "Wärmebildgeräte arbeiten im mittleren bzw. langwelligen Infrarot (3–5 bzw. 8–12 µm). Laser-Entfernungsmesser und Designatoren strahlen bei 1,06 bzw. 1,5 µm – unsichtbar für das WBG. Das WBG sieht aber dich und dein warmes Gerät."], ["l-7", "t90", "Was macht die Shtora-1 des T-90A, wenn sie Laserbestrahlung erkennt?", ["Sie schießt Aerosolgranaten in die Bedrohungsrichtung und richtet den Turm dorthin aus", "Sie schaltet die Störstrahler auf den Laser und blendet dich", "Sie meldet es nur der Besatzung", "Nichts – Shtora erkennt nur Radar"], "Shtora-1: Laserwarnsensoren erkennen die Bestrahlung, 3D17-Aerosolgranaten bilden in wenigen Sekunden eine Wolke, der Turm wird auf die Bedrohung ausgerichtet. Die „roten Augen“ stören LFK mit Kommandolenkung – nicht deinen Laser."], ["t-1", "gen", "Du liegst hinter einem Erdwall, nur Kopf und Optik ragen darüber. Was sieht das Wärmebildvisier eines T-72B3?", ["Nur, was über die Deckung ragt – Gesicht, Kopf, warme Optik", "Dich vollständig – Wärmebild sieht durch Erde", "Nichts, solange du dich nicht bewegst", "Nur dein Lasergerät, weil es heiß wird"], "Wärmebild sieht nicht durch feste Deckung wie Erde, Beton oder Mauern. Alles, was herausragt, ist sichtbar – besonders Gesicht und Hände. Stillhalten senkt die Auffälligkeit, nicht den Wärmekontrast."], ["t-2", "gen", "Hilft ein normales Tarnnetz gegen Wärmebild?", ["Kaum – Wärme ist durch die Maschen sichtbar; nur Multispektralnetze dämpfen die Signatur", "Ja, jedes Tarnnetz blockiert Wärmebild vollständig", "Ja, aber nur nachts", "Nein, im Wärmebild macht es dich sogar heller"], "Normale Netze tarnen im sichtbaren Bereich. Körper- und Motorwärme bleibt durch die Maschen und am erwärmten Netz sichtbar. Multispektral-Netze und -Ponchos dämpfen die Wärmesignatur, ersetzen aber keine feste Deckung."], ["t-3", "gen", "Kann ein Wärmebildgerät dich hinter einer Glasscheibe (Fenster, Fahrzeugscheibe) sehen?", ["Nein – Glas blockiert langwelliges Infrarot, das WBG sieht nur die Scheibe", "Ja, Glas ist für Wärmebild durchsichtig", "Nur bei Einfachglas", "Nur wenn es dunkel ist"], "Glas lässt Wärmestrahlung (8–12 µm) kaum durch. Umgekehrt kannst du mit deinem WBG auch nicht hinaus, und eine erwärmte Scheibe kann selbst auffallen."], ["t-4", "gen", "Schützt dich normaler Rauch vor einem Wärmebildvisier?", ["Kaum – Wärmebild sieht durch normalen Rauch; nur Mehrspektral-Nebel bzw. Aerosol blockiert es", "Ja, vollständig", "Nur wenn der Rauch heiß ist", "Nur bei Wind unter 5 m/s"], "Herkömmlicher Rauch verdeckt im sichtbaren Bereich und für Restlichtverstärker. Wärmebild sieht weitgehend hindurch. Erst Mehrspektral-Nebel (auch das Aerosol von Shtora und Co.) dämpft das Infrarot."], ["t-5", "t72", "Welches Fahrzeug sieht dich nachts schlechter: T-72B oder T-72B3?", ["T-72B – nur Restlichtverstärker mit kurzer Reichweite, der B3 hat ein Wärmebildvisier", "T-72B3 – Sosna-U ist nur ein Tagvisier", "Beide gleich", "T-72B – er hat gar keine Nachtsicht"], "Der T-72B hat den Restlichtverstärker TPN-3-49 mit IR-Scheinwerfer (nachts unter ca. 1 km). Der T-72B3 hat Sosna-U mit Wärmebild – Aufklärung auf mehrere Kilometer."], ["t-6", "gen", "Ein BMP-2 ohne Wärmebild steht vor deiner Stellung. Bist du nachts sicher vor Aufklärung?", ["Nein – Infanterie hat Wärmebild-Handgeräte, Drohnen fliegen mit Wärmebildkameras", "Ja, ohne WBG sieht die Besatzung nichts", "Ja, solange du keinen Laser einsetzt", "Nur bei Neumond"], "Fehlendes Bord-WBG heißt nicht, dass dich niemand sieht: Russische Infanterie nutzt Wärmebild-Handgeräte und -Zielfernrohre, Drohnen (Orlan-10, Supercam, FPV) haben Wärmebildkameras."], ["t-7", "t80", "Warum ist ein T-80 im Wärmebild meist besonders auffällig?", ["Gasturbine: sehr heißer Abgasstrahl am Heck", "Wegen der Kontakt-1-Kacheln", "Wegen des Kommandantenvisiers", "Er fährt immer mit IR-Scheinwerfer"], "Die Gasturbine des T-80 erzeugt einen sehr heißen Abgasstrahl am Heck – auch im Leerlauf. Im Wärmebild verrät ihn das auf große Entfernung."], ["t-8", "gen", "Was verrät dich im Wärmebild auch nach dem Stellungswechsel?", ["Warme Spuren am Boden und an der Deckung, wo du gelegen hast", "Nichts – Wärmespuren verschwinden sofort", "Nur der Geruch", "Die Funkantenne"], "Boden und Deckung bleiben eine Weile warm (Wärmeabdruck). Dazu verraten Akkus, Funkgeräte, Optiken und Fahrzeugmotoren die Position."], ["a-1", "gen", "Ab wann bist du als Fast Jet vor den Bordwaffen dieser Fahrzeuge weitgehend sicher?", ["Mit ausreichend Höhe (grob über 3 km über Grund) – dann bleiben MANPADS (bis ca. 4,5 km) und die Fla-Systeme", "Ab 500 m über Grund", "Erst ab 10 km", "Nie – 30-mm-Kanonen reichen bis 8 km Höhe"], "MG, Maschinenkanonen und Panzer-LFK wirken gegen tief fliegende, langsame Ziele. Mit Höhe und Abstand werden sie praktisch wirkungslos. Gefährlich bleiben MANPADS der Infanterie (Verba bis ca. 4,5 km Höhe) und die begleitende Flugabwehr."], ["a-2", "t90", "Warum ist der Schwebeflug eines Kampfhubschraubers in Sicht eines T-90 gefährlich?", ["Kanonen-LFK (Refleks, Invar) können schwebende Hubschrauber bis ca. 5 km treffen", "Das 12,7-mm-MG reicht bis 6 km", "Der Laserwarner stört die Hubschraubersensoren", "Der T-90 hat Fla-Raketen am Turm"], "Russische Kanonen-LFK sind laut Hersteller auch gegen langsame, tief fliegende Ziele wie Hubschrauber ausgelegt (Laserleitstrahl, bis ca. 5 km). Deckung und Bewegung nutzen, nicht im Schwebeflug in Sicht bleiben."], ["a-3", "gen", "Welche Fahrzeuge dieser App sind für Hubschrauber am gefährlichsten?", ["Kornet-D, Shturm-S und BMPT – LFK mit Annäherungszünder bzw. Fla-Fähigkeit", "BTR-80 und BRDM-2 wegen des 14,5-mm-MG", "MT-LB und BTR-D", "Tigr und Typhoon"], "Kornet-EM (bis ca. 10 km) und Ataka 9M220O (bis ca. 7 km) haben Annäherungszünder gegen Luftziele. Dazu kommen die Kanonen-LFK der Kampfpanzer, BMP-3 und BMD-4M."], ["a-4", "gen", "Motschützen sitzen aus ihren BTR-82A ab. Was bedeutet das für dein Lfz?", ["Mit MANPADS (Igla, Verba) in der Infanterie rechnen – Höhe und Anflug danach planen", "Nichts – abgesessene Infanterie ist für Lfz ungefährlich", "Nur die 30-mm-Kanone bleibt gefährlich", "Die Infanterie hat nur Handwaffen bis 300 m"], "Russische Motschützen- und Luftlandeeinheiten führen MANPADS mit. Das Fahrzeug selbst ist dann nur ein Teil der Bedrohung."], ["a-5", "btr", "Was unterscheidet BTR-80 und BTR-82A in der Gefahr für Hubschrauber?", ["BTR-82A: 30-mm-Kanone mit deutlich mehr Reichweite und Wirkung statt 14,5-mm-MG", "Kein Unterschied", "Der BTR-82A hat zusätzlich Fla-Raketen", "Der BTR-80 ist wegen der höheren Rohrerhöhung gefährlicher"], "Der BTR-80 trägt ein 14,5-mm-MG (Nahbereich bis ca. 2 km), der BTR-82A eine 30-mm-Maschinenkanone 2A72 – mehr Reichweite, Spreng- und Panzerbrechmunition."], ["a-6", "gen", "Wie weit reicht grob die Gefahr durch ein 12,7- bzw. 14,5-mm-MG gegen Hubschrauber?", ["Etwa 1,5 bis 2 km", "Etwa 500 m", "Etwa 5 km", "Etwa 8 km"], "Überschwere MG wirken gegen Luftziele etwa bis 1,5–2 km, 30-mm-Maschinenkanonen bis ca. 2,5 km und mehr, Kanonen-LFK und Ataka bzw. Kornet bis 4–10 km."], ["w-1", "t72", "Eine A-10C mit GAU-8 soll einen T-72B3 bekämpfen, der frontal auf sie zukommt. Was empfiehlst du?", ["Nicht frontal: Angriff auf Seite, Heck oder Dach – besser Maverick oder Lenkbombe", "Frontal, dort ist der KPz am größten", "Gar nicht – 30 mm wirkt gegen KPz überhaupt nicht", "Nur mit Airburst-Munition"], "Die GAU-8 durchschlägt die Front moderner KPz nicht, wohl aber Seite, Heck und Dach. Gegen die Front sind Maverick, Hellfire/JAGM oder ein Volltreffer mit einer Lenkbombe die bessere Wahl."], ["w-2", "btr", "Gegen einen BTR-82A stehen dir verschiedene Waffen zur Verfügung. Was ist angemessen?", ["Bordkanone oder APKWS – teure Panzerabwehrwaffen sind nicht nötig", "Nur eine GBU-31 – leichtere Waffen wirken nicht", "Nur Maverick oder Hellfire", "Ausschließlich Streumunition"], "Die 7–10 mm Stahl des BTR halten nur Handwaffen und Splitter ab. Bordkanone (20–30 mm), APKWS, Hydra oder kleine Bomben genügen."], ["w-3", "gen", "Was bewirkt Reaktivpanzerung (Kontakt-5, Relikt) gegen deine Lenkflugkörper?", ["Sie stört Hohlladungen – Tandem-Gefechtsköpfe (Hellfire II, JAGM, Brimstone) und Treffer auf Seite, Heck oder Dach helfen", "Sie macht den KPz gegen alle Luft-Boden-Waffen immun", "Nichts – sie wirkt nur gegen Panzergranaten", "Sie reflektiert den Laser, LGBs treffen nicht"], "Reaktivpanzerung zündet beim Auftreffen und stört den Hohlladungsstrahl. Tandem-Gefechtsköpfe lösen sie mit der Vorladung aus. Dach, Heck und Unterseite sind meist nicht oder kaum geschützt."], ["w-4", "gen", "Wozu dienen die Käfige („Cope Cages“) auf russischen Fahrzeugen vor allem?", ["Gegen FPV-Drohnen und kleine Top-Attack-Munition – gegen Lenkbomben oder Maverick kaum Schutz", "Gegen Wärmebild-Aufklärung", "Gegen Laserbeleuchtung", "Als Halterung für Tarnnetze"], "Käfige und Gitter sollen Drohnen und leichte Hohlladungen vorzeitig auslösen oder abhalten. Gegen schwere Luft-Boden-Waffen bieten sie kaum Schutz."], ["w-5", "gen", "Warum ist ein Durchschlag im Turmbereich von T-72, T-80 und T-90 oft katastrophal?", ["Munitionskarussell unter dem Turm – die Munition detoniert oft", "Der Kraftstoff liegt im Turm", "Der Turm ist aus Aluminium", "Die Reaktivpanzerung detoniert nach innen"], "Der Ladeautomat lagert die Munition im Karussell unter dem Turm, weitere Munition liegt im Kampfraum. Ein Durchschlag führt oft zur Detonation – der Turm fliegt ab."], ["w-6", "bmp2", "BMP-1 und BMP-2: Was ist bei einem Treffer am Heck besonders?", ["Die Hecktüren sind Kraftstofftanks – hohe Brandgefahr", "Dort liegt die gesamte Munition", "Dort ist die Panzerung am stärksten", "Dort sitzt der Motor"], "Bei BMP-1 und BMP-2 sind die Hecktüren als Kraftstofftanks ausgelegt. Treffer am Heck führen häufig zum Brand."], ["w-7", "gen", "Welche Waffe nimmst du gegen einen fahrenden KPz, wenn das Wetter einen Laser zulässt?", ["GBU-54 (Laser-JDAM), Hellfire/JAGM, Maverick oder Brimstone", "GBU-31 auf die letzte bekannte Koordinate", "GBU-38 (reine JDAM)", "Ungelenkte Mk 82"], "Gegen fahrende Ziele brauchst du Lenkung bis zum Einschlag: Laser (GBU-54, Hellfire), Bildsuchkopf (Maverick) oder Radar (JAGM, Brimstone). Reine GPS-Waffen treffen nur stehende Ziele."], ["w-8", "kornet", "Du entdeckst einen Kornet-D und einen BTR-82A. Welches Ziel priorisierst du für die Sicherheit eigener Hubschrauber?", ["Kornet-D – LFK mit Annäherungszünder bis ca. 10 km", "BTR-82A – die 30-mm-Kanone reicht weiter", "Beide gleich", "Keins – beide sind für Hubschrauber ungefährlich"], "Der Kornet-D bekämpft Hubschrauber bis ca. 10 km, der BTR-82A nur bis ca. 2,5–3 km. Der Kornet-D ist zudem leicht geschützt – schnell zu bekämpfen, wenn erkannt."], ["r-1", "gen", "Woran unterscheidest du T-64, T-72 und T-80 am Laufwerk?", ["T-64: kleine Laufrollen; T-72: große Laufrollen, 3 Stützrollen; T-80: gummibereifte Laufrollen, 5 Stützrollen", "Alle haben das gleiche Laufwerk", "T-72 hat sieben Laufrollen", "T-80 hat keine Stützrollen"], "Das Laufwerk ist das sicherste Merkmal: T-64 mit kleinen Laufrollen, T-72 und T-90 mit großen Laufrollen und drei Stützrollen, T-80 mit gummibereiften Laufrollen und fünf Stützrollen."], ["r-2", "gen", "Du erkennst bei einem KPz die genaue Version nicht. Wie meldest du ihn in der Zielbeschreibung?", ["Als KPz bzw. „T-72-Typ“ mit Anzahl, Lage und Tätigkeit", "Gar nicht, bis die Version feststeht", "Immer als T-90M, sicherheitshalber", "Als Schützenpanzer, damit kein Overkill entsteht"], "Für die Bekämpfung reicht die Fahrzeugart: KPz, SPz, Radfahrzeug. Wichtiger als die Version sind Anzahl, Lage, Bewegung und Bedrohung."], ["r-3", "gen", "Bedeutet ein T-72 oder BMP-2 automatisch „Feind“?", ["Nein – auch NATO-Partner (z. B. Polen, Tschechien, Bulgarien) und die Ukraine nutzen sie; Identifikation braucht Lage und Kennzeichnung", "Ja, nur Russland und Belarus nutzen sie", "Ja, sofern sie Reaktivpanzerung tragen", "Nur bei Fahrzeugen mit Käfig"], "Sowjetische Technik ist weit verbreitet – auch bei NATO-Partnern und der Ukraine. Der Fahrzeugtyp allein ist keine Feindidentifikation."], ["r-4", "gen", "Woran erkennst du aus der Luft einen KPz gegenüber einem SPz?", ["Langes Rohr, das weit über die Wanne ragt, großer Turm in der Mitte – SPz: kleiner Turm, langer flacher Kampfraum mit Luken", "Am Funkgerät", "KPz sind immer breiter als lang", "An der Anzahl der Antennen"], "Aus der Luft ist das lange Rohr das auffälligste Merkmal eines KPz. SPz haben kleine Türme und lange, flache Mannschaftsräume mit Dachluken."], ["r-5", "t90", "Woran unterscheidest du T-90A und T-90M am schnellsten?", ["T-90A: Shtora-Strahler („rote Augen“) und Kontakt-5; T-90M: Relikt und großer Staukorb am Turmheck", "Am Laufwerk", "An der Anzahl der Räder", "T-90M hat keine Kanone mehr"], "Die „roten Augen“ der Shtora gibt es nur beim T-90A. Der T-90M hat Relikt-Module und einen großen Staukorb am Turmheck."], ["r-6", "gen", "Was bedeutet ein MT-LB, der eine Haubitze oder Pak zieht?", ["Hinweis auf Artillerie bzw. Panzerabwehr in der Nähe – Feuerstellungen suchen", "Nichts Besonderes", "Ein Bergefahrzeug im Einsatz", "Ein Hinweis auf Luftlandekräfte"], "Der MT-LB ist ein typisches Zugmittel für D-30-Haubitzen und MT-12-Panzerabwehrkanonen. Wo er zieht, sind Feuerstellungen nicht weit."], ["r-9", "btr70", "Woran unterscheidest du BTR-60PB, BTR-70 und BTR-80 von der Seite?", ["BTR-60PB ohne Seitentür, BTR-70 mit kleiner tiefer Luke, BTR-80 mit großer zweiteiliger Tür zwischen 2. und 3. Achse", "Gar nicht – alle drei sehen gleich aus", "An der Zahl der Räder", "Nur der BTR-80 hat einen Turm"], "Die Seitentür ist das sicherste Merkmal: Beim BTR-60PB steigt die Infanterie über das Dach aus, der BTR-70 hat eine kleine, tief liegende Luke, der BTR-80 eine große Tür zwischen 2. und 3. Achse. BTR-60PB und BTR-70 tragen den Kegelturm mit nur ca. 30° Rohrerhöhung."], ["s-1", "gen", "Welche dieser Fahrzeuge setzen im Ukrainekrieg beide Seiten ein?", ["T-72, BMP-2, MT-LB und BRDM-2", "T-90M, BMP-3 und BMPT", "T-14, BTR-82A und BMD-4M", "Nur der T-64"], "T-72, T-80, BMP-1, BMP-2, BTR-70, BTR-80, MT-LB und BRDM-2 fahren Russland und die Ukraine. T-90M, BMP-3, BMPT, T-14 und BMD-4M sind russisch – bei der Ukraine höchstens als Beute. Den T-64 fährt vor allem die Ukraine."], ["s-2", "t64", "Du siehst im Raum der Ukraine einen T-64. Was folgt daraus?", ["Wahrscheinlich ukrainisch – aber erst Lage, Kennzeichnung und Meldungen entscheiden über Freund oder Feind", "Sicher Feind – der T-64 ist ein sowjetischer Panzer", "Sicher Freund – Russland hat keine T-64", "Es ist ein T-80 mit anderem Turm"], "Den T-64 fährt vor allem die Ukraine, Russland nur Einzelstücke und Beutefahrzeuge. Der Typ macht eine Seite wahrscheinlicher, entscheidet aber nie allein – im Zweifel nicht freigeben."], ["s-3", "gen", "Woran erkennst du bei sowjetischen Fahrzeugen im Ukrainekrieg sicher die Seite?", ["Gar nicht am Typ – nur an Lage, Kennzeichnung (z. B. taktische Zeichen, Erkennungsstreifen) und Meldungen der Bodentruppe", "Am Tarnmuster", "An der Zahl der Laufrollen", "Daran, ob Reaktivpanzerung montiert ist"], "Beide Seiten fahren T-72, BMP, BTR und MT-LB, oft mit ähnlicher Tarnung und Zusatzpanzerung. Aufgemalte Zeichen wechseln und lassen sich fälschen – entscheidend sind Lage, Frontverlauf und Bestätigung durch die Bodentruppe."], ["w-9", "ural", "Ein Konvoi aus Ural- und KamAZ-Lkw mit Planen. Welches Wirkmittel passt?", ["Splitterwirkung: Bordkanone, APKWS bzw. Hydra oder kleine Bomben – Folgeexplosionen der Ladung beachten", "Panzerbrechende Lenkflugkörper wie Hellfire oder Brimstone", "Nur schwere Lenkbomben (GBU-31)", "Lkw sind keine lohnenden Ziele"], "Lkw sind ungepanzert – Splitterwirkung genügt. Teure Panzerabwehrwaffen sparen. Munitions- und Kraftstoffladung kann heftig nachdetonieren bzw. brennen."], ["r-10", "kamaz", "Woran unterscheidest du einen Ural- von einem KamAZ-Lkw?", ["Ural mit langer Motorhaube vor der Kabine, KamAZ mit flacher Front ohne Haube", "An der Zahl der Achsen – Ural hat zwei, KamAZ drei", "Nur an der Farbe", "Gar nicht – beide sehen gleich aus"], "Beide haben drei Achsen. Der Ural hat eine lange, rundliche Motorhaube, der KamAZ ist ein Frontlenker mit flacher Front. Danach den Aufbau prüfen: Pritsche, Tank, Koffer oder Waffensystem."]], "merk": [["Laser – wer sieht was?", ["Auge und Wärmebildgerät sehen weder den Designator (1,06 µm) noch den augensicheren Entfernungsmesser (ca. 1,5 µm).", "Restlichtverstärker (NVG) sehen IR-Pointer und IR-Marker (ca. 0,8–0,9 µm) deutlich – auch der Gegner. Den Designator in der Regel nicht oder kaum, 1,5 µm gar nicht.", "SWIR-Kameras sehen beide Laser, digitale Nachtsichtgeräte teils 1,06 µm.", "Laserwarner (T-90A, T-90M, BMPT, T-14) erkennen die Bestrahlung und schießen automatisch Nebel bzw. Aerosol, der T-90A richtet zusätzlich den Turm aus.", "Lasern kurz halten: Designator erst in der Endphase, Entfernungen möglichst mit Pod, Karte oder Koordinaten bestimmen."]], ["Wärmebild und Deckung", ["Kein Durchblick durch Erde, Mauern, Beton, Glas und dichte Vegetation.", "Durchblick bei Dunkelheit, normalem Rauch, durch Lücken in leichter Vegetation und durch die Maschen normaler Tarnnetze.", "Verrät dich: Gesicht, Hände, Akkus, Funk- und Lasergeräte, Motoren, warme Spuren an Boden und Deckung.", "Multispektral-Netze und -Ponchos dämpfen die Signatur, feste Deckung ersetzen sie nicht.", "Kein Bord-WBG heißt nicht unbeobachtet: Infanterie mit Handgeräten, Drohnen mit Wärmebild."]], ["Bedrohung für dein Lfz", ["7,62 mm: Nahbereich. 12,7 und 14,5 mm: bis ca. 1,5–2 km.", "30-mm-Maschinenkanonen (BMP-2, BMD, BTR-82A, BMPT): gegen Hubschrauber bis ca. 2,5 km und mehr.", "Kanonen-LFK (KPz ab T-72B, BMP-3, BMD-4M): auch gegen schwebende Hubschrauber bis ca. 4–5,5 km.", "Ataka 9M220O (Shturm-S, BMPT) bis ca. 7 km und Kornet-EM bis ca. 10 km mit Annäherungszünder – gezielt gegen Luftziele.", "Mit ausreichend Höhe bleiben MANPADS der Infanterie (Verba bis ca. 4,5 km Höhe) und die Fla-Systeme (Flugabwehr-Trainer)."]], ["Wirkmittel", ["KPz: Hellfire/JAGM, Brimstone, Maverick oder Volltreffer mit Lenkbombe; GBU-54 gegen fahrende KPz. GAU-8 nur auf Seite, Heck oder Dach.", "SPz und BMD-4M: 30-mm-Kanone, Hellfire, Maverick, kleine Lenkbomben.", "BTR, MT-LB, BMD-2/3, Radfahrzeuge: jede Bordkanone, APKWS bzw. Hydra, kleine Bomben.", "Panzerjäger (Kornet-D, Shturm-S) priorisieren – Gefahr für Hubschrauber und KPz, aber leicht verwundbar.", "Lkw, Tankwagen und Geländewagen: Splitter genügen – Bordkanone, APKWS bzw. Hydra, kleine Bomben; Folgeexplosionen der Ladung beachten."]], ["Wer fährt was?", ["Beide Seiten: T-72, T-80, BMP-1, BMP-2, BTR-60PB, BTR-70, BTR-80, MT-LB, BRDM-2.", "Lkw und Geländewagen (Ural, KamAZ, GAZ-66, UAZ): beide Seiten.", "Vor allem die Ukraine: T-64.", "Russland (Ukraine höchstens Beute): T-90, T-14, BMPT, BMP-3, BTR-82A, BMD-4M, Tigr, Typhoon.", "Der Typ macht eine Seite nur wahrscheinlicher – entscheidend sind Lage, Kennzeichnung und Meldungen der Bodentruppe. Im Zweifel nicht freigeben."]]], "sides": {"both": "Beide Seiten – Russland und die Ukraine", "ru": "Russland – die Ukraine höchstens mit Beutefahrzeugen", "ua": "Vor allem die Ukraine – Russland nur Einzelstücke bzw. Beute"}, "sideOrder": ["both", "ru", "ua"], "sideNote": {"btr": "Den BTR-80 fahren beide Seiten, den BTR-82A fast nur Russland."}};

  conf: {name:'Verwechslungsgefahr', kinds:['img','var'], confusion:true},
};
const UNITS = [];
const UNIT = {};
FAMS.forEach(f => f.vars.forEach((u, k) => { u.fam = f.id; u.k = k; u.key = f.vars.length > 1 ? `${f.id}:${u.v}` : f.id; UNITS.push(u); if (f.vars.length > 1) UNIT[u.key] = {f, u}; }));
const multi = f => f.vars.length > 1;
const pinsFor = (fid, i) => (PINS[fid] || {})[i] || null;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const imgSrc = (fid, i) => fid === 'air' ? AIR[i] : IMG[fid][i];
const imgCount = fid => fid === 'air' ? AIR.length : (IMG[fid] || []).length;

/* ---------- state & persistence ---------- */
const KEY = 'manoevertrainer.v1';
const blank = () => ({v:1, updated:0, fam:{}, q:{}, flags:{}, recent:[], lastImg:{}, answered:0, correct:0, annoOpen:false});
function readLocal(){ try { const r = localStorage.getItem(KEY); if (r) return Object.assign(blank(), JSON.parse(r)); } catch(e){} return blank(); }
let S = readLocal();
let remote = null, syncLabel = 'Nur auf diesem Gerät gespeichert';

function save(){

  if (remote){ clearTimeout(pushTimer); pushTimer = setTimeout(pushRemote, 1200); }
}
async function pushRemote(){

  catch(e){ if (e && (e.code === 'invalid_argument' || e.code === 'revoked' || e.code === 'not_granted')) { remote = null; syncLabel = 'Nur auf diesem Gerät gespeichert'; } }
}
(async () => {

})();

/* ---------- question bank ---------- */
function buildBank(){
  const bank = [];
  for (const f of FAMS){
    const imgs = IMG[f.id] || [];
    imgs.forEach((_, i) => bank.push({id:`img:${f.id}:${i}`, kind:'img', fam:f.id, i}));
    if (multi(f)) imgs.forEach((_, i) => { if (VAR[f.id][i] && pinsFor(f.id, i)) bank.push({id:`var:${f.id}:${i}`, kind:'var', fam:f.id, i}); });
    bank.push({id:`cat:${f.id}`, kind:'cat', fam:f.id});
    if (f.side) bank.push({id:`side:${f.id}`, kind:'side', fam:f.id});
    bank.push({id:`wpn:${f.id}`, kind:'wpn', fam:f.id});
    f.vars.forEach((u, k) => {
      for (const kind of ['aa', 'lwr', 'tis']) bank.push({id:`${kind}:${f.id}:${k}`, kind, fam:f.id, k});
    });
  }
  AIR.forEach((_, i) => bank.push({id:`air:${i}`, kind:'air', fam:'air', i}));
  for (const [id, fam, q, opts, ex] of DATA.curated) bank.push({id, kind:'cur', fam, q, opts, ex});
  return bank;
}
const BANK = buildBank();

function famAcc(id){ const s = S.fam[id]; if (!s || (s.c + s.w) === 0) return null; return s.c / (s.c + s.w); }
function weight(q, prevFam){
  const fa = famAcc(q.fam);
  const weak = fa === null ? 0.45 : 1 - fa;
  const s = S.q[q.id];
  let w = (1 + 2 * weak) * (s ? Math.max(0.25, 1 + 1.6 * (s.w / Math.max(1, s.c + s.w)) - 0.08 * Math.min(s.c, 6)) : 1.35);
  if (S.recent.includes(q.id)) w *= 0.12;
  if (q.fam === prevFam) w *= 0.25;
  if (q.kind === 'img') w *= 0.9;
  if (q.kind === 'var' || q.kind === 'cat') w *= 0.8;
  return w;
}
function pickRound(mode){
  const M = MODES[mode];
  let pool = BANK.filter(q => M.kinds.includes(q.kind));
  if (M.tags) pool = pool.filter(q => q.kind !== 'cur' || M.tags.some(t => q.id.startsWith(t)));
  if (M.confusion) pool = pool.filter(q => FAM[q.fam] && FAM[q.fam].confuse.length);
  const out = []; let prevFam = null;
  const n = Math.min(ROUND_LEN, pool.length);
  const usedImgFam = {};
  const isImg = q => q.kind === 'img' || q.kind === 'var';
  while (out.length < n && pool.length){
    const ws = pool.map(q => weight(q, prevFam) * (isImg(q) && usedImgFam[q.fam] ? 0.2 : 1));
    let r = Math.random() * ws.reduce((a, b) => a + b, 0), k = 0;
    while (k < ws.length - 1 && (r -= ws[k]) > 0) k++;
    const q = pool.splice(k, 1)[0];
    if (isImg(q)) usedImgFam[q.fam] = true;
    out.push(q); prevFam = q.fam;
  }
  return out;
}

/* distractor helpers */
function nameDistractors(f, strict){
  const pool = FAMS.filter(x => x.id !== f.id);
  const conf = shuffle(f.confuse.map(id => FAM[id]).filter(Boolean));
  const same = shuffle(pool.filter(x => x.cat === f.cat && !f.confuse.includes(x.id)));
  const rest = shuffle(pool.filter(x => x.cat !== f.cat && !f.confuse.includes(x.id)));
  const list = strict ? [...conf, ...same, ...rest] : [...conf.slice(0, 2), ...shuffle([...conf.slice(2), ...same, ...rest])];
  return list.slice(0, 3).map(x => x.name);
}
function varDistractors(f, u){
  const own = f.vars.filter(x => x !== u).map(x => x.name);
  const other = shuffle(f.confuse.flatMap(id => FAM[id].vars.map(x => x.name)));
  return [...own, ...other].filter((x, i, a) => a.indexOf(x) === i).slice(0, 3);
}
function catAlternatives(f){
  const excl = [f.cat, ...(DATA.catExcl[f.cat] || []), ...(DATA.catX[f.id] || [])];
  return shuffle(DATA.catOrder.filter(c => !excl.includes(c))).slice(0, 3).map(c => CATS[c].label);
}
const unitOfImg = (f, i) => f.vars.find(u => u.v === VAR[f.id][i]) || null;
function unitImgs(f, u){
  const all = (IMG[f.id] || []).map((_, i) => i);
  if (!u.v) return all;
  const own = all.filter(i => VAR[f.id][i] === u.v);
  return own.length ? own : all;
}
function randomImg(f, u){
  const idx = u ? unitImgs(f, u) : (IMG[f.id] || []).map((_, i) => i);
  if (!idx.length) return null;
  let i = idx[Math.floor(Math.random() * idx.length)];
  if (idx.length > 1 && S.lastImg[f.id] === i) i = idx[(idx.indexOf(i) + 1) % idx.length];
  return [f.id, i];
}
function annoFig(fid, i, pins, alt){
  if (!pins || !IMG[fid] || IMG[fid][i] == null) return '';
  const ar = (ARS[fid] || [])[i] || 4/3;
  return `<figure class="anno" style="aspect-ratio:${ar};width:min(100%, ${Math.round(520 * ar)}px)" data-zoom="${fid}:${i}">
      <img src="${IMG[fid][i]}" alt="${esc(alt)} mit markierten Erkennungsmerkmalen">
      ${pins.map(([x, y], k) => `<span class="pin" style="left:${x}%;top:${y}%">${k + 1}</span>`).join('')}
    </figure>
    <ol class="legendlist">${pins.map(([, , t], k) => `<li><b>${k + 1}</b><span>${esc(t)}</span></li>`).join('')}</ol>`;
}
const annoHtml = f => annoFig(f.id, 0, ANNO[f.id], f.name);
const leitIdx = (f, u) => (LEIT[f.id] || {})[u.v];
const unitAnno = (f, u) => { const i = leitIdx(f, u); return i == null ? '' : annoFig(f.id, i, pinsFor(f.id, i), u.name); };
/* Merkmale passend zum gezeigten Bild: Bild-Pins, sonst Familien-Pins */
function imgAnno(f, i){
  const p = i != null ? pinsFor(f.id, i) : null;
  if (p) return {title:'Merkmale auf diesem Bild', html:annoFig(f.id, i, p, f.name)};
  return ANNO[f.id] ? {title:`Merkmale der ${f.name}-Familie`, html:annoHtml(f)} : null;
}
const tisLong = u => u.sight + (u.tis === 'tis'
  ? ' Feste Deckung (Erde, Mauern, Glas) schützt, normaler Rauch und normale Tarnnetze kaum.'
  : ' Trotzdem nicht unbeobachtet: Die Infanterie hat Wärmebild-Handgeräte, Drohnen fliegen mit Wärmebildkameras.');
const lwrLong = u => u.lwrx || (u.lwr === 'lwr' ? 'Laserwarner mit automatischem Nebel bzw. Aerosol.' : DATA.lwrNo);

function materialize(q, mode){
  const f = FAM[q.fam];
  const strict = MODES[mode].confusion;
  const confTxt = f && f.confuse.length ? ` Verwechslungsgefahr mit ${f.confuse.map(c => FAM[c].name).join(', ')}.` : '';
  const u = f && q.k != null ? f.vars[q.k] : null;
  switch (q.kind){
    case 'img': {
      const iu = unitOfImg(f, q.i);
      return {prompt:'Welches Fahrzeug ist das?', img:[f.id, q.i], correct:f.name, wrong:nameDistractors(f, strict),
        ex:`${f.name}: ${CATS[f.cat].label}.${iu && f.vars.length > 1 ? ` Hier: ${iu.name} – ${iu.recog}` : ''} Erkennung: ${f.recog}` + confTxt};
    }
    case 'var': {
      const iu = unitOfImg(f, q.i);
      return {prompt:'Welche Version ist das?', img:[f.id, q.i], correct:iu.name, wrong:varDistractors(f, iu),
        ex:`${iu.name}: ${iu.recog}`, unit:iu, pinsNow:true,
        compare:f.vars.filter(x => x !== iu)};
    }
    case 'cat':
      return {prompt:'Was für ein Fahrzeug ist das?', img:randomImg(f), correct:CATS[f.cat].label, wrong:catAlternatives(f),
        ex:`${f.name}: ${CATS[f.cat].label} – ${CATS[f.cat].cap}.`};
    case 'air': {
      const wrong = shuffle(['spz', 'll', 'tpzr', 'tpzk', 'rad', 'pzj']).slice(0, 3).map(c => CATS[c].label);
      return {prompt:'Drohnen- bzw. Pod-Bild: Was für ein Fahrzeug ist das?', img:['air', q.i], correct:CATS.kpz.label, wrong,
        ex:`${DATA.airNotes[q.i]} ${DATA.airTip}`};
    }
    case 'aa':
      return {unit:u, prompt:`${u.name}: Was ist die größte Gefahr für einen Hubschrauber?`, img:randomImg(f, u), correct:u.aaQ[0], wrong:shuffle(u.aaQ[1]).slice(0, 3),
        ex:`${u.aa} ${DATA.fj}`};
    case 'lwr':
      return {unit:u, prompt:`Du lasert einen ${u.name} mit Entfernungsmesser oder Designator. Merkt die Besatzung das?`, img:randomImg(f, u),
        correct:DATA.lwr[u.lwr], wrong:DATA.lwrOrder.filter(k => k !== u.lwr).map(k => DATA.lwr[k]), order:DATA.lwrOrder.map(k => DATA.lwr[k]),
        ex:lwrLong(u)};
    case 'tis':
      return {unit:u, prompt:`Womit klärt ein ${u.name} nachts mit Bordmitteln auf?`, img:randomImg(f, u),
        correct:DATA.tis[u.tis], wrong:DATA.tisOrder.filter(k => k !== u.tis).map(k => DATA.tis[k]), order:DATA.tisOrder.map(k => DATA.tis[k]),
        ex:tisLong(u)};
    case 'wpn':
      return {prompt:`Welche Wirkmittel empfiehlst du gegen ${f.name}?`, img:randomImg(f),
        correct:DATA.wcls[f.wcls], wrong:DATA.wOrder.filter(k => k !== f.wcls).map(k => DATA.wcls[k]), order:DATA.wOrder.map(k => DATA.wcls[k]),
        ex:`${f.protection} Schwachstellen: ${f.weak}`};
    case 'side':
      return {prompt:`Wer setzt den ${f.name} im Ukrainekrieg ein?`, img:randomImg(f), correct:DATA.sides[f.side],
        wrong:DATA.sideOrder.filter(k => k !== f.side).map(k => DATA.sides[k]), order:DATA.sideOrder.map(k => DATA.sides[k]),
        ex:`${f.name}: ${f.users}.${(DATA.sideNote || {})[f.id] ? ' ' + DATA.sideNote[f.id] : ''} Der Typ allein sagt nichts Sicheres über die Seite – Lage, Kennzeichnung und Meldungen abgleichen.`};
    case 'cur':
      return {prompt:q.q, correct:q.opts[0], wrong:q.opts.slice(1), ex:q.ex};
  }
}

    ${flags.length ? `<p class="small muted" style="margin:4px 0 8px">Kopiere die Liste und schick sie mir im Chat, dann prüfe und korrigiere ich die Fragen.</p><textarea readonly id="flagtxt">${esc(flagText)}</textarea><div class="row"><button class="btn" data-act="copyflags">Liste kopieren</button><button class="btn" data-act="clearflags">Meldungen löschen</button></div>` : '<p class="muted">Noch keine Frage gemeldet. Nach jeder Antwort kannst du eine Frage mit „Frage melden“ markieren.</p>'}
    <h2 style="margin-top:26px">Zurücksetzen</h2>
    <p class="small muted" style="margin:4px 0 8px">Löscht alle Antworten und Trefferquoten. Gemeldete Fragen bleiben erhalten.</p>
    <button class="btn" data-act="reset">Statistik zurücksetzen</button>`;
}
function render(){
  if (view === 'home') renderHome();
  else if (view === 'quiz') renderQuiz();
  else if (view === 'end') renderEnd();
  else if (view === 'cards') renderCards();
  else if (view === 'stats') renderStats();
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-zoom],[data-czoom]');
  if (!t) return;
  if (t.dataset.img && cardState){
    e.stopPropagation();
    const n = cardImgs().length;
    cardState.i = (cardState.i + Number(t.dataset.img) + n) % n; cardState.pins = false; drawCard(); return;
  }
  if (t.dataset.czoom){
    const [ci, side] = t.dataset.czoom.split(':'); const sd = CMP[Number(ci)][side];
    const ar = (ARS[sd.fam] || [])[sd.i] || 4/3;
    const lb = document.createElement('div'); lb.className = 'lightbox'; lb.setAttribute('role', 'dialog');
    lb.innerHTML = `<div class="czoom"><div class="cmpin" style="aspect-ratio:${ar};width:min(100%, calc((100vh - 140px) * ${ar}))"><img src="${imgSrc(sd.fam, sd.i)}" alt="${esc(sd.lab)}">${sd.pins.map(([x, y], k) => `<span class="pin" style="left:${x}%;top:${y}%">${k + 1}</span>`).join('')}</div>
      <p class="czcap"><b>${esc(sd.lab)}</b>${sd.pins.map(([, , tx], k) => `<span><i>${k + 1}</i>${esc(tx)}</span>`).join('')}</p></div>`;
    lb.addEventListener('click', () => lb.remove());
    document.body.appendChild(lb); return;
  }
  if (t.dataset.zoom){
    const [fid, i] = t.dataset.zoom.split(':');
    const lb = document.createElement('div'); lb.className = 'lightbox'; lb.setAttribute('role', 'dialog');
    lb.innerHTML = `<img src="${imgSrc(fid, Number(i))}" alt="Vergrößerte Ansicht">`;
    lb.addEventListener('click', () => lb.remove());
    document.body.appendChild(lb); return;
  }
  if (t.dataset.start){ closeCard(); startRound(t.dataset.start); return; }
  if (t.dataset.go){ view = t.dataset.go; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.card){ openCard(t.dataset.card); return; }
  if (t.dataset.ans != null){ answer(Number(t.dataset.ans)); return; }
  if (t.dataset.flag){
    const id = t.dataset.flag;
    if (S.flags[id]) delete S.flags[id]; else S.flags[id] = {t:R && R.cur ? R.cur.m.prompt : id, ts:Date.now()};
    save();
    t.classList.toggle('flagged', !!S.flags[id]); t.textContent = S.flags[id] ? 'Gemeldet' : 'Frage melden';
    return;
  }
  const act = t.dataset.act;
  if (act === 'home'){ closeCard(); view = 'home'; R = null; render(); window.scrollTo(0, 0); }
  else if (act === 'next') nextQ();
  else if (act === 'merk') openMerk();
  else if (act === 'cmpall') openCmpAll();
  else if (act === 'anno'){
    const ar = $('#annoarea'); if (!ar) return;
    S.annoOpen = ar.hidden; ar.hidden = !ar.hidden; save();
    t.textContent = S.annoOpen ? 'Erkennungsmerkmale ausblenden' : 'Erkennungsmerkmale zeigen';
    t.setAttribute('aria-expanded', S.annoOpen ? 'true' : 'false');
    if (S.annoOpen) ar.scrollIntoView({behavior:'smooth', block:'nearest'});
  }
  else if (act === 'closecard') closeCard();
  else if (act === 'cardpins' && cardState){ cardState.pins = !cardState.pins; drawCard(); }
  else if (act === 'copyflags'){
    const ta = $('#flagtxt'); ta.select();
    const done = () => { t.textContent = 'Kopiert'; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, () => { try { document.execCommand('copy'); done(); } catch(_){} });
    else { try { document.execCommand('copy'); done(); } catch(_){} }
  }
  else if (act === 'clearflags'){ S.flags = {}; save(); render(); }
  else if (act === 'reset'){
    if (t.dataset.confirm){ const fl = S.flags; S = blank(); S.flags = fl; save(); render(); }
    else { t.dataset.confirm = '1'; t.textContent = 'Wirklich zurücksetzen? Erneut tippen'; t.classList.add('flagged'); }
  }
});
document.addEventListener('keydown', e => {
  if (document.querySelector('.lightbox')){ if (e.key === 'Escape') document.querySelector('.lightbox').remove(); return; }
  if (!$('#sheet').hidden){ if (e.key === 'Escape') closeCard(); return; }
  if (view !== 'quiz' || !R) return;
  if (!R.answered && /^[1-4]$/.test(e.key)){ const k = Number(e.key) - 1; if (k < R.cur.opts.length) answer(k); }
  else if (R.answered && (e.key === 'Enter' || e.key === ' ') && !(e.target && e.target.dataset && e.target.dataset.flag)){ e.preventDefault(); nextQ(); }
});
render();

</script>
