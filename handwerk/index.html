<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JTAC-Handwerk</title>
<meta name="theme-color" content="#E4E9E7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1517" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="JTAC">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/app.css">
<style>
:root{
  --bg:#E4E9E7; --surface:#F4F7F5; --surface2:#E9EEEC; --ink:#1A2326; --muted:#55615F; --line:#C3CCC9;
  --ok:#2A7848; --ok-bg:#DCEEE2; --bad:#B0382B; --bad-bg:#F6DEDA;
  --cta:#E0A526; --cta-ink:#1A2326; --feed:#0B1113; --hud:#F2B632;
  --font-d:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --font-b:"Barlow","Segoe UI",system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1517; --surface:#172022; --surface2:#1D282B; --ink:#E1E7E5; --muted:#93A09D; --line:#2A3639;
    --ok:#56B57F; --ok-bg:#16301F; --bad:#E36D5E; --bad-bg:#3A1C18;
    --cta:#E3AA2E; --cta-ink:#111719; --feed:#06090A;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1517; --surface:#172022; --surface2:#1D282B; --ink:#E1E7E5; --muted:#93A09D; --line:#2A3639;
  --ok:#56B57F; --ok-bg:#16301F; --bad:#E36D5E; --bad-bg:#3A1C18;
  --cta:#E3AA2E; --cta-ink:#111719; --feed:#06090A;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--cta);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:12px 18px 48px}
h1,h2,h3{font-family:var(--font-d);line-height:1.1;margin:0}
h2{font-size:1.45rem;font-weight:600;letter-spacing:.005em}
.muted{color:var(--muted)}
.small{font-size:.875rem}

/* Kopfleiste */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:720px;margin:0 auto;padding:8px 18px;display:flex;align-items:center;gap:12px;min-height:52px}
.bar .t{font-family:var(--font-d);font-weight:600;font-size:1.2rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:40px;height:40px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:500}
.prog{height:3px;background:var(--line)}
.prog>i{display:block;height:100%;background:var(--cta);transition:width .25s}

/* Start */
.hero{padding:28px 0 20px}
.hero h1{font-size:clamp(3rem,13vw,5.2rem);font-weight:700;letter-spacing:-.015em;line-height:.9}
.hero p{max-width:34em;margin:12px 0 0;color:var(--muted);font-size:1.05rem}
.board{margin:8px 0 24px}
.board-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.cells{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media (min-width:600px){.cells{grid-template-columns:repeat(6,1fr)}}
.cell{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 8px 12px;min-height:66px;overflow:hidden}
.cell b{display:block;font-family:var(--font-d);font-weight:700;font-size:1.2rem;line-height:1}
.cell span{display:block;font-size:.72rem;color:var(--muted);line-height:1.2;margin-top:3px}
.cell i{position:absolute;left:0;bottom:0;height:5px;background:var(--line)}
.cell[data-s="bad"] i{background:var(--bad)} .cell[data-s="mid"] i{background:var(--cta)} .cell[data-s="ok"] i{background:var(--ok)}
.cell[data-s="none"]{border-style:dashed}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:.8rem;color:var(--muted)}
.legend em{font-style:normal;display:inline-flex;align-items:center;gap:5px}
.legend em::before{content:"";width:12px;height:5px;background:var(--c)}
.cta{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;background:var(--cta);color:var(--cta-ink);border:0;border-radius:10px;padding:16px 18px;text-align:left}
.cta strong{font-family:var(--font-d);font-size:1.5rem;font-weight:700;display:block;line-height:1.05}
.cta small{display:block;font-size:.9rem;opacity:.85}
.cta .go{font-family:var(--font-d);font-size:1.6rem;font-weight:700}
.modes{margin-top:22px;border-top:1px solid var(--line)}
.mode{display:flex;width:100%;gap:14px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 2px}
.mode .mi{flex:1}
.mode strong{display:block;font-family:var(--font-d);font-size:1.3rem;font-weight:600;line-height:1.1}
.mode small{display:block;color:var(--muted);font-size:.9rem;margin-top:2px}
.mode .n{font-family:var(--font-d);font-size:1.1rem;color:var(--muted);white-space:nowrap}
.mode:hover strong{text-decoration:underline;text-underline-offset:3px}
.foot{margin-top:28px;font-size:.82rem;color:var(--muted);max-width:40em}
.guide-link{display:flex;gap:14px;align-items:center;margin-top:18px;padding:14px 16px;border:1px solid var(--line);border-left:4px solid var(--cta);border-radius:10px;background:var(--surface);color:var(--ink);text-decoration:none}.guide-link .mi{flex:1}.guide-link strong{display:block;font-family:var(--font-d);font-size:1.3rem;font-weight:600;line-height:1.1}.guide-link small{display:block;color:var(--muted);font-size:.9rem;margin-top:2px}.guide-link .n{font-family:var(--font-d);font-size:1.1rem;color:var(--muted);white-space:nowrap}.guide-link:hover strong{text-decoration:underline;text-underline-offset:3px}

/* Bilder */
.scene{position:relative;margin:0;background:var(--feed);border-radius:10px;overflow:hidden;cursor:zoom-in}
.scene svg{display:block;width:100%;height:auto}
.scene.map{background:#fbf8ee}
.lightbox{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));cursor:zoom-out}
.lightbox svg{width:100%;height:auto;max-height:100%;max-width:calc((100vh - 24px) * 1.333)}

/* Frage */
.lage{margin:14px 0 0;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;line-height:1.45}
.say{margin:14px 0 0;padding:10px 14px;background:var(--surface);border-left:4px solid var(--cta);border-radius:0 10px 10px 0;line-height:1.45}
.say-h{display:block;font-family:var(--font-d);font-weight:700;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.prompt{font-family:var(--font-d);font-size:1.55rem;font-weight:600;line-height:1.15;margin:14px 0 14px;text-wrap:balance}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;line-height:1.35;min-height:52px}
.opts.long .opt{font-size:.95rem;line-height:1.4}
.opt .k{flex:none;width:26px;height:26px;border-radius:6px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-weight:700;color:var(--muted);font-size:.95rem}
.opt:not([disabled]):hover{border-color:var(--ink)}
.opt[disabled]{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)} .opt.correct .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)} .opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.fb{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c,var(--ok));border-radius:10px;padding:14px 16px}
.fb .v{font-family:var(--font-d);font-size:1.35rem;font-weight:700;color:var(--c)}
.fb p{margin:6px 0 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:10px 14px;font-weight:600}
.btn.main{background:var(--ink);color:var(--bg);border-color:var(--ink);flex:1;min-width:9em}
.btn.flagged{border-color:var(--bad);color:var(--bad)}

/* Auswertung, Statistik */
.score{font-family:var(--font-d);font-size:5rem;font-weight:700;line-height:.9;margin:24px 0 4px}
.misslist{list-style:none;padding:0;margin:12px 0 0;border-top:1px solid var(--line)}
.misslist li{padding:10px 0;border-bottom:1px solid var(--line)}
.stat-top{display:flex;gap:28px;margin:18px 0 6px}
.stat-top b{display:block;font-family:var(--font-d);font-size:2.4rem;line-height:1}
.srow{display:grid;grid-template-columns:minmax(0,10em) 1fr 4.2em;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.94rem}
.sbar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.sbar i{display:block;height:100%}
textarea{width:100%;min-height:120px;font:inherit;font-size:.85rem;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}

/* Kurzlehre */
.lehre section{margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.lehre section:first-child{margin-top:10px;border-top:0;padding-top:0}
.lehre h2{margin-bottom:10px}
.lehre p,.lehre li{max-width:40em}
.lehre ul,.lehre ol{padding-left:1.2em;margin:8px 0 0}
.lehre li{margin:5px 0}
.lehre-fig{margin:6px 0 12px}
.lehre-fig svg{display:block;max-width:100%;height:auto}
.lehre-fig.compass svg{width:min(260px,100%);margin:0 auto}
.lehre-scene{margin:6px 0 8px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="bar" id="bar"><div class="bar-in" id="barin"></div><div class="prog" id="prog" hidden><i></i></div></header>
<main class="wrap" id="app" aria-live="polite"></main>
<script>
/* ---------- Luftbild-Zeichner: Szenen aus Daten, Norden oben, 400 × 300 Pixel (1 Pixel ≈ 0,8 m) ---------- */
let SVGN = 0;
function mulberry(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const PTS = s => s.trim().split(/\s+/).map(p => p.split(',').map(Number));
function inPoly(x, y, P){ let c = false; for (let i = 0, j = P.length - 1; i < P.length; j = i++){ const [xi, yi] = P[i], [xj, yj] = P[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; } return c; }
const FIELD = {acker:['#8c6f4c', '#7a5f3f'], raps:['#cfbd47', '#bba93b'], stoppel:['#c4ae79', '#b29c68'], wiese:['#7f9d58', '#76944f'], gruen:['#93ab62', '#86a058']};
const ROOF = {haus:'#a9583f', haus2:'#6e6b69', stall:'#8b6a4d', flach:'#9d9c97', halle:'#b4b9bc'};

  const body = hot || (k === 'pkw' || k === 'bus' ? col || '#e8e8e8' : VCOL.mil), dark = hot ? '#ffffff' : VCOL.milT;
  let s = '';

  else if (k === 'spz') s = `<rect x="-2.4" y="-4.4" width="4.8" height="8.8" rx=".8" fill="${body}"/><rect x="-1.4" y="-2.4" width="2.8" height="2.8" fill="${dark}"/><line x1="0" y1="-2.4" x2="0" y2="-6.2" stroke="${dark}" stroke-width=".8"/>`;
  else if (k === 'lkw') s = `<rect x="-2" y="-5.2" width="4" height="2.6" rx=".4" fill="${dark}"/><rect x="-2.3" y="-2.3" width="4.6" height="7.4" fill="${body}"/>`;
  else if (k === 'fla') s = `<rect x="-2.6" y="-4.8" width="5.2" height="9.6" rx="1.6" fill="${body}"/><rect x="-1.9" y="-1.6" width="3.8" height="3.6" fill="${dark}"/><circle cx="0" cy="-3" r="1.3" fill="${dark}"/>`;
  else if (k === 'pkw') s = `<rect x="-1.5" y="-2.7" width="3" height="5.4" rx=".9" fill="${body}"/><rect x="-1.2" y="-1.6" width="2.4" height="1.1" fill="rgba(20,30,40,.55)"/>`;
  else if (k === 'bus') s = `<rect x="-1.9" y="-6" width="3.8" height="12" rx=".6" fill="${body}"/>`;
  const shadow = ir ? '' : `<rect x="-2" y="-4" width="5" height="9" rx="1" fill="rgba(0,0,0,.35)" transform="translate(1.6 1.6)"/>`;

function bldSvg([x, y, w, h, r = 0, k = 'haus']){
  const c = ROOF[k] || ROOF.haus, flat = k === 'flach' || k === 'halle';

  s += `<rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" fill="${c}" stroke="rgba(0,0,0,.35)" stroke-width=".5"/>`;
  if (flat){
    if (k === 'halle') for (let i = 1; i < Math.floor(w / 7); i++) s += `<line x1="${-w / 2 + i * 7}" y1="${-h / 2}" x2="${-w / 2 + i * 7}" y2="${h / 2}" stroke="rgba(0,0,0,.12)" stroke-width=".6"/>`;

function churchSvg([x, y, r = 0]){
  const L = 40, W = 15, T = 10;
  return `<g transform="translate(${x} ${y}) rotate(${r})">

    <rect x="${-L / 2}" y="0" width="${L}" height="${W / 2}" fill="rgba(0,0,0,.2)"/>
    <line x1="${-L / 2}" y1="0" x2="${L / 2}" y2="0" stroke="rgba(0,0,0,.4)" stroke-width=".6"/>
    <rect x="${-L / 2 - T + 1}" y="${-T / 2}" width="${T}" height="${T}" fill="#4a565d" stroke="rgba(0,0,0,.5)" stroke-width=".5"/>
    <path d="M${-L / 2 - T + 1} ${-T / 2}L${-L / 2 + 1} ${T / 2}M${-L / 2 + 1} ${-T / 2}L${-L / 2 - T + 1} ${T / 2}" stroke="rgba(255,255,255,.3)" stroke-width=".6"/></g>`;

function specSvg(sp, id){
  const [k, x, y, a = 0, b = 0, r = 0] = sp;
  if (k === 'sport'){ const w = a, h = b;
    return `<g transform="translate(${x} ${y}) rotate(${r})"><rect x="${-w / 2 - 5}" y="${-h / 2 - 5}" width="${w + 10}" height="${h + 10}" rx="${h / 2 + 5}" fill="#a3553f"/><rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" fill="#5e9c49"/>
      <g fill="none" stroke="rgba(255,255,255,.85)" stroke-width=".7"><rect x="${-w / 2 + 2}" y="${-h / 2 + 2}" width="${w - 4}" height="${h - 4}"/><line x1="0" y1="${-h / 2 + 2}" x2="0" y2="${h / 2 - 2}"/><circle r="${h / 6}"/><rect x="${-w / 2 + 2}" y="${-h / 5}" width="${w / 8}" height="${h * 2 / 5}"/><rect x="${w / 2 - 2 - w / 8}" y="${-h / 5}" width="${w / 8}" height="${h * 2 / 5}"/></g></g>`; }
  if (k === 'platz') return `<polygon points="${a}" fill="#aba596" stroke="rgba(0,0,0,.15)" stroke-width=".6"/>`;
  if (k === 'hof') return `<polygon points="${a}" fill="#a99c82"/>`;
  if (k === 'tanke') return `<g transform="translate(${x} ${y}) rotate(${r})"><rect x="-30" y="-14" width="60" height="38" fill="#7f7f7b"/>
      <rect x="-20" y="-9" width="40" height="18" fill="rgba(0,0,0,.3)" transform="translate(2 2)"/><rect x="-20" y="-9" width="40" height="18" fill="#e3e3df" stroke="rgba(0,0,0,.35)" stroke-width=".5"/>
      <rect x="-24" y="13" width="24" height="10" fill="rgba(0,0,0,.33)" transform="translate(2 2)"/><rect x="-24" y="13" width="24" height="10" fill="${ROOF.flach}" stroke="rgba(0,0,0,.35)" stroke-width=".5"/></g>`;
  if (k === 'kh') return `<g transform="translate(${x} ${y}) rotate(${r})"><rect x="-38" y="-20" width="76" height="40" fill="rgba(0,0,0,.33)" transform="translate(3 3)"/><rect x="-38" y="-20" width="76" height="40" fill="#cbc6bd" stroke="rgba(0,0,0,.35)" stroke-width=".5"/>
      <rect x="-9" y="-9" width="18" height="18" fill="#fff"/><rect x="-2.5" y="-7" width="5" height="14" fill="#d32f2f"/><rect x="-7" y="-2.5" width="14" height="5" fill="#d32f2f"/></g>`;

      <line x1="${x + 44 - 14}" y1="${y + 30 + 16}" x2="${x + 44 + 14}" y2="${y + 30 - 16}" stroke="rgba(0,0,0,.35)" stroke-width="1.4"/><circle cx="${x}" cy="${y}" r="3.2" fill="#e8e8e4" stroke="rgba(0,0,0,.4)" stroke-width=".5"/>
      <line x1="${x - 16}" y1="${y + 10}" x2="${x + 16}" y2="${y - 10}" stroke="#f2f2ee" stroke-width="1.6"/></g>`;

function scene(sc, o = {}){
  const id = 'sc' + (++SVGN), R = mulberry(sc.seed || 7), ir = !!o.ir;
  let defs = `<radialGradient id="IRG"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>`;
  let g = `<rect width="400" height="300" fill="${sc.ground || '#7f9d58'}"/>`;
  (sc.fields || []).forEach(([p, k, a = 0], i) => {
    const [c1, c2] = FIELD[k]; const pid = `${id}f${i}`;
    defs += `<pattern id="${pid}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(${a})"><rect width="6" height="6" fill="${c1}"/><rect width="6" height="2.4" fill="${c2}"/></pattern>`;
    g += `<polygon points="${p}" fill="url(#${pid})" stroke="rgba(0,0,0,.12)" stroke-width=".8"/>`;
  });
  (sc.spec || []).filter(s => ['platz', 'hof', 'kies'].includes(s[0])).forEach(s => g += specSvg(s, id));
  (sc.ponds || []).forEach(p => g += `<polygon points="${p}" fill="#3e6b86" stroke="#55745a" stroke-width="2.5"/>`);
  (sc.rivers || []).forEach(([p, w]) => g += `<polyline points="${p}" fill="none" stroke="#5b7a4c" stroke-width="${w + 7}" stroke-linejoin="round" stroke-linecap="round"/><polyline points="${p}" fill="none" stroke="#3b6984" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/><polyline points="${p}" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="${w / 3}" stroke-linejoin="round"/>`);
  (sc.forest || []).forEach(p => {
    const P = PTS(p); g += `<polygon points="${p}" fill="#2f4625"/>`;
    const cuts = (sc.cuts || []).map(([c, w]) => [PTS(c), w]);
    const nearCut = (x, y) => cuts.some(([C, w]) => C.some((a, i) => { if (!i) return false; const b = C[i - 1], dx = a[0] - b[0], dy = a[1] - b[1], t = Math.max(0, Math.min(1, ((x - b[0]) * dx + (y - b[1]) * dy) / (dx * dx + dy * dy))); return Math.hypot(x - b[0] - t * dx, y - b[1] - t * dy) < w / 2 + 3; }));
    const xs = P.map(q => q[0]), ys = P.map(q => q[1]); let cr = '', sh = '';
    for (let yy = Math.min(...ys); yy <= Math.max(...ys); yy += 6) for (let xx = Math.min(...xs); xx <= Math.max(...xs); xx += 6){
      const x = xx + (R() - .5) * 5, y = yy + (R() - .5) * 5; if (!inPoly(x, y, P) || nearCut(x, y)) continue;
      const r = 3.2 + R() * 1.8, c = ['#3d5a2c', '#46652f', '#355127', '#4c6b34'][Math.floor(R() * 4)];
      sh += `<circle cx="${(x + 1.6).toFixed(1)}" cy="${(y + 1.6).toFixed(1)}" r="${r.toFixed(1)}" fill="rgba(0,0,0,.28)"/>`;
      cr += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${c}"/>`;
    }
    g += sh + cr;
  });
  (sc.cuts || []).forEach(([c, w]) => g += `<polyline points="${c}" fill="none" stroke="#86a058" stroke-width="${w}"/>`);
  const roads = sc.roads || [];
  const RW = {main:9, minor:6.5, track:3.6};
  roads.forEach(([p, k]) => { if (k !== 'track') g += `<polyline points="${p}" fill="none" stroke="#5f5f5a" stroke-width="${RW[k] + 2}" stroke-linejoin="round"/>`; });
  roads.forEach(([p, k]) => g += `<polyline points="${p}" fill="none" stroke="${k === 'track' ? '#bba67d' : '#8e8e88'}" stroke-width="${RW[k]}" stroke-linejoin="round"/>`);
  roads.forEach(([p, k]) => { if (k === 'main') g += `<polyline points="${p}" fill="none" stroke="rgba(255,255,255,.75)" stroke-width=".7" stroke-dasharray="5 5"/>`; });
  (sc.rail || []).forEach(p => g += `<polyline points="${p}" fill="none" stroke="#7b7268" stroke-width="9"/><polyline points="${p}" fill="none" stroke="#3d3a36" stroke-width="7" stroke-dasharray="1 2"/><polyline points="${p}" fill="none" stroke="#9b9b98" stroke-width="3.4"/><polyline points="${p}" fill="none" stroke="#5e5a55" stroke-width="1.6"/>`);
  (sc.bridges || []).forEach(([x, y, w, h, r = 0]) => g += `<g transform="translate(${x} ${y}) rotate(${r})"><rect x="${-w / 2 + 2}" y="${-h / 2 + 2}" width="${w}" height="${h}" fill="rgba(0,0,0,.35)"/><rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" fill="#a6a59f" stroke="#57564f" stroke-width="1"/></g>`);
  (sc.power || []).forEach(p => { const P = PTS(p); g += `<polyline points="${p}" fill="none" stroke="rgba(30,30,30,.55)" stroke-width=".5"/>`;
    for (let i = 0; i < P.length; i++){ const [x, y] = P[i]; g += `<line x1="${x}" y1="${y}" x2="${x + 9}" y2="${y + 9}" stroke="rgba(0,0,0,.35)" stroke-width="1.6"/><rect x="${x - 2}" y="${y - 2}" width="4" height="4" fill="#9a9a96" stroke="#333" stroke-width=".4"/>`; } });
  (sc.spec || []).filter(s => !['platz', 'hof', 'kies'].includes(s[0])).forEach(s => g += specSvg(s, id));
  (sc.bld || []).forEach(b => g += bldSvg(b));
  (sc.church || []).forEach(c => g += churchSvg(c));
  (sc.trees || []).forEach(([x, y, r = 4.5]) => g += `<circle cx="${x + 2}" cy="${y + 2}" r="${r}" fill="rgba(0,0,0,.3)"/><circle cx="${x}" cy="${y}" r="${r}" fill="#3f5f2c" stroke="rgba(0,0,0,.25)" stroke-width=".5"/>`);
  let top = '';
  const veh = [...(sc.veh || []).filter(v => !o.show || !v[5] || o.show.includes(v[5])), ...(o.veh || [])];
  veh.forEach(v => top += vehSvg(v, ir));
  [...(sc.people || []), ...(o.people || [])].forEach(([x, y, n = 5, kind = 'ziv']) => {
    const r2 = mulberry(Math.round(x * 31 + y * 7));
    for (let i = 0; i < n; i++){ const px = x + (r2() - .5) * (n > 3 ? 12 : 6), py = y + (r2() - .5) * (n > 3 ? 12 : 6);
      const c = ir ? '#f6f6f2' : kind === 'mil' ? '#3a3f1f' : ['#d84a3a', '#2f6fd6', '#f2f2ee', '#e0a526'][i % 4];
      top += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="1.25" fill="${c}" stroke="rgba(0,0,0,.6)" stroke-width=".35"/>`; } });
  (o.mortar || sc.mortar || []).forEach(([x, y]) => top += `<g transform="translate(${x} ${y})"><circle r="6" fill="#6b5a3e" stroke="#4a3d29" stroke-width="2"/><circle r="1.6" fill="${ir ? '#fff' : '#2c3018'}"/></g>`);
  // Überlagerungen (nicht Teil des Bildes, sondern Markierungen)
  let ov = '';
  (o.friends || []).forEach(p => ov += `<polyline points="${p}" fill="none" stroke="#1e64d6" stroke-width="3" stroke-dasharray="7 4" stroke-linecap="round"/>`);
  if (o.friendLabel) ov += `<g transform="translate(${o.friendLabel[0]} ${o.friendLabel[1]})"><rect x="-38" y="-8" width="76" height="16" rx="3" fill="#1e64d6"/><text x="0" y="4" text-anchor="middle" font-size="10" font-weight="700" fill="#fff" font-family="Barlow, sans-serif">EIGENE TRUPPEN</text></g>`;
  (o.boxes || []).forEach(([x, y, s = 13, c = '#ff3b30']) => ov += `<path d="M${x - s} ${y - s + 5}V${y - s}H${x - s + 5}M${x + s - 5} ${y - s}H${x + s}V${y - s + 5}M${x + s} ${y + s - 5}V${y + s}H${x + s - 5}M${x - s + 5} ${y + s}H${x - s}V${y + s - 5}" fill="none" stroke="${c}" stroke-width="2.2"/>`);
  (o.labels || []).forEach(([x, y, t, dx = 13, dy = -13]) => ov += `<line x1="${x}" y1="${y}" x2="${x + dx * .62}" y2="${y + dy * .62}" stroke="#fff" stroke-width="1.2"/><circle cx="${x + dx}" cy="${y + dy}" r="8" fill="#fff" stroke="#111" stroke-width="1.3"/><text x="${x + dx}" y="${y + dy + 3.6}" text-anchor="middle" font-size="11" font-weight="700" font-family="Barlow, sans-serif" fill="#111">${t}</text>`);
  // HUD
  const hud = ir ? '#ffffff' : '#F2B632';
  ov += `<g fill="none" stroke="${hud}" stroke-width="1.6" opacity=".9"><path d="M8 26V8h18M374 8h18v18M392 274v18h-18M26 292H8v-18"/></g>
    <g transform="translate(376 40)"><circle r="11" fill="rgba(0,0,0,.45)"/><path d="M0 -8L4 3L0 1L-4 3Z" fill="${hud}"/><text y="-12.5" text-anchor="middle" font-size="9" font-weight="700" fill="${hud}" font-family="Barlow, sans-serif" style="paint-order:stroke" stroke="rgba(0,0,0,.6)" stroke-width="2">N</text></g>
    <g transform="translate(18 282)"><rect x="-4" y="-13" width="72" height="18" rx="2" fill="rgba(0,0,0,.45)"/><path d="M0 0H62M0 -3V3M62 -3V3M31 -2V2" stroke="${hud}" stroke-width="1.4"/><text x="31" y="-4" text-anchor="middle" font-size="8.5" font-weight="600" fill="${hud}" font-family="Barlow, sans-serif">50 m</text></g>`;
  if (ir) defs += `<filter id="${id}ir" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values=".3 .5 .2 0 -.08  .3 .5 .2 0 -.08  .3 .5 .2 0 -.08  0 0 0 1 0"/><feComponentTransfer><feFuncR type="gamma" exponent="1.4"/><feFuncG type="gamma" exponent="1.4"/><feFuncB type="gamma" exponent="1.4"/></feComponentTransfer></filter>`;
  const base = ir ? `<g filter="url(#${id}ir)">${g}</g>` : g;
  return `<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${o.alt ? o.alt.replace(/"/g, '&quot;') : 'Luftbild-Skizze'}"><defs>${defs}</defs>${base}${top}${ov}</svg>`;
}

  ['kgr6', 'kgr', 'Eine Zielkoordinate hat 10 Stellen. Ist das Ziel damit auf 1 m genau bestimmt?', ['Nein – die Stellenzahl sagt nur, wie fein geschrieben wurde, nicht wie genau gemessen wurde', 'Ja – 10 Stellen bedeuten immer 1 m Genauigkeit', 'Ja, aber nur bei Tag', 'Nein – 10 Stellen bedeuten 10 m'], 'Eine Koordinate kann 10 Stellen haben und trotzdem weit danebenliegen, etwa wenn sie grob aus der Karte geschätzt und mit Nullen aufgefüllt wurde. Wie genau sie wirklich ist, hängt davon ab, wie sie bestimmt wurde: Karte, GPS, Laser-Entfernungsmesser oder Zielerfassungsgerät. Für GPS-Waffen zählt diese echte Genauigkeit (TLE), nicht die Stellenzahl.'],

  ['dc5', 'card', 'In welcher Form gibst du Zeile 8 der 9-Line an?', ['Himmelsrichtung und Entfernung der eigenen Truppen vom Ziel aus, z. B. „Süd 800“', 'Koordinate der eigenen Truppen', 'Richtung vom eigenen Standort zum Ziel in Strich', 'Entfernung vom Lfz zum Ziel'], 'Zeile 8 sagt dem Piloten, wo ihr steht – vom Ziel aus gesehen: Himmelsrichtung und Entfernung in Metern. „Süd 800“ heißt: eigene Truppen 800 m südlich des Ziels.'],
  ['dc6', 'card', 'Deine Truppe steht 600 m südlich des Ziels. Was meldest du in Zeile 8?', ['Süd 600', 'Nord 600', 'Süd 6000', 'Nord 6'], 'Zeile 8 wird vom Ziel aus angegeben: Ihr steht südlich des Ziels, also „Süd 600“. Häufiger Fehler ist die Richtung vom eigenen Standort zum Ziel – das wäre „Nord“ und schickt den Piloten gedanklich auf die falsche Seite.'],
  ['tg1', 'tgr', 'Womit beginnt ein Talk-on?', ['Mit gemeinsamer Orientierung und einem großen, eindeutigen Bezugspunkt', 'Mit der genauen Beschreibung des Ziels', 'Mit der Koordinate der eigenen Truppen', 'Mit dem kleinsten Detail in Zielnähe'], 'Erst klärt ihr, wie ihr euch orientiert (z. B. Himmelsrichtungen, „Norden oben“). Dann kommt ein großer Bezugspunkt, den der Pilot sicher findet: Fluss, Ortschaft, große Kreuzung. Von dort geht es Schritt für Schritt zum Ziel.'],
  ['tg2', 'tgr', 'Warum Himmelsrichtungen statt „links“ und „rechts“?', ['Links und rechts hängen von der Blickrichtung ab – der Pilot fliegt aus einer anderen Richtung an', 'Himmelsrichtungen sind kürzer', 'Links und rechts sind im Funk verboten', 'Der Pilot hat keinen Kompass'], 'Du schaust vom Boden aus einer Richtung, der Pilot kreist oder fliegt aus einer anderen an. Für ihn ist „rechts von der Kirche“ etwas anderes als für dich. Norden ist für beide gleich.'],
  ['tg3', 'tgr', 'Was ist eine „Einheit“ (Maßstab) im Talk-on?', ['Eine Strecke, die ihr beide seht – z. B. Kreuzung bis Kirche –, mit der ihr weitere Entfernungen beschreibt', 'Die Entfernung zwischen dir und dem Ziel', 'Immer genau 100 m', 'Die Flughöhe des Lfz'], 'Entfernungen schätzt jeder anders, besonders aus der Luft. Legt ihr eine sichtbare Strecke als „eine Einheit“ fest, versteht ihr beide unter „zwei Einheiten östlich“ dasselbe.'],
  ['tg4', 'tgr', 'Der Pilot meldet bei einem Bezugspunkt „CONTACT“. Was bedeutet das?', ['Er hat den Bezugspunkt gefunden – du gehst zum nächsten Schritt', 'Er hat das Ziel gefunden', 'Er wird beschossen', 'Er hat den Funkkontakt verloren'], 'CONTACT bestätigt einen Bezugspunkt oder ein Merkmal. Erst wenn der Pilot das Ziel selbst gefunden hat, meldet er TALLY.'],
  ['tg5', 'tgr', 'Der Pilot meldet „LOOKING“. Was tust du?', ['Die Beschreibung vereinfachen oder einen größeren Bezugspunkt wählen', 'Sofort zum nächsten Schritt gehen', 'Den Angriff freigeben', 'Die Zielkoordinate wiederholen und abwarten'], 'LOOKING heißt: Der Pilot sucht noch. Dann hilft kein weiterer Schritt, sondern eine einfachere Beschreibung oder ein größerer, auffälligerer Bezugspunkt.'],
  ['tg6', 'tgr', 'Welcher Bezugspunkt eignet sich am besten?', ['Eine große Straßenkreuzung', 'Ein parkendes Auto', 'Ein Verkehrsschild', 'Ein Mensch am Straßenrand'], 'Gute Bezugspunkte sind groß, einmalig, aus der Luft gut sichtbar und bleiben, wo sie sind: Kreuzungen, Brücken, Waldränder, Gewässer, auffällige Gebäude. Fahrzeuge und Menschen bewegen sich, Schilder sind von oben nicht zu sehen.'],
  ['tg7', 'tgr', 'Nachts sieht der Pilot das Gelände nur im Wärmebild. Was ändert sich für deinen Talk-on?', ['Es gibt keine Farben mehr – beschreibe Formen, Linien und warme Objekte', 'Nichts', 'Ein Talk-on ist nachts nicht möglich', 'Du darfst nur noch Koordinaten verwenden'], 'Das Wärmebild zeigt Temperaturunterschiede, keine Farben. „Rotes Dach“ oder „gelbes Feld“ helfen nicht. Straßen, Gebäudeformen, Gewässer und warme Fahrzeuge dagegen schon.'],
  ['tg8', 'tgr', 'Wie verkürzt du einen langen Talk-on am besten?', ['Mit einer Markierung: IR-Pointer, Laser oder Rauch am Ziel oder nahe dabei', 'Indem du schneller sprichst', 'Indem du alle Schritte in einem Funkspruch sagst', 'Indem du auf Bezugspunkte verzichtest'], 'Eine Markierung gibt dem Piloten sofort einen Punkt im Gelände. Von dort brauchst du nur noch wenige Schritte, etwa „vom Rauch 100 m nach Norden“.'],
  ['tg9', 'tgr', 'Der Pilot meldet „TALLY“. Wie stellst du sicher, dass er das richtige Ziel hat?', ['Er beschreibt dir das Ziel und seine Umgebung – du vergleichst mit deinem Bild', 'Gar nicht – TALLY reicht immer', 'Du fragst nach seiner Flughöhe', 'Du wiederholst deinen Talk-on'], 'TALLY heißt nur: Der Pilot glaubt, das Ziel zu sehen. Lass ihn beschreiben, was er sieht (Fahrzeugart, Ausrichtung, Umgebung). Passt alles zu deinem Bild, habt ihr dasselbe Ziel. Mit ROVER seht ihr sogar dasselbe Pod-Bild.'],
  ['tg10', 'tgr', 'Warum funkst du den Talk-on in kurzen Schritten mit Bestätigung?', ['Damit der Pilot jeden Bezugspunkt gefunden hat, bevor der nächste kommt', 'Weil Funkgeräte nur kurze Sprüche übertragen', 'Damit der Gegner nicht mithört', 'Weil das Lfz sonst zu schnell ist'], 'Jeder Schritt baut auf dem vorigen auf. Hat der Pilot einen Bezugspunkt verpasst, ist alles danach wertlos. Deshalb: ein Schritt, CONTACT abwarten, nächster Schritt.'],
  ['cg1', 'cgr', 'Welche drei Grundsätze des humanitären Völkerrechts stehen hinter jeder Wirkmittelwahl?', ['Unterscheidung, Verhältnismäßigkeit, Vorsicht', 'Schnelligkeit, Überraschung, Masse', 'Aufklärung, Führung, Wirkung', 'Tarnung, Täuschung, Deckung'], 'Unterscheidung: nur militärische Ziele angreifen. Verhältnismäßigkeit: Die erwarteten Schäden an Zivilpersonen und zivilen Objekten dürfen nicht außer Verhältnis zum militärischen Vorteil stehen. Vorsicht: alles praktisch Mögliche tun, um solche Schäden zu vermeiden – durch Wahl von Wirkmittel, Zeitpunkt und Anflugrichtung. Festgeschrieben im I. Zusatzprotokoll zu den Genfer Abkommen.'],
  ['cg2', 'cgr', 'Eine GBU-31 ist GPS-gelenkt und sehr genau. Bedeutet das wenig Begleitschaden?', ['Nein – sie trifft genau, wirkt aber mit 2000 lb sehr weit um den Einschlagpunkt', 'Ja – präzise Waffen verursachen keinen Begleitschaden', 'Ja, wenn das Wetter gut ist', 'Nein – GPS-Waffen sind ungenau'], 'Die Präzision bestimmt, wo die Waffe einschlägt. Die Größe des Gefechtskopfs bestimmt, wie weit Druck und Splitter reichen. Für Ziele nahe Zivilisten zählt beides: genau treffen und möglichst kleine Wirkung.'],
  ['cg3', 'cgr', 'Was bewirkt ein Verzögerungszünder?', ['Die Bombe dringt erst ein und detoniert im Gebäude oder im Boden – weniger Splitter nach außen', 'Die Bombe detoniert einige Meter über dem Boden', 'Die Bombe detoniert erst Stunden später', 'Die Bombe detoniert nicht, wenn Zivilisten in der Nähe sind'], 'Mit Verzögerung detoniert die Bombe kurz nach dem Eindringen. Die Wirkung bleibt stärker im Gebäude oder im Erdreich. Nachteil: Das Gebäude kann einstürzen.'],
  ['cg4', 'cgr', 'Wann ist ein Annäherungszünder (Detonation über dem Boden) sinnvoll?', ['Gegen ungeschützte Kräfte im freien Gelände, fern von Zivilisten', 'Gegen Ziele in Gebäuden neben Wohnhäusern', 'Gegen Bunker', 'Immer, wenn Zivilisten in der Nähe sind'], 'Die Detonation über dem Boden verteilt Splitter über eine große Fläche – wirksam gegen Infanterie im Freien. Genau deshalb ist sie neben Wohnhäusern die schlechteste Wahl.'],
  ['cg5', 'cgr', 'In welche Richtung weichen Bomben bei Fehlern meist am stärksten ab?', ['In Flugrichtung – sie fallen eher zu kurz oder zu weit als zur Seite', 'Quer zur Flugrichtung', 'Immer mit dem Wind, egal wie das Lfz fliegt', 'Gar nicht – gelenkte Bomben treffen immer'], 'Bei vielen Waffen wirken sich Fehler bei Abwurf, Wind oder Lenkung vor allem als „zu kurz“ oder „zu weit“ aus. Darum legst du die Anflugrichtung so, dass weder vor noch hinter dem Ziel Zivilisten oder eigene Truppen liegen.'],
  ['cg6', 'cgr', 'Warum ist ein Ziel an einer Tankstelle besonders heikel?', ['Kraftstoff und Gas können explodieren und brennen – die Wirkung reicht weit über den Gefechtskopf hinaus', 'Tankstellen sind geschützte Objekte', 'Weil Laser an Tankstellen nicht funktionieren', 'Weil das Ziel dort schneller wird'], 'Folgeexplosionen und Brände (Kraftstoff, Gas, Munition) vergrößern den Schaden weit über die eigentliche Waffenwirkung hinaus. Solche Folgewirkungen gehören in deine Abwägung.'],
  ['cg7', 'cgr', 'Wann rufst du „ABORT“?', ['Sobald der Angriff Zivilisten oder eigene Truppen gefährdet oder etwas nicht stimmt – vor dem Auslösen', 'Nur wenn der Pilot es verlangt', 'Erst nach dem Einschlag', 'Nie – ein begonnener Angriff wird zu Ende geflogen'], 'ABORT bricht den Angriff ab. Du nutzt es, wenn etwas nicht stimmt: falsches Ziel, falscher Anflug, Zivilisten oder eigene Truppen in Gefahr. Wirksam ist es nur bis zum Auslösen – eine abgeworfene Bombe lässt sich nicht zurückholen.'],

  ['cg10', 'cgr', 'Wer trägt die Verantwortung für die Freigabe eines CAS-Angriffs?', ['Der Truppenführer am Boden – du handelst in seinem Auftrag und nach den Einsatzregeln', 'Der Pilot allein', 'Der JTAC ganz allein, ohne Auftrag', 'Die Flugsicherung'], 'Die Verantwortung liegt beim Truppenführer am Boden (Ground Commander). Du als JTAC berätst ihn, schlägst Wirkmittel, Anflug und Zeitpunkt vor und gibst die Freigabe in seinem Auftrag – im Rahmen der Einsatzregeln (ROE).'],

function mapBack(W, H, seed){
  const R = mulberry(seed); let s = `<rect width="${W}" height="${H}" fill="#f3efe0"/>`;
  for (let i = 0; i < 3; i++){ const cx = R() * W, cy = R() * H, n = 9, r0 = 25 + R() * 35; let d = '';
    for (let k = 0; k < n; k++){ const a = k / n * Math.PI * 2, r = r0 * (.7 + R() * .5); d += (k ? 'L' : 'M') + (cx + Math.cos(a) * r).toFixed(1) + ' ' + (cy + Math.sin(a) * r * .8).toFixed(1); }
    s += `<path d="${d}Z" fill="#c9dfb2" stroke="#9fc184" stroke-width=".6"/>`; }
  const y0 = R() * H, y1 = R() * H; s += `<path d="M0 ${y0.toFixed(1)} C ${W * .3} ${(y0 + 60 * (R() - .5)).toFixed(1)}, ${W * .6} ${(y1 + 60 * (R() - .5)).toFixed(1)}, ${W} ${y1.toFixed(1)}" fill="none" stroke="#7fb6dc" stroke-width="3"/>`;
  const x0 = R() * W, x1 = R() * W; s += `<path d="M${x0.toFixed(1)} 0 L${x1.toFixed(1)} ${H}" fill="none" stroke="#7a5a3a" stroke-width="3.2"/><path d="M${x0.toFixed(1)} 0 L${x1.toFixed(1)} ${H}" fill="none" stroke="#f0b94a" stroke-width="2"/>`;
  for (let v = 0; v < 2; v++){ const vx = R() * W * .8 + W * .1, vy = R() * H * .8 + H * .1; for (let k = 0; k < 7; k++) s += `<rect x="${(vx + (R() - .5) * 26).toFixed(1)}" y="${(vy + (R() - .5) * 20).toFixed(1)}" width="4" height="3.4" fill="#6b6b6b"/>`; }
  return s;
}

/* Gitterkarte: cols × rows Quadrate, Beschriftung der Gitterlinien (km) unten und links */
function gridMap({E0, N0, cols = 4, rows = 3, pts = [], zone, sq, sub = 0, seed = 1, unit = 'km'}){
  const L = 30, B = 24, T = 20, Rm = 8, W = 400, H = 300, k = Math.min((W - L - Rm) / cols, (H - T - B) / rows);
  const mw = cols * k, mh = rows * k, ox = L, oy = T;
  let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kartenausschnitt mit Gitter"><rect width="${W}" height="${H}" fill="#fbf8ee"/>`;
  s += `<g transform="translate(${ox} ${oy})"><svg width="${mw}" height="${mh}" overflow="hidden">${mapBack(mw, mh, seed)}</svg>`;
  if (sub) for (let i = 0; i <= cols * sub; i++) s += `<line x1="${i * k / sub}" y1="0" x2="${i * k / sub}" y2="${mh}" stroke="#2a6db0" stroke-width=".35" opacity=".55"/>`;
  if (sub) for (let j = 0; j <= rows * sub; j++) s += `<line x1="0" y1="${j * k / sub}" x2="${mw}" y2="${j * k / sub}" stroke="#2a6db0" stroke-width=".35" opacity=".55"/>`;
  for (let i = 0; i <= cols; i++) s += `<line x1="${i * k}" y1="0" x2="${i * k}" y2="${mh}" stroke="#2a6db0" stroke-width="1"/>`;
  for (let j = 0; j <= rows; j++) s += `<line x1="0" y1="${j * k}" x2="${mw}" y2="${j * k}" stroke="#2a6db0" stroke-width="1"/>`;
  for (const p of pts) s += MK[p.kind](p.x * k, mh - p.y * k);
  s += `</g>`;
  const lab = (x, y, t, a = 'middle') => `<text x="${x}" y="${y}" text-anchor="${a}" font-size="11" font-weight="600" fill="#1d4f8a" font-family="Barlow, sans-serif">${t}</text>`;
  if (E0 != null) for (let i = 0; i <= cols; i++) s += lab(ox + i * k, oy + mh + 15, p2((E0 + i) % 100));
  if (N0 != null) for (let j = 0; j <= rows; j++) s += lab(ox - 5, oy + mh - j * k + 4, p2((N0 + j) % 100), 'end');
  if (zone) s += `<text x="${ox}" y="14" font-size="11" font-weight="700" fill="#333" font-family="Barlow, sans-serif">${zone} ${sq} · Gitterlinien alle 1 km</text>`;
  if (unit === '100m') s += `<text x="${ox}" y="14" font-size="11" font-weight="700" fill="#333" font-family="Barlow, sans-serif">1 Kästchen = 100 m · Gitternord oben</text>`;
  s += `<g transform="translate(${W - 22} ${oy + 16})"><path d="M0 -10L5 4L0 1L-5 4Z" fill="#333"/><text y="14" text-anchor="middle" font-size="9" font-weight="700" fill="#333" font-family="Barlow, sans-serif">N</text></g>`;
  return s + `</svg>`;
}
/* 8-stellig: links das Kilometerquadrat mit 100-m-Teilung, rechts das 100-m-Quadrat vergrößert mit 10-m-Teilung (wie ein Planzeiger) */
function zoomMap({E0, N0, e100, n100, fe, fn, zone, sq, seed}){
  const W = 400, H = 222, a = 150, ox = 30, oy = 34, k = a / 10, b = 150, bx = 232, by = 34, kb = b / 10;
  let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kilometerquadrat und vergrößertes 100-m-Quadrat"><rect width="${W}" height="${H}" fill="#fbf8ee"/>`;
  s += `<text x="${ox}" y="16" font-size="11" font-weight="700" fill="#333" font-family="Barlow, sans-serif">${zone} ${sq} · 1 km-Quadrat</text>`;
  s += `<g transform="translate(${ox} ${oy})"><svg width="${a}" height="${a}" overflow="hidden">${mapBack(a, a, seed)}</svg>`;
  for (let i = 0; i <= 10; i++){ const w = i % 10 ? .45 : 1.2, o = i % 10 ? .6 : 1;
    s += `<line x1="${i * k}" y1="0" x2="${i * k}" y2="${a}" stroke="#2a6db0" stroke-width="${w}" opacity="${o}"/><line x1="0" y1="${i * k}" x2="${a}" y2="${i * k}" stroke="#2a6db0" stroke-width="${w}" opacity="${o}"/>`; }
  for (let i = 1; i < 10; i++) s += `<text x="${i * k}" y="${a + 10}" text-anchor="middle" font-size="7.5" fill="#1d4f8a" font-family="Barlow, sans-serif">${i}</text><text x="-3" y="${a - i * k + 2.5}" text-anchor="end" font-size="7.5" fill="#1d4f8a" font-family="Barlow, sans-serif">${i}</text>`;
  const cx = e100 * k, cy = a - (n100 + 1) * k;
  s += `<rect x="${cx}" y="${cy}" width="${k}" height="${k}" fill="none" stroke="#e0a526" stroke-width="2"/>`;
  s += `<circle cx="${(e100 + fe / 10) * k}" cy="${a - (n100 + fn / 10) * k}" r="2.4" fill="#d32f2f"/></g>`;
  const lab = (x, y, t, an = 'middle', sz = 11) => `<text x="${x}" y="${y}" text-anchor="${an}" font-size="${sz}" font-weight="600" fill="#1d4f8a" font-family="Barlow, sans-serif">${t}</text>`;
  s += lab(ox, oy + a + 22, p2(E0)) + lab(ox + a, oy + a + 22, p2((E0 + 1) % 100)) + lab(ox - 6, oy + a + 4, p2(N0), 'end') + lab(ox - 6, oy + 4, p2((N0 + 1) % 100), 'end');
  // Lupe
  s += `<path d="M${ox + cx + k} ${oy + cy} L${bx} ${by} M${ox + cx + k} ${oy + cy + k} L${bx} ${by + b}" stroke="#e0a526" stroke-width="1" opacity=".8"/>`;
  s += `<text x="${bx}" y="16" font-size="11" font-weight="700" fill="#333" font-family="Barlow, sans-serif">Lupe: 100 m, Teilung 10 m</text>`;
  s += `<g transform="translate(${bx} ${by})"><rect width="${b}" height="${b}" fill="#f6f1df" stroke="#e0a526" stroke-width="2"/>`;
  for (let i = 1; i < 10; i++) s += `<line x1="${i * kb}" y1="0" x2="${i * kb}" y2="${b}" stroke="#2a6db0" stroke-width=".35" opacity=".5"/><line x1="0" y1="${i * kb}" x2="${b}" y2="${i * kb}" stroke="#2a6db0" stroke-width=".35" opacity=".5"/>`;
  for (let i = 0; i <= 10; i++) s += `<line x1="${i * kb}" y1="${b}" x2="${i * kb}" y2="${b + 5}" stroke="#333" stroke-width="1"/><line x1="0" y1="${b - i * kb}" x2="-5" y2="${b - i * kb}" stroke="#333" stroke-width="1"/>`;
  for (let i = 0; i < 10; i++) s += `<text x="${i * kb}" y="${b + 15}" text-anchor="middle" font-size="9" fill="#333" font-family="Barlow, sans-serif">${i}</text><text x="-8" y="${b - i * kb + 3}" text-anchor="end" font-size="9" fill="#333" font-family="Barlow, sans-serif">${i}</text>`;
  const px = fe * kb, py = b - fn * kb;
  s += `<path d="M${px} ${b}V${py}H0" fill="none" stroke="#d32f2f" stroke-width=".8" stroke-dasharray="3 2"/><circle cx="${px}" cy="${py}" r="4" fill="#d32f2f"/></g>`;
  return s + `</svg>`;
}

function mgrsSvg(){

      <p>Auf der Karte: Ein 1-km-Gitterquadrat hat 1000 m, ein Zehntel 100 m. Diagonal ist eine Strecke rund 1,4-mal so lang wie ihre Seite.</p>

      <ol>
        <li><b>Orientierung festlegen:</b> Himmelsrichtungen; gegebenenfalls „Norden oben“, wenn ihr dasselbe Bild seht (ROVER).</li>
        <li><b>Großer, eindeutiger Bezugspunkt:</b> Fluss, Ortschaft, große Kreuzung, Bahnlinie, Waldstück.</li>
        <li><b>Maßstab festlegen:</b> eine Strecke, die ihr beide seht, als „eine Einheit“.</li>

    </section>
    <section><h2>5 · Begleitschaden vermeiden</h2>
      <p>Grundlage ist das humanitäre Völkerrecht (I. Zusatzprotokoll zu den Genfer Abkommen): <b>Unterscheidung</b> (nur militärische Ziele, sichere Identifizierung), <b>Verhältnismäßigkeit</b> (erwarteter ziviler Schaden nicht außer Verhältnis zum militärischen Vorteil) und <b>Vorsicht</b> (alles praktisch Mögliche tun, um ihn zu vermeiden). Deine Stellschrauben als JTAC:</p>
      <ul>
        <li><b>Wirkmittel:</b> das kleinste, das das Ziel sicher bekämpft. Präzise ist nicht dasselbe wie klein – eine GBU-31 trifft genau, wirkt aber mit 2000 lb.</li>
        <li><b>Zünder:</b> Verzögerung hält die Wirkung im Gebäude oder Boden; Detonation über dem Boden verteilt Splitter über eine große Fläche – gut im freien Gelände, schlecht neben Wohnhäusern.</li>
        <li><b>Anflugrichtung:</b> Fehler streuen meist in Flugrichtung (zu kurz, zu weit). Nicht über Zivilisten oder eigene Truppen hinweg und nicht auf sie zu anfliegen lassen.</li>
        <li><b>Zeitpunkt:</b> Ziel im freien Gelände bekämpfen, warten, bis es eine Tankstelle oder ein Krankenhaus verlassen hat, Pattern of Life beobachten.</li>
        <li><b>Folgewirkungen:</b> Kraftstoff, Gas und Munition am Ziel vergrößern den Schaden weit über den Gefechtskopf hinaus.</li>
        <li><b>Abbrechen:</b> ABORT bis zum Auslösen. Danach kann nur noch eine lasergelenkte Waffe umgelenkt werden – durch Verlegen des Laserpunkts auf eine freie Fläche.</li>
        <li><b>Geschützte Objekte:</b> Krankenhäuser (rotes Kreuz), Schulen, religiöse Stätten und Kulturgut. Die Entscheidung über Grenzfälle trifft die Führung nach den Einsatzregeln (ROE) – du lieferst Lagebild und Vorschlag.</li>
      </ul>
      <p class="muted small">Nicht enthalten: Sicherheitsabstände für eigene Truppen (Danger Close, Risk-Estimate Distances) und Verfahren der Kollateralschadensschätzung aus eingestuften Vorschriften. Die lernst du in der Ausbildung aus den gültigen Unterlagen.</p>
    </section>

const ROUND_LEN = 12, MIX_LEN = 24;
const MODES = {
  mix:  {name:'Gemischte Runde', areas:AREA_ORDER},
  koord:{name:'Koordinaten (MGRS)', areas:['mgrs', 'prec', 'dist', 'kgr']},

/* ---------- Hilfen ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rnd = a => a[Math.floor(Math.random() * a.length)];

/* ---------- Stand und Speichern ---------- */
const KEY = 'handwerktrainer.v1';
const blank = () => ({v:1, updated:0, fam:{}, q:{}, flags:{}, recent:[], answered:0, correct:0});
function readLocal(){ try { const r = localStorage.getItem(KEY); if (r) return Object.assign(blank(), JSON.parse(r)); } catch(e){} return blank(); }
let S = readLocal();
function save(){ S.updated = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

/* ---------- Fragenpool ---------- */
function buildBank(){
  const bank = [];
  for (const [g, G] of Object.entries(GEN)) for (let k = 0; k < G.n; k++) bank.push({id:`gen:${g}:${k}`, kind:'gen', g, area:G.area});
  for (const [id, area, q, opts, ex] of CUR) bank.push({id, kind:'cur', area, q, opts, ex});
  for (const t of TALK){
    bank.push({id:`talk:${t.id}`, kind:'talk', area:'talk', t});
    bank.push({id:`tfail:${t.id}`, kind:'tfail', area:'tfail', t});
    bank.push({id:`follow:${t.id}`, kind:'follow', area:'follow', t});
  }
  for (const c of CDE) bank.push({id:`cde:${c.id}`, kind:'cde', area:'cde', c});
  return bank;
}
const BANK = buildBank();
function famAcc(id){ const s = S.fam[id]; if (!s || (s.c + s.w) === 0) return null; return s.c / (s.c + s.w); }
function weight(q, prev){
  const fa = famAcc(q.area), weak = fa === null ? 0.45 : 1 - fa, s = S.q[q.id];
  let w = (1 + 2 * weak) * (s ? Math.max(0.25, 1 + 1.6 * (s.w / Math.max(1, s.c + s.w)) - 0.08 * Math.min(s.c, 6)) : 1.35);
  if (S.recent.includes(q.id)) w *= 0.15;
  if (q.area === prev) w *= 0.35;
  return w;
}
function pickRound(mode){
  const M = MODES[mode];
  let pool = BANK.filter(q => M.areas.includes(q.area));
  const out = [], usedScene = {}; let prev = null;
  const n = Math.min(mode === 'mix' ? MIX_LEN : ROUND_LEN, pool.length);
  while (out.length < n && pool.length){
    const ws = pool.map(q => { const sc = q.t ? q.t.id : q.c ? q.c.id : null; return weight(q, prev) * (sc && usedScene[sc] ? 0.15 : 1); });
    let r = Math.random() * ws.reduce((a, b) => a + b, 0), k = 0;
    while (k < ws.length - 1 && (r -= ws[k]) > 0) k++;
    const q = pool.splice(k, 1)[0];
    if (q.t) usedScene[q.t.id] = true;
    out.push(q); prev = q.area;
  }
  return out;
}

/* ---------- Bilder zu Szenen ---------- */
const vehOf = (sc, id) => SC[sc].veh.find(v => v[5] === id);
function sceneFig(scKey, o = {}){ return `<figure class="scene" data-zoom="1">${scene(SC[scKey], o)}</figure>`; }
const mapFig = svg => `<figure class="scene map" data-zoom="1">${svg}</figure>`;

/* ---------- Fragen erzeugen ---------- */
function materialize(q){
  if (q.kind === 'gen'){ const m = GEN[q.g].make(); if (m.fig) m.fig = mapFig(m.fig); return m; }
  if (q.kind === 'cur') return {prompt:q.q, correct:q.opts[0], wrong:q.opts.slice(1), ex:q.ex};
  if (q.kind === 'talk'){
    const t = q.t, v = vehOf(t.sc, t.tgt);
    const bad = shuffle(t.bad).slice(0, 3);
    return {prompt:'Welche Einweisung führt den Piloten eindeutig zum markierten Ziel?', fig:sceneFig(t.sc, {ir:t.ir, boxes:[[v[0], v[1]]]}),
      correct:t.ok, wrong:bad.map(b => b[1]), long:true,
      ex:`Richtig: vom Großen zum Kleinen, nur eindeutige und von oben sichtbare Bezugspunkte, Himmelsrichtungen. ${t.why}`,
      exWrong:bad.map(b => ({t:b[1], why:b[2] || FL_WHY[b[0]], cat:FL[b[0]]}))};
  }
  if (q.kind === 'tfail'){
    const t = q.t, v = vehOf(t.sc, t.tgt), b = rnd(t.bad);
    const others = shuffle(Object.keys(FL).filter(k => k !== b[0])).slice(0, 3);
    return {prompt:'Was ist an dieser Einweisung falsch?', fig:sceneFig(t.sc, {ir:t.ir, boxes:[[v[0], v[1]]]}), say:b[1],
      correct:FL[b[0]], wrong:others.map(k => FL[k]), ex:`${b[2] || FL_WHY[b[0]]} Besser: „${t.ok}“`};
  }
  if (q.kind === 'follow'){
    const t = q.t, letters = shuffle(['A', 'B', 'C', 'D']);
    const lab = t.cand.map((id, i) => { const v = vehOf(t.sc, id); return [v[0], v[1], letters[i]]; });
    const ci = t.cand.indexOf(t.tgt), right = letters[ci], v = vehOf(t.sc, t.tgt);
    return {prompt:'Du bist der Pilot. Welches Fahrzeug meint der JTAC?', fig:sceneFig(t.sc, {ir:t.ir, labels:lab}), say:t.ok,
      figAfter:sceneFig(t.sc, {ir:t.ir, labels:lab, boxes:[[v[0], v[1]]]}),
      correct:`Fahrzeug ${right}`, wrong:letters.filter(x => x !== right).map(x => `Fahrzeug ${x}`), sortOpts:true,
      ex:`Gemeint ist Fahrzeug ${right}. ${t.why}`};
  }
  if (q.kind === 'cde'){
    const c = q.c;
    return {prompt:c.q, lage:c.lage, fig:sceneFig(c.sc, {ir:c.ir, show:c.show, veh:c.veh, people:c.people, mortar:c.mortar, friends:c.friends, friendLabel:c.friendLabel, boxes:c.boxes}),
      correct:c.opts[0], wrong:c.opts.slice(1), long:true, ex:c.ex};
  }
}

function startRound(mode){ R = {mode, qs:pickRound(mode), i:0, score:0, missed:[], cur:null, answered:false}; view = 'quiz'; nextQ(true); }
function nextQ(first){
  if (!first) R.i++;
  if (R.i >= R.qs.length){ view = 'end'; return render(); }
  const q = R.qs[R.i], m = materialize(q);
  let opts = shuffle([m.correct, ...m.wrong.slice(0, 3)]);
  if (m.sortOpts) opts = opts.sort();
  R.cur = {q, m, opts, ci:opts.indexOf(m.correct)}; R.answered = false;
  render(); window.scrollTo(0, 0);
}
function renderQuiz(){

  $('#app').innerHTML = `

    ${m.say ? `<blockquote class="say"><span class="say-h">JTAC funkt</span>${esc(m.say)}</blockquote>` : ''}
    <h2 class="prompt">${esc(m.prompt)}</h2>
    <div class="opts${m.long ? ' long' : ''}" role="group" aria-label="Antworten">${opts.map((o, k) => `<button class="opt" data-ans="${k}"><span class="k">${k + 1}</span><span>${esc(o)}</span></button>`).join('')}</div>
    <div id="fb"></div>`;
}
function answer(k){
  if (R.answered) return;
  R.answered = true;
  const {q, m, opts, ci} = R.cur, ok = k === ci;
  document.querySelectorAll('.opt').forEach((b, j) => { b.disabled = true; if (j === ci) b.classList.add('correct'); else if (j === k) b.classList.add('wrong'); else b.classList.add('dim'); });
  const qs = S.q[q.id] || (S.q[q.id] = {c:0, w:0}); ok ? qs.c++ : qs.w++;
  const fs = S.fam[q.area] || (S.fam[q.area] = {c:0, w:0}); ok ? fs.c++ : fs.w++;
  S.answered++; if (ok) S.correct++;
  S.recent = [q.id, ...S.recent.filter(x => x !== q.id)].slice(0, 40);
  save();
  if (ok) R.score++; else R.missed.push({area:q.area, prompt:m.prompt, correct:m.correct});
  if (m.figAfter) $('#figbox').innerHTML = m.figAfter;
  const wrongPick = !ok && m.exWrong ? m.exWrong.find(x => x.t === opts[k]) : null;
  const flagged = !!S.flags[q.id];
  $('#fb').innerHTML = `<section class="fb" style="--c:${ok ? 'var(--ok)' : 'var(--bad)'}">
    <div class="v">${ok ? 'Richtig' : m.long ? 'Falsch – richtig ist die grün markierte Antwort' : 'Falsch – richtig ist: ' + esc(m.correct)}</div>
    ${wrongPick ? `<p><b>Deine Wahl – ${esc(wrongPick.cat)}:</b> ${esc(wrongPick.why)}</p>` : ''}
    <p>${esc(m.ex)}</p>
    <div class="row">
      <button class="btn main" data-act="next">${R.i + 1 < R.qs.length ? 'Nächste Frage' : 'Auswertung'}</button>
      <button class="btn ${flagged ? 'flagged' : ''}" data-flag="${esc(q.id)}">${flagged ? 'Gemeldet' : 'Frage melden'}</button>
    </div>
  </section>`;
  const nb = $('#fb .btn.main'); if (nb) nb.focus({preventScroll:true});
  $('#fb').scrollIntoView({behavior:'smooth', block:'nearest'});
}
function renderEnd(){
  $('#bar').style.display = '';
  setBar('Auswertung', {back:'home'});
  const n = R.qs.length;
  $('#app').innerHTML = `
    <div class="score">${R.score}<span class="muted" style="font-size:.45em"> / ${n}</span></div>
    <p class="muted">${MODES[R.mode].name} – ${Math.round(100 * R.score / n)} % richtig.</p>
    ${R.missed.length ? `<h2 style="margin-top:22px">Nacharbeiten</h2><ul class="misslist">${R.missed.map(x => `<li><div>${esc(x.prompt)}</div><div class="small"><strong>${esc(x.correct)}</strong> <span class="muted">· ${esc(AREAS[x.area].n)}</span></div></li>`).join('')}</ul>` : '<p>Alles richtig.</p>'}
    <div class="row" style="margin-top:20px"><button class="btn main" data-start="${R.mode}">Neue Runde</button><button class="btn" data-go="lehre">Kurzlehre</button><button class="btn" data-act="home">Zur Übersicht</button></div>`;
}
function renderStats(){
  $('#bar').style.display = '';
  setBar('Statistik', {back:'home'});
  const rows = AREA_ORDER.map(a => ({a, acc:famAcc(a), s:S.fam[a] || {c:0, w:0}})).sort((x, y) => (x.acc ?? -1) - (y.acc ?? -1));
  const flags = Object.entries(S.flags);
  const flagText = flags.map(([id, v]) => `• [${id}] ${v.t}`).join('\n');
  $('#app').innerHTML = `
    <div class="stat-top"><div><b>${S.answered}</b><span class="muted small">Antworten</span></div><div><b>${S.answered ? Math.round(100 * S.correct / S.answered) + ' %' : '–'}</b><span class="muted small">richtig</span></div></div>
    <h2 style="margin-top:18px">Je Bereich, schwächster zuerst</h2>
    ${rows.map(({a, acc, s}) => `<div class="srow"><span>${esc(AREAS[a].n)}</span><div class="sbar"><i style="width:${acc === null ? 0 : acc * 100}%;background:${acc === null ? 'var(--line)' : acc >= .8 ? 'var(--ok)' : acc >= .5 ? 'var(--cta)' : 'var(--bad)'}"></i></div><span class="small muted" style="text-align:right">${acc === null ? '–' : Math.round(acc * 100) + ' %'}<br>${s.c + s.w}×</span></div>`).join('')}
    <h2 style="margin-top:26px">Gemeldete Fragen</h2>
    ${flags.length ? `<p class="small muted" style="margin:4px 0 8px">Kopiere die Liste und schick sie zur Prüfung.</p><textarea id="flagtxt" readonly>${esc(flagText)}</textarea><div class="row"><button class="btn" data-act="copyflags">Liste kopieren</button><button class="btn" data-act="clearflags">Liste leeren</button></div>` : '<p class="small muted">Keine gemeldeten Fragen. Mit „Frage melden“ markierst du Fragen, die falsch oder unklar sind.</p>'}
    <h2 style="margin-top:26px">Zurücksetzen</h2>
    <p class="small muted" style="margin:4px 0 8px">Löscht alle Antworten und Trefferquoten. Gemeldete Fragen bleiben erhalten.</p>
    <button class="btn" data-act="reset">Statistik zurücksetzen</button>`;
}
function render(){
  if (view === 'home') renderHome();
  else if (view === 'quiz') renderQuiz();
  else if (view === 'end') renderEnd();
  else if (view === 'stats') renderStats();
  else if (view === 'lehre') renderLehre();
}

/* ---------- Bedienung ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-zoom]');
  if (!t) return;
  if (t.dataset.zoom){
    const svg = t.querySelector('svg'); if (!svg) return;
    const lb = document.createElement('div'); lb.className = 'lightbox'; lb.setAttribute('role', 'dialog'); lb.setAttribute('aria-label', 'Vergrößerte Ansicht');
    lb.innerHTML = svg.outerHTML; lb.addEventListener('click', () => lb.remove()); document.body.appendChild(lb); return;
  }
  if (t.dataset.start){ startRound(t.dataset.start); return; }
  if (t.dataset.go){ view = t.dataset.go; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.ans != null){ answer(Number(t.dataset.ans)); return; }
  if (t.dataset.flag){
    const id = t.dataset.flag;
    if (S.flags[id]) delete S.flags[id]; else S.flags[id] = {t:R && R.cur ? R.cur.m.prompt + (R.cur.m.say ? ' – „' + R.cur.m.say.slice(0, 80) + '…“' : '') : id, ts:Date.now()};
    save(); t.classList.toggle('flagged', !!S.flags[id]); t.textContent = S.flags[id] ? 'Gemeldet' : 'Frage melden'; return;
  }
  const act = t.dataset.act;
  if (act === 'home'){ view = 'home'; R = null; render(); window.scrollTo(0, 0); }
  else if (act === 'next') nextQ();
  else if (act === 'copyflags'){
    const ta = $('#flagtxt'); ta.select();
    const done = () => { t.textContent = 'Kopiert'; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, () => { try { document.execCommand('copy'); done(); } catch(_){} });
    else { try { document.execCommand('copy'); done(); } catch(_){} }
  }
  else if (act === 'clearflags'){ S.flags = {}; save(); render(); }
  else if (act === 'reset'){
    if (t.dataset.confirm){ const fl = S.flags; S = blank(); S.flags = fl; save(); render(); }
    else { t.dataset.confirm = '1'; t.textContent = 'Wirklich zurücksetzen? Erneut tippen'; t.classList.add('flagged'); }
  }
});
document.addEventListener('keydown', e => {
  if (document.querySelector('.lightbox')){ if (e.key === 'Escape') document.querySelector('.lightbox').remove(); return; }
  if (view !== 'quiz' || !R) return;
  if (!R.answered && /^[1-4]$/.test(e.key)){ const k = Number(e.key) - 1; if (k < R.cur.opts.length) answer(k); }
  else if (R.answered && (e.key === 'Enter' || e.key === ' ') && !(e.target && e.target.dataset && e.target.dataset.flag)){ e.preventDefault(); nextQ(); }
});
render();
</script>
<script src="../assets/terms.js" defer></script>
<script src="../assets/app.js" defer></script>
